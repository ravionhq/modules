definition:
  type: rvn-aws-alternat
  name: alterNAT
  description: Highly available alterNAT instances that replace NAT gateway data processing charges and fail over to a NAT gateway automatically.
release:
  version: 0.1.0
  description: Cut NAT gateway data processing charges with alterNAT instances that fail over to a NAT gateway automatically.
module:
  inputs:
    - id: network
      immutable: true
      label: VPC network
      description: Ravion network to take over egress for, or Enter values manually for any other VPC.
      mapped_inputs:
        - id: section_aws
          label: AWS account & region
          type: section
        - default: << ref.input.aws_account_id >>
          id: aws_account_id
          immutable: true
          label: AWS account
          required: true
          type: string
          values: $values:ravion/aws_accounts
        - default: << ref.input.aws_region >>
          id: aws_region
          immutable: true
          label: Region
          required: true
          type: string
          values: $values:aws/regions
        - collapsible: true
          default: << ref.input.execution_environment_id >>
          description: Override the VPC, subnet, and security group for Terraform runners. Must use the same AWS account as selected above.
          id: execution_environment_id
          label: Terraform execution environment
          type: string
          values: $values:ravion/execution_environments
        - id: section_vpc
          label: VPC
          type: section
        - default: <<ref.stack.output.vpc_id>>
          id: vpc_id
          immutable: true
          label: VPC ID
          placeholder: vpc-...
          required: true
          type: string
        - add_button_label: Add public subnet ID
          default: <<ref.stack.output.public_subnet_ids>>
          description: alterNAT instances run here, one in the first public subnet of each availability zone they serve.
          id: public_subnet_ids
          label: Public subnet IDs
          placeholder: subnet-...
          required: true
          type: string_array
        - add_button_label: Add private subnet ID
          default: <<ref.stack.output.private_subnet_ids>>
          description: Subnets whose internet egress moves to the alterNAT instances. Their route tables are found automatically.
          id: private_subnet_ids
          label: Private subnet IDs
          placeholder: subnet-...
          required: true
          type: string_array
      required: false
      type: $ref:rvn-aws-network
    - id: section_nat_instances
      label: alterNAT instances
      type: section
    - default: <<project.given_id>>-<<environment.given_id>>-<<module.given_id>>
      description: Name prefix for all resources. Must be unique in the AWS account and region.
      id: name
      immutable: true
      label: Name slug
      patterns:
        - message: 1-28 lowercase letters, numbers, and hyphens. Start and end with a letter or number.
          pattern: ^[a-z0-9]([a-z0-9-]{0,26}[a-z0-9])?$
      required: true
      type: string
    - default: true
      description: One alterNAT instance per availability zone with its own private route table, so no traffic crosses zones. Turn off to run a single alterNAT instance for every route table.
      id: high_availability_enabled
      label: High availability
      type: boolean
    - default: c7gn.medium
      description: Network-optimized Graviton (`c7gn`, `c6gn`) types give the most bandwidth per dollar. Instances under 32 vCPUs are capped at 5 Gbps to the internet.
      id: nat_instance_type
      label: Instance type
      no_options_message: Select a VPC network, or enter an AWS account and region, to load available EC2 instance types.
      required: true
      type: string
      values: $values:aws/ec2/instances?awsAccountId=<<module.input.aws_account_id>>&region=<<module.input.aws_region>>
    - add_button_label: Add Elastic IP allocation ID
      collapsible: true
      description: One per alterNAT instance, to keep public IPs stable for partner allowlists. Leave empty to allocate new Elastic IPs.
      id: nat_instance_eip_allocation_ids
      label: Elastic IP allocation IDs
      placeholder: eipalloc-...
      required: false
      type: string_array
    - collapsible: true
      default: 14
      description: Replaces each alterNAT instance on this schedule to pick up the latest AMI, dropping its open connections. 0 never replaces.
      id: max_instance_lifetime_days
      label: Instance lifetime (days)
      max: 365
      min: 0
      type: number
    - id: section_failover
      label: Failover
      type: section
    - default: existing
      description: Where traffic goes while an alterNAT instance is unhealthy.
      id: fallback_nat_gateway_mode
      label: Fallback NAT gateway
      required: true
      type: string
      values:
        - label: Use the VPC's existing NAT gateway
          value: existing
        - label: Create a standby NAT gateway per alterNAT instance
          value: create
    - collapsible: true
      description: Leave empty to use the VPC's only NAT gateway, or the one in each alterNAT instance's public subnet.
      id: fallback_nat_gateway_id
      label: Fallback NAT gateway ID
      placeholder: nat-...
      required: false
      show_when:
        fallback_nat_gateway_mode: existing
      type: string
    - collapsible: true
      description: Keyed by availability zone, for example `us-west-2a`. Leave empty to allocate new Elastic IPs.
      id: fallback_nat_gateway_eip_allocation_ids
      label: Standby NAT gateway Elastic IP allocation IDs
      required: false
      show_when:
        fallback_nat_gateway_mode: create
      type: keyvalue
    - default: true
      description: Moves traffic back to an alterNAT instance as soon as it recovers, instead of when it is replaced. Requires Systems Manager access.
      id: nat_restore_enabled
      label: Restore to alterNAT instance
      type: boolean
    - add_button_label: Add URL
      collapsible: true
      default:
        - https://www.example.com
        - https://www.google.com
      description: Checked every minute from each availability zone. Traffic fails over only when all of them are unreachable.
      id: connectivity_check_urls
      label: Connectivity check URLs
      type: string_array
    - id: section_vpc_endpoints
      label: VPC endpoints
      type: section
    - default: true
      description: Lets failover reach the EC2 API while internet egress is down. About $7/month per availability zone. Turn off only if the VPC already has one with private DNS.
      id: ec2_endpoint_enabled
      label: EC2 interface endpoint
      type: boolean
    - default: false
      description: Free. Keeps S3 traffic, including ECR image layers, off alterNAT and NAT gateways. S3 bucket policies that allowlist your alterNAT or NAT gateway IPs stop matching. Leave off if the VPC already has one.
      id: s3_gateway_endpoint_enabled
      label: S3 gateway endpoint
      type: boolean
    - default: false
      description: Free. Keeps DynamoDB traffic off alterNAT and NAT gateways. Leave off if the VPC already has one.
      id: dynamodb_gateway_endpoint_enabled
      label: DynamoDB gateway endpoint
      type: boolean
    - id: section_access
      label: Access
      type: section
    - add_button_label: Add CIDR block
      collapsible: true
      description: The VPC's own CIDR blocks are always allowed. Add peered VPC ranges that egress through this VPC.
      id: allowed_cidr_blocks
      label: Allowed CIDR blocks
      placeholder: 10.1.0.0/16
      required: false
      type: string_array
    - add_button_label: Add security group ID
      collapsible: true
      description: Members may route through the alterNAT instances, in addition to the VPC's CIDR blocks.
      id: allowed_security_group_ids
      label: Allowed security groups
      placeholder: sg-...
      required: false
      type: string_array
    - default: true
      description: Session Manager access to the alterNAT instances, with no SSH keys or open ports.
      id: ssm_enabled
      label: Systems Manager access
      type: boolean
    - collapsible: true
      description: Prefer Systems Manager access.
      id: nat_instance_key_name
      label: SSH key pair name
      required: false
      type: string
    - id: section_instance_customization
      label: Instance customization
      type: section
    - collapsible: true
      default: false
      description: Publishes per-interface network metrics. Custom metrics are billed.
      id: cloudwatch_agent_enabled
      label: CloudWatch agent
      type: boolean
    - collapsible: true
      description: Leave blank for the latest Amazon Linux 2023 minimal AMI for the instance type's architecture.
      id: nat_instance_ami_id
      label: Custom AMI ID
      placeholder: ami-...
      required: false
      type: string
    - collapsible: true
      description: Runs as root on each alterNAT instance before alterNAT configures it.
      id: nat_instance_user_data_pre_install
      label: User data before setup
      required: false
      type: text
    - collapsible: true
      description: Runs as root on each alterNAT instance after alterNAT configures it.
      id: nat_instance_user_data_post_install
      label: User data after setup
      required: false
      type: text
    - $include: ../../partials/inputs/misc-section.yml
    - $include: ../../partials/inputs/tags.yml
    - $include: ../../partials/inputs/terraform-settings.yml
  readme: |
    Highly available alterNAT instances that replace NAT gateway data processing charges and fail over to a NAT gateway automatically.

    ## Overview

    A NAT gateway charges $0.045 for every GB it processes, on top of its hourly charge. For workloads that pull images, sync artifacts, or call external APIs heavily, that per-GB charge becomes the largest networking line item. An alterNAT instance has no per-GB charge, but a single instance is a single point of failure.

    This module runs [alterNAT](https://github.com/chime/terraform-aws-alternat), Chime's open-source high-availability alterNAT instance design:

    - **alterNAT instances** in Auto Scaling groups carry your private subnets' internet traffic
    - **A connectivity tester** in each availability zone checks internet access through its alterNAT instance every minute
    - **Automatic failover** moves the route to a NAT gateway when an alterNAT instance fails a check or terminates, so egress is never lost
    - **Automatic restore** moves the route back to the alterNAT instance once it is healthy again

    It works with any VPC: pick a Ravion VPC network, or choose **Enter values manually** and enter the VPC and subnet IDs of a VPC created elsewhere.

     Terraform source: [ravionhq/modules/networking/alternat](https://github.com/ravionhq/modules/tree/$local.module_tag/networking/alternat)

    ## Use cases

    | Scenario | alterNAT helps by... |
    | --- | --- |
    | High NAT gateway data processing charges | Moving egress to alterNAT instances, which have no per-GB charge |
    | Keeping a NAT gateway as a safety net | Failing over to it automatically, so it carries traffic only during failures |
    | Existing VPCs created outside Ravion | Discovering route tables from subnet IDs, and reusing the VPC's NAT gateway |
    | Partner IP allowlists | Using pre-allocated Elastic IPs for alterNAT instances |

    ## When it pays off

    | Monthly egress | NAT gateway data processing | alterNAT (2 × c7gn.medium + EC2 endpoint) |
    | --- | --- | --- |
    | 1 TB | ~$46 | ~$115 |
    | 5 TB | ~$230 | ~$115 |
    | 20 TB | ~$920 | ~$115 |

    Both sides exclude internet data transfer, which AWS bills the same either way. The fallback NAT gateway's hourly charge (~$33/month) applies to both. Below roughly 2.5 TB a month, a NAT gateway is usually cheaper. alterNAT figures assume us-west-2 on-demand pricing: two alterNAT instances, their Elastic IPs, and the EC2 interface endpoint in two zones.

    ## How alterNAT instances are placed

    You list public and private subnets; the module works out the rest:

    1. It finds the route table of every private subnet (the VPC's main route table for subnets without an explicit association).
    2. With **high availability** on, every availability zone that has its own private route table gets an alterNAT instance in its first public subnet, serving only that zone. Traffic never crosses zones.
    3. Private route tables shared across zones (for example a Ravion VPC network without NAT gateway high availability) are served by one alterNAT instance.
    4. With high availability off, one alterNAT instance serves every private route table.

    alterNAT then owns the `0.0.0.0/0` route in those route tables. A route table that public subnets also use is rejected at plan time, since replacing its Internet Gateway route would cut the alterNAT instances off from the internet.

    ## Failover

    | Fallback NAT gateway | Behavior | Extra cost |
    | --- | --- | --- |
    | Existing (default) | Fails over to the VPC's public NAT gateway. With several, each alterNAT instance uses the one in its own public subnet unless you pick one. | None |
    | Create | Creates a standby NAT gateway next to each alterNAT instance | ~$33/month each |

    Failover keeps connectivity but not connections: established TCP connections through a failed alterNAT instance are dropped, as they are when an instance reaches its lifetime and is replaced. Clients that retry recover immediately.

    While failed over, traffic leaves from the NAT gateway's public IP. **Add both the alterNAT instance and NAT gateway IPs to any partner allowlist.**

    ## Using it with a Ravion VPC network

    The VPC network manages its private route tables' `0.0.0.0/0` route to its NAT gateway. After alterNAT takes over that route, the next VPC network deploy points it back at the NAT gateway. With **Restore to alterNAT instance** on (the default), alterNAT moves it back within a minute. To avoid the round trip entirely, turn off the VPC network's NAT gateway and set **Fallback NAT gateway** to **Create**.

    ## Configuration

    | Field | Required | Default | Description |
    | --- | --- | --- | --- |
    | VPC network | No | - | Ravion network to take over egress for, or Enter values manually |
    | AWS account / Region | Yes | From network | Where the VPC is |
    | VPC ID | Yes | From network | VPC whose egress moves to alterNAT instances |
    | Public / private subnet IDs | Yes | From network | Where alterNAT instances run / whose egress they carry |
    | Name slug | Yes | {project}-{env}-{module} | Prefix for all resources, unique per account and region |
    | High availability | No | true | One alterNAT instance per availability zone |
    | Instance type | Yes | c7gn.medium | Architecture of the AMI follows the type |
    | Elastic IP allocation IDs | No | New Elastic IPs | One per alterNAT instance, for stable public IPs |
    | Instance lifetime (days) | No | 14 | 0 never replaces instances |
    | Fallback NAT gateway | Yes | existing | Reuse the VPC's NAT gateway, or create standby ones |
    | Restore to alterNAT instance | No | true | Return traffic to a recovered alterNAT instance |
    | Connectivity check URLs | No | example.com, google.com | Fail over only when all are unreachable |
    | EC2 interface endpoint | No | true | Lets failover work while internet egress is down |
    | S3 / DynamoDB gateway endpoint | No | false | Free endpoints that keep that traffic off alterNAT and NAT gateways |
    | Systems Manager access | No | true | Required for restore |

    ## Design decisions

    - **Official alterNAT, pinned:** The module wraps [`chime/alternat/aws`](https://registry.terraform.io/modules/chime/alternat/aws) at a pinned version rather than forking it.
    - **No container image to build:** The Lambda functions deploy as zip packages built from the alterNAT source; they need only boto3, which the Lambda runtime provides.
    - **Graviton by default:** alterNAT instances default to `c7gn.medium` and the Lambda functions run on arm64. The AMI architecture follows the instance type, so x86 types also work.
    - **Discovery over configuration:** Route tables are found from subnet associations, not from routes, so discovery is unaffected by alterNAT rewriting routes.
    - **Encrypted root volumes** and IMDSv2-only instance metadata.
    - **Names derived from the name slug:** Lambda functions, IAM roles, and Auto Scaling groups carry the slug, so several VPCs in one account can each run alterNAT.

    ## Learn more

    - [alterNAT](https://github.com/chime/terraform-aws-alternat) — Design, failure modes, and benchmarks
    - [NAT gateway pricing](https://aws.amazon.com/vpc/pricing/) — Hourly and data processing charges
    - [NAT instances](https://docs.aws.amazon.com/vpc/latest/userguide/VPC_NAT_Instance.html) — AWS guide to the NAT instances alterNAT builds on
    - [EC2 network bandwidth](https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ec2-instance-network-bandwidth.html) — Internet bandwidth limits per instance size
  stack:
    $template: ../../partials/templates/opentofu-stack.yml
    with:
      base_path: networking/alternat
      terraform_variables:
        ...overrides: << module.input.advanced_terraform_variables >>
        allowed_cidr_blocks: << module.input.allowed_cidr_blocks || [] >>
        allowed_security_group_ids: << module.input.allowed_security_group_ids || [] >>
        cloudwatch_agent_enabled: << module.input.cloudwatch_agent_enabled >>
        connectivity_check_urls: << module.input.connectivity_check_urls >>
        dynamodb_gateway_endpoint_enabled: << module.input.dynamodb_gateway_endpoint_enabled >>
        ec2_endpoint_enabled: << module.input.ec2_endpoint_enabled >>
        fallback_nat_gateway_eip_allocation_ids: << module.input.fallback_nat_gateway_eip_allocation_ids || {} >>
        fallback_nat_gateway_id: '<< module.input.fallback_nat_gateway_mode == "existing" ? (module.input.fallback_nat_gateway_id || nil) : nil >>'
        fallback_nat_gateway_mode: << module.input.fallback_nat_gateway_mode >>
        high_availability_enabled: << module.input.high_availability_enabled >>
        max_instance_lifetime_days: << module.input.max_instance_lifetime_days >>
        name: << module.input.name >>
        nat_instance_ami_id: << module.input.nat_instance_ami_id || nil >>
        nat_instance_eip_allocation_ids: << module.input.nat_instance_eip_allocation_ids || [] >>
        nat_instance_key_name: << module.input.nat_instance_key_name || nil >>
        nat_instance_type: << module.input.nat_instance_type >>
        nat_instance_user_data_post_install: << module.input.nat_instance_user_data_post_install || "" >>
        nat_instance_user_data_pre_install: << module.input.nat_instance_user_data_pre_install || "" >>
        nat_restore_enabled: << module.input.nat_restore_enabled >>
        private_subnet_ids: << module.input.private_subnet_ids >>
        public_subnet_ids: << module.input.public_subnet_ids >>
        region: << module.input.aws_region >>
        s3_gateway_endpoint_enabled: << module.input.s3_gateway_endpoint_enabled >>
        ssm_enabled: << module.input.ssm_enabled >>
        tags:
          $include: ../../partials/stack/ravion-tags.yml
        vpc_id: << module.input.vpc_id >>
  ui:
    logs: |-
      <<
      stack.output.nat_instances != nil ? concat(
        map(stack.output.nat_instances, {
          "id":"connectivity_tester_" + #.availability_zone,
          "name":"Connectivity tester (" + #.availability_zone + ")",
          "source":{
            "type":"cloudwatch",
            "aws_account_id":module.input.aws_account_id,
            "region":stack.output.region,
            "log_group":#.connectivity_tester_log_group_name
          }
        }),
        [{
          "id":"autoscaling_hook",
          "name":"Failover on instance termination",
          "source":{
            "type":"cloudwatch",
            "aws_account_id":module.input.aws_account_id,
            "region":stack.output.region,
            "log_group":stack.output.autoscaling_hook_log_group_name
          }
        }]
      ) : []
      >>
    metrics: |-
      <<
      stack.output.nat_instances != nil ? concat(
        map(stack.output.nat_instances, {
          "id":"nat_instance_network_out_" + #.availability_zone,
          "name":"alterNAT instance bytes out (" + #.availability_zone + ")",
          "type":"line",
          "source":{
            "type":"cloudwatch",
            "aws_account_id":module.input.aws_account_id,
            "namespace":"AWS/EC2",
            "region":stack.output.region,
            "dimensions":{"AutoScalingGroupName":#.autoscaling_group_name},
            "name":"NetworkOut",
            "statistic":"Sum"
          }
        }),
        map(stack.output.fallback_nat_gateway_ids, {
          "id":"fallback_nat_gateway_bytes_" + #,
          "name":"Fallback NAT gateway bytes out (" + # + ")",
          "type":"line",
          "source":{
            "type":"cloudwatch",
            "aws_account_id":module.input.aws_account_id,
            "namespace":"AWS/NATGateway",
            "region":stack.output.region,
            "dimensions":{"NatGatewayId":#},
            "name":"BytesOutToDestination",
            "statistic":"Sum"
          }
        })
      ) : []
      >>
