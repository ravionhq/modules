global: false
definition:
  type: rvn-preview-ingress
  name: Preview Ingress
  description: Entry point for sandbox previews. A Network Load Balancer with a managed wildcard domain and certificate, in front of a router that sends each preview hostname to its sandbox and wakes a paused sandbox on request.
release:
  version: 0.1.0
  description: "Serve sandbox previews under a managed wildcard domain, or under your own wildcard domains, through a Network Load Balancer and a preview router that wakes paused sandboxes on request."
module:
  outputs:
    - id: sandbox_router_id
      type: string
      label: Router ID
      description: The router's identity, which is this module instance's ID.
    - id: sandbox_router_dns_name
      type: string
      label: Load balancer DNS name
    - id: sandbox_router_zone_id
      type: string
      label: Load balancer hosted zone ID
    - id: sandbox_router_load_balancer_arn
      type: string
      label: Load balancer ARN
    - id: sandbox_router_security_group_id
      type: string
      label: Router security group ID
      description: Sandbox hosts allow preview traffic from this group.
    - id: sandbox_host_security_group_ids
      type: string_array
      label: Sandbox host security group IDs
      description: The router reaches sandbox hosts in these groups only.
    - id: wildcard_domain_name
      type: string
      label: Wildcard domain
      description: Every preview is a hostname one label below this domain.
    - id: certificate_arn
      type: string
      label: Certificate ARN
    - id: custom_domain_names
      type: string_array
      label: Custom domains
      description: Wildcard domains previews can be served under, beside the wildcard domain.
    - id: custom_certificate_arn
      type: string
      label: Custom domains certificate ARN
    - id: load_balancer_security_group_id
      type: string
      label: Load balancer security group ID
    - id: autoscaling_group_name
      type: string
      label: Auto Scaling group name
    - id: image_id
      type: string
      label: Image ID
      description: The AMI new router instances boot.
    - id: aws_account_id
      type: string
      label: AWS account ID
    - id: region
      type: string
      label: Region
  inputs:
    - id: network
      immutable: true
      label: VPC network
      type: $ref:rvn-aws-network
      description: The network of the sandboxes whose previews this ingress serves.
      mapped_inputs:
        - $template: ../../partials/templates/network-ref-mapped-inputs.yml
          with:
            aws_account_id_default: << ref.input.aws_account_id >>
            aws_region_default: << ref.input.aws_region >>
            execution_environment_default: << ref.input.execution_environment_id >>
            private_subnet_ids_default: <<ref.stack.output.private_subnet_ids>>
            public_subnet_ids_default: <<ref.stack.output.public_subnet_ids>>
            vpc_id_default: <<ref.stack.output.vpc_id>>
      required: true
    - id: section_ingress
      label: Preview ingress
      type: section
    - id: name
      immutable: true
      label: Name slug
      type: string
      description: Name for the load balancer and related resources.
      required: true
      default: <<project.given_id>>-<<environment.given_id>>-<<module.given_id>>
      patterns:
        - message: 1-32 lowercase letters, numbers, and hyphens. Start and end with a letter or number.
          pattern: ^[a-z0-9]([a-z0-9-]{0,30}[a-z0-9])?$
    - id: sandbox_host_security_group_ids
      label: Sandbox host security groups
      type: string_array
      description: Security group of each execution environment whose sandbox pool runs the previews. Each group gets an inbound rule for the router on the preview ports.
      required: true
      add_button_label: Add security group
      placeholder: Select a security group
      no_options_message: Select a VPC Network, or enter an AWS account, region, and VPC ID, to load security groups.
      values: $values:aws/security-groups?awsAccountId=<<module.input.aws_account_id>>&region=<<module.input.aws_region>>&vpcId=<<module.input.vpc_id>>
    - id: ingress_cidr_blocks
      label: Ingress IPv4 CIDRs
      type: string_array
      description: IPv4 CIDR blocks allowed to open previews. Defaults to public internet access. Use an empty list to allow no ingress.
      add_button_label: Add CIDR block
      collapsible: true
      placeholder: 0.0.0.0/0
    - id: section_managed_domains
      label: Managed domains
      type: section
    - description: Base for preview addresses; uses the ingress module ID when empty.
      id: ravion_domain_name
      label: Preview domain
      patterns:
        - message: The subdomain must contain only lowercase letters, numbers, and hyphens, and start and end with a letter or number.
          pattern: ^[a-z0-9]([a-z0-9-]*[a-z0-9])?$
      required: false
      suffix: ".<< platform.apex >>"
      type: string
    - add_button_label: Add custom domain
      description: Wildcard domains that previews can use in addition to the preview domain; Ravion manages the certificate. Add the provided DNS records at your DNS provider.
      id: domains
      label: Custom domains
      max_length: 10
      patterns:
        - message: Use a lowercase wildcard domain, such as *.preview.example.com.
          pattern: ^\*\.([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
      placeholder: "*.preview.example.com"
      type: string_array
    - id: section_router
      label: Router
      type: section
    - id: instance_type
      label: Instance type
      type: string
      description: One instance runs at all times. The default image is x86_64.
      required: true
      default: t3.small
      no_options_message: Select a VPC Network, or enter an AWS account and region, to load available EC2 instance types.
      values: $values:aws/ec2/instances?awsAccountId=<<module.input.aws_account_id>>&region=<<module.input.aws_region>>
    - id: private_subnet_placement_enabled
      label: Run in private subnets
      type: boolean
      description: Recommended. Requires a NAT gateway for the router's outbound HTTPS. Turn off to run the router in the public subnets with a public IP address. The load balancer always uses the public subnets.
      default: true
    - id: ssm_enabled
      label: Session Manager access
      type: boolean
      description: Gives the router instance an IAM role that allows AWS Systems Manager Session Manager and nothing else. Turn off to launch the instance with no IAM role.
      default: true
    - id: image_id
      label: Image ID
      type: string
      description: Pins the AMI the router boots. Leave blank for the newest image the image owner publishes.
      collapsible: true
      placeholder: ami-...
      patterns:
        - message: An AMI ID, such as ami-0123456789abcdef0.
          pattern: ^ami-[0-9a-f]+$
    - id: image_owner
      label: Image owner
      type: string
      description: AWS account that publishes the router image. Enter a 12-digit account ID, or self for this account's own images. Leave blank for Ravion's images.
      collapsible: true
      placeholder: "123456789012"
      patterns:
        - message: A 12-digit AWS account ID, or one of self, amazon, aws-marketplace.
          pattern: ^([0-9]{12}|self|amazon|aws-marketplace)$
    - $include: ../../partials/inputs/misc-section.yml
    - $include: ../../partials/inputs/tags.yml
    - $include: ../../partials/inputs/terraform-settings.yml
  stack:
    $template: ../../partials/templates/opentofu-stack.yml
    with:
      base_path: networking/preview_ingress
      terraform_variables:
        ...overrides: << module.input.advanced_terraform_variables >>
        domains: << module.input.domains || [] >>
        image_id: << module.input.image_id || nil >>
        image_owner: << module.input.image_owner || nil >>
        ingress_cidr_blocks: '<< module.input.ingress_cidr_blocks != nil ? module.input.ingress_cidr_blocks : ["0.0.0.0/0"] >>'
        instance_type: << module.input.instance_type >>
        module_instance_id: << module.id >>
        name: << module.input.name >>
        public_subnet_ids: << module.input.public_subnet_ids >>
        ravion_aws_account_id: << module.input.aws_account_id >>
        ravion_domain_name: << module.input.ravion_domain_name >>
        region: << module.input.aws_region >>
        router_public_ip_enabled: "<< module.input.private_subnet_placement_enabled ? false : true >>"
        router_subnet_ids: "<< module.input.private_subnet_placement_enabled ? module.input.private_subnet_ids : module.input.public_subnet_ids >>"
        sandbox_host_security_group_ids: << module.input.sandbox_host_security_group_ids >>
        ssm_enabled: << module.input.ssm_enabled >>
        tags:
          $include: ../../partials/stack/ravion-tags.yml
        vpc_id: << module.input.vpc_id >>
  readme: |
    Entry point for sandbox previews. A Network Load Balancer with a managed wildcard domain and certificate, in front of a router that sends each preview hostname to its sandbox and wakes a paused sandbox on request.

    ## Overview

    Use this module to serve the previews of your sandboxes from one always-on address in your own VPC. Select a VPC network and Ravion provisions:

    - A **wildcard domain and certificate** on Ravion's managed apex. Every preview is a hostname one label below it.
    - An internet-facing **Network Load Balancer** that terminates TLS with that certificate.
    - One **router instance** behind the load balancer, kept running by an Auto Scaling group.
    - **Security groups** that admit the load balancer's traffic to the router and nothing else, and one rule on each sandbox host security group that admits the router.

    Preview requests go from the browser to the load balancer, to the router, to the sandbox. They stay inside your AWS account.

    Terraform source: [ravionhq/modules/networking/preview_ingress](https://github.com/ravionhq/modules/tree/$local.module_tag/networking/preview_ingress)

    ## How previews are served

    Ravion keeps the router's table of preview hostnames current over a connection the router opens outbound. The router answers each request by its hostname:

    | Preview | What the router does |
    | --- | --- |
    | Running | Forwards the request to the sandbox |
    | Paused | Asks Ravion to resume the sandbox, holds the request, and forwards it once the sandbox runs. A request that outlasts the hold is told to retry |
    | Unknown hostname | Answers 404 |

    Exposing a port of a sandbox on a hostname under one of this module's wildcard domains routes it through the router. Pausing, resuming and deleting the sandbox update the route.

    ## Domains

    Preview domain names the wildcard domain on Ravion's managed apex. Ravion issues and renews its certificate and publishes its DNS record. Every preview can use a hostname one label below it.

    Custom domains adds wildcard domains from DNS zones you control, such as `*.preview.example.com`. A preview served under one takes a hostname below the wildcard, such as `feature-x.preview.example.com`. Ravion issues one certificate for all custom domains and attaches it to the load balancer beside the managed one.

    Add the DNS records Ravion provides for each custom domain at your DNS provider. The module's Domains tab lists them after the stack run:

    | Record | Purpose |
    | --- | --- |
    | Certificate validation | Proves you control the domain. Ravion issues the certificate once this record resolves |
    | Routing | Points the wildcard at the load balancer |

    Add the records once. Every preview under the wildcard then works without further DNS changes. The stack run finishes without waiting for the records. Previews under a custom domain answer after the certificate is issued and the routing record resolves.

    Custom domains belong to DNS zones you control. Entries under Ravion's managed apex are refused.

    ## Use cases

    | Scenario | Benefit |
    | --- | --- |
    | Pull request previews | A preview URL keeps working after its sandbox is paused; opening it starts the sandbox again |
    | Many short-lived previews | Exposing a preview adds a route and creates no load balancer resources |
    | Previews with a fixed entry point | One load balancer and one wildcard record serve every preview in the network |

    ## Placement and security

    The load balancer is internet-facing in the network's public subnets. Restrict who can open previews with Ingress IPv4 CIDRs.

    The router runs in the private subnets by default and needs a NAT gateway for outbound HTTPS. Turn off Run in private subnets to place it in the public subnets with a public IP address.

    | Security group | Inbound | Outbound |
    | --- | --- | --- |
    | Load balancer | TCP 443 and 80 from the ingress CIDRs | The router's three ports |
    | Router | TCP 8080, 8081 and 8082 from the load balancer's group | TCP 443 to any address; TCP 20000-20998 inside the VPC |

    No CIDR reaches the router. Ports 20000-20998 are where sandbox hosts publish previews.

    Sandbox host security groups lists the security group of each execution environment whose sandbox pool runs the previews. The module adds one inbound rule to each: TCP 20000-20998 from the router's group. The router reaches sandbox hosts in the listed groups only. Destroying the module removes the rules.

    ## Router instance

    The instance boots the newest image Ravion publishes for the instance type's architecture. Its boot script downloads the current router release from the Ravion API, verifies the release's SHA-256 checksum, and starts the router. The script holds no credential. The router obtains its credential from Ravion at start with the instance's signed identity document, and keeps it in memory.

    The router updates itself to new releases. A change to the instance type or image replaces the instance, and previews are unreachable for a few minutes while the new instance starts. Set Image ID to decide when a newer image is adopted.

    A stack run succeeds once the router answers its health check behind the load balancer. A router that never turns healthy fails the run after ten minutes; the cause is in the instance's console output.

    Session Manager access gives operators a shell on the instance through AWS Systems Manager. The instance role holds that permission and no other.

    ## Configuration

    | Field | Required | Default | Description |
    | --- | --- | --- | --- |
    | VPC network | Yes | - | Existing rvn-aws-network module instance, the network of the sandboxes |
    | Name slug | Yes | {project}-{env}-{module} | Name for the load balancer, 32 characters max |
    | Sandbox host security groups | Yes | - | Security groups of the sandbox hosts that run the previews |
    | Ingress IPv4 CIDRs | No | 0.0.0.0/0 | Sources allowed to open previews |
    | Preview domain | No | {module} | Base for preview addresses on Ravion's managed apex |
    | Custom domains | No | [] | Wildcard domains in your own DNS zones, 10 max |
    | Instance type | Yes | t3.small | Router instance type |
    | Run in private subnets | No | true | Router placement |
    | Session Manager access | No | true | Instance role for AWS Systems Manager Session Manager |
    | Image ID | No | Newest published image | AMI the router boots |
    | Image owner | No | Ravion | AWS account that publishes the router image |
    | Tags | No | Standard Ravion tags | Additional tags applied to resources |
    | Advanced Terraform variables | No | {} | Raw lower-level overrides for exceptional cases |
    | OpenTofu version override | No | Ravion default | Override the OpenTofu version for the stack |
    | Ravion Terraform workspace name | No | {project}-{env}-{module} | Override the state backend workspace name |

    ## Design decisions

    - TLS ends at the load balancer with a certificate Ravion issues and renews. The router receives plain HTTP/1.1, and WebSocket upgrades pass through.
    - Port 80 reaches the router, which redirects to HTTPS. A Network Load Balancer cannot redirect by itself.
    - One router instance serves all previews. A replaced instance means a few minutes without previews; running previews resume on the next request.
    - The load balancer and the router use IPv4.
    - The load balancer writes no access logs.

    ## Learn more

    - [Network Load Balancers](https://docs.aws.amazon.com/elasticloadbalancing/latest/network/introduction.html)
    - [TLS listeners](https://docs.aws.amazon.com/elasticloadbalancing/latest/network/create-tls-listener.html)
    - [Security groups for Network Load Balancers](https://docs.aws.amazon.com/elasticloadbalancing/latest/network/load-balancer-security-groups.html)
    - [Session Manager](https://docs.aws.amazon.com/systems-manager/latest/userguide/session-manager.html)
