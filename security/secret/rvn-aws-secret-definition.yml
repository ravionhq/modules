definition:
  type: rvn-aws-secret
  name: AWS Secret
  description: Generates a random value and stores it in SSM Parameter Store or Secrets Manager without it ever appearing in Terraform state.
release:
  version: 0.1.0
  description: Generate random keys and passwords in Parameter Store or Secrets Manager, never stored in Terraform state or Ravion.
module:
  inputs:
    - $include: ../../partials/inputs/aws-account.yml
    - $include: ../../partials/inputs/aws-region.yml
    - id: section_secret
      label: Secret
      type: section
    - default: parameter_store
      description: Parameter Store is free. Secrets Manager costs about $0.40 per secret per month and adds cross-Region replication and managed rotation, which this module doesn't set up yet. ECS reads both the same way.
      id: store
      immutable: true
      label: Store
      required: true
      type: string
      values:
        - label: SSM Parameter Store
          value: parameter_store
        - label: Secrets Manager
          value: secrets_manager
    - default: ravion/<<project.given_id>>/<<environment.given_id>>/<<module.given_id>>
      description: Parameter Store adds a leading slash and doesn't allow + = @ or names starting with aws or ssm. Can't be changed later.
      id: name
      immutable: true
      label: Name
      patterns:
        - message: Up to 512 letters, numbers, and . _ - + = @ /, with no empty path segments.
          pattern: ^/?[A-Za-z0-9_.+=@-]+(/[A-Za-z0-9_.+=@-]+)*$
      required: true
      type: string
    - default: 32
      description: Characters in the generated value, from 16 to 512. Applies on the next rotation.
      id: length
      label: Length
      max: 512
      min: 16
      required: true
      type: number
    - default: 30
      description: How long a deleted secret can be restored before AWS removes it for good.
      id: recovery_window_in_days
      label: Recovery window (days)
      max: 30
      min: 7
      required: true
      show_when:
        store: secrets_manager
      type: number
    - collapsible: true
      default: false
      description: Leave off for values used in URLs, headers, or connection strings. Applies on the next rotation.
      id: special_characters
      label: Special characters
      type: boolean
    - collapsible: true
      default: 1
      description: Increase to replace the stored value. Services pick it up when their tasks next start.
      id: rotation_version
      label: Rotation version
      min: 1
      required: true
      type: number
    - collapsible: true
      description: Customer managed key for encryption. Leave blank to use the AWS managed key.
      id: kms_key_id
      label: KMS key
      placeholder: alias/my-key
      type: string
    - $include: ../../partials/inputs/misc-section.yml
    - $include: ../../partials/inputs/tags.yml
    - $include: ../../partials/inputs/terraform-settings.yml
    - $merge:
        - ../../partials/inputs/execution-environment.yml
      description: Override the execution environment for Terraform runners. Must use the same AWS account as selected above.
  stack:
    $template: ../../partials/templates/opentofu-stack.yml
    with:
      base_path: security/secret
      terraform_variables:
        ...overrides: << module.input.advanced_terraform_variables >>
        kms_key_id: << module.input.kms_key_id || null >>
        length: << module.input.length >>
        name: << module.input.name >>
        recovery_window_in_days: << module.input.recovery_window_in_days >>
        region: << module.input.aws_region >>
        rotation_version: << module.input.rotation_version >>
        special_characters: << module.input.special_characters || false >>
        store: << module.input.store >>
        tags:
          $include: ../../partials/stack/ravion-tags.yml
  ui:
    links: |-
      <<
      stack.output.name && stack.output.region ?
      (stack.output.store == "parameter_store" ?
      [{"name":"SSM parameter","href":"https://" + stack.output.region + ".console.aws.amazon.com/systems-manager/parameters" + stack.output.name + "/description?region=" + stack.output.region}] :
      [{"name":"Secret","href":"https://" + stack.output.region + ".console.aws.amazon.com/secretsmanager/secret?name=" + stack.output.name + "&region=" + stack.output.region}]) :
      []
      >>
  readme: |
    Generates a random value, such as an API key, master key, or session secret, and stores it in SSM Parameter Store or Secrets Manager. The value never appears in Terraform state, plans, Ravion, or your project config.

    ## Overview

    Use this module when an app needs a secret that nobody has to type in or copy around. The module generates the value during apply and writes it directly to AWS. It only outputs the parameter or secret ARN and name, so other modules can reference the secret without ever seeing it.

    ## Using the secret in a service

    Pass the `arn` output to an ECS service as a runtime secret:

    ```yaml
    secrets:
      - name: MEILI_MASTER_KEY
        valueFrom: << modules.meilisearch-master-key.output.arn >>
    ```

    ECS reads the value when each task starts. ECS services created with Ravion can already read parameters and secrets in the same AWS account and region.

    ## Stores

    | Store | Resource | Default encryption | Notes |
    | --- | --- | --- | --- |
    | SSM Parameter Store | Standard `SecureString` parameter | `aws/ssm` | Free. Regional only. |
    | Secrets Manager | Secret with one version | `aws/secretsmanager` | About $0.40 per secret per month plus API calls. Supports cross-Region replication and managed rotation (not configured by this module). Deleted secrets are kept for the recovery window. |

    ## Rotation

    Increase Rotation version to generate a new value and overwrite the stored one. Changes to Length or Special characters only take effect on the next rotation, so the current value never changes unexpectedly. Services pick up the new value the next time their tasks start, for example on their next deploy.

    ## Configuration

    | Setting | Required | Default | Notes |
    | --- | --- | --- | --- |
    | AWS account | Yes | None | AWS account where the secret is stored. |
    | Region | Yes | None | AWS Region where the secret is stored. |
    | Store | Yes | SSM Parameter Store | Parameter Store or Secrets Manager. |
    | Name | Yes | `ravion/<project>/<environment>/<module>` | Parameter Store names get a leading slash. |
    | Length | Yes | 32 | 16 to 512 characters. |
    | Special characters | No | Off | Letters and numbers only by default. |
    | Rotation version | Yes | 1 | Increase to rotate the value. |
    | KMS key | No | AWS managed key | Customer managed key for encryption. |
    | Recovery window (days) | Secrets Manager only | 30 | 7 to 30. |
    | Tags | No | Standard Ravion tags | Additional tags merged with Ravion ownership and identity tags. |

    ## Design decisions

    The value is generated with an ephemeral resource and written through write-only arguments. OpenTofu never persists ephemeral values or write-only arguments, so the value exists only in Parameter Store or Secrets Manager. This requires OpenTofu 1.11 or later.

    Store, name, AWS account, and Region are immutable because changing them creates a different parameter or secret, and services referencing the old ARN would lose access.

    ## Learn more

    - [SSM Parameter Store SecureString parameters](https://docs.aws.amazon.com/systems-manager/latest/userguide/sysman-paramstore-securestring.html)
    - [AWS Secrets Manager](https://docs.aws.amazon.com/secretsmanager/latest/userguide/intro.html)
    - [Passing secrets to ECS tasks](https://docs.aws.amazon.com/AmazonECS/latest/developerguide/specifying-sensitive-data.html)
    - [OpenTofu ephemeral resources](https://opentofu.org/docs/language/ephemerality/)
    - [Source module](https://github.com/ravionhq/modules/tree/$local.module_tag/security/secret)
