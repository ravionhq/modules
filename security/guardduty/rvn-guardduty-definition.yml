definition:
  type: rvn-guardduty
  name: AWS GuardDuty
  description: Enables Amazon GuardDuty threat detection in the selected AWS Regions with explicit protection plans.
release:
  version: 0.1.0
  description: Enable Amazon GuardDuty in a list of AWS Regions with explicitly managed protection plans.
module:
  inputs:
    - $include: ../../partials/inputs/aws-account.yml
    - $merge:
        - ../../partials/inputs/aws-region.yml
      description: Region where the Terraform runner executes. GuardDuty itself is enabled in the Regions selected below.
    - id: section_regions
      label: GuardDuty Regions
      type: section
    - add_button_label: Add Region
      description: AWS Regions where GuardDuty is enabled. Every Region must be enabled for the account. Removing a Region disables GuardDuty there and discards its findings.
      id: regions
      label: Regions
      required: true
      type: string_array
      values: $values:aws/regions
    - id: section_protection_plans
      label: Protection plans
      type: section
    - default: true
      description: Monitor S3 data events for suspicious access to buckets and objects.
      id: s3_protection_enabled
      label: S3 Protection
      type: boolean
    - default: true
      description: Monitor Kubernetes audit logs from EKS clusters.
      id: eks_protection_enabled
      label: EKS Protection
      type: boolean
    - default: true
      description: Scan EBS volumes attached to EC2 instances and container workloads when GuardDuty detects malicious behaviour.
      id: malware_protection_enabled
      label: Malware Protection for EC2
      type: boolean
    - default: true
      description: Monitor login activity to Aurora and supported RDS databases.
      id: rds_protection_enabled
      label: RDS Protection
      type: boolean
    - default: true
      description: Monitor Lambda network activity logs.
      id: lambda_protection_enabled
      label: Lambda Protection
      type: boolean
    - default: false
      description: OS-level threat detection for EKS, ECS Fargate, and EC2 workloads using the GuardDuty security agent. Adds agent cost per workload.
      id: runtime_monitoring_enabled
      label: Runtime Monitoring
      type: boolean
    - add_button_label: Add workload type
      default:
        - EKS_ADDON_MANAGEMENT
        - ECS_FARGATE_AGENT_MANAGEMENT
        - EC2_AGENT_MANAGEMENT
      description: Workload types where GuardDuty installs and manages the Runtime Monitoring security agent automatically.
      id: runtime_monitoring_automated_agents
      label: Automated agent management
      patterns:
        - message: Must be EKS_ADDON_MANAGEMENT, ECS_FARGATE_AGENT_MANAGEMENT, or EC2_AGENT_MANAGEMENT.
          pattern: ^(EKS_ADDON_MANAGEMENT|ECS_FARGATE_AGENT_MANAGEMENT|EC2_AGENT_MANAGEMENT)$
      show_when:
        runtime_monitoring_enabled: true
      type: string_array
    - id: section_findings
      label: Findings
      type: section
    - collapsible: true
      default: FIFTEEN_MINUTES
      description: How often GuardDuty exports updated findings to EventBridge. New findings are always exported within five minutes.
      id: finding_publishing_frequency
      label: Finding publishing frequency
      type: string
      values:
        - label: Every 15 minutes
          value: FIFTEEN_MINUTES
        - label: Every hour
          value: ONE_HOUR
        - label: Every 6 hours
          value: SIX_HOURS
    - $include: ../../partials/inputs/misc-section.yml
    - $include: ../../partials/inputs/tags.yml
    - $include: ../../partials/inputs/terraform-settings.yml
    - $merge:
        - ../../partials/inputs/execution-environment.yml
      description: Override the execution environment for Terraform runners. Must use the same AWS account as selected above.
  stack:
    $template: ../../partials/templates/opentofu-stack.yml
    with:
      base_path: security/guardduty
      terraform_variables:
        ...overrides: << module.input.advanced_terraform_variables >>
        eks_protection_enabled: << module.input.eks_protection_enabled >>
        finding_publishing_frequency: << module.input.finding_publishing_frequency || "FIFTEEN_MINUTES" >>
        lambda_protection_enabled: << module.input.lambda_protection_enabled >>
        malware_protection_enabled: << module.input.malware_protection_enabled >>
        rds_protection_enabled: << module.input.rds_protection_enabled >>
        regions: << module.input.regions >>
        runtime_monitoring_automated_agents: "<< module.input.runtime_monitoring_enabled ? (module.input.runtime_monitoring_automated_agents || []) : [] >>"
        runtime_monitoring_enabled: << module.input.runtime_monitoring_enabled >>
        s3_protection_enabled: << module.input.s3_protection_enabled >>
        tags:
          $include: ../../partials/stack/ravion-tags.yml
  ui:
    links: |-
      <<
      stack.output.regions != nil && stack.output.regions != [] ? map(stack.output.regions, {
        "name":"GuardDuty " + #,
        "href":"https://" + # + ".console.aws.amazon.com/guardduty/home?region=" + #
      }) : []
      >>
  readme: |
    Enables Amazon GuardDuty threat detection in the selected AWS Regions with explicit protection plans.

    ## Overview

    Use this module to turn on continuous threat detection for one AWS account across every Region you operate in. GuardDuty analyses CloudTrail management events, VPC Flow Logs, and DNS logs without any agents, and adds protection plans for S3, EKS, EC2 malware, RDS, Lambda, and runtime workloads.

    The module creates one GuardDuty detector per selected Region and writes every protection plan explicitly as enabled or disabled in each Region. The applied configuration is therefore fully described by the module inputs rather than inherited from AWS account defaults or console trials, which makes it straightforward to evidence for SOC 2 monitoring controls.

    ## Use cases

    | Scenario | Benefit |
    | --- | --- |
    | SOC 2 and ISO 27001 monitoring controls | Demonstrate continuous, account-wide threat detection with a declarative, reviewable configuration. |
    | Multi-Region workloads | Enable GuardDuty consistently in every in-use Region from one module. |
    | Data-plane protection | Detect suspicious S3 access, database logins, and Lambda network activity beyond control-plane events. |
    | Container and host runtime security | Optionally add Runtime Monitoring with GuardDuty-managed agents for EKS, ECS Fargate, and EC2. |

    ## Regions

    Select every Region where the account runs workloads. GuardDuty is a Regional service, so a Region that is not selected is not monitored. Every selected Region must already be enabled (opted in) for the account; the module fails the plan with a clear message otherwise.

    Removing a Region later destroys that Region's detector, which disables GuardDuty there and discards its findings.

    ## Protection plans

    S3 Protection, EKS Protection, Malware Protection for EC2, RDS Protection, and Lambda Protection are enabled by default. Runtime Monitoring is disabled by default because it adds agent cost per workload; when enabled, GuardDuty can install and manage the security agent automatically on the selected workload types.

    Protection plans are billed per Region by the volume of data analysed. Turning a plan off keeps the detector and records the plan as disabled.

    ## Findings

    GuardDuty publishes findings to EventBridge in each Region. New findings are exported within five minutes; the finding publishing frequency controls how often updates to existing findings are exported. Central aggregation such as S3 export, Security Hub, or a delegated administrator account is configured separately.

    ## Configuration

    | Setting | Required | Default | Notes |
    | --- | --- | --- | --- |
    | AWS account | Yes | None | AWS account where GuardDuty is enabled. |
    | Region | Yes | None | Region where the Terraform runner executes. |
    | Regions | Yes | None | Regions where GuardDuty detectors are created. |
    | S3 Protection | No | Enabled | Monitor S3 data events. |
    | EKS Protection | No | Enabled | Monitor EKS audit logs. |
    | Malware Protection for EC2 | No | Enabled | Scan EBS volumes on suspicious behaviour. |
    | RDS Protection | No | Enabled | Monitor database login activity. |
    | Lambda Protection | No | Enabled | Monitor Lambda network activity. |
    | Runtime Monitoring | No | Disabled | OS-level detection using the GuardDuty agent. |
    | Automated agent management | No | EKS, ECS Fargate, and EC2 | Workload types where GuardDuty manages the agent. |
    | Finding publishing frequency | No | Every 15 minutes | Export cadence for updated findings. |
    | Tags | No | Standard Ravion tags | Additional tags merged with Ravion ownership and identity tags. |
    | Terraform execution environment | No | None | Optional runner environment override. |
    | OpenTofu version override | No | Environment default | Optional OpenTofu version override. |
    | Ravion Terraform workspace name | No | Generated from project, environment, module, and stack IDs | Backend workspace override. |
    | Advanced Terraform variables | No | Empty object | Escape hatch for one-off Terraform variable overrides. |

    ## Design decisions

    AWS allows exactly one GuardDuty detector per account per Region. If GuardDuty is already enabled in a selected Region, the apply fails; import the existing detector into this module's state or disable GuardDuty there first.

    Every protection plan is written explicitly in every Region so that plan output and state show the complete configuration. This avoids drift between Regions and makes the module's behaviour independent of whether AWS enables a plan by default for new detectors.

    Ravion adds standard tags for ownership and traceability. User-provided Tags are merged on top for team, cost, or environment metadata.

    ## Learn more

    - [Amazon GuardDuty](https://docs.aws.amazon.com/guardduty/latest/ug/what-is-guardduty.html)
    - [GuardDuty protection plans](https://docs.aws.amazon.com/guardduty/latest/ug/guardduty-features-activation-model.html)
    - [GuardDuty Runtime Monitoring](https://docs.aws.amazon.com/guardduty/latest/ug/runtime-monitoring.html)
    - [Source module](https://github.com/ravionhq/modules/tree/$local.module_tag/security/guardduty)
