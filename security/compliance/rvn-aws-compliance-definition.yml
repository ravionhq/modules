definition:
  type: rvn-aws-compliance
  name: AWS Compliance
  description: Manages an AWS compliance baseline with GuardDuty, ECR image scanning, regional CloudTrail audit trails, and secure account defaults.
release:
  version: 1.1.0
  description: Apply secure account defaults; IAM Access Analyzer, IMDSv2 for new instances, EBS encryption for new volumes and the S3 account public access block, each of which can be turned off.
module:
  inputs:
    - $include: ../../partials/inputs/aws-account.yml
    - $merge:
        - ../../partials/inputs/aws-region.yml
      description: Region where the Terraform runner executes. GuardDuty and ECR scanning are enabled in the Regions selected below.
    - id: section_regions
      label: Compliance regions
      type: section
    - add_button_label: Add Region
      description: Regions for GuardDuty, ECR scanning and CloudTrail. Include us-east-1 for IAM changes; each Region must be enabled.
      id: regions
      label: Regions
      required: true
      type: string_array
      values: $values:aws/regions
    - id: section_cloudtrail
      label: CloudTrail
      type: section
    - id: cloudtrail_enabled
      label: CloudTrail
      type: boolean
      default: true
      description: Use CloudTrail regions to omit existing coverage, or turn off if all Regions are already covered.
    - id: cloudtrail_regions
      label: CloudTrail regions
      type: string_array
      collapsible: true
      add_button_label: Add Region
      required: false
      values: $values:aws/regions
      description: Defaults to all selected Regions. Leave out Regions an existing trail already covers.
      show_when:
        cloudtrail_enabled: true
    - id: cloudtrail_log_retention_days
      label: Log retention (days)
      type: number
      collapsible: true
      default: 365
      min: 0
      description: S3 lifecycle expiry; 0 keeps logs forever.
      show_when:
        cloudtrail_enabled: true
    - id: cloudtrail_kms_key_arn
      label: KMS key ARN
      type: string
      collapsible: true
      required: false
      description: Leave blank for SSE-S3. Use a bucket-Region key whose policy allows cloudtrail.amazonaws.com for every trail.
      show_when:
        cloudtrail_enabled: true
    - id: section_protection_plans
      label: GuardDuty protection plans
      type: section
    - default: true
      description: Monitor S3 data events for suspicious access to buckets and objects.
      id: s3_protection_enabled
      label: S3 protection
      type: boolean
    - default: true
      description: Monitor Kubernetes audit logs from EKS clusters.
      id: eks_protection_enabled
      label: EKS protection
      type: boolean
    - default: true
      description: Scan EBS volumes attached to EC2 instances and container workloads when GuardDuty detects malicious behaviour.
      id: malware_protection_enabled
      label: Malware protection for EC2
      type: boolean
    - default: true
      description: Monitor login activity to Aurora and supported RDS databases.
      id: rds_protection_enabled
      label: RDS protection
      type: boolean
    - default: true
      description: Monitor Lambda network activity logs.
      id: lambda_protection_enabled
      label: Lambda protection
      type: boolean
    - default: false
      description: OS-level threat detection for EKS, ECS Fargate, and EC2 workloads using the GuardDuty security agent. Adds agent cost per workload.
      id: runtime_monitoring_enabled
      label: Runtime monitoring
      type: boolean
    - add_button_label: Add workload type
      default:
        - EKS_ADDON_MANAGEMENT
        - ECS_FARGATE_AGENT_MANAGEMENT
        - EC2_AGENT_MANAGEMENT
      description: Workload types where GuardDuty installs and manages the Runtime Monitoring security agent automatically.
      id: runtime_monitoring_automated_agents
      label: Automated agent management
      patterns:
        - message: Must be EKS_ADDON_MANAGEMENT, ECS_FARGATE_AGENT_MANAGEMENT, or EC2_AGENT_MANAGEMENT.
          pattern: ^(EKS_ADDON_MANAGEMENT|ECS_FARGATE_AGENT_MANAGEMENT|EC2_AGENT_MANAGEMENT)$
      show_when:
        runtime_monitoring_enabled: true
      type: string_array
    - id: section_account_settings
      label: Account settings
      type: section
    - default: true
      description: Reports resource policies that grant access outside the account. Free.
      id: access_analyzer_enabled
      label: IAM Access Analyzer
      type: boolean
    - default: true
      description: Applies to instances launched without their own metadata options. Running instances are not changed.
      id: imdsv2_default_enabled
      label: Require IMDSv2 by default
      type: boolean
    - default: true
      description: Applies to new volumes and snapshot copies. Turn off if this account shares AMIs or snapshots publicly.
      id: ebs_encryption_by_default_enabled
      label: Encrypt new EBS volumes by default
      type: boolean
    - default: true
      description: Applies to every bucket in the account, overriding each bucket's own setting.
      id: s3_public_acls_blocked
      label: Block public S3 ACLs
      type: boolean
    - default: true
      description: Applies to every bucket in the account. Turn off if a bucket is served publicly by bucket policy.
      id: s3_public_policies_blocked
      label: Block public S3 bucket policies
      type: boolean
    - id: section_findings
      label: Findings
      type: section
    - collapsible: true
      default: FIFTEEN_MINUTES
      description: How often GuardDuty exports updated findings to EventBridge. New findings are always exported within five minutes.
      id: finding_publishing_frequency
      label: Finding publishing frequency
      type: string
      values:
        - label: Every 15 minutes
          value: FIFTEEN_MINUTES
        - label: Every hour
          value: ONE_HOUR
        - label: Every 6 hours
          value: SIX_HOURS
    - $include: ../../partials/inputs/misc-section.yml
    - $include: ../../partials/inputs/tags.yml
    - $include: ../../partials/inputs/terraform-settings.yml
    - $merge:
        - ../../partials/inputs/execution-environment.yml
      description: Override the execution environment for Terraform runners. Must use the same AWS account as selected above.
  stack:
    $template: ../../partials/templates/opentofu-stack.yml
    with:
      base_path: security/compliance
      terraform_variables:
        ...overrides: << module.input.advanced_terraform_variables >>
        access_analyzer_enabled: << module.input.access_analyzer_enabled >>
        cloudtrail_enabled: << module.input.cloudtrail_enabled >>
        cloudtrail_regions: "<< module.input.cloudtrail_regions != nil && len(module.input.cloudtrail_regions) > 0 ? module.input.cloudtrail_regions : nil >>"
        cloudtrail_log_retention_days: "<< module.input.cloudtrail_log_retention_days != nil ? module.input.cloudtrail_log_retention_days : 365 >>"
        cloudtrail_kms_key_arn: << module.input.cloudtrail_kms_key_arn || nil >>
        ebs_encryption_by_default_enabled: << module.input.ebs_encryption_by_default_enabled >>
        eks_protection_enabled: << module.input.eks_protection_enabled >>
        finding_publishing_frequency: << module.input.finding_publishing_frequency || "FIFTEEN_MINUTES" >>
        imdsv2_default_enabled: << module.input.imdsv2_default_enabled >>
        lambda_protection_enabled: << module.input.lambda_protection_enabled >>
        malware_protection_enabled: << module.input.malware_protection_enabled >>
        rds_protection_enabled: << module.input.rds_protection_enabled >>
        regions: << module.input.regions >>
        runtime_monitoring_automated_agents: "<< module.input.runtime_monitoring_enabled ? (module.input.runtime_monitoring_automated_agents || []) : [] >>"
        runtime_monitoring_enabled: << module.input.runtime_monitoring_enabled >>
        s3_protection_enabled: << module.input.s3_protection_enabled >>
        s3_public_acls_blocked: << module.input.s3_public_acls_blocked >>
        s3_public_policies_blocked: << module.input.s3_public_policies_blocked >>
        tags:
          $include: ../../partials/stack/ravion-tags.yml
  ui:
    links: |-
      <<
      stack.output.regions != nil && stack.output.regions != [] ? map(stack.output.regions, {
        "name":"GuardDuty " + #,
        "href":"https://" + # + ".console.aws.amazon.com/guardduty/home?region=" + #
      }) : []
      >>
  readme: |
    Manages an AWS compliance baseline with GuardDuty, ECR image scanning, regional CloudTrail audit trails, and secure account defaults.

    ## Account-level setup

    Deploy one module for an AWS account and select every Region you want covered. The runner Region controls where Terraform executes and hosts the shared CloudTrail bucket; the Regions list controls GuardDuty, ECR scanning and CloudTrail trails. Every selected Region must already be enabled for the account.

    Each selected Region receives a GuardDuty detector with explicitly managed protection plans and an ECR registry scanning rule covering all existing and future private repositories. CloudTrail trails cover all selected Regions by default, or the CloudTrail regions subset when set. Application alarms and application log retention remain in their respective modules.

    ## GuardDuty

    S3, EKS audit logs, EC2 malware, RDS login, and Lambda network protection are enabled by default. Runtime Monitoring is opt-in because it adds security-agent costs. Each protection plan is explicitly enabled or disabled in every selected Region.

    GuardDuty sends findings to EventBridge. The finding publishing frequency controls updates to existing findings, defaulting to every 15 minutes. Central aggregation and notification routing are configured separately. GuardDuty protection plans incur AWS charges.

    ## ECR image scanning

    Basic scan-on-push is always enabled with a registry-level `*` filter. It covers repositories used by ECS, EKS, EC2, Lambda, and other workloads, including repositories created later. This declares the registry settings checked by OneLeet's image-scanning monitor.

    Basic scans check operating-system vulnerabilities on new image pushes. They do not provide continuous scanning or automatically scan all images pushed before this configuration was enabled.

    ## CloudTrail

    CloudTrail is enabled by default and creates one single-Region trail in each selected Region. CloudTrail regions optionally limits trails to a non-empty subset of Regions; leave it blank for all selected Regions. Turn CloudTrail off to disable all trails. Each trail records read and write management events with log file validation and no data events. The trails share one bucket in the runner Region.

    Include us-east-1 in Regions and, when set, CloudTrail regions to capture IAM changes and other global service events (CloudFront and the STS global endpoint). Only that trail includes global service events; us-east-1 is not added automatically. STS regional-endpoint events are recorded in their respective Regions.

    Logs go to a dedicated private S3 bucket with public access blocked, bucket-owner-enforced ownership, versioning, and encryption. Log retention (days) sets lifecycle expiry for current and noncurrent object versions; 365 is the default and 0 keeps them forever. With versioning, current-object expiry makes a version noncurrent, then noncurrent expiry applies.

    Leave KMS key ARN blank for SSE-S3, or supply a key in the bucket's runner Region, even for trails in other Regions. Its policy must allow cloudtrail.amazonaws.com to encrypt logs for every selected trail. This module does not manage the key policy.

    The first copy of management events per Region is free; S3 storage and optional KMS usage incur charges. If an existing trail already records those events in a Region, the additional copy is paid. Leave those Regions out via CloudTrail regions, or turn CloudTrail off if an organization trail already provides full coverage.

    Destroy fails while the bucket contains logs or object versions: force deletion is disabled. Disabling CloudTrail also attempts to remove its bucket, so preserve or explicitly remove retained logs before doing so.

    ## Account settings

    Four account defaults are on unless turned off. Each is managed only while it is on: turning one off, or destroying the module, returns that setting to the AWS default and leaves existing resources as they are.

    - **IAM Access Analyzer** creates an external-access analyzer in each selected Region. It reports resource policies (S3, IAM roles, KMS, Lambda, Secrets Manager, SQS, SNS and others) that grant access to a principal outside the account. It is free, and an analyzer the account already has is left alone.
    - **Require IMDSv2 by default** applies in each selected Region to instances launched without their own metadata options. A launch template or instance that sets its own options keeps them, and running instances are not changed.
    - **Encrypt new EBS volumes by default** applies in each selected Region to new volumes and snapshot copies, using the Region's default EBS key. Existing volumes are not changed. Encrypted snapshots cannot be shared publicly, so turn this off in an account that publishes public AMIs or snapshots.
    - **Block public S3 ACLs** and **Block public S3 bucket policies** set the S3 account public access block. It is one setting for the whole account, not one per Region, and it overrides every bucket's own setting. Turn the policy half off if a bucket is served publicly by bucket policy; a bucket behind CloudFront origin access control is not public and is unaffected.

    When upgrading from 1.0.0, review these before applying: with the defaults, the first apply stops public access to any bucket that relies on a public bucket policy or ACL.

    ## Existing resources and ownership

    GuardDuty detectors and ECR scanning configurations are shared by the whole account in each Region. Keep exactly one Terraform owner per account and Region; do not deploy overlapping instances or also manage them from a VPC or service module.

    If GuardDuty is already enabled, import the existing detectors into this module's Terraform state before applying. Do not disable GuardDuty just to adopt this module. Existing protection-plan settings are reconciled to the selected inputs.

    Applying replaces any existing ECR Enhanced scanning or custom filters with Basic scan-on-push for all repositories. Review the current configuration before adoption. Manually configured ECR registries can be managed by applying this module.

    Removing a Region or destroying the module deletes its GuardDuty detector and findings and resets ECR scanning to Basic without registry rules. It does not delete ECR repositories or images.

    ## Configuration

    | Setting | Default | Purpose |
    | --- | --- | --- |
    | AWS account | Required | Account whose regional security settings are managed. |
    | Region | Required | Terraform runner Region. |
    | Regions | Required | Regions covered by GuardDuty, ECR scanning and CloudTrail. Include us-east-1 for IAM changes. |
    | ECR scanning | Basic scan-on-push for all repositories | Always enabled by this module. |
    | CloudTrail | Enabled | One single-Region management-event trail in each selected Region, sharing a runner-Region bucket. |
    | CloudTrail regions | All selected Regions | Optional subset of Regions; omit Regions already covered by an existing trail. |
    | Log retention (days) | 365 | S3 lifecycle expiry; 0 keeps logs forever. |
    | KMS key ARN | None (SSE-S3) | Key in the bucket's runner Region whose policy permits encryption for every trail. |
    | S3, EKS, malware, RDS, Lambda protection | Enabled | GuardDuty protection plans. |
    | Runtime monitoring | Disabled | Optional workload security agents. |
    | Automated agent management | EKS, ECS Fargate, EC2 | Used when Runtime Monitoring is enabled. |
    | Finding publishing frequency | Every 15 minutes | Export cadence for updated GuardDuty findings. |
    | IAM Access Analyzer | Enabled | External-access analyzer in each selected Region. |
    | Require IMDSv2 by default | Enabled | Default for instances launched without their own metadata options. |
    | Encrypt new EBS volumes by default | Enabled | Turn off when sharing AMIs or snapshots publicly. |
    | Block public S3 ACLs | Enabled | Account-wide; overrides bucket settings. |
    | Block public S3 bucket policies | Enabled | Account-wide; turn off when a bucket is public by bucket policy. |
    | Tags | Standard Ravion tags | Additional tags for GuardDuty, Access Analyzer, CloudTrail and its bucket; ECR registry scanning does not support tags. |

    ## Learn more

    - [Amazon GuardDuty](https://docs.aws.amazon.com/guardduty/latest/ug/what-is-guardduty.html)
    - [GuardDuty protection plans](https://docs.aws.amazon.com/guardduty/latest/ug/guardduty-features-activation-model.html)
    - [ECR scanning filters](https://docs.aws.amazon.com/AmazonECR/latest/userguide/image-scanning-filters.html)
    - [IAM Access Analyzer](https://docs.aws.amazon.com/IAM/latest/UserGuide/what-is-access-analyzer.html)
    - [S3 block public access](https://docs.aws.amazon.com/AmazonS3/latest/userguide/access-control-block-public-access.html)
    - [Source module](https://github.com/ravionhq/modules/tree/$local.module_tag/security/compliance)
