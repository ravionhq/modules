definition:
  type: rvn-elasticache
  name: ElastiCache
  description: Creates and manages Amazon ElastiCache for Redis, Valkey, Memcached, or serverless Redis-compatible caches.
release:
  version: 1.0.2
  description: Derive per-input apply-action metadata in the compiled module definition.
module:
  inputs:
    - id: network
      immutable: true
      label: VPC network
      mapped_inputs:
        - id: section_aws
          label: AWS account & region
          type: section
        - default: << ref.input.aws_account_id >>
          id: aws_account_id
          immutable: true
          label: AWS account
          type: string
          values: $values:ravion/aws_accounts
        - default: << ref.input.aws_region >>
          description: AWS region for this cache.
          id: aws_region
          immutable: true
          label: Region
          type: string
          values: $values:aws/regions
        - collapsible: true
          default: << ref.input.execution_environment_id >>
          description: Override the VPC, subnet, and security group for Terraform runners. Must use the same AWS account as selected above.
          id: execution_environment_id
          label: Terraform execution environment
          type: string
          values: $values:ravion/execution_environments
        - id: section_vpc
          label: VPC
          type: section
        - default: <<ref.stack.output.vpc_id>>
          id: vpc_id
          immutable: true
          label: VPC ID
          required: true
          type: string
        - add_button_label: Add private subnet ID
          default: <<ref.stack.output.private_subnet_ids>>
          description: Subnets for the ElastiCache subnet group or serverless cache. Use private subnets for normal cache deployments.
          id: subnet_ids
          immutable: true
          label: Private subnet IDs
          required: true
          type: string_array
      required: true
      type: $ref:rvn-aws-network
    - id: section_cache
      label: Cache
      type: section
    - default: <<project.given_id>>-<<environment.given_id>>
      description: Name prefix for all ElastiCache resources.
      id: name
      immutable: true
      label: Name slug
      patterns:
        - message: 1-40 lowercase letters, numbers, and hyphens. Start and end with a letter or number.
          pattern: ^[a-z0-9]([a-z0-9-]{0,38}[a-z0-9])?$
      required: true
      type: string
    - id: section_version
      label: Version
      type: section
    - default: valkey
      description: Choose Valkey for Redis-compatible workloads with lower AWS pricing, Redis for Redis OSS compatibility requirements, or Memcached for simple non-persistent object caching without Redis data structures. AWS prices Valkey 20% lower than Redis OSS for node-based ElastiCache and 33% lower for Serverless, with a 90% lower Serverless minimum data storage size.
      id: engine
      immutable: true
      label: Engine
      required: true
      type: string
      values:
        - label: Valkey
          description: Recommended default for Redis-compatible workloads. AWS prices Valkey 20% lower than Redis OSS for node-based caches and 33% lower for Serverless, with a 90% lower Serverless minimum data storage size.
          value: valkey
        - label: Redis
          description: Use when you specifically need Redis OSS engine compatibility or have an existing Redis OSS requirement.
          value: redis
        - label: Memcached
          description: Best for simple volatile object caching where you do not need Redis commands, persistence, replicas, or cluster-mode sharding.
          value: memcached
    - description: "Major engine version. Current latest major versions include Valkey 9, Redis OSS 7, and Memcached 1.6."
      id: engine_major_version
      immutable: true
      label: Engine major version
      placeholder: "9"
      required: true
      type: string
    - description: Minor or patch version appended to the major version.
      id: engine_minor_version
      label: Engine minor version
      placeholder: "0"
      required: true
      type: string
    - default: true
      description: Enable automatic minor engine version upgrades during the maintenance window.
      id: minor_version_auto_upgrade_enabled
      label: Auto minor version upgrades
      show_when:
        serverless_enabled: false
      type: boolean
    - id: section_size
      label: Size & topology
      type: section
    - default: false
      description: Create an ElastiCache Serverless cache instead of provisioned nodes. Supported for Redis and Valkey.
      id: serverless_enabled
      immutable: true
      label: Serverless
      show_when:
        engine:
          - redis
          - valkey
      type: boolean
    - default: cache.t4g.micro
      description: ElastiCache node size for provisioned clusters.
      id: node_type
      label: Node type
      patterns:
        - message: Node type must start with cache.
          pattern: ^cache\..+
      required: true
      show_when:
        serverless_enabled: false
      type: string
    - default: 1
      description: Number of Memcached cache nodes.
      id: num_cache_nodes
      label: Cache nodes
      max: 40
      min: 1
      show_when:
        engine: memcached
        serverless_enabled: false
      type: number
    - default: false
      description: Enable cluster mode when one primary shard is not enough for your data size or throughput. Leave disabled for simpler Redis or Valkey deployments with one primary and optional replicas.
      id: cluster_mode_enabled
      label: Cluster mode
      show_when:
        engine:
          - redis
          - valkey
        serverless_enabled: false
      type: boolean
    - default: 1
      description: Number of Redis or Valkey shards. Use 1 when cluster mode is disabled.
      id: num_node_groups
      label: Node groups
      max: 500
      min: 1
      show_when:
        cluster_mode_enabled: true
        engine:
          - redis
          - valkey
        serverless_enabled: false
      type: number
    - default: 0
      description: Number of replica nodes in each Redis or Valkey node group.
      id: replicas_per_node_group
      label: Replicas per node group
      max: 5
      min: 0
      show_when:
        engine:
          - redis
          - valkey
        serverless_enabled: false
      type: number
    - collapsible: true
      description: Port where the cache accepts connections. Leave blank for engine defaults.
      id: port
      label: Port
      max: 65535
      min: 1
      type: number
    - collapsible: true
      default: ipv4
      description: Network type for the replication group.
      id: network_type
      label: Network type
      show_when:
        serverless_enabled: false
      type: string
      values:
        - label: IPv4
          value: ipv4
        - label: IPv6
          value: ipv6
        - label: Dual stack
          value: dual_stack
    - collapsible: true
      default: ipv4
      description: IP address discovery method.
      id: ip_discovery
      label: IP discovery
      show_when:
        serverless_enabled: false
      type: string
      values:
        - label: IPv4
          value: ipv4
        - label: IPv6
          value: ipv6
    - id: section_security
      label: Security
      type: section
    - default: true
      description: Create a security group with ingress rules for this cache.
      id: security_group_creation_enabled
      label: Security group creation
      type: boolean
    - description: Existing security group ID to use when security group creation is disabled.
      id: security_group_id
      label: Security group ID
      patterns:
        - message: Security group ID must start with sg-.
          pattern: ^sg-.+
      required: true
      show_when:
        security_group_creation_enabled: false
      type: string
    - add_button_label: Add security group ID
      description: Security groups allowed to connect to this cache.
      id: allowed_security_group_ids
      label: Allowed security groups
      patterns:
        - message: Security group ID must start with sg-.
          pattern: ^sg-.+
      placeholder: sg-...
      type: string_array
    - add_button_label: Add CIDR block
      collapsible: true
      description: IPv4 CIDR blocks allowed to connect to this cache.
      id: allowed_cidr_blocks
      label: Allowed IPv4 CIDR blocks
      placeholder: 10.0.0.0/16
      type: string_array
    - add_button_label: Add IPv6 CIDR block
      collapsible: true
      description: IPv6 CIDR blocks allowed to connect to this cache.
      id: allowed_ipv6_cidr_blocks
      label: Allowed IPv6 CIDR blocks
      placeholder: 2001:db8::/64
      type: string_array
    - collapsible: true
      default: true
      description: Enable TLS encryption for Redis and Valkey traffic.
      id: transit_encryption_enabled
      label: Transit encryption
      show_when:
        engine:
          - redis
          - valkey
      type: boolean
    - collapsible: true
      default: true
      description: Enable encryption at rest for Redis and Valkey.
      id: at_rest_encryption_enabled
      label: At-rest encryption
      show_when:
        engine:
          - redis
          - valkey
      type: boolean
    - collapsible: true
      description: KMS key ARN for at-rest encryption. Leave blank to use the AWS managed key.
      id: kms_key_arn
      label: KMS key ARN
      placeholder: arn:aws:kms:us-east-1:123456789012:key/abc-123
      show_when:
        at_rest_encryption_enabled: true
        engine:
          - redis
          - valkey
      type: string
    - collapsible: true
      default: true
      description: Generate an AUTH token for Redis or Valkey when no token is provided. Requires transit encryption.
      id: auth_token_enabled
      label: AUTH token generation
      show_when:
        engine:
          - redis
          - valkey
        transit_encryption_enabled: true
      type: boolean
    - collapsible: true
      description: Optional explicit AUTH token. Leave blank to generate one when AUTH token generation is enabled.
      id: auth_token
      label: AUTH token
      show_when:
        engine:
          - redis
          - valkey
        transit_encryption_enabled: true
      type: string
    - collapsible: true
      default: 32
      description: Length of the generated AUTH token.
      id: auth_token_length
      label: AUTH token length
      max: 128
      min: 16
      show_when:
        auth_token_enabled: true
        engine:
          - redis
          - valkey
        transit_encryption_enabled: true
      type: number
    - id: section_availability
      label: Availability
      show_when:
        engine:
          - redis
          - valkey
        serverless_enabled: false
      type: section
    - default: false
      description: Enable automatic failover. Requires at least one replica.
      id: automatic_failover_enabled
      label: Automatic failover
      show_when:
        engine:
          - redis
          - valkey
        serverless_enabled: false
      type: boolean
    - default: false
      description: Enable Multi-AZ support for the replication group.
      id: multi_az_enabled
      label: Multi-AZ
      show_when:
        engine:
          - redis
          - valkey
        serverless_enabled: false
      type: boolean
    - collapsible: true
      default: false
      description: Enable data tiering for r6gd or r7gd node types.
      id: data_tiering_enabled
      label: Data tiering
      show_when:
        engine:
          - redis
          - valkey
        serverless_enabled: false
      type: boolean
    - id: section_backups
      label: Backups
      show_when:
        engine:
          - redis
          - valkey
      type: section
    - default: 0
      description: Number of days to retain automatic snapshots. Set to 0 to disable backups.
      id: snapshot_retention_limit
      label: Snapshot retention days
      max: 35
      min: 0
      show_when:
        engine:
          - redis
          - valkey
        serverless_enabled: false
      type: number
    - collapsible: true
      description: Daily UTC window for automatic snapshots.
      id: snapshot_window
      label: Snapshot window
      placeholder: 05:00-09:00
      show_when:
        engine:
          - redis
          - valkey
        serverless_enabled: false
      type: string
    - collapsible: true
      description: Final snapshot name to create when deleting the replication group. Leave blank to skip final snapshot creation.
      id: final_snapshot_identifier
      label: Final snapshot identifier
      show_when:
        engine:
          - redis
          - valkey
        serverless_enabled: false
      type: string
    - collapsible: true
      description: Snapshot ARNs to restore into the serverless cache.
      id: serverless_snapshot_arns_to_restore
      label: Serverless snapshot ARNs to restore
      show_when:
        engine:
          - redis
          - valkey
        serverless_enabled: true
      type: string_array
    - collapsible: true
      description: Daily UTC time for serverless automated snapshots.
      id: serverless_daily_snapshot_time
      label: Serverless daily snapshot time
      placeholder: "05:00"
      show_when:
        engine:
          - redis
          - valkey
        serverless_enabled: true
      type: string
    - id: section_serverless_limits
      label: Serverless usage limits
      show_when:
        serverless_enabled: true
      type: section
    - default: 10
      description: Maximum serverless data storage in GB.
      id: serverless_data_storage_maximum
      label: Data storage maximum (GB)
      max: 5000
      min: 1
      show_when:
        serverless_enabled: true
      type: number
    - default: 5000
      description: Maximum serverless ECPU per second.
      id: serverless_ecpu_per_second_maximum
      label: ECPU per second maximum
      max: 15000000
      min: 1000
      show_when:
        serverless_enabled: true
      type: number
    - add_button_label: Add security group ID
      collapsible: true
      description: Security groups to associate with the serverless cache. Leave blank to use this module's security group.
      id: serverless_security_group_ids
      label: Serverless security groups
      patterns:
        - message: Security group ID must start with sg-.
          pattern: ^sg-.+
      show_when:
        serverless_enabled: true
      type: string_array
    - id: section_maintenance
      label: Maintenance
      type: section
    - collapsible: true
      description: Weekly UTC maintenance window.
      id: maintenance_window
      label: Maintenance window
      placeholder: sun:05:00-sun:09:00
      show_when:
        serverless_enabled: false
      type: string
    - default: false
      description: Apply changes immediately instead of during the next maintenance window.
      id: immediate_apply_enabled
      label: Apply immediately
      show_when:
        serverless_enabled: false
      type: boolean
    - id: section_parameters
      label: Parameter group
      show_when:
        serverless_enabled: false
      type: section
    - collapsible: true
      description: Parameter group family. Leave blank to derive it from engine and version.
      id: parameter_group_family
      label: Parameter group family
      placeholder: redis7
      show_when:
        serverless_enabled: false
      type: string
    - collapsible: true
      default: []
      description: Parameter name/value pairs for the ElastiCache parameter group.
      id: parameters
      item_inputs:
        - id: name
          label: Name
          required: true
          type: string
        - id: value
          label: Value
          required: true
          type: string
      item_label: Parameter
      label: Parameters
      show_when:
        serverless_enabled: false
      type: object_array
    - id: section_notifications
      label: Notifications
      type: section
    - collapsible: true
      description: SNS topic ARN for ElastiCache notifications.
      id: notification_topic_arn
      label: Notification topic ARN
      placeholder: arn:aws:sns:us-east-1:123456789012:alerts
      show_when:
        serverless_enabled: false
      type: string
    - id: section_secrets
      label: Secrets Manager
      type: section
    - default: true
      description: Create a Secrets Manager secret containing the cache connection string.
      id: secret_creation_enabled
      label: Connection string secret
      type: boolean
    - collapsible: true
      description: Secret name. Leave blank to use the generated connection string secret name.
      id: secret_name
      label: Secret name
      show_when:
        secret_creation_enabled: true
      type: string
    - collapsible: true
      description: KMS key ARN used to encrypt the connection string secret.
      id: secret_kms_key_arn
      label: Secret KMS key ARN
      placeholder: arn:aws:kms:us-east-1:123456789012:key/abc-123
      show_when:
        secret_creation_enabled: true
      type: string
    - collapsible: true
      default: 7
      description: Days AWS Secrets Manager waits before deleting the secret. Set to 0 for immediate deletion.
      id: secret_recovery_window_in_days
      label: Secret recovery window (days)
      max: 30
      min: 0
      show_when:
        secret_creation_enabled: true
      type: number
    - id: section_observability
      label: Observability
      type: section
    - default: false
      description: Create CloudWatch alarms for CPU, memory, connections, and evictions.
      id: cloudwatch_alarms_creation_enabled
      label: CloudWatch alarms
      type: boolean
    - collapsible: true
      default: 80
      description: CPU utilization threshold in percent.
      id: cloudwatch_alarm_cpu_threshold
      label: CPU alarm threshold (%)
      max: 100
      min: 0
      show_when:
        cloudwatch_alarms_creation_enabled: true
      type: number
    - collapsible: true
      default: 80
      description: Memory utilization threshold in percent.
      id: cloudwatch_alarm_memory_threshold
      label: Memory alarm threshold (%)
      max: 100
      min: 0
      show_when:
        cloudwatch_alarms_creation_enabled: true
      type: number
    - collapsible: true
      default: 1000
      description: Current connections alarm threshold.
      id: cloudwatch_alarm_connections_threshold
      label: Connections alarm threshold
      min: 1
      show_when:
        cloudwatch_alarms_creation_enabled: true
      type: number
    - collapsible: true
      default: 100
      description: Evictions alarm threshold.
      id: cloudwatch_alarm_evictions_threshold
      label: Evictions alarm threshold
      min: 0
      show_when:
        cloudwatch_alarms_creation_enabled: true
      type: number
    - collapsible: true
      default: 2
      description: Number of periods over which CloudWatch compares alarm data to the threshold.
      id: cloudwatch_alarm_evaluation_periods
      label: Alarm evaluation periods
      min: 1
      show_when:
        cloudwatch_alarms_creation_enabled: true
      type: number
    - collapsible: true
      default: 300
      description: Alarm period in seconds.
      id: cloudwatch_alarm_period
      label: Alarm period
      show_when:
        cloudwatch_alarms_creation_enabled: true
      type: number
      values:
        - label: 10 seconds
          value: 10
        - label: 30 seconds
          value: 30
        - label: 60 seconds
          value: 60
        - label: 5 minutes
          value: 300
        - label: 15 minutes
          value: 900
        - label: 1 hour
          value: 3600
    - add_button_label: Add alarm action ARN
      collapsible: true
      description: ARNs to notify when an alarm transitions to ALARM.
      id: cloudwatch_alarm_actions
      label: Alarm actions
      show_when:
        cloudwatch_alarms_creation_enabled: true
      type: string_array
    - add_button_label: Add OK action ARN
      collapsible: true
      description: ARNs to notify when an alarm transitions to OK.
      id: cloudwatch_ok_actions
      label: OK actions
      show_when:
        cloudwatch_alarms_creation_enabled: true
      type: string_array
    - $include: ../../partials/inputs/misc-section.yml
    - $include: ../../partials/inputs/tags.yml
    - $include: ../../partials/inputs/terraform-settings.yml
  stack:
    $template: ../../partials/templates/opentofu-stack.yml
    with:
      base_path: cache/elasticache
      terraform_variables:
        ...overrides: << module.input.advanced_terraform_variables >>
        allowed_cidr_blocks: << module.input.allowed_cidr_blocks >>
        allowed_ipv6_cidr_blocks: << module.input.allowed_ipv6_cidr_blocks >>
        allowed_security_group_ids: << module.input.allowed_security_group_ids >>
        at_rest_encryption_enabled: << module.input.at_rest_encryption_enabled >>
        auth_token: << module.input.auth_token >>
        auth_token_enabled: << module.input.auth_token_enabled >>
        auth_token_length: << module.input.auth_token_length >>
        automatic_failover_enabled: << module.input.automatic_failover_enabled >>
        cloudwatch_alarm_actions: << module.input.cloudwatch_alarm_actions >>
        cloudwatch_alarm_connections_threshold: << module.input.cloudwatch_alarm_connections_threshold >>
        cloudwatch_alarm_cpu_threshold: << module.input.cloudwatch_alarm_cpu_threshold >>
        cloudwatch_alarm_evaluation_periods: << module.input.cloudwatch_alarm_evaluation_periods >>
        cloudwatch_alarm_evictions_threshold: << module.input.cloudwatch_alarm_evictions_threshold >>
        cloudwatch_alarm_memory_threshold: << module.input.cloudwatch_alarm_memory_threshold >>
        cloudwatch_alarm_period: << module.input.cloudwatch_alarm_period >>
        cloudwatch_alarms_creation_enabled: << module.input.cloudwatch_alarms_creation_enabled >>
        cloudwatch_ok_actions: << module.input.cloudwatch_ok_actions >>
        cluster_mode_enabled: << module.input.cluster_mode_enabled >>
        data_tiering_enabled: << module.input.data_tiering_enabled >>
        engine: << module.input.engine >>
        engine_major_version: << module.input.engine_major_version >>
        engine_minor_version: << module.input.engine_minor_version >>
        final_snapshot_identifier: << module.input.final_snapshot_identifier >>
        global_replication_group_id: null
        immediate_apply_enabled: << module.input.immediate_apply_enabled >>
        ip_discovery: << module.input.ip_discovery >>
        kms_key_arn: << module.input.kms_key_arn >>
        log_delivery_configuration: []
        maintenance_window: << module.input.maintenance_window >>
        minor_version_auto_upgrade_enabled: << module.input.minor_version_auto_upgrade_enabled >>
        multi_az_enabled: << module.input.multi_az_enabled >>
        name: << module.input.name >>
        network_type: << module.input.network_type >>
        node_type: << module.input.node_type >>
        notification_topic_arn: << module.input.notification_topic_arn >>
        num_cache_nodes: << module.input.num_cache_nodes >>
        num_node_groups: "<< module.input.cluster_mode_enabled ? module.input.num_node_groups : 1 >>"
        parameter_group_family: << module.input.parameter_group_family >>
        parameters: << module.input.parameters >>
        port: << module.input.port >>
        region: << module.input.aws_region >>
        replicas_per_node_group: << module.input.replicas_per_node_group >>
        secret_creation_enabled: << module.input.secret_creation_enabled >>
        secret_kms_key_arn: << module.input.secret_kms_key_arn >>
        secret_name: << module.input.secret_name >>
        secret_recovery_window_in_days: << module.input.secret_recovery_window_in_days >>
        security_group_creation_enabled: << module.input.security_group_creation_enabled >>
        security_group_id: << module.input.security_group_id >>
        serverless_cache_usage_limits:
          data_storage_maximum: << module.input.serverless_data_storage_maximum >>
          ecpu_per_second_maximum: << module.input.serverless_ecpu_per_second_maximum >>
        serverless_daily_snapshot_time: << module.input.serverless_daily_snapshot_time >>
        serverless_enabled: << module.input.serverless_enabled >>
        serverless_security_group_ids: << module.input.serverless_security_group_ids >>
        serverless_snapshot_arns_to_restore: << module.input.serverless_snapshot_arns_to_restore >>
        snapshot_retention_limit: << module.input.snapshot_retention_limit >>
        snapshot_window: << module.input.snapshot_window >>
        subnet_ids: << module.input.subnet_ids >>
        tags:
          $include: ../../partials/stack/ravion-tags.yml
        transit_encryption_enabled: << module.input.transit_encryption_enabled >>
        vpc_id: << module.input.vpc_id >>
  ui:
    metrics: |-
      <<
      module.input.serverless_enabled ? [
        {id:"serverless_cache_hit_rate", name:"Cache hit rate", type:"line", source:{type:"cloudwatch", aws_account_id:module.input.aws_account_id, namespace:"AWS/ElastiCache", region:stack.output.region, dimensions:{CacheName:module.input.name}, name:"CacheHitRate", statistic:"Average"}},
        {id:"serverless_cache_hits", name:"Cache hits", type:"line", source:{type:"cloudwatch", aws_account_id:module.input.aws_account_id, namespace:"AWS/ElastiCache", region:stack.output.region, dimensions:{CacheName:module.input.name}, name:"CacheHits", statistic:"Sum"}},
        {id:"serverless_cache_misses", name:"Cache misses", type:"line", source:{type:"cloudwatch", aws_account_id:module.input.aws_account_id, namespace:"AWS/ElastiCache", region:stack.output.region, dimensions:{CacheName:module.input.name}, name:"CacheMisses", statistic:"Sum"}},
        {id:"serverless_current_connections", name:"Current connections", type:"line", source:{type:"cloudwatch", aws_account_id:module.input.aws_account_id, namespace:"AWS/ElastiCache", region:stack.output.region, dimensions:{CacheName:module.input.name}, name:"CurrConnections", statistic:"Average"}},
        {id:"serverless_current_items", name:"Current items", type:"line", source:{type:"cloudwatch", aws_account_id:module.input.aws_account_id, namespace:"AWS/ElastiCache", region:stack.output.region, dimensions:{CacheName:module.input.name}, name:"CurrItems", statistic:"Average"}},
        {id:"serverless_bytes_used_for_cache", name:"Bytes used for cache", type:"line", source:{type:"cloudwatch", aws_account_id:module.input.aws_account_id, namespace:"AWS/ElastiCache", region:stack.output.region, dimensions:{CacheName:module.input.name}, name:"BytesUsedForCache", statistic:"Average"}},
        {id:"serverless_elasticache_processing_units", name:"ElastiCache processing units", type:"line", source:{type:"cloudwatch", aws_account_id:module.input.aws_account_id, namespace:"AWS/ElastiCache", region:stack.output.region, dimensions:{CacheName:module.input.name}, name:"ElastiCacheProcessingUnits", statistic:"Sum"}},
