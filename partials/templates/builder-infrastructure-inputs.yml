- id: section_builder_config
  label: Builder config
  show_when: $with.show_when
  type: section
- default: ec2
  id: build_capacity_type
  label: Builder capacity type
  required: true
  show_when: $with.show_when
  type: string
  values:
    - label: EC2
      description: Use on-demand capacity for predictable availability without Spot interruption.
      value: ec2
    - label: EC2 spot
      description: Use lower-cost Spot capacity that can wait for capacity or be interrupted by AWS.
      value: ec2-spot
    - label: Sandbox (preview)
      description: Runs the build as a microVM on the execution environment's sandbox host pool, which keeps warm hosts so a build starts in seconds. Contact support to enable it for your organization.
      value: sandbox
- default: c7a.4xlarge
  description: EC2 instance type for builds. Start with the default value, then increase or decrease it based on the resource usage report at the end of builds.
  id: build_instance_type
  label: Builder instance type
  no_options_message: $with.no_options_message
  required: true
  show_when:
    $merge:
      - $with.show_when
      - build_capacity_type:
          - ec2
          - ec2-spot
  type: string
  values: $values:aws/ec2/instances?awsAccountId=<<module.input.aws_account_id>>&region=<<module.input.aws_region>>&costUnit=minute
- default: 4
  id: build_cpu
  label: Builder vCPUs
  required: true
  show_when:
    $merge:
      - $with.show_when
      - build_capacity_type: sandbox
  type: number
- default: 8
  id: build_memory
  label: Builder memory (GiB)
  required: true
  show_when:
    $merge:
      - $with.show_when
      - build_capacity_type: sandbox
  type: number
- collapsible: true
  default: 30
  description: Space the build reserves on the pool host for what it writes. Larger values let fewer builds share a host.
  id: build_disk
  label: Builder disk (GiB)
  required: false
  show_when:
    $merge:
      - $with.show_when
      - build_capacity_type: sandbox
  type: number
- collapsible: true
  description: Optional execution environment ID or given ID for builds. Defaults to the module Terraform execution environment.
  id: build_execution_environment_id
  label: Builder execution environment
  required: false
  show_when: $with.show_when
  type: string
  values: $values:ravion/execution_environments
- collapsible: true
  description: Optional AMI ID for build runners. Leave empty to use the default runner image.
  id: build_ami_id
  label: Builder AMI
  required: false
  show_when:
    $merge:
      - $with.show_when
      - build_capacity_type:
          - ec2
          - ec2-spot
  type: string
- default: true
  collapsible: true
  description: The step's built-in policies (ECR/S3 access, CloudWatch agent) stay attached alongside your Builder IAM policies. Turn off to run the build with only the policies listed below.
  id: build_default_policies_enabled
  label: Include default build policies
  show_when: $with.show_when
  type: boolean
- add_button_label: Add policy ARN
  collapsible: true
  default: []
  description: IAM managed policy ARNs for the EC2 build runner role, applied for the duration of each build.
  id: build_iam_policy_arns
  label: Builder IAM policies
  required: false
  show_when: $with.show_when
  type: string_array
