- id: cpu_utilization
  name: CPU utilization
  type: line
  source:
    type: cloudwatch
    aws_account_id: $with.aws_account_id
    dimensions:
      ClusterName: $with.cluster_name
      ServiceName: $with.service_name
    name: CPUUtilization
    namespace: AWS/ECS
    region: $with.region
    statistic: Average
- id: memory_utilization
  name: Memory utilization
  type: line
  source:
    type: cloudwatch
    aws_account_id: $with.aws_account_id
    dimensions:
      ClusterName: $with.cluster_name
      ServiceName: $with.service_name
    name: MemoryUtilization
    namespace: AWS/ECS
    region: $with.region
    statistic: Average
- id: running_tasks
  name: Running tasks
  type: line
