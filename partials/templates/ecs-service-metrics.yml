    aws_account_id: $with.aws_account_id
    dimensions:
      ClusterName: $with.cluster_name
      ServiceName: $with.service_name
    name: RunningTaskCount
    namespace: ECS/ContainerInsights
    region: $with.region
    statistic: Average
- id: request_count
  name: Request count
  type: line
  source:
