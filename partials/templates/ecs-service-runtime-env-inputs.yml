- id: section_app_config
  label: Environment variables
  type: section
- id: environment_variables
  label: Runtime environment variables
  type: array
  description: $with.environment_variables_description
  placeholder: |-
    - name: NODE_ENV
      value: production
- id: secrets
  label: Runtime secrets
  type: array
  description: '`{name, value_from}` with a Secrets Manager or SSM Parameter Store ARN (snake_case `value_from`). ECS resolves it when the task starts; Ravion never reads the value.'
  placeholder: |-
    - name: DATABASE_URL
      value_from: arn:aws:ssm:us-east-1:123456789012:parameter/my-app/database-url
