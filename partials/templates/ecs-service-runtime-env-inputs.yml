- id: section_app_config
  label: Environment variables
  type: section
- $include: ../inputs/build-environment-variables.yml
- $include: ../inputs/dockerfile-env-injection.yml
- id: environment_variables
  label: Runtime environment variables
  type: array
  description: $with.environment_variables_description
  placeholder: |-
    - name: NODE_ENV
      value: production
- id: secrets
  label: Runtime secrets
  type: array
  description: Secrets injected into the ECS task at runtime, as an array of objects with `name` and `value_from` keys (snake_case, not `valueFrom`). value_from is an SSM Parameter Store or Secrets Manager ARN.
  placeholder: |-
    - name: DATABASE_URL
      value_from: arn:aws:ssm:us-east-1:123456789012:parameter/my-app/database-url
