# AWS permissions for an EKS workload: an IAM role the pods assume through EKS
# Pod Identity, the EKS analogue of the ECS task role. The stack creates the
# role and binds it to the release's ServiceAccount (the chart names it after
# the release), and the AWS SDK in the pods picks up short-lived credentials
# for it with no configuration. Shared by rvn-eks-web, rvn-eks-worker, and
# rvn-eks-cron.
- id: section_iam
  label: AWS permissions
  type: section
- id: pod_identity_role_creation_enabled
  label: Create IAM role
  type: boolean
  description: Gives pods short-lived AWS credentials through EKS Pod Identity, with no keys. Leave off if the workload calls no AWS APIs.
  default: false
- id: pod_identity_role_name
  label: IAM role name
  type: string
  description: Blank uses `<service>-task`, like ECS. Must be unique in the account, so set it if the service also runs on ECS or another cluster.
  placeholder: web-eks-prod
  collapsible: true
  required: false
  show_when:
    pod_identity_role_creation_enabled: true
  patterns:
    - message: 1-64 characters of letters, digits and + = , . @ _ -
      pattern: ^[\w+=,.@-]{1,64}$
- id: pod_identity_managed_policy_arns
  label: IAM policy ARNs
  type: string_array
  add_button_label: Add policy ARN
  placeholder: arn:aws:iam::aws:policy/AmazonS3ReadOnlyAccess
  required: false
  default: []
  show_when:
    pod_identity_role_creation_enabled: true
- id: pod_identity_inline_policies
  label: IAM inline policies
  type: object
  description: Keyed by policy name. Same shape as ECS task role inline policies.
  required: false
  show_when:
    pod_identity_role_creation_enabled: true
  placeholder: |-
    {
      "read-app-bucket": {
        "Version": "2012-10-17",
        "Statement": [
          {
            "Effect": "Allow",
            "Action": [
              "s3:GetObject"
            ],
            "Resource": "arn:aws:s3:::my-app-bucket/*"
          }
        ]
      }
    }
