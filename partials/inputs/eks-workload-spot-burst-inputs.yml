- id: spot_burst_enabled
  label: Spot burst
  type: boolean
  description: Run a fixed On-Demand baseline with a separate KEDA-scaled Spot pool that starts at the configured minimum.
  show_when:
    compute_target: on_demand
  default: false
- id: spot_burst_baseline_replicas
  label: Baseline pods
  type: number
  description: Fixed number of On-Demand pods kept available while the Spot pool scales independently.
  max: 1000
  min: 1
  show_when:
    compute_target: on_demand
    spot_burst_enabled: true
  default: 2
- id: spot_burst_min_replicas
  label: Minimum Spot pods
  type: number
  max: 1000
  min: 0
  show_when:
    compute_target: on_demand
    spot_burst_enabled: true
  default: 0
- id: spot_burst_max_replicas
  label: Maximum Spot pods
  type: number
  max: 1000
  min: 1
  show_when:
    compute_target: on_demand
    spot_burst_enabled: true
  default: 8
- id: spot_burst_triggers
  label: KEDA triggers
  type: array
  description: At least one trigger must report demand at the configured minimum. If the minimum is zero, CPU or memory alone cannot wake the pool. Reference pre-created authentication resources only.
  placeholder: |-
    - type: <KEDA scaler type>
      metadata:
        <key>: <string value>
      authenticationRef:
        name: <pre-created authentication resource>
        kind: TriggerAuthentication
  required: true
  show_when:
    compute_target: on_demand
    spot_burst_enabled: true
- id: spot_burst_polling_interval
  label: Polling interval (secs)
  type: number
  collapsible: true
  min: 1
  show_when:
    compute_target: on_demand
    spot_burst_enabled: true
  default: 30
- id: spot_burst_cooldown_period
  label: Cooldown period (secs)
  type: number
  collapsible: true
  description: Seconds KEDA waits after the last active trigger before scaling the Spot pool down.
  min: 0
  show_when:
    compute_target: on_demand
    spot_burst_enabled: true
  default: 300
- id: spot_burst_fallback_replicas
  label: Spot pods when metrics fail
  type: number
  collapsible: true
  description: Minimum Spot pods kept while KEDA cannot read its metrics; running pods are never removed. Empty uses the maximum. Not applied to CPU, memory or Utilization triggers.
  max: 1000
  min: 0
  show_when:
    compute_target: on_demand
    spot_burst_enabled: true
