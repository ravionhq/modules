- id: section_app_config
  label: Environment variables
  type: section
# Build-time variables reach the builder only; the pod never sees them. They sit
# here with the runtime variables so every environment variable is in one
# section, as on ECS.
- $merge:
    - ./build-environment-variables.yml
  show_when:
    build_source:
      - dockerfile
      - railpack
- $include: ./dockerfile-env-injection.yml
- id: environment_variables
  label: Runtime environment variables
  type: array
  placeholder: |-
    - name: LOG_LEVEL
      value: info
- id: secrets
  label: Runtime secrets
  type: array
  description: '`{name, value_from}` with a Secrets Manager or SSM Parameter Store ARN. Resolved inside the cluster; Ravion never reads the value.'
  placeholder: |-
    - name: DATABASE_URL
      value_from: arn:aws:secretsmanager:us-east-1:123456789012:secret:db-AbCdEf:url::
- id: deploy_environment_variable_names
  label: Deploy-provided environment variables
  type: string_array
  description: Names a pipeline deploy step may set with `input.environment_variables`. Plain values only; can't replace a runtime variable or secret.
  add_button_label: Add env var name
  collapsible: true
  required: false
