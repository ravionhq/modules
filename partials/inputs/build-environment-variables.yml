description: Available only during the build; the running app never sees them. Put values the app reads at runtime, such as API keys and database URLs, in the runtime environment variables or secrets. Values can be plain strings or references loaded from Parameter Store or Secrets Manager.
id: build_environment_variables
label: Build environment variables
placeholder: |-
  {
    "NODE_ENV": "production",
    "API_URL": {
      "fromParameterStore": "my-secret"
    },
    "NPM_TOKEN": {
      "fromSecretManager": "arn:..."
    }
  }
required: false
type: object
