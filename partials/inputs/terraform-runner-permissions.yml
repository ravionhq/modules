- default: true
  collapsible: true
  description: Turn off to plan with only the policies below instead of the default read-only policies. Requires at least one policy below.
  id: terraform_plan_default_policies_enabled
  label: Include default plan policies
  type: boolean
- add_button_label: Add policy ARN
  collapsible: true
  default: []
  description: IAM managed policy ARNs for the Terraform plan runner role. Without default policies, include S3 access to the ravion-terraform-plans-<account-id> bucket.
  id: terraform_plan_iam_policy_arns
  label: Terraform plan IAM policies
  required: false
  type: string_array
- default: true
  collapsible: true
  description: Turn off to apply and destroy with only the policies below instead of AdministratorAccess. Requires at least one policy below.
  id: terraform_apply_default_policies_enabled
  label: Include default apply policies
  type: boolean
- add_button_label: Add policy ARN
  collapsible: true
  default: []
  description: IAM managed policy ARNs for the Terraform apply runner role. Without default policies, include S3 access to the ravion-terraform-plans-<account-id> bucket.
  id: terraform_apply_iam_policy_arns
  label: Terraform apply IAM policies
  required: false
  type: string_array
