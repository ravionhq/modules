- $template: ../templates/builder-infrastructure-inputs.yml
  with:
    no_options_message: Select a VPC Network, or enter an AWS account and region, to load available EC2 instance types.
    show_when:
      build_source:
        - dockerfile
        - railpack
        - nixpacks
- id: section_ecr
  label: Image registry lifecycle
  type: section
  show_when:
    build_source:
      - dockerfile
      - railpack
      - nixpacks
      - ecr
- id: ecr_scan_on_push_enabled
  label: Scan images on push
  type: boolean
  description: Ask ECR to run its basic vulnerability scan whenever a new image is pushed. Keep this on for early dependency and OS package findings; disable only if another scanner owns image scanning or duplicate findings are noisy. Enabled by default to satisfy SOC 2 vulnerability-scanning requirements.
  collapsible: true
  show_when:
    build_source:
      - dockerfile
      - railpack
      - nixpacks
      - ecr
  default: true
- id: ecr_force_deletion_enabled
  label: Force delete image repository
  type: boolean
  description: Allow the ECR repository to be deleted even when it contains images. Use with care.
  collapsible: true
  show_when:
    build_source:
      - dockerfile
      - railpack
      - nixpacks
      - ecr
  default: false
- $include: ./misc-section.yml
- id: new_deployment_forcing_enabled
  label: Force new deployment
  type: boolean
  description: Force ECS to start a new deployment when applying service configuration, even if the task definition did not change.
  default: true
- $include: ./tags.yml
- $include: ./terraform-settings.yml
