- id: section_build
  label: Build config
  type: section
- id: build_source
  label: Build source
  type: string
  required: true
  default: dockerfile
  values:
    - description: Bring your own Dockerfile
      label: Dockerfile
      value: dockerfile
    - description: Automatically build an image with Railpack
      label: Railpack
      value: railpack
    - description: Deploy an image from a registry configured on this module. Provide only the tag or digest at deploy time.
      label: Pull from image registry
      value: image_registry
    - description: Ravion creates and manages an ECR repository for this service without a build config. Push images to it from a pipeline `build:image` step, then provide only the tag or digest at deploy time.
      label: Managed ECR repository
      value: ecr
- $template: ./build-git-source.yml
  with:
    show_when:
      build_source:
        - dockerfile
        - railpack
- id: image_repository
  label: Image repository
  type: string
  description: Image repository without a tag or digest, such as `nginx`, `ghcr.io/org/app`, or `123456789012.dkr.ecr.us-east-1.amazonaws.com/app`.
  placeholder: nginx
  required: true
  show_when:
    build_source: image_registry
- id: image_registry_credentials_secret_arn
  label: Registry credentials secret ARN
  type: string
  description: Secrets Manager secret ARN for private registries such as GHCR or Docker Hub. The secret must use the ECS repository credentials JSON format. Not needed for public images or normal same-account ECR.
  collapsible: true
  placeholder: arn:aws:secretsmanager:us-east-1:123456789012:secret:registry-creds
  required: false
  show_when:
    build_source: image_registry
- id: image_start_command
  label: Start command
  type: string_array
  description: Optional command arguments that override the image default command. For shell behavior, use `/bin/sh`, `-lc`, and your command string as separate arguments.
  add_button_label: Add cmd segment
  placeholder: npm
  required: false
  default: []
  show_when:
    build_source:
      - image_registry
      - ecr
- $template: ./dockerfile-build.yml
  with:
    show_when:
      build_source: dockerfile
- $template: ./railpack.yml
  with:
    show_when:
      build_source: railpack
- id: railpack_start_cmd
  label: Start command
  type: string
  placeholder: Railpack default
  show_when:
    build_source: railpack
