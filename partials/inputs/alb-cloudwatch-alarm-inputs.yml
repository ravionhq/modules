# Application Load Balancer alarm thresholds (load balancer dimension only).
# Include after a boolean input with id cloudwatch_alarms_creation_enabled,
# and follow with cloudwatch-alarm-common-inputs.yml.
- id: cloudwatch_alarm_elb_5xx_threshold
  label: Load balancer 5xx alarm threshold
  type: number
  description: Alarm when the load balancer itself returns more than this many 5xx responses in one period. These include 502, 503, and 504 responses for unreachable targets and the fixed 503 for unmatched routes.
  collapsible: true
  min: 0
  show_when:
    cloudwatch_alarms_creation_enabled: true
  default: 10
- id: cloudwatch_alarm_target_5xx_threshold
  label: Target 5xx alarm threshold
  type: number
  description: Alarm when targets behind the load balancer return more than this many 5xx responses in one period.
  collapsible: true
  min: 0
  show_when:
    cloudwatch_alarms_creation_enabled: true
  default: 10
- id: cloudwatch_alarm_target_response_time_threshold
  label: Target response time alarm threshold (seconds)
  type: number
  description: Alarm when the average time targets take to respond exceeds this many seconds. Must be greater than 0.
  collapsible: true
  show_when:
    cloudwatch_alarms_creation_enabled: true
  default: 1
