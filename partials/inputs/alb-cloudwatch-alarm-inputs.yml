# Application Load Balancer alarm thresholds (load balancer dimension only).
# Include after a boolean input with id cloudwatch_alarms_creation_enabled,
# and follow with cloudwatch-alarm-common-inputs.yml.
- id: cloudwatch_alarm_elb_5xx_threshold
  label: Load balancer 5xx alarm threshold
  type: number
  description: Triggers above this total per period, excluding responses generated by targets.
  collapsible: true
  min: 0
  show_when:
    cloudwatch_alarms_creation_enabled: true
  default: 10
- id: cloudwatch_alarm_target_5xx_threshold
  label: Target 5xx alarm threshold
  type: number
  description: Triggers above this total per period across all attached target groups.
  collapsible: true
  min: 0
  show_when:
    cloudwatch_alarms_creation_enabled: true
  default: 10
- id: cloudwatch_alarm_target_response_time_threshold
  label: Target response time alarm threshold (seconds)
  type: number
  description: Triggers when the period average exceeds this value. Must be greater than 0.
  collapsible: true
  show_when:
    cloudwatch_alarms_creation_enabled: true
  default: 1
