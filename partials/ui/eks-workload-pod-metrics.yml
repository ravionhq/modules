# "Open in <vendor>" actions, one per metrics provider that ships to a vendor
# instead of rendering in Ravion. Same construction as the Logs tab; see
# partials/ui/eks-workload-logs.yml for the reasoning. These are actions, not
# chain links, so each takes its own id rather than joining a chart chain.
- id: link_datadog
  name: Open in Datadog
  type: link
  enabled: >-
    << module.input.metrics_external_links != nil
    && len(filter(module.input.metrics_external_links, #.provider == "datadog")) > 0 >>
  source:
    type: link
    provider: datadog
    href: >-
      << module.input.metrics_external_links == nil ? "" :
      reduce(filter(module.input.metrics_external_links, #.provider == "datadog"), #acc + #.href_prefix, "")
      + "kube_namespace%3A" + module.input.namespace + "%20pod_name%3A" + module.input.name + "-%2A" >>
- id: link_grafana_cloud
  name: Open in Grafana Cloud
  type: link
  enabled: >-
    << module.input.metrics_external_links != nil
    && len(filter(module.input.metrics_external_links, #.provider == "grafana_cloud")) > 0 >>
  source:
    type: link
    provider: grafana_cloud
    href: >-
      << module.input.metrics_external_links == nil ? "" :
      reduce(filter(module.input.metrics_external_links, #.provider == "grafana_cloud"), #acc + #.href_prefix, "")
      + "%7Bnamespace%3D%22" + module.input.namespace + "%22%2Cpod%3D~%22" + module.input.name + "-.%2A%22%7D" >>
- id: link_new_relic
  name: Open in New Relic
  type: link
  enabled: >-
    << module.input.metrics_external_links != nil
    && len(filter(module.input.metrics_external_links, #.provider == "new_relic")) > 0 >>
  source:
    type: link
    provider: new_relic
    href: >-
      << module.input.metrics_external_links == nil ? "" :
      reduce(filter(module.input.metrics_external_links, #.provider == "new_relic"), #acc + #.href_prefix, "")
      + "k8s.namespaceName%3A%27" + module.input.namespace + "%27%20AND%20k8s.podName%3A%27" + module.input.name + "-%2A%27" >>
- id: link_otlp
  name: Open in the OTLP destination
  type: link
  enabled: >-
    << module.input.metrics_external_links != nil
    && len(filter(module.input.metrics_external_links, #.provider == "otlp")) > 0 >>
  source:
    type: link
    provider: otlp
    href: >-
      << module.input.metrics_external_links == nil ? "" :
      reduce(filter(module.input.metrics_external_links, #.provider == "otlp"), #acc + #.href_prefix, "") >>
