id: environment_variables
label: Environment variables
type: array
description: >-
  Plain environment variables to set for this deploy. Only names listed in the module's
  Deploy-provided or Required deploy-provided environment variables input are applied; others
  are ignored. Can't replace a runtime variable or secret.
placeholder: |-
  - name: LOG_LEVEL
    value: info
required: false
invalid_when:
  - $include: ./required-deploy-environment-variable-validation.yml
