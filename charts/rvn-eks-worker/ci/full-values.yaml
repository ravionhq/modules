# Autoscaling plus both secret providers.
image:
  repository: 123456789012.dkr.ecr.us-east-1.amazonaws.com/demo-worker
  tag: v1.2.3
replicaCount: 3
resources:
  requests:
    cpu: 500m
    memory: 1Gi
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 20
  targetCPUUtilizationPercentage: 60
# Explicit constraints replace the chart's default zone spread.
topologySpreadConstraints:
  - maxSkew: 2
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: DoNotSchedule
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: rvn-eks-worker
serviceAccount:
  name: demo-worker
ravion:
  secrets:
    - name: DB_PASSWORD
      provider: secretsManager
      key: arn:aws:secretsmanager:us-east-1:123456789012:secret:db-AbCdEf
      property: password
      version: AWSCURRENT
    - name: FEATURE_FLAGS
      provider: parameterStore
      key: arn:aws:ssm:us-east-1:123456789012:parameter/demo/feature-flags
