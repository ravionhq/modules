{{/*
Reference-only secrets (ENG-5034).

Ravion sends secret REFERENCES under the reserved `ravion.secrets` key — never
values. Each entry maps 1:1 onto an External Secrets Operator `remoteRef`, and
ESO (running with its own Pod Identity role) is the only party that ever reads
the value. Nothing here, in values.yaml, or in the Helm release object in etcd
contains secret material.

Store selection: ESO's AWS provider takes one service per store, so the addon
in compute/eks/addons provisions two ClusterSecretStores — `ravion-aws` for
Secrets Manager and `ravion-aws-parameter-store` for SSM Parameter Store. Both
names are values, defaulted to the addon's outputs, so nothing is hardcoded.

A single ExternalSecret carries one top-level secretStoreRef, so the store that
the majority of entries need becomes the default and the remainder override it
per entry via sourceRef.storeRef. That keeps one ExternalSecret and one target
Secret regardless of provider mix, and leaves no reference to a store the
workload does not actually use.
*/}}
{{- if .Values.ravion.secrets }}
{{- $secretsManagerStore := .Values.ravion.secretStores.secretsManager -}}
{{- $parameterStore := .Values.ravion.secretStores.parameterStore -}}
{{- $storeKind := .Values.ravion.secretStores.kind -}}
{{- $usesSecretsManager := false -}}
{{- range .Values.ravion.secrets -}}
{{- if eq .provider "secretsManager" }}{{ $usesSecretsManager = true }}{{ end -}}
{{- end -}}
{{- $defaultStore := ternary $secretsManagerStore $parameterStore $usesSecretsManager -}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "rvn-eks-worker.fullname" . }}
  labels:
    {{- include "rvn-eks-worker.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.ravion.secretRefreshInterval }}
  secretStoreRef:
    name: {{ $defaultStore }}
    kind: {{ $storeKind }}
  target:
    name: {{ include "rvn-eks-worker.secretName" . }}
    creationPolicy: Owner
    deletionPolicy: Delete
  data:
    {{- range .Values.ravion.secrets }}
    {{- $store := ternary $secretsManagerStore $parameterStore (eq .provider "secretsManager") }}
    - secretKey: {{ .name }}
      remoteRef:
        key: {{ .key | quote }}
        {{- with .property }}
        property: {{ . | quote }}
        {{- end }}
        {{- with .version }}
        version: {{ . | quote }}
        {{- end }}
      {{- if ne $store $defaultStore }}
      sourceRef:
        storeRef:
          name: {{ $store }}
          kind: {{ $storeKind }}
      {{- end }}
    {{- end }}
{{- end }}
