{{- $root := . -}}
{{- if and .Values.spotBurst.enabled (not .Values.spotBurst.kedaEnabled) -}}
{{- fail "spotBurst.enabled requires KEDA to be installed by rvn-eks-addons before this workload is deployed" -}}
{{- end -}}
{{- if and .Values.spotBurst.enabled (gt (int .Values.spotBurst.minReplicas) (int .Values.spotBurst.maxReplicas)) -}}
{{- fail "spotBurst.minReplicas must not exceed spotBurst.maxReplicas" -}}
{{- end -}}
{{- $pools := list false -}}
{{- if .Values.spotBurst.enabled -}}
{{- $pools = append $pools true -}}
{{- end -}}
{{- range $index, $isSpot := $pools -}}
{{- if gt $index 0 }}
---
{{- end }}
{{- with $root }}
{{/*
Worker Deployment: no Service, no ports, no load-balancer attachment. The pod
spec is otherwise identical to rvn-eks-web so an app can move between the two
shapes without rewriting its image/env/resources/secrets values.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ if $isSpot }}{{ include "rvn-eks-worker.spotDeploymentName" $ }}{{ else }}{{ include "rvn-eks-worker.fullname" . }}{{ end }}
  labels:
    {{- include "rvn-eks-worker.labels" . | nindent 4 }}
  {{- with .Values.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if $isSpot }}
  replicas: {{ include "rvn-eks-worker.spotDeploymentReplicas" $ }}
  {{- else if .Values.spotBurst.enabled }}
  replicas: {{ .Values.spotBurst.baselineReplicas }}
  {{- else if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      {{- if and .Values.spotBurst.enabled $isSpot }}
      {{- include "rvn-eks-worker.spotSelectorLabels" $ | nindent 6 }}
      {{- else }}
      {{- include "rvn-eks-worker.selectorLabels" . | nindent 6 }}
      {{- end }}
  strategy:
    type: {{ .Values.strategy.type }}
    {{- if eq .Values.strategy.type "RollingUpdate" }}
    rollingUpdate:
      maxSurge: {{ .Values.strategy.maxSurge }}
      maxUnavailable: {{ .Values.strategy.maxUnavailable }}
    {{- end }}
  template:
    metadata:
      labels:
        {{- if and .Values.spotBurst.enabled $isSpot }}
        {{- include "rvn-eks-worker.spotSelectorLabels" $ | nindent 8 }}
        {{- else }}
        {{- include "rvn-eks-worker.selectorLabels" . | nindent 8 }}
        {{- end }}
        {{- if .Values.spotBurst.enabled }}
        ravion.com/spot-burst-pool: {{ ternary "spot" "baseline" $isSpot }}
        {{- with (omit .Values.podLabels "app.kubernetes.io/name" "app.kubernetes.io/instance" "ravion.com/spot-burst-pool") }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- else }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- end }}
      {{- $podAnnotations := deepCopy (.Values.podAnnotations | default dict) }}
      {{- if .Values.spotBurst.enabled }}
      {{- $_ := set $podAnnotations "eks.amazonaws.com/compute-type" "ec2" }}
      {{- end }}
      {{- with $podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "rvn-eks-worker.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      containers:
        - name: {{ .Chart.Name }}
          image: {{ include "rvn-eks-worker.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with (include "rvn-eks-worker.env" . | trim) }}
          env:
            {{- . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- $poolAffinity := include "rvn-eks-worker.affinityForPool" (list $ $isSpot) | trim }}
      {{- with $poolAffinity }}
      affinity:
        {{- . | fromYaml | toYaml | nindent 8 }}
      {{- end }}
      {{- if .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml .Values.topologySpreadConstraints | nindent 8 }}
      {{- else if .Values.topologySpread.enabled }}
      topologySpreadConstraints:
        - maxSkew: {{ .Values.topologySpread.maxSkew }}
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: {{ .Values.topologySpread.whenUnsatisfiable }}
          labelSelector:
            matchLabels:
              {{- if and .Values.spotBurst.enabled $isSpot }}
              {{- include "rvn-eks-worker.spotSelectorLabels" $ | nindent 14 }}
              {{- else }}
              {{- include "rvn-eks-worker.selectorLabels" . | nindent 14 }}
              {{- end }}
              {{- if .Values.spotBurst.enabled }}
              ravion.com/spot-burst-pool: {{ ternary "spot" "baseline" $isSpot }}
              {{- end }}
      {{- end }}
{{- end }}
{{- end }}
