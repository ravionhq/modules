# rvn-eks-worker default values.
#
# The image/env/resources/secrets surface is identical to rvn-eks-web so an app
# can move between the two shapes without rewriting values. What is absent here
# is deliberate: no containerPort, no service, no probes, no targetGroupArns.

# -- Override the chart name used in resource names and labels.
nameOverride: ""
# -- Replace the generated resource name entirely.
fullnameOverride: ""
# -- Extra labels applied to every object (not to the immutable selector).
commonLabels: {}
# -- Annotations on the Deployment object itself.
annotations: {}

image:
  # -- Image repository. Required.
  repository: ""
  # -- Image tag. Required unless digest is set.
  tag: ""
  # -- Image digest (sha256:...). Takes precedence over tag when set.
  digest: ""
  pullPolicy: IfNotPresent

# -- References to Secrets holding registry credentials.
imagePullSecrets: []

# -- Override the image ENTRYPOINT. Usually set for workers, e.g. ["bundle"].
command: []
# -- Override the image CMD, e.g. ["exec", "sidekiq"].
args: []

# -- Non-secret environment variables: [{name: QUEUE, value: "default"}].
env: []

# -- Number of pods when autoscaling is disabled.
replicaCount: 1
revisionHistoryLimit: 10
# -- Give in-flight work time to drain before SIGKILL.
terminationGracePeriodSeconds: 30

strategy:
  type: RollingUpdate
  maxSurge: 25%
  maxUnavailable: 0

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  # -- Set to a number to add a memory metric.
  targetMemoryUtilizationPercentage: null

serviceAccount:
  create: true
  # -- Stable name the EKS Pod Identity association targets. Defaults to the
  # release fullname. No IRSA annotation is emitted; Pod Identity binds by name.
  name: ""
  annotations: {}
  automountServiceAccountToken: true

podAnnotations: {}
podLabels: {}
podSecurityContext: {}
securityContext: {}

nodeSelector: {}
tolerations: []
affinity: {}
# -- Default zone spread. Renders one topologySpreadConstraint on
# topology.kubernetes.io/zone selecting this chart's pods, so workers sit in
# every zone and their calls to zone-local Services stay in-zone. Ignored when
# topologySpreadConstraints below is non-empty.
topologySpread:
  enabled: true
  maxSkew: 1
  # -- ScheduleAnyway keeps pods schedulable on a small or uneven cluster;
  # DoNotSchedule makes the spread a hard requirement.
  whenUnsatisfiable: ScheduleAnyway
# -- Explicit constraints. When set, replaces the default zone spread entirely.
topologySpreadConstraints: []
volumes: []
volumeMounts: []

# Reserved namespace. Ravion writes this block; user-authored values may not
# declare a top-level `ravion` key (the tower-side resolver rejects it).
ravion:
  secretStores:
    # -- ClusterSecretStore (default) or SecretStore.
    kind: ClusterSecretStore
    # -- Store for `secretsManager` entries. ESO's AWS provider takes one
    # service per store, so Secrets Manager and Parameter Store need separate
    # stores. Both are provisioned by the ESO addon in compute/eks/addons,
    # which exposes these names as Terraform outputs.
    secretsManager: ravion-aws
    # -- Store for `parameterStore` entries.
    parameterStore: ravion-aws-parameter-store
  # -- How often ESO re-reads the remote values.
  secretRefreshInterval: 1h
  # -- Secret REFERENCES, never values.
  secrets: []
