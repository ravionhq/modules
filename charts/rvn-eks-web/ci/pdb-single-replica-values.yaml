# PodDisruptionBudget requested on a single fixed replica: the chart skips the
# budget, because minAvailable >= replicas would block every node drain. A
# target group is bound, so the default readiness gate renders.
image:
  repository: 123456789012.dkr.ecr.us-east-1.amazonaws.com/demo-web
  tag: v1.2.3
replicaCount: 1
podDisruptionBudget:
  enabled: true
  minAvailable: 1
targetGroupArns:
  - arn:aws:elasticloadbalancing:us-east-1:123456789012:targetgroup/demo-web-tg-1/abc123
