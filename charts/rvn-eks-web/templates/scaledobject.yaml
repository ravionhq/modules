{{- if .Values.spotBurst.enabled }}
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ include "rvn-eks-web.spotDeploymentName" . }}
  labels:
    {{- include "rvn-eks-web.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "rvn-eks-web.spotDeploymentName" . }}
  minReplicaCount: 0
  maxReplicaCount: {{ .Values.spotBurst.maxReplicas }}
  pollingInterval: {{ .Values.spotBurst.pollingInterval }}
  cooldownPeriod: {{ .Values.spotBurst.cooldownPeriod }}
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 300
    restoreToOriginalReplicaCount: false
  triggers:
    {{- toYaml .Values.spotBurst.triggers | nindent 4 }}
{{- end }}
