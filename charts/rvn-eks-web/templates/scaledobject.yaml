{{- if .Values.spotBurst.enabled }}
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ include "rvn-eks-web.spotDeploymentName" . }}
  labels:
    {{- include "rvn-eks-web.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "rvn-eks-web.spotDeploymentName" . }}
  minReplicaCount: {{ .Values.spotBurst.minReplicas }}
  maxReplicaCount: {{ .Values.spotBurst.maxReplicas }}
  pollingInterval: {{ .Values.spotBurst.pollingInterval }}
  cooldownPeriod: {{ .Values.spotBurst.cooldownPeriod }}
  {{- $fallback := .Values.spotBurst.fallback }}
  {{- $supported := true }}
  {{- range .Values.spotBurst.triggers }}
  {{- if or (has .type (list "cpu" "memory")) (eq (.metricType | default "") "Utilization") }}
  {{- $supported = false }}
  {{- end }}
  {{- end }}
  {{- if and $fallback.enabled $supported }}
  # When KEDA cannot read the triggers' metrics (its metrics source is down),
  # keep every running pod and never fewer than this floor. KEDA refuses a
  # fallback on CPU, memory and Utilization triggers, so those go without.
  fallback:
    failureThreshold: {{ $fallback.failureThreshold }}
    replicas: {{ min (ternary .Values.spotBurst.maxReplicas $fallback.replicas (kindIs "invalid" $fallback.replicas)) .Values.spotBurst.maxReplicas }}
    behavior: currentReplicasIfHigher
  {{- end }}
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        {{- $scaleDown := .Values.spotBurst.scaleDown }}
        # Shrink a few pods at a time: at most podsPerPeriod or
        # percentPerPeriod each period, whichever removes fewer.
        scaleDown:
          stabilizationWindowSeconds: {{ $scaleDown.stabilizationWindowSeconds }}
          selectPolicy: Min
          policies:
            - type: Pods
              value: {{ $scaleDown.podsPerPeriod }}
              periodSeconds: {{ $scaleDown.periodSeconds }}
            - type: Percent
              value: {{ $scaleDown.percentPerPeriod }}
              periodSeconds: {{ $scaleDown.periodSeconds }}
    restoreToOriginalReplicaCount: false
  {{- /*
  The fixed On-Demand baseline serves the same work as the Spot pool, so
  demand that a trigger counts across every pod already has baselineReplicas
  pods' worth of capacity. KEDA sizes the Spot pool alone, so subtract that
  capacity from each Prometheus AverageValue trigger: the query becomes the
  demand beyond the baseline, clamped at 0, and the threshold stays the
  capacity of one pod. A trigger whose metric already leaves out what running
  pods serve, such as a backlog of waiting work, sets subtractBaseline: false.
  */}}
  {{- $baseline := int .Values.spotBurst.baselineReplicas }}
  {{- $triggers := list }}
  {{- range $index, $source := .Values.spotBurst.triggers }}
  {{- $trigger := omit (deepCopy $source) "subtractBaseline" }}
  {{- $subtract := ternary $source.subtractBaseline true (hasKey $source "subtractBaseline") }}
  {{- if and $subtract (eq $source.type "prometheus") (eq ($source.metricType | default "AverageValue") "AverageValue") }}
  {{- $threshold := toString (get $source.metadata "threshold") | trim }}
  {{- if not (regexMatch "^[0-9]+(\\.[0-9]+)?$" $threshold) }}
  {{- fail (printf "spotBurst.triggers[%d]: subtracting the On-Demand baseline needs a numeric metadata.threshold, got %q; set subtractBaseline: false to keep the query as written" $index $threshold) }}
  {{- end }}
  {{- $query := toString (get $source.metadata "query") | trim }}
  {{- if not $query }}
  {{- fail (printf "spotBurst.triggers[%d]: a prometheus trigger needs metadata.query" $index) }}
  {{- end }}
  {{- /*
  PromQL comments run to the end of the line, so a query ending in a
  "# comment" would swallow the closing parenthesis; end its line first.
  */}}
  {{- $close := ternary "\n)" ")" (contains "#" $query) }}
  {{- $_ := set $trigger.metadata "query" (printf "clamp_min((%s%s - %d * %s, 0)" $query $close $baseline $threshold) }}
  {{- end }}
  {{- $triggers = append $triggers $trigger }}
  {{- end }}
  triggers:
    {{- toYaml $triggers | nindent 4 }}
{{- end }}
