{{- $root := . -}}
{{- if and .Values.spotBurst.enabled (not .Values.spotBurst.kedaEnabled) -}}
{{- fail "spotBurst.enabled requires KEDA to be installed by rvn-eks-addons before this workload is deployed" -}}
{{- end -}}
{{- $pools := list false -}}
{{- if .Values.spotBurst.enabled -}}
{{- $pools = append $pools true -}}
{{- end -}}
{{- range $index, $isSpot := $pools -}}
{{- if gt $index 0 }}
---
{{- end }}
{{- with $root }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ if $isSpot }}{{ include "rvn-eks-web.spotDeploymentName" $ }}{{ else }}{{ include "rvn-eks-web.fullname" . }}{{ end }}
  labels:
    {{- include "rvn-eks-web.labels" . | nindent 4 }}
  {{- with .Values.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if $isSpot }}
  replicas: {{ include "rvn-eks-web.spotDeploymentReplicas" $ }}
  {{- else if .Values.spotBurst.enabled }}
  replicas: {{ .Values.spotBurst.baselineReplicas }}
  {{- else if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      {{- if and .Values.spotBurst.enabled $isSpot }}
      {{- include "rvn-eks-web.spotSelectorLabels" $ | nindent 6 }}
      {{- else }}
      {{- include "rvn-eks-web.selectorLabels" . | nindent 6 }}
      {{- end }}
  strategy:
    type: {{ .Values.strategy.type }}
    {{- if eq .Values.strategy.type "RollingUpdate" }}
    rollingUpdate:
      maxSurge: {{ .Values.strategy.maxSurge }}
      maxUnavailable: {{ .Values.strategy.maxUnavailable }}
    {{- end }}
  template:
    metadata:
      labels:
        {{- if and .Values.spotBurst.enabled $isSpot }}
        {{- include "rvn-eks-web.spotSelectorLabels" $ | nindent 8 }}
        {{- else }}
        {{- include "rvn-eks-web.selectorLabels" . | nindent 8 }}
        {{- end }}
        {{- if .Values.spotBurst.enabled }}
        ravion.com/spot-burst-pool: {{ ternary "spot" "baseline" $isSpot }}
        {{- with (omit .Values.podLabels "app.kubernetes.io/name" "app.kubernetes.io/instance" "ravion.com/spot-burst-pool") }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- else }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- end }}
      {{- $podAnnotations := deepCopy (.Values.podAnnotations | default dict) }}
      {{- if .Values.spotBurst.enabled }}
      {{- $_ := set $podAnnotations "eks.amazonaws.com/compute-type" "ec2" }}
      {{- end }}
      {{- with $podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "rvn-eks-web.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- /*
      One readiness gate per TargetGroupBinding. The AWS Load Balancer
      Controller sets the matching target-health condition once the pod is
      healthy in that target group, so a rolling update does not retire an old
      pod before its replacement is actually serving load balancer traffic. The
      controller honours a gate declared in the pod spec directly, so this does
      not depend on the namespace carrying the controller's injection label.
      */}}
      {{- if and .Values.targetGroupBinding.podReadinessGate .Values.targetGroupArns }}
      readinessGates:
        {{- range $index, $arn := .Values.targetGroupArns }}
        - conditionType: {{ printf "target-health.elbv2.k8s.aws/%s" (include "rvn-eks-web.targetGroupBindingName" (list $ $index)) }}
        {{- end }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: {{ include "rvn-eks-web.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
              protocol: TCP
          {{- /*
          preStop sleep: keeps the container running, still serving, for a few
          seconds after the pod is marked Terminating, so the load balancer
          controller can deregister it before the application receives SIGTERM
          and no new connections arrive while it drains. Uses the native sleep
          action, so the image needs no shell or sleep binary. The sleep counts
          against terminationGracePeriodSeconds.
          */}}
          {{- /* Skipped, not failed, before 1.30: the sleep action does not
          exist there, and a default must never break a supported cluster. */}}
          {{- if semverCompare ">=1.30-0" .Capabilities.KubeVersion.Version }}
          {{- with .Values.lifecycle.preStopSleepSeconds }}
          {{- if ge (int .) (int $.Values.terminationGracePeriodSeconds) }}
          {{- fail (printf "lifecycle.preStopSleepSeconds (%d) must be less than terminationGracePeriodSeconds (%d), or the application never gets time to shut down after SIGTERM" (int .) (int $.Values.terminationGracePeriodSeconds)) }}
          {{- end }}
          lifecycle:
            preStop:
              sleep:
                seconds: {{ . }}
          {{- end }}
          {{- end }}
          {{- with (include "rvn-eks-web.env" . | trim) }}
          env:
            {{- . | nindent 12 }}
          {{- end }}
          {{- if .Values.probes.liveness.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: {{ .Values.probes.liveness.port | default "http" }}
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          {{- end }}
          {{- if .Values.probes.readiness.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: {{ .Values.probes.readiness.port | default "http" }}
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
            successThreshold: {{ .Values.probes.readiness.successThreshold }}
          {{- end }}
          {{- if .Values.probes.startup.enabled }}
          startupProbe:
            httpGet:
              path: {{ .Values.probes.startup.path | default .Values.probes.readiness.path }}
              port: {{ .Values.probes.startup.port | default "http" }}
            initialDelaySeconds: {{ .Values.probes.startup.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.startup.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- $poolAffinity := include "rvn-eks-web.affinityForPool" (list $ $isSpot) | trim }}
      {{- with $poolAffinity }}
      affinity:
        {{- . | fromYaml | toYaml | nindent 8 }}
      {{- end }}
      {{- if .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml .Values.topologySpreadConstraints | nindent 8 }}
      {{- else if .Values.topologySpread.enabled }}
      topologySpreadConstraints:
        - maxSkew: {{ .Values.topologySpread.maxSkew }}
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: {{ .Values.topologySpread.whenUnsatisfiable }}
          labelSelector:
            matchLabels:
              {{- if and .Values.spotBurst.enabled $isSpot }}
              {{- include "rvn-eks-web.spotSelectorLabels" $ | nindent 14 }}
              {{- else }}
              {{- include "rvn-eks-web.selectorLabels" . | nindent 14 }}
              {{- end }}
              {{- if .Values.spotBurst.enabled }}
              ravion.com/spot-burst-pool: {{ ternary "spot" "baseline" $isSpot }}
              {{- end }}
        {{- if .Values.topologySpread.nodeSpread }}
        - maxSkew: {{ .Values.topologySpread.maxSkew }}
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: {{ .Values.topologySpread.whenUnsatisfiable }}
          labelSelector:
            matchLabels:
              {{- if and .Values.spotBurst.enabled $isSpot }}
              {{- include "rvn-eks-web.spotSelectorLabels" $ | nindent 14 }}
              {{- else }}
              {{- include "rvn-eks-web.selectorLabels" . | nindent 14 }}
              {{- end }}
              {{- if .Values.spotBurst.enabled }}
              ravion.com/spot-burst-pool: {{ ternary "spot" "baseline" $isSpot }}
              {{- end }}
        {{- end }}
      {{- end }}
{{- end }}
{{- end }}
