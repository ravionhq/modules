{{/*
EKS Pod Identity associates an IAM role with a service account by namespace +
NAME, from the AWS side. There is therefore no IRSA `eks.amazonaws.com/role-arn`
annotation here: the chart's only obligation is to create a service account
whose name is stable and configurable, so the Terraform that creates the
aws_eks_pod_identity_association can target it.
*/}}
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "rvn-eks-web.serviceAccountName" . }}
  labels:
    {{- include "rvn-eks-web.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
