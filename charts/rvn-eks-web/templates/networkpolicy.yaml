{{/*
Ingress allow-list. Rendered only when networkPolicy.enabled; the cluster must
enforce NetworkPolicy for it to have any effect (the EKS Cluster module turns
enforcement on in the VPC CNI by default). Sources are listed as OR-ed peers:
pods of the named releases in this namespace, every pod in the named
namespaces, and the given CIDR blocks. With enabled and no sources the policy
denies all ingress. policyTypes lists only Ingress, so egress stays open.
*/}}
{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "rvn-eks-web.fullname" . }}
  labels:
    {{- include "rvn-eks-web.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "rvn-eks-web.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    {{- $ingress := .Values.networkPolicy.ingress }}
    {{- if or $ingress.fromReleases $ingress.fromNamespaces $ingress.fromCIDRs }}
    - from:
        {{- range $ingress.fromReleases }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ . | quote }}
        {{- end }}
        {{- range $ingress.fromNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . | quote }}
        {{- end }}
        {{- range $ingress.fromCIDRs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ $.Values.containerPort }}
    {{- end }}
{{- end }}
