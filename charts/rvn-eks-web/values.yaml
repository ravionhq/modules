# rvn-eks-web default values.
#
# This file is the chart's public API. See values.schema.json for the enforced
# shape and README.md for the compatibility policy: values are added, never
# removed or repurposed, within a major version.

# -- Override the chart name used in resource names and labels.
nameOverride: ""
# -- Replace the generated resource name entirely.
fullnameOverride: ""
# -- Extra labels applied to every object (not to the immutable selector).
commonLabels: {}
# -- Annotations on the Deployment object itself.
annotations: {}

image:
  # -- Image repository, e.g. 1234.dkr.ecr.us-east-1.amazonaws.com/my-app. Required.
  repository: ""
  # -- Image tag. Required unless digest is set.
  tag: ""
  # -- Image digest (sha256:...). Takes precedence over tag when set.
  digest: ""
  pullPolicy: IfNotPresent

# -- References to Secrets holding registry credentials, e.g. [{name: ecr-creds}].
imagePullSecrets: []

# -- Container port the application listens on.
containerPort: 8080

# -- Override the image ENTRYPOINT.
command: []
# -- Override the image CMD.
args: []

# -- Non-secret environment variables: [{name: LOG_LEVEL, value: "info"}].
env: []

# -- Number of pods when autoscaling is disabled. Two by default: with one, any
# pod stop (node drain, node failure, crash) is an outage.
replicaCount: 2
revisionHistoryLimit: 10
# -- Seconds a pod has to shut down after SIGTERM before it is killed. Includes
# any preStop sleep below. Raise it for services that drain long-lived
# connections (WebSockets, streaming responses) on shutdown.
terminationGracePeriodSeconds: 30

lifecycle:
  # -- Seconds the main container keeps running after the pod is marked
  # Terminating, before it receives SIGTERM. Gives the load balancer controller
  # time to deregister the pod so no new connections arrive while the
  # application drains. Rendered as the native preStop sleep action (no shell
  # needed in the image); skipped on Kubernetes older than 1.30, which lacks it.
  # 0 renders no hook. Must be less than terminationGracePeriodSeconds.
  preStopSleepSeconds: 10

strategy:
  type: RollingUpdate
  maxSurge: 100%
  maxUnavailable: 0

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi

probes:
  liveness:
    enabled: true
    path: /
    # -- Port name or number. Defaults to the container port named "http".
    port: ""
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    enabled: true
    path: /
    port: ""
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
    successThreshold: 1
  startup:
    enabled: false
    # -- Defaults to the readiness path when empty.
    path: ""
    port: ""
    initialDelaySeconds: 0
    periodSeconds: 5
    timeoutSeconds: 5
    failureThreshold: 30

service:
  # -- Port the Service exposes; the target group's listener registers against it.
  port: 80
  # -- Container port name or number. Defaults to the "http" port.
  targetPort: ""
  type: ClusterIP
  annotations: {}
  appProtocol: ""
  # -- Keep in-cluster traffic to this Service inside the caller's availability
  # zone when a pod is running there, falling back to every zone otherwise.
  # Cuts cross-AZ data transfer for service-to-service calls. Needs Kubernetes
  # 1.31+; older API servers ignore the field. Set "" to spread across zones.
  trafficDistribution: PreferClose

# -- Ingress allow-list rendered as a NetworkPolicy. Needs NetworkPolicy
# enforcement in the cluster (the EKS Cluster module turns it on in the VPC
# CNI). When enabled, only the listed sources may reach the container port;
# everything else in the cluster is denied. Egress is never restricted.
# Release peers are matched by pod label, so the namespace is the trust
# boundary: anyone able to create pods in it can impersonate an allowed
# release. Isolate separately trusted teams by namespace instead.
networkPolicy:
  enabled: false
  ingress:
    # -- Helm release names in this namespace whose pods may call this service.
    fromReleases: []
    # -- Namespaces whose pods may call this service (all pods in each).
    fromNamespaces: []
    # -- CIDR blocks that may call this service, typically the shared load
    # balancer's subnets so its health checks and forwarded requests get in.
    fromCIDRs: []

# -- ARNs of Terraform-owned target groups to register this Service's pods into.
# One TargetGroupBinding is rendered per ARN; nothing renders when empty.
targetGroupArns: []

targetGroupBinding:
  # -- Must match the aws_lb_target_group's target_type.
  targetType: ip
  # -- Only needed when the target group lives in a different VPC than the cluster.
  vpcId: ""
  # -- Add an AWS Load Balancer Controller readiness gate per TargetGroupBinding,
  # so a pod is Ready only once it is healthy in the target group and a rolling
  # update keeps old pods until their replacements serve traffic. Pods of a
  # release with no targetGroupArns get no gate.
  podReadinessGate: true

autoscaling:
  enabled: false
  # -- Two by default, for the same reason as replicaCount.
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  # -- Set to a number to add a memory metric.
  targetMemoryUtilizationPercentage: null

# -- PodDisruptionBudget limiting voluntary disruptions (node drains,
# consolidation, upgrades). Rendered only when the replica floor
# (autoscaling.minReplicas, or replicaCount) is greater than minAvailable: a
# budget that allows zero evictions blocks every node drain.
podDisruptionBudget:
  enabled: true
  minAvailable: 1

serviceAccount:
  create: true
  # -- Stable name the EKS Pod Identity association targets. Defaults to the
  # release fullname. No IRSA annotation is emitted; Pod Identity binds by name.
  name: ""
  annotations: {}
  automountServiceAccountToken: true

podAnnotations: {}
podLabels: {}
podSecurityContext: {}
securityContext: {}

nodeSelector: {}
tolerations: []
affinity: {}
# -- Default zone spread. Renders one topologySpreadConstraint on
# topology.kubernetes.io/zone selecting this chart's pods, so every zone has a
# local endpoint for service.trafficDistribution to route to. Ignored when
# topologySpreadConstraints below is non-empty.
topologySpread:
  enabled: true
  # -- Also spread across nodes (kubernetes.io/hostname). With the default
  # ScheduleAnyway this is a preference: replicas land on separate nodes when
  # the cluster has room, but can share one node if it is the only eligible
  # node. Set whenUnsatisfiable to DoNotSchedule to require separate nodes.
  nodeSpread: true
  maxSkew: 1
  # -- ScheduleAnyway keeps pods schedulable on a small or uneven cluster;
  # DoNotSchedule makes the spread a hard requirement.
  whenUnsatisfiable: ScheduleAnyway
# -- Explicit constraints. When set, replaces the default zone spread entirely.
topologySpreadConstraints: []
volumes: []
volumeMounts: []

# Reserved namespace. Ravion writes this block; user-authored values may not
# declare a top-level `ravion` key (the tower-side resolver rejects it).
ravion:
  secretStores:
    # -- ClusterSecretStore (default) or SecretStore.
    kind: ClusterSecretStore
    # -- Store for `secretsManager` entries. ESO's AWS provider takes one
    # service per store, so Secrets Manager and Parameter Store need separate
    # stores. Both are provisioned by the ESO addon in compute/eks/addons,
    # which exposes these names as Terraform outputs.
    secretsManager: ravion-aws
    # -- Store for `parameterStore` entries.
    parameterStore: ravion-aws-parameter-store
  # -- How often ESO re-reads the remote values.
  secretRefreshInterval: 1h
  # -- Secret REFERENCES, never values:
  # [{name: DB_PASSWORD, provider: secretsManager, key: <full ARN>,
  #   property: password, version: "AWSCURRENT"}]
  secrets: []
