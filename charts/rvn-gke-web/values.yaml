# rvn-gke-web default values.
#
# This file is the chart's public API. See values.schema.json for the enforced
# shape and README.md for the compatibility policy: values are added, never
# removed or repurposed, within a major version.

# -- Override the chart name used in resource names and labels.
nameOverride: ""
# -- Replace the generated resource name entirely.
fullnameOverride: ""
# -- Extra labels applied to every object (not to the immutable selector).
commonLabels: {}
# -- Annotations on the Deployment object itself.
annotations: {}

image:
  # -- Image repository, e.g. us-central1-docker.pkg.dev/my-project/my-app/my-app. Required.
  repository: ""
  # -- Image tag. Required unless digest is set.
  tag: ""
  # -- Image digest (sha256:...). Takes precedence over tag when set.
  digest: ""
  pullPolicy: IfNotPresent

# -- References to Secrets holding registry credentials, e.g. [{name: ecr-creds}].
imagePullSecrets: []

# -- Container port the application listens on.
containerPort: 8080

# -- Override the image ENTRYPOINT.
command: []
# -- Override the image CMD.
args: []

# -- Non-secret environment variables: [{name: LOG_LEVEL, value: "info"}].
env: []

# -- Number of pods when autoscaling is disabled. Two by default: with one, any
# pod stop (node drain, node failure, crash) is an outage.
replicaCount: 2
revisionHistoryLimit: 10
# -- Seconds a pod has to shut down after SIGTERM before it is killed. Includes
# any preStop sleep below. Raise it for services that drain long-lived
# connections (WebSockets, streaming responses) on shutdown.
terminationGracePeriodSeconds: 30

lifecycle:
  # -- Seconds the main container keeps running after the pod is marked
  # Terminating, before it receives SIGTERM. Gives the load balancer
  # time to remove the pod so no new connections arrive while the
  # application drains. Rendered as the native preStop sleep action (no shell
  # needed in the image); skipped on Kubernetes older than 1.30, which lacks it.
  # 0 renders no hook. Must be less than terminationGracePeriodSeconds.
  preStopSleepSeconds: 10

strategy:
  type: RollingUpdate
  maxSurge: 100%
  maxUnavailable: 0

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi

probes:
  liveness:
    enabled: true
    path: /
    # -- Port name or number. Defaults to the container port named "http".
    port: ""
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    enabled: true
    path: /
    port: ""
    initialDelaySeconds: 0
    periodSeconds: 1
    timeoutSeconds: 5
    # -- About 30 seconds of failed checks at the 1-second period before the pod leaves traffic.
    failureThreshold: 30
    successThreshold: 1
  startup:
    enabled: false
    # -- Defaults to the readiness path when empty.
    path: ""
    port: ""
    initialDelaySeconds: 0
    periodSeconds: 5
    timeoutSeconds: 5
    failureThreshold: 30

service:
  # -- Port the Service exposes; the target group's listener registers against it.
  port: 80
  # -- Container port name or number. Defaults to the "http" port.
  targetPort: ""
  type: ClusterIP
  annotations: {}
  appProtocol: ""
  # -- Keep in-cluster traffic to this Service inside the caller's availability
  # zone when a pod is running there, falling back to every zone otherwise.
  # Cuts cross-AZ data transfer for service-to-service calls. Needs Kubernetes
  # 1.31+; older API servers ignore the field. Set "" to spread across zones.
  trafficDistribution: PreferClose

# -- Ingress allow-list rendered as a NetworkPolicy. Needs NetworkPolicy
# enforcement in the cluster (the GKE Cluster module turns it on with
# Dataplane V2). When enabled, only the listed sources may reach the container port;
# everything else in the cluster is denied. Egress is never restricted.
# Release peers are matched by pod label, so the namespace is the trust
# boundary: anyone able to create pods in it can impersonate an allowed
# release. Isolate separately trusted teams by namespace instead.
networkPolicy:
  enabled: false
  ingress:
    # -- Helm release names in this namespace whose pods may call this service.
    fromReleases: []
    # -- Namespaces whose pods may call this service (all pods in each).
    fromNamespaces: []
    # -- CIDR blocks that may call this service, typically the shared load
    # balancer's source ranges so its health checks and forwarded requests get in.
    fromCIDRs: []

# -- Per-workload GKE Gateway, HTTPRoute, HealthCheckPolicy and
# GCPBackendPolicy. GKE's Gateway controller turns them into a Google Cloud
# Application Load Balancer that sends requests straight to pod IPs, and its
# NEG controller adds a readiness gate so a rollout waits for new pods to be
# healthy in the load balancer. Requires the Gateway API on the cluster.
gateway:
  enabled: false
  # -- gke-l7-global-external-managed (internet) or gke-l7-rilb (regional
  # internal; the VPC needs a proxy-only subnet in the region).
  className: gke-l7-global-external-managed
  # -- Name of an address reserved for this Gateway (global for external,
  # regional internal for gke-l7-rilb). Blank lets GKE pick an ephemeral one.
  addressName: ""
  # -- Hostnames the HTTPRoute matches. Empty matches every host.
  hostnames: []
  # -- Path prefixes the HTTPRoute matches. Empty matches "/".
  pathPrefixes: []
  # -- Certificate Manager certificate map (external Gateways only). Setting it,
  # or preSharedCertificateNames, adds an HTTPS listener on 443.
  certificateMapName: ""
  # -- Compute Engine SSL certificate names.
  preSharedCertificateNames: []
  # -- With HTTPS, redirect plain HTTP requests to it.
  httpsRedirect: true
  healthCheck:
    path: /
    intervalSeconds: 5
    timeoutSeconds: 4
    healthyThreshold: 2
    unhealthyThreshold: 2
  # -- Seconds the load balancer lets in-flight requests to a removed pod finish.
  drainingTimeoutSeconds: 300
  sessionAffinity:
    # -- "" (none), CLIENT_IP or GENERATED_COOKIE.
    type: ""
    cookieTtlSeconds: 86400

autoscaling:
  enabled: false
  # -- Two by default, for the same reason as replicaCount.
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  # -- Set to a number to add a memory metric.
  targetMemoryUtilizationPercentage: null

# -- Keep a fixed baseline on On-Demand and use KEDA to scale a second,
# Spot-only Deployment from its configured minimum. Requires KEDA installed by
# rvn-gke-addons.
spotBurst:
  enabled: false
  kedaEnabled: false
  baselineReplicas: 2
  minReplicas: 0
  maxReplicas: 8
  pollingInterval: 30
  cooldownPeriod: 300
  triggers: []
  # -- What KEDA does when it cannot read the triggers' metrics, for example
  # while Prometheus is down: keep every running Spot pod and never fewer than
  # replicas (null means maxReplicas). Not applied to CPU, memory or
  # Utilization triggers, which KEDA does not support it for.
  fallback:
    enabled: true
    failureThreshold: 3
    replicas: null
  # -- How fast the Spot pool shrinks once demand falls. After
  # stabilizationWindowSeconds of lower demand, each periodSeconds removes at
  # most podsPerPeriod pods or percentPerPeriod percent of the pool, whichever
  # is fewer (at least one pod). Without these limits Kubernetes removes every
  # excess pod at once, so a pool at its maximum drops to its minimum in one
  # step while work may still be queued. Scale-up is unchanged.
  scaleDown:
    stabilizationWindowSeconds: 300
    podsPerPeriod: 2
    percentPerPeriod: 25
    periodSeconds: 60

# -- PodDisruptionBudget limiting voluntary disruptions (node drains,
# consolidation, upgrades). Rendered only when the replica floor
# (autoscaling.minReplicas, or replicaCount) is greater than minAvailable: a
# budget that allows zero evictions blocks every node drain.
podDisruptionBudget:
  enabled: true
  minAvailable: 1

serviceAccount:
  create: true
  # -- Stable name the Workload Identity binding names. Defaults to the
  # release fullname.
  name: ""
  # -- Email of the Google service account the pods act as through Workload
  # Identity (compute/gke_service's workload_identity_service_account_email).
  # Rendered as the iam.gke.io/gcp-service-account annotation. Empty: the pods
  # get no Google identity of their own.
  gcpServiceAccount: ""
  annotations: {}
  automountServiceAccountToken: true

podAnnotations: {}
podLabels: {}
podSecurityContext: {}
securityContext: {}

nodeSelector: {}
tolerations: []
affinity: {}
# -- Default zone spread. Renders one topologySpreadConstraint on
# topology.kubernetes.io/zone selecting this chart's pods, so every zone has a
# local endpoint for service.trafficDistribution to route to. Ignored when
# topologySpreadConstraints below is non-empty.
topologySpread:
  enabled: true
  # -- Also spread across nodes (kubernetes.io/hostname). With the default
  # ScheduleAnyway this is a preference: replicas land on separate nodes when
  # the cluster has room, but can share one node if it is the only eligible
  # node. Set whenUnsatisfiable to DoNotSchedule to require separate nodes.
  nodeSpread: true
  maxSkew: 1
  # -- ScheduleAnyway keeps pods schedulable on a small or uneven cluster;
  # DoNotSchedule makes the spread a hard requirement.
  whenUnsatisfiable: ScheduleAnyway
# -- Explicit constraints. When set, replaces the default zone spread entirely.
topologySpreadConstraints: []
volumes: []
volumeMounts: []

# Reserved namespace. Ravion writes this block; user-authored values may not
# declare a top-level `ravion` key (the tower-side resolver rejects it).
ravion:
  secretStores:
    # -- ClusterSecretStore (default) or SecretStore.
    kind: ClusterSecretStore
    # -- Secret Manager store. The GKE Add-ons module creates `ravion-gcp`.
    secretManager: ravion-gcp
  # -- How often ESO re-reads the remote values.
  secretRefreshInterval: 1h
  # -- Secret REFERENCES, never values:
  # [{name: DB_PASSWORD, key: db-password, property: password, version: "3"}]
  # key is a secret ID in the store's project or projects/<project>/secrets/<id>.
  secrets: []
