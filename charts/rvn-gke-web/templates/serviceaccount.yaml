{{/*
Workload Identity Federation for GKE: the compute/gke_service stack creates a
Google service account for the workload, grants it the workload's roles, and
lets this Kubernetes service account (by namespace and NAME) act as it with
roles/iam.workloadIdentityUser. serviceAccount.gcpServiceAccount is that
account's email; it becomes the iam.gke.io/gcp-service-account annotation,
which tells the GKE metadata server which Google identity to hand the pods.
*/}}
{{- if .Values.serviceAccount.create }}
{{- $annotations := deepCopy (default dict .Values.serviceAccount.annotations) }}
{{- with .Values.serviceAccount.gcpServiceAccount }}
{{- $_ := set $annotations "iam.gke.io/gcp-service-account" . }}
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "rvn-gke-web.serviceAccountName" . }}
  labels:
    {{- include "rvn-gke-web.labels" . | nindent 4 }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
