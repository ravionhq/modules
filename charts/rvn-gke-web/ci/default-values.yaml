# Minimal container-only config: the chart's happy path.
image:
  repository: us-central1-docker.pkg.dev/demo-project/demo-web/demo-web
  tag: v1.2.3
containerPort: 3000
env:
  - name: LOG_LEVEL
    value: info
  - name: PORT
    value: "3000"
probes:
  liveness:
    path: /healthz
  readiness:
    path: /healthz
