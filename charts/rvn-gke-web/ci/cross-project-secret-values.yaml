# Secrets referenced by full name in another project: the key is passed through
# unchanged to the single Secret Manager store.
image:
  repository: us-central1-docker.pkg.dev/demo-project/demo-web/demo-web
  tag: v1.2.3
ravion:
  secrets:
    - name: FEATURE_FLAGS
      key: projects/shared-project/secrets/feature-flags
    - name: RATE_LIMIT
      key: projects/shared-project/secrets/rate-limit
