{{/*
Reference-only secrets.

Ravion sends secret REFERENCES under the reserved `ravion.secrets` key, never
values. Each entry maps 1:1 onto an External Secrets Operator `remoteRef`
against Google Secret Manager, and ESO (authenticating as its own Kubernetes
service account through Workload Identity) is the only party that ever reads
the value. Nothing here, in values.yaml, or in the Helm release object in etcd
contains secret material.

Secret Manager is one service, so one store serves every entry: the
`ravion-gcp` ClusterSecretStore the GKE Add-ons module creates. A key is a
secret ID in the store's project or a full projects/<project>/secrets/<id>
name; the store's service account must be able to read it.
*/}}
{{- if .Values.ravion.secrets }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "rvn-gke-cron.fullname" . }}
  labels:
    {{- include "rvn-gke-cron.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.ravion.secretRefreshInterval }}
  secretStoreRef:
    name: {{ .Values.ravion.secretStores.secretManager }}
    kind: {{ .Values.ravion.secretStores.kind }}
  target:
    name: {{ include "rvn-gke-cron.secretName" . }}
    creationPolicy: Owner
    deletionPolicy: Delete
  data:
    {{- range .Values.ravion.secrets }}
    - secretKey: {{ .name }}
      remoteRef:
        key: {{ .key | quote }}
        {{- with .property }}
        property: {{ . | quote }}
        {{- end }}
        {{- with .version }}
        version: {{ . | quote }}
        {{- end }}
    {{- end }}
{{- end }}
