name: Terraform Static Checks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate Terraform Modules
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1
        with:
          tofu_version: 1.10.0

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@90f302c255ef959cbfb4bd10581afecdb7ece3e6 # v4

      - name: Check formatting
        run: tofu fmt -check -recursive

      - name: Initialize TFLint plugins
        run: tflint --init
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Validate module syntax
        run: |
          set -euo pipefail

          modules=$(find . -mindepth 2 -maxdepth 2 -name versions.tf -exec dirname {} \; | sort)

          for module in $modules; do
            echo "Validating ${module}"
            tofu -chdir="${module}" init -backend=false
            tofu -chdir="${module}" validate
          done

      - name: Test CloudFront module
        run: |
          tofu -chdir=cdn/cloudfront init -backend=false
          tofu -chdir=cdn/cloudfront test

      - name: Test CloudFront viewer-request function
        run: node --test cdn/cloudfront/functions/viewer_request.test.js

      - name: Test EKS capacity reconciliation
        run: |
          python3 -m unittest discover -s compute/eks/tests -p 'test_*.py' -v
          tofu -chdir=compute/eks init -backend=false
          tofu -chdir=compute/eks test -filter=tests/node_group_scaling.tftest.hcl

      - name: Lint modules
        run: tflint --recursive

      - name: Scan Terraform configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          trivyignores: .trivyignore.yaml
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
