name: Helm Charts

on:
  pull_request:
    branches:
      - main
    paths:
      - 'charts/**'
      - 'compute/eks/addons/charts/**'
      - '.github/workflows/helm-charts.yml'
  push:
    branches:
      - main
    paths:
      - 'charts/**'
      - 'compute/eks/addons/charts/**'
      - '.github/workflows/helm-charts.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and Template Tests
    runs-on: ravion/ee=github-actions/type=sandbox/cpu=2/memory=4/disk_cache=auto/id=${{ github.run_id }}-helm-charts-test/interruptible=true
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v3.16.3

      # yq is preinstalled on ubuntu-latest runners; pinned here so the
      # assertion syntax in charts/test.sh cannot drift underneath us.
      - name: Setup yq
        uses: mikefarah/yq@bbdd97482f2d439126582a59689eb1c855944955 # v4.44.3

      - name: Lint and template tests
        run: ./charts/test.sh

      - name: Test load balancer controller CRD retention
        run: python3 -B -m unittest discover -s compute/eks/addons/tests -p 'test_lb_controller_crds_chart.py' -v
