name: GCP Setup Module

# gcp/setup is the Google Cloud project setup module Ravion's setup command
# installs. Ravion's CI publishes it here from Ravion's source repository,
# file for file, and tags each version rvn-gcp-setup@<VERSION>. The setup
# command checks that the tag's gcp/setup holds exactly the files of that
# version, so a published version never changes: this check refuses pull
# requests that change gcp/setup under a VERSION that is already tagged.

on:
  pull_request:
    branches:
      - main
    paths:
      - 'gcp/setup/**'
      - '.github/workflows/gcp-setup.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check GCP setup version
    runs-on: ravion/ee=github-actions-other/type=sandbox/cpu=auto/memory=auto/disk=auto/disk_cache=auto/id=${{ github.run_id }}-gcp-setup-check/interruptible=true
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Check VERSION, CHANGELOG and the published tag
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < gcp/setup/VERSION)"
          if ! [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error file=gcp/setup/VERSION::VERSION must be MAJOR.MINOR.PATCH, got '${version}'."
            exit 1
          fi
          newest="$(sed -n 's/^## \([0-9][0-9.]*\)[[:space:]]*$/\1/p' gcp/setup/CHANGELOG.md | head -n 1)"
          if [ "${newest}" != "${version}" ]; then
            echo "::error file=gcp/setup/CHANGELOG.md::The newest CHANGELOG entry is '${newest}', but VERSION is '${version}'."
            exit 1
          fi

          tag="rvn-gcp-setup@${version}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" > /dev/null; then
            git fetch --quiet --no-tags --depth=1 origin "+refs/tags/${tag}:refs/tags/${tag}"
            published="$(git rev-parse "refs/tags/${tag}^{commit}:gcp/setup")"
            current="$(git rev-parse "HEAD:gcp/setup")"
            if [ "${published}" != "${current}" ]; then
              echo "::error file=gcp/setup/VERSION::${tag} is already published with different files. Change the module in Ravion's source repository under a new VERSION; it is published here from there."
              exit 1
            fi
            echo "${tag} is published and matches gcp/setup."
          else
            echo "${tag} is not published yet."
          fi

