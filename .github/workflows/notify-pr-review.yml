name: Notify PR reviewers

on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  pull-requests: read

jobs:
  notify:
    # Fork review events receive no repository or organization secrets; skip them.
    if: >-
      ${{
        contains(fromJSON('["approved", "changes_requested"]'), github.event.review.state) &&
        github.event.pull_request.head.repo.fork == false
      }}
    runs-on: ravion/ee=github-actions-other/type=sandbox/cpu=auto/memory=auto/disk=auto/disk_cache=auto/id=${{ github.run_id }}-notify-pr-review-notify/interruptible=false
    steps:
      - name: Check out reviewer map
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 1
          sparse-checkout: .github/reviewer-slack-map.yml
          sparse-checkout-cone-mode: false

      - name: Send Slack notifications
        env:
          INTERNAL_SLACK_BOT_TOKEN: ${{ secrets.INTERNAL_SLACK_BOT_TOKEN }}
          REVIEW_STATE: ${{ github.event.review.state }}
          REVIEWER: ${{ github.event.review.user.login }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ github.token }}
          REQUESTED_REVIEWERS: ${{ toJSON(github.event.pull_request.requested_reviewers) }}
          ASSIGNEES: ${{ toJSON(github.event.pull_request.assignees) }}
          REPOSITORY: ${{ github.repository }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail

          if [[ -z "${INTERNAL_SLACK_BOT_TOKEN}" ]]; then
            echo "::error::INTERNAL_SLACK_BOT_TOKEN is empty"
            exit 1
          fi

          review_state="$(printf '%s' "${REVIEW_STATE}" | tr '[:upper:]' '[:lower:]')"
          case "${review_state}" in
            approved)
              decision="approved"
              ;;
            changes_requested)
              decision="requested changes on"
              ;;
            *)
              echo "::error::Unsupported review state: ${REVIEW_STATE}"
              exit 1
              ;;
          esac

          requested_by_login="$(
            PR_BODY="${PR_BODY}" python3 - <<'PY'
          import os
          import re

          match = re.search(
              r"^Requested by:\s*@([A-Za-z\d](?:[A-Za-z\d]|-(?=[A-Za-z\d])){0,38})\s*$",
              os.environ["PR_BODY"],
              re.MULTILINE,
          )
          if match:
              print(match.group(1))
          PY
          )"

          # Tembo credits the session's requester as a commit co-author instead of a body line.
          if [[ -z "${requested_by_login}" && "${PR_AUTHOR,,}" == "tembo[bot]" ]]; then
            commit_authors_query="$(
              jq -n \
                --arg owner "${REPOSITORY%%/*}" \
                --arg repo "${REPOSITORY#*/}" \
                --argjson number "${PR_NUMBER}" \
                '{
                  query: "query($owner: String!, $repo: String!, $number: Int!) { repository(owner: $owner, name: $repo) { pullRequest(number: $number) { commits(first: 100) { nodes { commit { authors(first: 10) { nodes { user { login } } } } } } } } }",
                  variables: {owner: $owner, repo: $repo, number: $number}
                }'
            )"
            if commit_authors="$(
              curl --silent --show-error --fail \
                --header "Authorization: Bearer ${GITHUB_TOKEN}" \
                --header "Content-Type: application/json" \
                --data "${commit_authors_query}" \
                https://api.github.com/graphql
            )"; then
              # GraphQL reports failures with HTTP 200 and an `errors` array.
              graphql_errors="$(
                jq -r '
                  if (.errors | type) == "array" and (.errors | length) > 0 then
                    [.errors[] | .message // "unknown error"] | join("; ")
                  elif (.data.repository.pullRequest | type) != "object" then
                    "pull request missing from response"
                  else
                    ""
                  end
                ' <<<"${commit_authors}" 2>/dev/null || echo "invalid JSON response"
              )"
              if [[ -n "${graphql_errors}" ]]; then
                echo "::warning::Could not read commit authors to find the Tembo requester: ${graphql_errors}"
              else
                requested_by_login="$(
                  jq -r '
                    [.data.repository.pullRequest.commits.nodes[]?.commit.authors.nodes[]?.user.login
                      | select(type == "string" and (endswith("[bot]") | not))]
                    | first // ""
                  ' <<<"${commit_authors}"
                )"
                if [[ -z "${requested_by_login}" ]]; then
                  echo "::warning::No human commit author found to identify the Tembo requester"
                fi
              fi
            else
              echo "::warning::Could not read commit authors to find the Tembo requester"
            fi
          fi

          if [[ "${PR_AUTHOR,,}" != "devin-ai-integration[bot]" && "${PR_AUTHOR,,}" != "tembo[bot]" && -z "${requested_by_login}" ]]; then
            exit 0
          fi

          # Don't DM the requester about approvals once they have approved the PR and added it to the merge queue themselves.
          skip_login=""
          if [[ "${review_state}" == "approved" && -n "${requested_by_login}" ]]; then
            queue_state_query="$(
              jq -n \
                --arg owner "${REPOSITORY%%/*}" \
                --arg repo "${REPOSITORY#*/}" \
                --argjson number "${PR_NUMBER}" \
                '{
                  query: "query($owner: String!, $repo: String!, $number: Int!) { repository(owner: $owner, name: $repo) { pullRequest(number: $number) { labels(first: 100) { nodes { name } } latestOpinionatedReviews(first: 100, writersOnly: true) { nodes { state author { login } } } } } }",
                  variables: {owner: $owner, repo: $repo, number: $number}
                }'
            )"
            if queue_state="$(
              curl --silent --show-error --fail \
                --header "Authorization: Bearer ${GITHUB_TOKEN}" \
                --header "Content-Type: application/json" \
                --data "${queue_state_query}" \
                https://api.github.com/graphql
            )"; then
              requester_queued="$(
                jq -r --arg requester "${requested_by_login}" '
                  if (.errors | type) == "array" and (.errors | length) > 0 then
                    "error: " + ([.errors[] | .message // "unknown error"] | join("; "))
                  elif (.data.repository.pullRequest | type) != "object" then
                    "error: pull request missing from response"
                  else
                    .data.repository.pullRequest as $pr
                    | (any($pr.labels.nodes[]?.name; . == "0 - ravion queue" or . == "0 - ravion priority")) as $queued
                    | (any($pr.latestOpinionatedReviews.nodes[]?;
                        .state == "APPROVED" and
                        ((.author.login // "") | ascii_downcase) == ($requester | ascii_downcase))) as $approved
                    | ($queued and $approved | tostring)
                  end
                ' <<<"${queue_state}" 2>/dev/null || echo "error: invalid JSON response"
              )"
              case "${requester_queued}" in
                true)
                  echo "@${requested_by_login} already approved and queued this PR; not notifying them"
                  skip_login="${requested_by_login}"
                  ;;
                false) ;;
                *) echo "::warning::Could not check merge queue state: ${requester_queued#error: }" ;;
              esac
            else
              echo "::warning::Could not check merge queue state"
            fi
          fi

          recipients="$(
            jq -cn \
              --arg reviewer "${REVIEWER}" \
              --arg skip "${skip_login}" \
              --arg requested_by "${requested_by_login}" \
              --argjson requested "${REQUESTED_REVIEWERS}" \
              --argjson assignees "${ASSIGNEES}" '
                (($requested + $assignees +
                    (if $requested_by == "" then [] else [{login: $requested_by}] end))
                  | map(.login)
                  | map(select(type == "string"))
                  | map(select((ascii_downcase) != ($reviewer | ascii_downcase)))
                  | map(select((ascii_downcase) != ($skip | ascii_downcase)))
                  | reduce .[] as $login
                      ([];
                       if any(.[]; ascii_downcase == ($login | ascii_downcase))
                       then .
                       else . + [$login]
                       end))
              '
          )"

          if [[ "$(jq 'length' <<<"${recipients}")" == "0" ]]; then
            exit 0
          fi

          map_file=".github/reviewer-slack-map.yml"
          if [[ ! -f "${map_file}" || ! -r "${map_file}" ]]; then
            echo "::error::Reviewer Slack map is missing or unreadable: ${map_file}"
            exit 1
          fi

          if ! command -v yq >/dev/null 2>&1; then
            echo "::error::yq is required to read .github/reviewer-slack-map.yml"
            exit 1
          fi

          escape_slack_text() {
            local value="$1"
            value="${value//&/\&amp;}"
            value="${value//</\&lt;}"
            value="${value//>/\&gt;}"
            printf '%s' "${value}"
          }

          escaped_reviewer="$(escape_slack_text "${REVIEWER}")"
          escaped_repository="$(escape_slack_text "${REPOSITORY}")"
          escaped_title="$(escape_slack_text "${PR_TITLE}")"
          message="*${escaped_reviewer}* ${decision} <${PR_URL}|${escaped_repository}: ${escaped_title}>"
          failed_logins=()
          failed_reasons=()

          while IFS= read -r login; do
            slack_channel="$(login="${login}" yq -r '.[strenv(login)] // ""' "${map_file}")"
            if [[ -z "${slack_channel}" || "${slack_channel}" == "null" ]]; then
              echo "::warning::No Slack member mapping for GitHub login @${login}; skipping"
              continue
            fi

            payload="$(
              jq -n \
                --arg channel "${slack_channel}" \
                --arg text "${message}" \
                '{channel: $channel, text: $text}'
            )"

            if ! response="$(
              curl --silent --show-error \
                --header "Authorization: Bearer ${INTERNAL_SLACK_BOT_TOKEN}" \
                --header "Content-Type: application/json; charset=utf-8" \
                --data "${payload}" \
                --write-out $'\n%{http_code}' \
                https://slack.com/api/chat.postMessage
            )"; then
              failed_logins+=("${login}")
              failed_reasons+=("curl request failed")
              continue
            fi

            http_status="${response##*$'\n'}"
            response_body="${response%$'\n'*}"
            if [[ "${http_status}" != "200" ]]; then
              failed_logins+=("${login}")
              failed_reasons+=("HTTP ${http_status}: ${response_body}")
              continue
            fi

            if [[ "$(jq -r '.ok // false' <<<"${response_body}")" != "true" ]]; then
              slack_error="$(jq -r '.error // "unknown Slack API error"' <<<"${response_body}")"
              failed_logins+=("${login}")
              failed_reasons+=("Slack API error: ${slack_error}")
            fi
          done < <(jq -r '.[]' <<<"${recipients}")

          if (( ${#failed_logins[@]} > 0 )); then
            for index in "${!failed_logins[@]}"; do
              echo "::error::Failed to notify @${failed_logins[index]}: ${failed_reasons[index]}"
            done
            exit 1
          fi
