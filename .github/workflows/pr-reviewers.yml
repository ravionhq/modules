name: PR reviewers

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, edited]
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]
  issue_comment:
    types: [created]
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  request-review:
    # Greptile status comments matter too: they say when Greptile skipped an agent PR.
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      contains(fromJSON('["devin-ai-integration[bot]", "tembo[bot]"]'), github.event.pull_request.user.login) || (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        github.event.comment.user.login == 'greptile-apps[bot]'
      )
    permissions:
      pull-requests: write
      contents: read
      issues: write
    concurrency:
      group: pr-reviewers-request-${{ github.event.pull_request.number || github.event.issue.number || 'sweep' }}
      cancel-in-progress: false
    runs-on: ravion/ee=github-actions-other/type=sandbox/cpu=auto/memory=auto/disk=auto/id=${{ github.run_id }}-pr-reviewers-request/interruptible=true
    steps:
      # Metadata only: never check out or execute code from the PR head.
      - name: Request review from the session creator
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            // Coding agents whose PRs get a human reviewer once Greptile is done. `replyLogin` is the
            // agent's GraphQL login on review thread comments.
            const agents = new Map([
              ["devin-ai-integration[bot]", {name: "Devin", replyLogin: "devin-ai-integration"}],
              ["tembo[bot]", {name: "Tembo", replyLogin: "tembo"}],
            ])
            const agentFor = (pr) => agents.get(pr.user?.login ?? "")

            // Tembo PRs carry no requester line; Tembo credits the session's requester as a commit
            // co-author instead. Use the earliest human author.
            async function commitRequester(pr) {
              const {repository} = await github.graphql(
                `query($owner: String!, $repo: String!, $number: Int!) {
                  repository(owner: $owner, name: $repo) {
                    pullRequest(number: $number) {
                      commits(first: 100) {
                        nodes { commit { authors(first: 10) { nodes { user { login } } } } }
                      }
                    }
                  }
                }`,
                {...context.repo, number: pr.number},
              )
              for (const {commit} of repository.pullRequest.commits.nodes) {
                for (const author of commit.authors.nodes) {
                  const login = author.user?.login
                  if (login && !login.endsWith("[bot]")) {
                    return login
                  }
                }
              }
              return null
            }

            async function reviewerFor(pr) {
              const match = (pr.body ?? "").match(/^Requested by:[ \t]*@([A-Za-z\d](?:[A-Za-z\d]|-(?=[A-Za-z\d])){0,38})[ \t]*\r?$/m)
              if (match) {
                return match[1]
              }
              if (pr.user?.login === "tembo[bot]") {
                const login = await commitRequester(pr)
                if (login) {
                  return login
                }
              }
              core.info(`PR #${pr.number}: no valid requester metadata; defaulting to @flybayer`)
              return "flybayer"
            }

            // Greptile's dashboard trigger rules can skip agent PRs (it posts a status comment saying
            // the PR "does not match any of the configured review trigger rule"). Mention it once to
            // start the review; the request then follows Greptile's summary as usual.
            async function triggerSkippedGreptileReview(pr) {
              const comments = await github.paginate(github.rest.issues.listComments, {
                ...context.repo,
                issue_number: pr.number,
                per_page: 100,
              })
              const skipped = comments.some(
                (comment) =>
                  comment.user?.login === "greptile-apps[bot]" &&
                  (comment.body ?? "").includes("<!-- greptile-status -->") &&
                  (comment.body ?? "").includes("does not match any of the"),
              )
              if (!skipped || comments.some((comment) => /@greptileai\b/i.test(comment.body ?? ""))) {
                return
              }
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: pr.number,
                body: "@greptileai",
              })
              core.info(`PR #${pr.number}: Greptile skipped the review; asked it to review`)
            }

            async function requestReview(pr, {waitForGreptile}) {
              const agent = agentFor(pr)
              if (pr.state !== "open" || pr.draft || !agent) {
                return
              }
              const reviews = await github.paginate(github.rest.pulls.listReviews, {
                ...context.repo,
                pull_number: pr.number,
                per_page: 100,
              })
              // Greptile writes its summary into the body when a review finishes, and also submits
              // a review when it has comments.
              const greptileReviewed =
                (pr.body ?? "").includes("<!-- greptile_confidence_score:") ||
                reviews.some((review) => review.user?.login === "greptile-apps[bot]")
              if (waitForGreptile && !greptileReviewed) {
                await triggerSkippedGreptileReview(pr)
                core.info(`PR #${pr.number}: waiting for Greptile's first review`)
                return
              }
              const reviewer = await reviewerFor(pr)
              const isReviewer = (user) => user?.login.toLowerCase() === reviewer.toLowerCase()
              if ((pr.requested_reviewers ?? []).some(isReviewer)) {
                return
              }
              if (reviews.some((review) => review.state !== "PENDING" && isReviewer(review.user))) {
                return
              }
              if (waitForGreptile) {
                // Wait until the agent addresses all unresolved Greptile threads.
                const threads = []
                let cursor = null
                do {
                  const {repository} = await github.graphql(
                    `query($owner: String!, $repo: String!, $number: Int!, $cursor: String) {
                      repository(owner: $owner, name: $repo) {
                        pullRequest(number: $number) {
                          reviewThreads(first: 100, after: $cursor) {
                            pageInfo { hasNextPage endCursor }
                            nodes { isResolved comments(first: 100) { nodes { author { login } } } }
                          }
                        }
                      }
                    }`,
                    {...context.repo, number: pr.number, cursor},
                  )
                  const page = repository.pullRequest.reviewThreads
                  threads.push(...page.nodes)
                  cursor = page.pageInfo.hasNextPage ? page.pageInfo.endCursor : null
                } while (cursor)
                const unhandled = threads.filter(({isResolved, comments: {nodes: [first, ...replies]}}) =>
                  first?.author?.login === "greptile-apps" &&
                  !isResolved &&
                  !replies.some((comment) => comment.author?.login === agent.replyLogin),
                )
                if (unhandled.length > 0) {
                  core.info(`PR #${pr.number}: waiting for ${agent.name} to address ${unhandled.length} Greptile thread(s)`)
                  return
                }
              }
              await github.rest.pulls.requestReviewers({
                ...context.repo,
                pull_number: pr.number,
                reviewers: [reviewer],
              })
              core.info(`PR #${pr.number}: requested review from @${reviewer}`)
            }

            const eventPullNumber = context.payload.pull_request?.number ?? context.payload.issue?.number
            if (eventPullNumber) {
              const {data: pr} = await github.rest.pulls.get({
                ...context.repo,
                pull_number: eventPullNumber,
              })
              await requestReview(pr, {waitForGreptile: true})
            } else {
              const pullRequests = await github.paginate(github.rest.pulls.list, {
                ...context.repo,
                state: "open",
                per_page: 100,
              })
              const failedPullRequests = []
              for (const pr of pullRequests.filter(
                (pullRequest) => agentFor(pullRequest) && !pullRequest.draft,
              )) {
                try {
                  await requestReview(pr, {
                    waitForGreptile:
                      Date.now() - Date.parse(pr.created_at) < 2 * 60 * 60 * 1000,
                  })
                } catch (error) {
                  const message =
                    error && typeof error === "object" && "message" in error
                      ? String(error.message)
                      : String(error)
                  core.error(`PR #${pr.number}: ${message}`)
                  failedPullRequests.push(pr.number)
                }
              }
              if (failedPullRequests.length > 0) {
                core.setFailed(
                  `Failed to request reviewers for PRs: ${failedPullRequests.map((number) => `#${number}`).join(", ")}`,
                )
              }
            }
