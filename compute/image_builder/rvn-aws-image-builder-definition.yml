                  label: List files
                  value: ListFiles
                - group_label: Folders
                  label: Create a folder
                  value: CreateFolder
                - group_label: Folders
                  label: Copy a folder
                  value: CopyFolder
                - group_label: Folders
                  label: Move a folder
                  value: MoveFolder
                - group_label: Folders
                  label: Delete a folder
                  value: DeleteFolder
                - group_label: System
                  label: Reboot
                  value: Reboot
                - group_label: System
                  label: Update the operating system
                  value: UpdateOS
                - group_label: System
                  label: Assert a condition
                  value: Assert
                - group_label: Windows
                  label: Install an MSI
                  value: InstallMSI
                - group_label: Windows
                  label: Uninstall an MSI
                  value: UninstallMSI
                - group_label: Windows
                  label: Set a registry value
                  value: SetRegistry
            - add_button_label: Add command
              default: []
              description: Commands run in order. The step fails on the first one that exits non-zero.
              id: commands
              label: Commands
              placeholder: set -euo pipefail
              required: true
              show_when:
                action:
                  - ExecuteBash
                  - ExecutePowerShell
              type: string_array
            - description: Inputs for this action as JSON, in the shape its AWS documentation describes. Leave blank for an action that takes none.
              id: inputs_json
              label: Inputs
              placeholder: '[{"source": "s3://my-releases/app", "destination": "/tmp/app"}]'
              show_when:
                action:
                  not:
                    - ExecuteBash
                    - ExecutePowerShell
              type: text
            - collapsible: true
              default: Abort
              description: What happens when this step fails.
              id: on_failure
              label: On failure
              type: string
              values:
                - description: Stop the build.
                  label: Abort
                  value: Abort
                - description: Run the rest of the phase, then fail it.
                  label: Continue
                  value: Continue
                - description: Carry on as if the step had passed.
                  label: Ignore
                  value: Ignore
            - collapsible: true
              description: Seconds this step may run before it is stopped. Leave blank for the Image Builder default.
              id: timeout_seconds
