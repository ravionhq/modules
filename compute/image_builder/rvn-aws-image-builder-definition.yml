              min: 1
              type: number
            - collapsible: true
              description: Times this step is retried before the phase fails.
              id: max_attempts
              label: Max attempts
              min: 1
              type: number
          item_label: Step
          item_title:
            fallback: Step
            template: "{name}"
          label: Validate steps
          show_when:
            source: steps
          type: object_array
        - collapsible: true
          default: []
          description: Steps that check an instance launched from the finished image, after the build.
          id: test_steps
          item_inputs:
            - description: Name of this step, unique within the phase.
              id: name
              label: Name
              patterns:
