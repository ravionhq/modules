            template: "{name}"
          label: Validate steps
          show_when:
            source: steps
          type: object_array
        - collapsible: true
          default: []
          description: Steps that check an instance launched from the finished image. Run only when image tests are on.
          id: test_steps
          item_inputs:
            - description: Name of this step, unique within the phase.
