        - collapsible: true
          description: Operating system the component runs on.
          id: platform
          label: Platform
          show_when:
            source:
              - steps
              - document
          type: string
          values:
            - label: Linux
              value: Linux
            - label: Windows
              value: Windows
            - label: macOS
              value: macOS
        - collapsible: true
          default: {}
          description: Values for the parameters the component declares. Changing a value creates a new recipe over the same component.
          id: parameters
          label: Parameters
          show_when:
            source:
              - document
              - arn
          type: keyvalue
      item_label: Component
      item_title:
        fallback: Component
        template: "{name}"
      label: Components
      required: true
      type: object_array
    - collapsible: true
      description: User data the build instance launches with. Supplying it replaces the script Image Builder uses to install the Systems Manager agent, so it must install the agent on a parent image that does not ship one.
      id: user_data
      label: Build instance user data
      type: text
    - collapsible: true
      description: Directory on the build instance the build and test workflows run in. Leave blank to keep the Image Builder default.
      id: working_directory
      label: Build working directory
      patterns:
        - message: Use an absolute path.
          pattern: ^$|^/
      placeholder: /tmp
      type: string
    - collapsible: true
      default: true
      description: Remove the Systems Manager agent from the image when Image Builder installed it for the build.
      id: ssm_agent_uninstall_after_build
      label: Remove Systems Manager agent after build
      type: boolean
    - default: false
      description: Give the image a root volume configured here. The volume becomes the image's snapshot, and its size is the smallest root volume an instance can launch the image with.
      id: root_volume_override_enabled
      label: Custom root volume
      type: boolean
    - description: Root device name of the parent image, for example /dev/xvda or /dev/sda1.
      id: root_device_name
      label: Root device name
      patterns:
        - message: Use a device path, for example /dev/xvda.
          pattern: ^/dev/[a-z0-9/]+$
      placeholder: /dev/xvda
      required: true
      show_when:
        root_volume_override_enabled: true
      type: string
    - default: 30
      description: Size of the image's root snapshot. Every instance launched from the image gets a root volume at least this large.
      id: root_volume_size_gb
      label: Root volume size (GiB)
      max: 65536
      min: 1
      required: true
      show_when:
        root_volume_override_enabled: true
      type: number
    - collapsible: true
      default: gp3
      description: EBS volume type of the root volume.
      id: root_volume_type
      label: Root volume type
      show_when:
        root_volume_override_enabled: true
      type: string
      values:
        - label: gp3
          value: gp3
        - label: gp2
          value: gp2
        - label: io1
          value: io1
        - label: io2
          value: io2
    - collapsible: true
      description: Provisioned IOPS for the root volume. Leave blank to take the volume type's default.
      id: root_volume_iops
      label: Root volume IOPS
      max: 256000
      min: 100
      placeholder: "3000"
      show_when:
        root_volume_override_enabled: true
        root_volume_type:
          - gp3
          - io1
          - io2
      type: number
    - collapsible: true
      description: Throughput of the root volume in MiB/s. Leave blank to take the gp3 default of 125.
      id: root_volume_throughput
      label: Root volume throughput (MiB/s)
      max: 1000
      min: 125
      placeholder: "125"
      show_when:
        root_volume_override_enabled: true
        root_volume_type: gp3
      type: number
    - collapsible: true
      default: true
      description: Encrypt the image's root snapshot. Public images are always unencrypted.
      id: root_volume_encrypted
      label: Encrypt root volume
      show_when:
        public: false
        root_volume_override_enabled: true
      type: boolean
    - collapsible: true
      description: KMS key the root snapshot is encrypted with, as a key ID, alias, or ARN. Leave blank to use the account's default EBS key.
      id: root_volume_kms_key_id
      label: Root volume KMS key
      patterns:
        - message: Use a KMS key ID, alias, or ARN.
          pattern: ^$|^alias/.+$|^[A-Fa-f0-9-]{36}$|^arn:aws[a-z-]*:kms:[a-z0-9-]+:[0-9]{12}:(key|alias)/.+$
      placeholder: arn:aws:kms:us-west-2:123456789012:key/1234abcd-12ab-34cd-56ef-1234567890ab
      show_when:
        public: false
        root_volume_encrypted: true
        root_volume_override_enabled: true
      type: string
    - id: section_build
      label: Build infrastructure
      type: section
    - add_button_label: Add instance type
      default:
        - m7i.large
      description: Instance types the build may run on, in order of preference. They must match the parent image's architecture.
      id: instance_types
      label: Instance types
      required: true
      type: string_array
    - collapsible: true
      description: Subnet the build instance launches in. It needs outbound access to Systems Manager, Image Builder, S3, and whatever the components download. Leave blank to use the default VPC.
      id: subnet_id
      label: Subnet ID
      patterns:
        - message: Use a subnet ID.
          pattern: ^$|^subnet-[0-9a-f]{8,17}$
      placeholder: subnet-0123456789abcdef0
      type: string
    - add_button_label: Add security group ID
      collapsible: true
      default: []
      description: Security groups for the build instance. Required with a subnet ID.
      id: security_group_ids
      label: Security group IDs
      placeholder: sg-0123456789abcdef0
      show_when:
        subnet_id:
          not: ""
      type: string_array
    - add_button_label: Add managed policy ARN
      collapsible: true
      default: []
      description: Managed policies attached to the build instance's role, beyond the two Image Builder requires.
      id: instance_managed_policy_arns
      label: Build instance managed policy ARNs
      patterns:
        - message: Use a valid IAM managed policy ARN.
          pattern: ^arn:aws(-cn|-us-gov)?:iam::(aws|\d{12}):policy/.+$
      placeholder: arn:aws:iam::aws:policy/AmazonS3ReadOnlyAccess
      type: string_array
    - collapsible: true
      description: Inline IAM policy for the build instance's role. Grant what the components need to reach, such as read access to a release bucket.
      id: instance_policy_json
      label: Build instance policy JSON
      patterns:
        - message: Include a JSON object with Version and Statement properties.
          pattern: ^\s*$|^\s*\{[\s\S]*"Version"[\s\S]*"Statement"[\s\S]*\}\s*$
      placeholder: |-
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Action": ["s3:GetObject"],
              "Resource": ["arn:aws:s3:::my-bucket/releases/*"]
            }
          ]
        }
      type: text
    - collapsible: true
      default: true
      description: Terminate the build instance when a build fails. Turn off to keep it for debugging.
      id: terminate_instance_on_failure
      label: Terminate instance on failure
      type: boolean
    - collapsible: true
      default: true
      description: Launch a test instance from the new image and run the components' test phases. Turn off for an image that does not start the Systems Manager agent on boot.
      id: image_tests_enabled
      label: Run image tests
      type: boolean
    - collapsible: true
      default: 60
      description: How long the test phase may run.
      id: image_tests_timeout_minutes
      label: Image test timeout (minutes)
      max: 1440
      min: 60
      show_when:
        image_tests_enabled: true
      type: number
    - collapsible: true
      description: S3 bucket the build logs are written to. The build instance is granted write access under the log prefix. Leave blank to keep the logs in CloudWatch only.
      id: log_bucket
      label: Build log bucket
      patterns:
        - message: Use an S3 bucket name.
          pattern: ^$|^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$
      placeholder: my-build-logs
      type: string
    - collapsible: true
      default: image-builder
      description: Key prefix the build logs are written under. An empty prefix writes them at the bucket root.
      id: log_prefix
      label: Build log prefix
      show_when:
        log_bucket:
          not: ""
      type: string
    - id: section_notification
      label: Build notification
      type: section
    - collapsible: true
      description: HTTPS endpoint told when a build finishes and its images reach every region. The notification carries the image's ARN, and the endpoint reads the rest back from Image Builder. Leave blank to send none.
      id: notify_url
      label: Notify endpoint
      patterns:
        - message: Use an https:// URL.
          pattern: ^$|^https://.+
      placeholder: https://api.example.com/hooks/image-built
      type: string
    - collapsible: true
      default: X-Lambda-Secret
      description: Header the notification carries so the endpoint can tell it apart from any other caller.
      id: notify_header_name
      label: Notify header
      show_when:
        notify_url:
          not: ""
      type: string
    - default: value
      description: Where the header value comes from. A parameter or a secret is read on each deploy, so rotating it reaches the endpoint on the next deploy rather than the moment it changes.
      id: notify_secret_source
      label: Header value source
      required: true
      show_when:
        notify_url:
          not: ""
      type: string
      values:
        - description: Enter the value here.
          label: Value
          value: value
        - description: Read it from an SSM parameter.
          label: Parameter Store
          value: parameter_store
        - description: Read it from a Secrets Manager secret.
          label: Secrets Manager
          value: secrets_manager
    - description: Value of that header, which the endpoint checks before it trusts the call.
      id: notify_header_value
      label: Notify header value
      required: true
      show_when:
        notify_secret_source: value
        notify_url:
          not: ""
      type: string
    - description: Name or ARN of the parameter holding the header value. A SecureString is decrypted on read, so the deploy needs to be allowed ssm:GetParameter on it and kms:Decrypt on its key.
      id: notify_header_parameter
      label: Parameter
      placeholder: /ravion/image-builder/notify-header
      required: true
      show_when:
        notify_secret_source: parameter_store
        notify_url:
          not: ""
      type: string
    - description: Name or ARN of the secret holding the header value. The deploy needs to be allowed secretsmanager:GetSecretValue on it, and kms:Decrypt on its key when the secret uses a customer-managed one.
      id: notify_header_secret
      label: Secret
      placeholder: ravion/image-builder/notify-header
      required: true
      show_when:
        notify_secret_source: secrets_manager
        notify_url:
          not: ""
      type: string
    - collapsible: true
      description: Key to read out of a secret that stores JSON. Leave blank to use the whole secret.
      id: notify_header_secret_json_key
      label: Secret JSON key
      placeholder: header
      show_when:
        notify_secret_source: secrets_manager
        notify_url:
          not: ""
      type: string
    - id: section_distribution
      label: Distribution
      type: section
    - collapsible: true
      description: Name of each image produced. Include {{ imagebuilder:buildDate }} so that every build gets its own name. Defaults to the pipeline name followed by the build date.
      id: ami_name
      label: AMI name
      patterns:
        - message: Include {{ imagebuilder:buildDate }} or {{ imagebuilder:buildVersion }}.
          pattern: ^$|\{\{\s*imagebuilder:build(Date|Version)\s*\}\}
      placeholder: my-image-{{ imagebuilder:buildDate }}
      type: string
    - collapsible: true
      description: Description stored on each image produced.
      id: ami_description
      label: AMI description
      patterns:
        - message: 1024 characters or fewer.
          pattern: ^.{0,1024}$
      type: string
    - collapsible: true
      default: {}
      description: Tags written on each image produced, in every region. Tags are visible only to the owning account, even on a public image.
      id: ami_tags
      label: AMI tags
      type: keyvalue
    - add_button_label: Add region
      default: []
      description: Regions the finished image is copied to, beyond the build region.
      id: distribution_regions
      label: Additional regions
      placeholder: Select a region
      type: string_array
      values: $values:aws/regions
    - default: false
      description: Make every image produced launchable by any AWS account. A public image cannot be backed by an encrypted snapshot, so EBS encryption by default must be off in every region the image lands in.
      id: public
      label: Public image
      type: boolean
    - default: false
      description: Turn off the account-wide block on public AMI sharing in the build region and every additional region. The setting covers every image the account owns in those regions, not only the images built here, and stays off after this module is destroyed. Leave it off unless you mean to change the account, and a build that would publish a public image fails in any region that still blocks sharing.
      id: manage_image_block_public_access
      label: Allow public AMI sharing in this account
      show_when:
        public: true
      type: boolean
    - add_button_label: Add account ID
      default: []
      description: AWS accounts granted launch permission on every image produced.
      id: launch_account_ids
      label: Shared account IDs
      patterns:
        - message: Use a 12-digit AWS account ID.
          pattern: ^[0-9]{12}$
      placeholder: "123456789012"
      show_when:
        public: false
      type: string_array
    - add_button_label: Add organization ARN
      collapsible: true
      default: []
      description: AWS Organizations granted launch permission on every image produced. Every account in the organization can launch the image.
      id: launch_organization_arns
      label: Shared organization ARNs
      patterns:
        - message: Use an AWS Organizations organization ARN.
          pattern: ^arn:aws[a-z-]*:organizations::[0-9]{12}:organization/o-[a-z0-9]+$
      placeholder: arn:aws:organizations::123456789012:organization/o-abc123def4
      show_when:
        public: false
      type: string_array
    - $include: ../../partials/inputs/misc-section.yml
    - $include: ../../partials/inputs/tags.yml
    - $include: ../../partials/inputs/terraform-settings.yml
    - $merge:
        - ../../partials/inputs/execution-environment.yml
      description: Override the execution environment for Terraform runners. Must use the same AWS account as selected above.
  stack:
    $template: ../../partials/templates/opentofu-stack.yml
    with:
      base_path: compute/image_builder
      terraform_variables:
        ...overrides: << module.input.advanced_terraform_variables >>
        ami_description: << module.input.ami_description || nil >>
        ami_name: << module.input.ami_name || nil >>
        ami_tags: << module.input.ami_tags || {} >>
        build_on_apply: << module.input.build_on_apply >>
        build_timeout_minutes: "<< module.input.build_on_apply ? (module.input.build_timeout_minutes || nil) : nil >>"
        components: << module.input.components || [] >>
        create_pipeline_execution_policy: << module.input.create_pipeline_execution_policy >>
        description: << module.input.description || nil >>
        distribution_regions: << module.input.distribution_regions || [] >>
        enhanced_image_metadata_enabled: << module.input.enhanced_image_metadata_enabled >>
        image_tests_enabled: << module.input.image_tests_enabled >>
        image_tests_timeout_minutes: << module.input.image_tests_timeout_minutes >>
        instance_managed_policy_arns: << module.input.instance_managed_policy_arns || [] >>
        instance_policy_json: << module.input.instance_policy_json || nil >>
        instance_types: << module.input.instance_types >>
        launch_account_ids: "<< module.input.public ? [] : (module.input.launch_account_ids || []) >>"
        launch_organization_arns: "<< module.input.public ? [] : (module.input.launch_organization_arns || []) >>"
        log_bucket: << module.input.log_bucket || nil >>
        log_prefix: << module.input.log_prefix >>
        manage_image_block_public_access: << module.input.manage_image_block_public_access >>
        name: << module.input.name >>
        notify_header_name: << module.input.notify_header_name >>
        notify_header_parameter: << module.input.notify_header_parameter || "" >>
        notify_header_secret: << module.input.notify_header_secret || "" >>
        notify_header_secret_json_key: << module.input.notify_header_secret_json_key || "" >>
        notify_header_value: << module.input.notify_header_value || "" >>
        notify_secret_source: << module.input.notify_secret_source || nil >>
        notify_url: << module.input.notify_url || "" >>
        parent_image: '<< module.input.parent_image_source == "image" ? module.input.parent_image : nil >>'
        parent_image_lookup: >-
          << module.input.parent_image_source == "lookup" ?
          {"owners": module.input.parent_image_owners, "name": module.input.parent_image_name,
          "architecture": module.input.parent_image_architecture} : nil >>
        pipeline_enabled: << module.input.pipeline_enabled >>
        public: << module.input.public >>
        region: << module.input.aws_region >>
        root_volume: >-
          << module.input.root_volume_override_enabled ?
          {"device_name": module.input.root_device_name, "size_gb": module.input.root_volume_size_gb,
          "type": module.input.root_volume_type,
          "iops": (module.input.root_volume_type == "gp2" ? nil : (module.input.root_volume_iops || nil)),
          "throughput": (module.input.root_volume_type == "gp3" ? (module.input.root_volume_throughput || nil) : nil),
          "encrypted": (module.input.public ? nil : module.input.root_volume_encrypted),
          "kms_key_id": (module.input.public || !module.input.root_volume_encrypted ?
          nil : (module.input.root_volume_kms_key_id || nil))} : nil >>
        schedule_expression: << module.input.schedule_expression || nil >>
        schedule_start_condition: << module.input.schedule_start_condition >>
        security_group_ids: << module.input.security_group_ids || [] >>
        ssm_agent_uninstall_after_build: << module.input.ssm_agent_uninstall_after_build >>
        subnet_id: << module.input.subnet_id || nil >>
        tags:
          $include: ../../partials/stack/ravion-tags.yml
        terminate_instance_on_failure: << module.input.terminate_instance_on_failure >>
        user_data: << module.input.user_data || nil >>
        working_directory: << module.input.working_directory || nil >>
  ui:
    links: |-
      <<
      stack.output.pipeline_arn && stack.output.region ?
      [{"name":"Image pipeline","href":"https://" + stack.output.region + ".console.aws.amazon.com/imagebuilder/home?region=" + stack.output.region + "#/pipelines/" + stack.output.pipeline_arn}] :
      []
      >>
  readme: |
    Creates an EC2 Image Builder pipeline that bakes an AMI and distributes it.

    ## Overview

    Use this module to turn a manual image build into a repeatable pipeline. A recipe starts from a parent image, runs your components in order on a temporary build instance, snapshots the result as an AMI, and copies it to every region you list.

    The module creates the components, the recipe, the build infrastructure and its IAM role, the distribution settings, and the pipeline. It does not keep build instances around: each one exists only for the length of a build.

    A pipeline builds on a schedule, on request from a pipeline step, or during a deploy that changes the recipe. The request path is what a release pipeline uses: a step starts the build, waits for the image, and hands the new AMI ID to whatever launches instances from it.

    ## Use cases

    | Scenario | Benefit |
    | --- | --- |
    | Golden images | Bake packages, agents, and hardening into an AMI so instances boot ready to work. |
    | Release images | Bake one application release per image and roll it out by changing a launch template. |
    | Multi-region fleets | Build once and copy the image to every region that launches it. |
    | Distributed software | Share an image with selected accounts, or publish it for any AWS account to launch. |

    ## Components and parameters

    A component is an Image Builder document with build, validate, and test phases. Components run in the order listed, and each one names where its document comes from.

    | Source | What you fill in | When it fits |
    | --- | --- | --- |
    | Steps | Named steps under Build steps, Validate steps, and Test steps | Most components. The module writes the document. |
    | Component document | The YAML document itself | A document you already have, or an action this form does not offer |
    | Existing component ARN | The ARN | An AWS-managed component, or one another module created |

    A step names an action and what that action needs. Run bash commands and Run PowerShell commands take a list of commands, run in order, and the phase stops at the first one that exits non-zero. Every other action takes Inputs, the JSON its AWS documentation describes.

    Declare the values that change between builds, such as a release version, under Parameters. A step reads one as `{{ ParameterName }}`. A parameter's value is passed by the recipe rather than written into the document, so changing a value creates a new recipe over the same component and the document stays stable across releases.

    Image Builder recipes and components are immutable. This module names each by a hash of its content, so any change is a new recipe or component beside the old one, and the pipeline moves to it in the same deploy. There is no version to bump.

    ## Building

    The pipeline is manual unless you give it a schedule. A build commonly takes 20-60 minutes.

    | Trigger | Turn on | When it fits |
    | --- | --- | --- |
    | Schedule | A cron expression under Schedule | Weekly base images, or a rebuild whenever the parent image or a wildcard-versioned component updates |
    | Pipeline step | Allow a deploy step to start builds | A release pipeline that bakes the release into an AMI and deploys it |
    | Deploy | Build on deploy | A recipe you edit rarely, where the deploy should produce the image it describes |
    | Manual | Nothing | One-off builds from the Image pipeline link |

    ### Building from a pipeline step

    Turning on Allow a deploy step to start builds creates an IAM policy that starts this pipeline and reads the images it produces, and nothing else. Its ARN is the module's `pipeline_execution_policy_arn` output. A `custom` step attaches that ARN under `permissions`, starts the pipeline, polls until the image is available, and publishes the AMI ID for later steps:

    ```yaml
    - id: build_ami
      name: Build AMI
      type: custom
      timeout: 7200
      infrastructure:
        type: ec2
        instance_size: small
        aws_account_id: my-aws-account
        region: us-west-2
        permissions:
          attach:
            - arn:aws:iam::123456789012:policy/app-host-start-image-pipeline
      environment_variables:
        AWS_REGION: us-west-2
        PIPELINE_ARN: arn:aws:imagebuilder:us-west-2:123456789012:image-pipeline/app-host
      outputs:
        - ami_id
      commands:
        - |
          set -euo pipefail

          BUILD_ARN=$(aws imagebuilder start-image-pipeline-execution \
            --image-pipeline-arn "$PIPELINE_ARN" \
            --query imageBuildVersionArn --output text)

          while true; do
            STATE=$(aws imagebuilder list-image-pipeline-images \
              --image-pipeline-arn "$PIPELINE_ARN" \
              --query "imageSummaryList[?arn=='$BUILD_ARN'].state.status | [0]" --output text)
            case "$STATE" in
              AVAILABLE) break ;;
              FAILED|CANCELLED) echo "Image build $STATE" >&2; exit 1 ;;
            esac
            sleep 60
          done

          AMI_ID=$(aws imagebuilder list-image-pipeline-images \
            --image-pipeline-arn "$PIPELINE_ARN" \
            --query "imageSummaryList[?arn=='$BUILD_ARN'].outputResources.amis[0].image | [0]" --output text)
          echo "ami_id=$AMI_ID" >> "$RAVION_OUTPUT"
    ```

    Later steps read the new image as `<< steps.build_ami.output.ami_id >>`. Give the step a timeout longer than a build takes, and pass the pipeline ARN as a pipeline input to reuse the step across environments.

    Image Builder drives the build instance through the Systems Manager agent. On a parent image that does not ship the agent, install it in Build instance user data.

    ## Build notifications

    Notify endpoint forwards an event to an HTTPS endpoint once an image has finished building and reached every region it is distributed to. It is the only way to learn about a build nobody started from a deploy: a schedule, or a rebuild triggered by a new parent image. The notification carries the image's ARN, and the endpoint reads the rest back from Image Builder.

    The endpoint needs something to tell the call apart from any other caller, so the notification carries a header. Header value source says where its value comes from.

    | Source | What it reads |
    | --- | --- |
    | Value | The value entered here. |
    | Parameter Store | An SSM parameter, by name or ARN. |
    | Secrets Manager | A Secrets Manager secret, by name or ARN. Name a Secret JSON key to read one field out of a secret that stores JSON. |

    EventBridge is given the value itself rather than a reference to it, and two things follow. The deploy reads the parameter or the secret, so the role it runs as has to be allowed `ssm:GetParameter` or `secretsmanager:GetSecretValue` on it, and `kms:Decrypt` on the key behind a SecureString or a customer-managed secret. And rotation is not live: the value is read on the deploy that writes the connection, so a rotated parameter or secret reaches the endpoint on the next deploy rather than the moment it changes.

    Only images built from this pipeline's current recipe are forwarded. The recipe moves whenever its content does and the rule moves with it in the same deploy, so an image still building against the previous recipe when that happens finishes unannounced.

    ## Sharing

    Images are private by default. Share them with listed accounts or AWS Organizations, or turn on Public image to let any AWS account launch them.

    New AWS accounts block public AMI sharing in every region, and Public image on its own does not change that: a build that would publish an image fails in a region that still blocks sharing. Turning on Allow public AMI sharing in this account clears the block in the build region and every additional region. That is a change to the account rather than to this image: it covers every image the account owns in those regions, and it stays cleared after this module is destroyed. Restore it per region with `aws ec2 enable-image-block-public-access --image-block-public-access block-new-sharing --region <region>`.

    A public image cannot be backed by an encrypted snapshot, and a build that produces one fails an hour in. Public image is therefore checked during the deploy: the parent image must be an AMI this account can describe whose snapshots are unencrypted, and EBS encryption by default must be off in every region the image lands in. A deploy that fails these checks names what to change.

    AMI tags are visible only to the account that owns the image, even when the image is public.

    ## Configuration

    | Setting | Required | Default | Notes |
    | --- | --- | --- | --- |
    | AWS account | Yes | None | Account that owns the pipeline and the images. |
    | Region | Yes | None | Region the image is built in. |
    | Pipeline name | Yes | Project, environment, and module given IDs | Prefix of every resource created. |
    | Build on deploy | No | Off | Build during deploys that change the recipe. |
    | Build timeout | No | Image test timeout plus an hour | How long a deploy waits for the build it starts. |
    | Allow a deploy step to start builds | No | Off | Creates an IAM policy a deploy step's role can use to start this pipeline. |
    | Schedule | No | Manual | Image Builder cron expression. |
    | Pipeline enabled | No | On | A disabled pipeline keeps its configuration and ignores its schedule. |
    | Collect image metadata | No | On | Package list and other metadata from each build. |
    | Parent image | Yes | None | A specific image, or the newest AMI matching an owner and name pattern. |
    | Components | Yes | None | Steps, documents, or component ARNs, in run order. |
    | Build instance user data | No | None | Replaces the Systems Manager agent install. |
    | Build working directory | No | Image Builder default | Directory the build and test workflows run in. |
    | Custom root volume | No | Off | Gives the image its own root volume: device name, size, type, IOPS, throughput, and encryption. |
    | Instance types | Yes | `m7i.large` | Must match the parent image's architecture. |
    | Subnet and security groups | No | Default VPC | The build needs outbound internet or VPC endpoints. |
    | Build instance policies | No | Image Builder minimum | What the components need to reach. |
    | Run image tests | No | On | Needs the Systems Manager agent to start on boot. |
    | Image test timeout | No | 60 minutes | How long the test phase may run. |
    | Build log bucket and prefix | No | CloudWatch only | Build logs in S3, with write access scoped to the prefix. |
    | AMI name, description, and tags | No | Pipeline name and build date | Applied in every region. |
    | Additional regions | No | None | Regions the image is copied to. |
    | Public image | No | Off | Any AWS account can launch the image. |
    | Allow public AMI sharing in this account | No | Off | Clears the account-wide block in every region an image lands in. Stays cleared after this module is destroyed. |
    | Shared account IDs | No | None | Accounts granted launch permission. |
    | Shared organization ARNs | No | None | Organizations whose accounts can launch the image. |
    | Notify endpoint | No | None | Where a finished build is announced. |
    | Header value source | No | Value | Whether the notification header value is entered here or read from Parameter Store or Secrets Manager on each deploy. |

    ## Design decisions

    The build instance role carries only the two policies Image Builder requires. Anything the components download or call is granted explicitly, so an image build cannot reach more than it was given.

    The build instance requires IMDSv2 and is terminated after a failed build unless you keep it for debugging.

    Private images default to an encrypted root snapshot, using the account's default EBS key unless you name a KMS key.

    The root volume settings describe the image, not one instance. The size becomes the image's snapshot size, so every instance launched from the image carries at least that much root storage.

    ## Learn more

    - [EC2 Image Builder](https://docs.aws.amazon.com/imagebuilder/latest/userguide/what-is-image-builder.html)
    - [Component documents](https://docs.aws.amazon.com/imagebuilder/latest/userguide/toe-use-documents.html)
    - [Make an AMI public](https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/sharingamis-intro.html)
    - [Source module](https://github.com/ravionhq/modules/tree/$local.module_tag/compute/image_builder)
