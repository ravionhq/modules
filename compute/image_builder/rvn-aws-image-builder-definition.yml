                - group_label: Files
                  label: Create a file
                  value: CreateFile
                - group_label: Files
                  label: Copy a file
                  value: CopyFile
                - group_label: Files
                  label: Move a file
                  value: MoveFile
                - group_label: Files
                  label: Delete a file
                  value: DeleteFile
                - group_label: Files
                  label: Append to a file
                  value: AppendFile
                - group_label: Files
                  label: Read a file
                  value: ReadFile
                - group_label: Files
