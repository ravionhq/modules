                  value: AppendFile
                - group_label: Files
                  label: Read a file
                  value: ReadFile
                - group_label: Files
                  label: List files
                  value: ListFiles
                - group_label: Folders
                  label: Create a folder
                  value: CreateFolder
                - group_label: Folders
                  label: Copy a folder
                  value: CopyFolder
                - group_label: Folders
                  label: Move a folder
                  value: MoveFolder
                - group_label: Folders
                  label: Delete a folder
                  value: DeleteFolder
                - group_label: System
                  label: Reboot
                  value: Reboot
                - group_label: System
                  label: Update the operating system
                  value: UpdateOS
                - group_label: System
                  label: Assert a condition
                  value: Assert
                - group_label: Windows
