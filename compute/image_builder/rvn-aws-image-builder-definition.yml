definition:
  type: rvn-aws-image-builder
  name: EC2 Image Builder
  description: Creates an EC2 Image Builder pipeline that bakes an AMI from a parent image and ordered components, then distributes it across regions, privately or publicly.
release:
  version: 0.2.0
  description: Adds a build notification that tells an endpoint when an image finishes and reaches every region.
module:
  inputs:
    - $include: ../../partials/inputs/aws-account.yml
    - $include: ../../partials/inputs/aws-region.yml
    - id: section_pipeline
      label: Pipeline
      type: section
    - default: <<project.given_id>>-<<environment.given_id>>-<<module.given_id>>
      description: Name of the pipeline and the prefix of the recipe, components, configurations, and build instance role.
      id: name
      immutable: true
      label: Pipeline name
      patterns:
        - message: 2-64 letters, numbers, hyphens, or underscores. Start with a letter or number.
          pattern: ^[A-Za-z0-9][A-Za-z0-9_-]{1,63}$
      required: true
      type: string
    - description: Description stored on the pipeline, the recipe, and the configurations.
      id: description
      label: Description
      patterns:
        - message: 1024 characters or fewer.
          pattern: ^.{0,1024}$
      type: string
    - default: false
      description: Build an image during every deploy that changes the recipe. The deploy waits for the build and its distribution, commonly 20-60 minutes. Off leaves builds to the schedule or a manual pipeline run.
      id: build_on_apply
      label: Build on deploy
      type: boolean
    - collapsible: true
      description: How long a deploy waits for the build it starts, covering the build, the image tests, and the distribution. It must be greater than the image test timeout. Leave blank to allow an hour on top of that timeout.
      id: build_timeout_minutes
      label: Build timeout (minutes)
      max: 2880
      min: 61
      placeholder: "120"
      show_when:
        build_on_apply: true
      type: number
    - default: false
      description: Create an IAM policy that starts this pipeline and reads the images it produces. Attach it to the role of a deploy step that runs `aws imagebuilder start-image-pipeline-execution`.
      id: create_pipeline_execution_policy
      label: Allow a deploy step to start builds
      type: boolean
    - collapsible: true
      description: Cron expression the pipeline runs on. Leave blank to run it manually.
      id: schedule_expression
      label: Schedule
      patterns:
        - message: Use an Image Builder cron expression, for example cron(0 0 * * ? *).
          pattern: ^$|^cron\(.+\)$
      placeholder: cron(0 0 * * ? *)
      type: string
    - collapsible: true
      default: EXPRESSION_MATCH_AND_DEPENDENCY_UPDATES_AVAILABLE
      description: Whether a scheduled run always builds, or only when the parent image or a wildcard-versioned component has an update.
      id: schedule_start_condition
      label: Scheduled run condition
      type: string
      values:
        - label: Only when dependencies have updates
          value: EXPRESSION_MATCH_AND_DEPENDENCY_UPDATES_AVAILABLE
        - label: Every scheduled run
          value: EXPRESSION_MATCH_ONLY
    - collapsible: true
      default: true
      description: Whether the pipeline can run. A disabled pipeline keeps its configuration and ignores its schedule.
      id: pipeline_enabled
      label: Pipeline enabled
      type: boolean
    - collapsible: true
      default: true
      description: Collect the package list and other metadata from each image built, and show it in the Image Builder console.
      id: enhanced_image_metadata_enabled
      label: Collect image metadata
      type: boolean
    - id: section_parent_image
      label: Parent image
      type: section
    - default: image
      description: Pin one parent image, or look up the newest image an owner publishes under a name pattern on every deploy.
      id: parent_image_source
      label: Parent image source
      required: true
      type: string
      values:
        - label: Specific image
          description: An AMI ID, an Image Builder image ARN, or an SSM parameter.
          value: image
        - label: Newest matching AMI
          description: The newest AMI from an owner whose name matches a pattern. A newer parent image produces a new recipe on the next deploy.
          value: lookup
    - description: AMI ID, Image Builder image ARN, or SSM parameter written as ssm:<parameter name>.
      id: parent_image
      label: Parent image
      patterns:
        - message: Use an AMI ID, an Image Builder image ARN, or ssm:<parameter name>.
          pattern: ^(ami-[0-9a-f]{8,17}|arn:aws[a-z-]*:imagebuilder:[a-z0-9-]+:(aws|[0-9]{12}):image/.+|ssm:.+)$
      placeholder: ami-0123456789abcdef0
      required: true
      show_when:
        parent_image_source: image
      type: string
    - add_button_label: Add owner
      default: []
      description: AWS account IDs or owner aliases (amazon, aws-marketplace) that publish the parent image.
      id: parent_image_owners
      label: Image owners
      placeholder: "123456789012"
      required: true
      show_when:
        parent_image_source: lookup
      type: string_array
    - description: AMI name pattern. Use * as a wildcard.
      id: parent_image_name
      label: Image name pattern
      placeholder: al2023-ami-2023.*-x86_64
      required: true
      show_when:
        parent_image_source: lookup
      type: string
    - default: x86_64
      id: parent_image_architecture
      label: Architecture
      required: true
      show_when:
        parent_image_source: lookup
      type: string
      values:
        - label: x86_64
          value: x86_64
        - label: arm64
          value: arm64
    - id: section_recipe
      label: Recipe
      type: section
    - default: []
      description: Components the recipe runs, in order. Describe what a component does as ordered steps, write its document yourself, or reference an AWS-managed or existing component by ARN.
      id: components
      item_inputs:
        - description: Short name for this component. Used in the created component's name.
          id: name
          label: Name
          patterns:
            - message: 1-40 letters, numbers, hyphens, or underscores. Start with a letter or number.
              pattern: ^[A-Za-z0-9][A-Za-z0-9_-]{0,39}$
          placeholder: provision
          required: true
          type: string
        - default: steps
          description: Where this component's document comes from.
          id: source
          label: Source
          required: true
          type: string
          values:
            - description: Describe the work as ordered steps and this module writes the document.
              label: Steps
              value: steps
            - description: Write the Image Builder component document yourself.
              label: Component document
              value: document
            - description: Use an AWS-managed component or one that already exists in this account.
              label: Existing component ARN
              value: arn
        - collapsible: true
          description: What this component does. Shown on the component in the Image Builder console.
          id: description
          label: Description
          placeholder: Installs the sandbox runtime
          show_when:
            source:
              - steps
              - document
          type: string
        - description: Image Builder component document in YAML. Changing it creates a new component and a new recipe.
          id: data
          label: Component document
          placeholder: |-
            name: provision
            schemaVersion: 1.0
            phases:
              - name: build
                steps:
                  - name: Install
                    action: ExecuteBash
                    inputs:
                      commands:
                        - echo hello
          required: true
          show_when:
            source: document
          type: text
        - description: ARN of an AWS-managed component or one that already exists in this account. Use x.x.x for the latest version.
          id: arn
          label: Component ARN
          patterns:
            - message: Use an Image Builder component ARN.
              pattern: ^arn:aws[a-z-]*:imagebuilder:[a-z0-9-]+:(aws|[0-9]{12}):component/.+$
          placeholder: arn:aws:imagebuilder:us-east-1:aws:component/update-linux/x.x.x
          required: true
          show_when:
            source: arn
          type: string
        - collapsible: true
          default: []
          description: Values the steps read as {{ ParameterName }}. A value is passed by the recipe, so changing one creates a new recipe over the same component; changing a name or a default creates a new component.
          id: parameter_definitions
          item_inputs:
            - description: Name the steps refer to.
              id: name
              label: Name
              patterns:
                - message: 1-128 letters, numbers, hyphens, or underscores. Start with a letter.
                  pattern: ^[A-Za-z][A-Za-z0-9_-]{0,127}$
              placeholder: RunnerVersion
              required: true
              type: string
            - default: string
              id: type
              label: Type
              required: true
              type: string
              values:
                - label: String
                  value: string
                - label: Integer
                  value: integer
                - label: Boolean
                  value: boolean
                - label: List of strings
                  value: stringList
            - description: Value this recipe passes. Leave blank to use the default.
              id: value
              label: Value
              placeholder: v1.1.37
              type: string
            - collapsible: true
              description: Value used when the recipe passes none.
              id: default
              label: Default
              type: string
            - collapsible: true
              description: What this parameter controls.
              id: description
              label: Description
              type: string
          item_label: Parameter
          item_title:
            fallback: Parameter
            template: "{name}"
          label: Parameters
          show_when:
            source: steps
          type: object_array
        - default: []
          description: Steps that build the image, in order.
          id: build_steps
          item_inputs:
            - description: Name of this step, unique within the phase.
              id: name
              label: Name
              patterns:
                - message: 1-128 letters, numbers, hyphens, or underscores. Start with a letter or number.
                  pattern: ^[A-Za-z0-9][A-Za-z0-9_-]{0,127}$
              placeholder: InstallRuntime
              required: true
              type: string
            - default: ExecuteBash
              description: What this step does. The shell actions run the commands below; every other action takes the inputs its AWS documentation describes.
              id: action
              label: Action
              required: true
              type: string
              values:
                - group_label: Run
                  label: Run bash commands
                  value: ExecuteBash
                - group_label: Run
                  label: Run PowerShell commands
                  value: ExecutePowerShell
                - group_label: Run
                  label: Run a binary
                  value: ExecuteBinary
                - group_label: Run
                  label: Run another component document
                  value: ExecuteDocument
                - group_label: Transfer
                  label: Download from S3
                  value: S3Download
                - group_label: Transfer
                  label: Upload to S3
                  value: S3Upload
                - group_label: Transfer
                  label: Download from a URL
                  value: WebDownload
                - group_label: Files
                  label: Create a file
                  value: CreateFile
                - group_label: Files
                  label: Copy a file
                  value: CopyFile
                - group_label: Files
                  label: Move a file
                  value: MoveFile
                - group_label: Files
                  label: Delete a file
                  value: DeleteFile
                - group_label: Files
                  label: Append to a file
                  value: AppendFile
                - group_label: Files
                  label: Read a file
                  value: ReadFile
                - group_label: Files
                  label: List files
                  value: ListFiles
                - group_label: Folders
                  label: Create a folder
                  value: CreateFolder
                - group_label: Folders
                  label: Copy a folder
                  value: CopyFolder
                - group_label: Folders
                  label: Move a folder
                  value: MoveFolder
                - group_label: Folders
                  label: Delete a folder
                  value: DeleteFolder
                - group_label: System
                  label: Reboot
                  value: Reboot
                - group_label: System
                  label: Update the operating system
                  value: UpdateOS
                - group_label: System
                  label: Assert a condition
                  value: Assert
                - group_label: Windows
                  label: Install an MSI
                  value: InstallMSI
                - group_label: Windows
                  label: Uninstall an MSI
                  value: UninstallMSI
                - group_label: Windows
                  label: Set a registry value
                  value: SetRegistry
            - add_button_label: Add command
              default: []
              description: Commands run in order. The step fails on the first one that exits non-zero.
              id: commands
              label: Commands
              placeholder: set -euo pipefail
              required: true
              show_when:
                action:
                  - ExecuteBash
                  - ExecutePowerShell
              type: string_array
            - description: Inputs for this action as JSON, in the shape its AWS documentation describes. Leave blank for an action that takes none.
              id: inputs_json
              label: Inputs
              placeholder: '[{"source": "s3://releases/runner", "destination": "/tmp/runner"}]'
              show_when:
                action:
                  not:
                    - ExecuteBash
                    - ExecutePowerShell
              type: text
            - collapsible: true
              default: Abort
              description: What happens when this step fails.
              id: on_failure
              label: On failure
              type: string
              values:
                - description: Stop the build.
                  label: Abort
                  value: Abort
                - description: Run the rest of the phase, then fail it.
                  label: Continue
                  value: Continue
                - description: Carry on as if the step had passed.
                  label: Ignore
                  value: Ignore
            - collapsible: true
              description: Seconds this step may run before it is stopped. Leave blank for the Image Builder default.
              id: timeout_seconds
              label: Timeout
              min: 1
              type: number
            - collapsible: true
              description: Times this step is retried before the phase fails.
              id: max_attempts
              label: Max attempts
              min: 1
              type: number
          item_label: Step
          item_title:
            fallback: Step
            template: "{name}"
          label: Build steps
          required: true
          show_when:
            source: steps
          type: object_array
        - collapsible: true
          default: []
          description: Steps that check the build instance before the image is created. Run in order after the build phase.
