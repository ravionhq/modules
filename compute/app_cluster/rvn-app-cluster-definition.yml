global: false
definition:
  type: rvn-app-cluster
  name: App Cluster
  description: Runs the apps you deploy with ravion deploy, each in its own sandbox on an execution environment's sandbox pool, and serves them under a managed wildcard domain and your own domains through a Network Load Balancer and a router that wakes a paused app on request.
release:
  version: 0.1.0
  description: "Run apps deployed with ravion deploy on an execution environment's sandbox pool, served under a managed wildcard domain and your own domains through a router that wakes paused apps on request."
module:
  outputs:
    - id: wildcard_domain_name
      type: string
      label: Wildcard domain
      description: Every app address is a hostname one label below this domain.
    - id: custom_domain_apexes
      type: string_array
      label: Custom domain apexes
      description: The custom domains without their *.; apps are also served one label below each.
    - id: tls_listener_arn
      type: string
      label: TLS listener ARN
      description: The listener the certificates of apps' own domains are attached to.
    - id: router_subnet_ids
      type: string_array
      label: Router subnet IDs
    - id: router_security_group_id
      type: string
      label: Router security group ID
    - id: router_instance_profile_name
      type: string
      label: Router instance profile
    - id: traffic_target_group_arn
      type: string
      label: HTTPS target group ARN
    - id: redirect_target_group_arn
      type: string
      label: HTTP target group ARN
    - id: certificate_arn
      type: string
      label: Certificate ARN
    - id: custom_domain_names
      type: string_array
      label: Custom domains
    - id: custom_certificate_arn
      type: string
      label: Custom domains certificate ARN
    - id: load_balancer_arn
      type: string
      label: Load balancer ARN
    - id: load_balancer_dns_name
      type: string
      label: Load balancer DNS name
    - id: load_balancer_zone_id
      type: string
      label: Load balancer hosted zone ID
    - id: load_balancer_security_group_id
      type: string
      label: Load balancer security group ID
    - id: load_balancer_arn_suffix
      type: string
      label: Load balancer ARN suffix
      description: The LoadBalancer dimension of the load balancer's CloudWatch metrics.
    - id: traffic_target_group_arn_suffix
      type: string
      label: HTTPS target group ARN suffix
      description: The TargetGroup dimension of the router's health metrics.
    - id: aws_account_id
      type: string
      label: AWS account ID
    - id: region
      type: string
      label: Region
  inputs:
    - id: network
      immutable: true
      label: VPC network
      type: $ref:rvn-aws-network
      description: The load balancer runs in its public subnets, and the router in its private subnets, which need a NAT gateway.
      mapped_inputs:
        - id: section_aws
          label: AWS account & region
          type: section
        - default: << ref.input.aws_account_id >>
          id: aws_account_id
          immutable: true
          label: AWS account
          type: string
          values: $values:ravion/aws_accounts
        - default: << ref.input.aws_region >>
          description: AWS region for this module. If unset in Terraform, the provider region is used.
          id: aws_region
          immutable: true
          label: Region
          type: string
          values: $values:aws/regions
        # The apps' sandboxes live in this execution environment's pool, which
        # cannot hand them to another one: it is fixed once the module exists.
        - default: << ref.input.execution_environment_id >>
          description: Its sandbox pool runs the apps, and Terraform runs in it. It must be in this module's AWS account, region and VPC, with a sandbox pool.
          id: execution_environment_id
          immutable: true
          label: Execution environment
          required: true
          type: string
          values: $values:ravion/execution_environments
        - id: section_vpc
          label: VPC
          type: section
        - default: <<ref.stack.output.vpc_id>>
          id: vpc_id
          immutable: true
          label: VPC ID
          required: true
          type: string
        - add_button_label: Add private subnet ID
          default: <<ref.stack.output.private_subnet_ids>>
          description: Required by Terraform. Used for private workloads and private load balancers.
          id: private_subnet_ids
          immutable: true
          label: Private subnet IDs
          required: true
          type: string_array
        - add_button_label: Add public subnet ID
          default: <<ref.stack.output.public_subnet_ids>>
          description: Used for public load balancers. Terraform defaults to [] when no public load balancer is enabled.
          id: public_subnet_ids
          immutable: true
          label: Public subnet IDs
          placeholder: subnet-...
          type: string_array
      required: true
    - id: section_cluster
      label: Cluster
      type: section
    - id: name
      immutable: true
      label: Name slug
      type: string
      description: Name for the load balancer and related resources.
      required: true
      default: <<project.given_id>>-<<environment.given_id>>-<<module.given_id>>
      patterns:
        - message: 1-32 lowercase letters, numbers, and hyphens. Start and end with a letter or number.
          pattern: ^[a-z0-9]([a-z0-9-]{0,30}[a-z0-9])?$
    - id: section_domain
      label: Domain
      type: section
    - description: Apps are served one label below it, such as my-app.<domain>. Leave blank to use this module's ID.
      id: ravion_domain_name
      label: Ravion domain
      patterns:
        - message: The subdomain must contain only lowercase letters, numbers, and hyphens, and start and end with a letter or number.
          pattern: ^[a-z0-9]([a-z0-9-]*[a-z0-9])?$
      required: false
      suffix: ".<< platform.apex >>"
      type: string
    - id: domains
      label: Custom domains
      type: string_array
      description: Wildcards in DNS zones you control. Apps are also served one label below each. Ravion issues one certificate for all of them; add the DNS records it provides at your DNS provider.
      add_button_label: Add custom domain
      max_length: 10
      placeholder: "*.apps.example.com"
      patterns:
        - message: Enter a lowercase wildcard domain, *. followed by a domain name of two or more labels, such as *.apps.example.com.
          pattern: '^\*\.([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$'
    - id: ingress_cidr_blocks
      label: Allowed source CIDRs
      type: string_array
      description: IPv4 ranges that may open the apps. Defaults to public internet access. Use an empty list to allow none.
      add_button_label: Add CIDR block
      collapsible: true
      placeholder: 0.0.0.0/0
    - id: section_router
      label: Router
      type: section
    - id: router_instance_type
      label: Router instance type
      type: string
      required: true
      default: t3.micro
      no_options_message: Select a VPC Network, or enter an AWS account and region, to load available EC2 instance types.
      values: $values:aws/ec2/instances?awsAccountId=<<module.input.aws_account_id>>&region=<<module.input.aws_region>>
    - id: section_app_defaults
      label: App defaults
      type: section
    - id: app_cpu
      label: vCPUs
      type: number
      description: Used when an app's ravion-app.yaml sets none, as are the other app defaults.
      required: true
      default: 2
      min: 1
    - id: app_memory
      label: Memory (GiB)
      type: number
      required: true
      default: 4
      min: 1
    - id: app_disk
      label: Disk (GiB)
      type: number
      required: true
      default: 20
      min: 1
    - id: app_idle_timeout
      label: Idle timeout (minutes)
      type: number
      description: Time without a request or a running command before an app is paused. 0 never pauses it.
      required: true
      default: 15
      min: 0
    - id: section_app_limits
      label: App limits
      type: section
    - id: max_cpu
      label: Max vCPUs per app
      type: number
      description: A deploy asking for more than a limit is refused.
      required: true
      default: 8
      min: 1
    - id: max_memory
      label: Max memory per app (GiB)
      type: number
      required: true
      default: 16
      min: 1
    - id: max_disk
      label: Max disk per app (GiB)
      type: number
      required: true
      default: 100
      min: 1
    - id: max_idle_timeout
      label: Max idle timeout (minutes)
      type: number
      description: 0 sets no limit, so an app may also ask never to pause.
      required: true
      default: 1440
      min: 0
    - id: retention_days
      label: Disk kept while paused (days)
      type: number
      description: After it, a paused app's disk is deleted and the app stays stopped until its next deploy.
      required: true
      default: 7
      min: 1
      max: 30
    - $include: ../../partials/inputs/misc-section.yml
    - $include: ../../partials/inputs/tags.yml
    - $include: ../../partials/inputs/terraform-settings.yml
  stack:
    $template: ../../partials/templates/opentofu-stack.yml
    with:
      base_path: compute/app_cluster
      terraform_variables:
        ...overrides: << module.input.advanced_terraform_variables >>
        domains: << module.input.domains || [] >>
        ingress_cidr_blocks: '<< module.input.ingress_cidr_blocks != nil ? module.input.ingress_cidr_blocks : ["0.0.0.0/0"] >>'
        module_instance_id: << module.id >>
        name: << module.input.name >>
        public_subnet_ids: << module.input.public_subnet_ids >>
        ravion_aws_account_id: << module.input.aws_account_id >>
        ravion_domain_name: << module.input.ravion_domain_name >>
        region: << module.input.aws_region >>
        router_subnet_ids: << module.input.private_subnet_ids >>
        tags:
          $include: ../../partials/stack/ravion-tags.yml
        vpc_id: << module.input.vpc_id >>
  apps:
    executionEnvironmentId: << module.input.execution_environment_id >>
    awsAccountId: << module.input.aws_account_id >>
    region: << module.output.region >>
    vpcId: << module.input.vpc_id >>
    domain: << module.output.wildcard_domain_name >>
    customDomains: << module.output.custom_domain_apexes >>
    loadBalancer:
      tlsListenerArn: << module.output.tls_listener_arn >>
      dnsName: << module.output.load_balancer_dns_name >>
      zoneId: << module.output.load_balancer_zone_id >>
    router:
      instanceType: << module.input.router_instance_type >>
      subnetIds: << module.output.router_subnet_ids >>
      securityGroupId: << module.output.router_security_group_id >>
      instanceProfileName: << module.output.router_instance_profile_name >>
      trafficTargetGroupArn: << module.output.traffic_target_group_arn >>
      redirectTargetGroupArn: << module.output.redirect_target_group_arn >>
    defaults:
      cpu: << module.input.app_cpu >>
      memoryMib: << module.input.app_memory * 1024 >>
      diskGib: << module.input.app_disk >>
      idleTimeoutSeconds: << module.input.app_idle_timeout * 60 >>
    limits:
      cpu: << module.input.max_cpu >>
      memoryMib: << module.input.max_memory * 1024 >>
      diskGib: << module.input.max_disk >>
      idleTimeoutSeconds: << module.input.max_idle_timeout * 60 >>
      retentionSeconds: << module.input.retention_days * 86400 >>
  ui:
    metrics:
      - id: requests
        name: Requests
        type: line
        source:
          type: cloudwatch
          aws_account_id: << module.input.aws_account_id >>
          region: << module.output.region >>
          namespace: Ravion/AppRouter
          name: Requests
          statistic: Sum
          dimensions:
            Router: << module.id >>
      - id: responses_2xx
        name: 2xx responses
        type: line
        source:
          type: cloudwatch
          aws_account_id: << module.input.aws_account_id >>
          region: << module.output.region >>
          namespace: Ravion/AppRouter
          name: Responses2xx
          statistic: Sum
          dimensions:
            Router: << module.id >>
      - id: responses_3xx
        name: 3xx responses
        type: line
        source:
          type: cloudwatch
          aws_account_id: << module.input.aws_account_id >>
          region: << module.output.region >>
          namespace: Ravion/AppRouter
          name: Responses3xx
          statistic: Sum
          dimensions:
            Router: << module.id >>
      - id: responses_4xx
        name: 4xx responses
        type: line
        source:
          type: cloudwatch
          aws_account_id: << module.input.aws_account_id >>
          region: << module.output.region >>
          namespace: Ravion/AppRouter
          name: Responses4xx
          statistic: Sum
          dimensions:
            Router: << module.id >>
      - id: responses_5xx
        name: 5xx responses
        type: line
        source:
          type: cloudwatch
          aws_account_id: << module.input.aws_account_id >>
          region: << module.output.region >>
          namespace: Ravion/AppRouter
          name: Responses5xx
          statistic: Sum
          dimensions:
            Router: << module.id >>
      - id: latency_average
        name: Latency (avg)
        type: line
        source:
          type: cloudwatch
          aws_account_id: << module.input.aws_account_id >>
          region: << module.output.region >>
          namespace: Ravion/AppRouter
          name: Latency
          statistic: Average
          dimensions:
            Router: << module.id >>
      - id: latency_maximum
        name: Latency (max)
        type: line
        source:
          type: cloudwatch
          aws_account_id: << module.input.aws_account_id >>
          region: << module.output.region >>
          namespace: Ravion/AppRouter
          name: Latency
          statistic: Maximum
          dimensions:
            Router: << module.id >>
      - id: requests_by_hostname
        name: Requests by hostname
        type: line
        source:
          type: cloudwatch
          aws_account_id: << module.input.aws_account_id >>
          region: << module.output.region >>
          namespace: Ravion/AppRouter
          name: Requests
          statistic: Sum
          group_by: Hostname
          dimensions:
            Router: << module.id >>
      - id: responses_5xx_by_hostname
        name: 5xx responses by hostname
        type: line
        source:
          type: cloudwatch
          aws_account_id: << module.input.aws_account_id >>
          region: << module.output.region >>
          namespace: Ravion/AppRouter
          name: Responses5xx
          statistic: Sum
          group_by: Hostname
          dimensions:
            Router: << module.id >>
      - id: unknown_hostname_requests
        name: Unknown hostname requests
        type: line
        source:
          type: cloudwatch
          aws_account_id: << module.input.aws_account_id >>
          region: << module.output.region >>
          namespace: Ravion/AppRouter
          name: UnknownHostnameRequests
          statistic: Sum
          dimensions:
            Router: << module.id >>
      - id: wakes
        name: App wakes
        type: line
        source:
          type: cloudwatch
          aws_account_id: << module.input.aws_account_id >>
          region: << module.output.region >>
          namespace: Ravion/AppRouter
          name: Wakes
          statistic: Sum
          dimensions:
            Router: << module.id >>
      - id: wake_failures
        name: App wake failures
        type: line
        source:
          type: cloudwatch
          aws_account_id: << module.input.aws_account_id >>
          region: << module.output.region >>
          namespace: Ravion/AppRouter
          name: WakeFailures
          statistic: Sum
          dimensions:
            Router: << module.id >>
      - id: wake_duration
        name: App wake duration (avg)
        type: line
        source:
          type: cloudwatch
          aws_account_id: << module.input.aws_account_id >>
          region: << module.output.region >>
          namespace: Ravion/AppRouter
          name: WakeDuration
          statistic: Average
          dimensions:
            Router: << module.id >>
      - id: held_requests
        name: Held requests
        type: line
        source:
          type: cloudwatch
          aws_account_id: << module.input.aws_account_id >>
          region: << module.output.region >>
          namespace: Ravion/AppRouter
          name: HeldRequests
          statistic: Maximum
          dimensions:
            Router: << module.id >>
      - id: open_websockets
        name: Open WebSockets
        type: line
        source:
          type: cloudwatch
          aws_account_id: << module.input.aws_account_id >>
          region: << module.output.region >>
          namespace: Ravion/AppRouter
          name: OpenWebSockets
          statistic: Maximum
          dimensions:
            Router: << module.id >>
      - id: routes
        name: Routes
        type: line
        source:
          type: cloudwatch
          aws_account_id: << module.input.aws_account_id >>
          region: << module.output.region >>
          namespace: Ravion/AppRouter
          name: Routes
          statistic: Maximum
          dimensions:
            Router: << module.id >>
      - id: control_plane_connected
