      - id: router_resets
        name: Resets sent by the router
        type: line
        source:
          type: cloudwatch
          aws_account_id: << module.input.aws_account_id >>
          region: << module.output.region >>
          namespace: AWS/NetworkELB
          name: TCP_Target_Reset_Count
          statistic: Sum
          dimensions:
            LoadBalancer: << module.output.load_balancer_arn_suffix >>
      - id: load_balancer_resets
        name: Resets sent by the load balancer
        type: line
        source:
          type: cloudwatch
          aws_account_id: << module.input.aws_account_id >>
          region: << module.output.region >>
          namespace: AWS/NetworkELB
          name: TCP_ELB_Reset_Count
          statistic: Sum
          dimensions:
            LoadBalancer: << module.output.load_balancer_arn_suffix >>
      - id: router_memory
        name: Router memory used
        type: line
        source:
          type: cloudwatch
          aws_account_id: << module.input.aws_account_id >>
          region: << module.output.region >>
          namespace: Ravion/AppRouter
          name: MemoryUsedMiB
          statistic: Maximum
          dimensions:
            Router: << module.id >>
      - id: router_instance_cpu
        name: Router instance CPU utilization
        type: line
        source:
          type: cloudwatch
          aws_account_id: << module.input.aws_account_id >>
          region: << module.output.region >>
          namespace: Ravion/AppRouter
          name: RouterInstanceCPUUtilization
          statistic: Maximum
          dimensions:
            Router: << module.id >>
      - id: router_instance_memory
        name: Router instance memory utilization
        type: line
        source:
          type: cloudwatch
          aws_account_id: << module.input.aws_account_id >>
          region: << module.output.region >>
          namespace: Ravion/AppRouter
          name: RouterInstanceMemoryUtilization
          statistic: Maximum
          dimensions:
            Router: << module.id >>
      - id: router_instance_network_in
        name: Router instance network in
        type: line
        source:
          type: cloudwatch
          aws_account_id: << module.input.aws_account_id >>
          region: << module.output.region >>
          namespace: Ravion/AppRouter
          name: RouterInstanceNetworkInBytes
          statistic: Sum
          dimensions:
            Router: << module.id >>
      - id: router_instance_network_out
        name: Router instance network out
        type: line
        source:
          type: cloudwatch
          aws_account_id: << module.input.aws_account_id >>
          region: << module.output.region >>
          namespace: Ravion/AppRouter
          name: RouterInstanceNetworkOutBytes
          statistic: Sum
          dimensions:
            Router: << module.id >>
      - id: hosts_running
        name: Running host minutes
        type: line
        source:
          type: cloudwatch
          aws_account_id: << module.input.aws_account_id >>
          region: << module.output.region >>
          namespace: Ravion/SandboxHost
          name: BusyHosts
          statistic: SampleCount
          dimensions:
            ExecutionEnvironmentId: << module.input.execution_environment_id >>
      - id: hosts_busy
        name: Busy host minutes
        type: line
        source:
          type: cloudwatch
          aws_account_id: << module.input.aws_account_id >>
          region: << module.output.region >>
          namespace: Ravion/SandboxHost
          name: BusyHosts
          statistic: Sum
          dimensions:
            ExecutionEnvironmentId: << module.input.execution_environment_id >>

  readme: |
    Runs the apps you deploy with `ravion deploy`, each in its own sandbox on the sandbox pool of an execution environment you choose, and serves them under a managed wildcard domain, and domains of your own, through a Network Load Balancer and a router that wakes a paused app on request.

    ## Overview

    Select a VPC network and an execution environment with a sandbox pool in it, and Ravion provisions the cluster's entry point:

    - A **wildcard domain and certificate** on Ravion's managed apex. Every app address is a hostname one label below it.
    - **Custom domains**, if you add any: wildcards such as `*.apps.example.com` in DNS zones you control, covered by one more certificate.
    - An internet-facing **Network Load Balancer** that terminates TLS with those certificates.
    - A **router** behind the load balancer that sends each hostname to its app. Ravion runs the router instance and replaces it with a new one, launched and ready before the old one stops, when a new router release ships.
    - **Security groups** for the load balancer and the router.

    The apps run in sandboxes on the execution environment's sandbox pool. Requests go from the browser to the load balancer, to the router, to the app's sandbox. They stay inside your AWS account.

    Terraform source: [ravionhq/modules/compute/app_cluster](https://github.com/ravionhq/modules/tree/$local.module_tag/compute/app_cluster)

    ## Execution environment

    The **Execution environment** runs the apps, each in a sandbox on its sandbox pool, and the module's Terraform runs in it too. It must be an AWS execution environment in this module's AWS account, region and VPC, with a sandbox pool; otherwise Ravion deploys no app to the cluster and says which of these it misses. It cannot be changed once the module exists.

    The pool's settings, such as its instance types, markets, warm hosts and max hosts, belong to the execution environment: change them there. Other sandboxes on the same pool share its hosts with the apps.

    ## Deploying apps

    Run `ravion deploy` in an app's folder and choose this cluster. The first deploy of a new name creates the app; later deploys of the same name update it. The Apps tab of this module lists every app.

    | App address | Serves |
    | --- | --- |
    | `<app>.<domain>` | The app's first exposed port |
    | `<app>-<port name>.<domain>` | Each other exposed port |

    `<domain>` is the Ravion domain and each custom domain without its `*.`.

    An app idle for its idle timeout is paused and its disk saved. A request to a paused app is held while the app wakes, then answered. A paused app's disk is kept for **Disk kept while paused**; after it, the disk is deleted and the app stays stopped until its next deploy.

    ## Domains

    **Custom domains** are wildcards such as `*.apps.example.com` in DNS zones you control, at most 10. Ravion issues one certificate for all of them and attaches it to the load balancer beside the Ravion wildcard certificate. The Domains tab lists the records to add at your DNS provider: the certificate's validation records and, for each domain, a record that points it at the load balancer. A custom domain cannot be under Ravion's managed apex.

    An app can also list domains of its own for an exposed port in its `ravion-app.yaml`, such as `shop.example.com`. Ravion requests one certificate per app for them on this cluster's load balancer, and the deploy and the app's page list the records to add. A load balancer listener holds 25 certificates by default, so about 23 apps of one cluster can have domains of their own. Removing a domain from the file, or deleting the app, releases it.

    ## App defaults and limits

    App defaults are the sizes an app gets when its `ravion-app.yaml` sets none. App limits are the most an app may ask for; a deploy asking for more is refused with the limit in the message.

    ## Reaching other resources

    The apps run on the execution environment's sandbox hosts, in its security group. Allow that security group in a database's or another service's security group to let the apps reach it.

    ## Placement and security

    The load balancer is internet-facing in the network's public subnets. Restrict who can open the apps with Allowed source CIDRs. The router runs in the private subnets and needs a NAT gateway for outbound traffic.

    | Security group | Inbound | Outbound |
    | --- | --- | --- |
    | Load balancer | TCP 443 and 80 from the allowed CIDRs | The router's three ports |
    | Router | TCP 8080, 8081 and 8082 from the load balancer's group | TCP 443 to any address; TCP 20000-20999 to the VPC's address ranges |

    No CIDR reaches the router. While the router runs, Ravion adds a rule to the execution environment's security group that admits the router's group on TCP 20000-20999, the ports its sandbox hosts serve apps on, and removes it when the router stops.

    The router's instance role allows it to publish its metrics to CloudWatch, in the `Ravion/AppRouter` namespace only, and adds AWS Systems Manager Session Manager access for operators.

    ## Destroying the cluster

    Delete the cluster's apps first: Ravion refuses to destroy a cluster that has apps. The destroy then stops the router, and Ravion removes the router's rule from the execution environment's security group, before Terraform removes the rest. The execution environment and its sandbox pool stay.

    ## Metrics

    The Metrics tab reads CloudWatch in your account:

    - Router, published every minute: requests, responses by status class, latency average and maximum, requests and 5xx responses per hostname, requests for unknown hostnames, app wakes, wake failures and wake duration, requests held during a wake, open WebSockets, routes, whether the router is connected to Ravion, the router's memory, and the CPU, memory and network use of the instance it runs on.
    - Load balancer: healthy and unhealthy routers, new and active connections, data processed, peak throughput, capacity units, client TLS errors, connections the allowed CIDRs block, and resets by side.
    - Sandbox pool: host minutes running and busy on the execution environment's pool, from the minute each running host reports. They cover the whole pool, hosts running other sandboxes than the apps included.

    Each app's page charts its own sandbox and requests.

    ## Configuration

    | Field | Required | Default | Description |
    | --- | --- | --- | --- |
    | VPC network | Yes | - | Existing rvn-aws-network module instance |
    | Execution environment | Yes | The network's | Its sandbox pool runs the apps; same AWS account, region and VPC as the module |
    | Name slug | Yes | {project}-{env}-{module} | Name for the load balancer, 32 characters max |
    | Ravion domain | No | {module} | Base for app addresses on Ravion's managed apex |
    | Custom domains | No | - | Wildcards such as *.apps.example.com, at most 10 |
    | Allowed source CIDRs | No | 0.0.0.0/0 | Sources allowed to open the apps |
    | Router instance type | Yes | t3.micro | Instance type of the router |
    | vCPUs, memory, disk | Yes | 2, 4 GiB, 20 GiB | App defaults |
    | Idle timeout | Yes | 15 minutes | App default; 0 never pauses |
    | Max vCPUs, memory, disk per app | Yes | 8, 16 GiB, 100 GiB | App limits |
    | Max idle timeout | Yes | 1440 minutes | App limit; 0 sets none |
    | Disk kept while paused | Yes | 7 days | How long a paused app's disk is kept |
    | Tags | No | Standard Ravion tags | Additional tags applied to resources |
    | Advanced Terraform variables | No | {} | Raw lower-level overrides for exceptional cases |
    | OpenTofu version override | No | Ravion default | Override the OpenTofu version for the stack |
    | Ravion Terraform workspace name | No | {project}-{env}-{module} | Override the state backend workspace name |

    ## Design decisions

    - TLS ends at the load balancer with certificates Ravion issues and renews. The router receives plain HTTP/1.1, and WebSocket upgrades pass through.
    - Port 80 reaches the router, which redirects to HTTPS. A Network Load Balancer cannot redirect by itself.
    - Ravion runs the router instance, so a new router release reaches the cluster without a stack run.
    - The rule that admits the router to the execution environment's hosts is Ravion's, not the stack's: it exists only while the router runs, so destroying the stack never meets a rule that names the router's group.
    - The load balancer, the router and the hosts use IPv4.
    - The load balancer writes no access logs.

