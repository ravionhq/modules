      - id: open_websockets
        name: Open WebSockets
        type: line
        source:
          type: cloudwatch
          aws_account_id: << module.input.aws_account_id >>
          region: << module.output.region >>
          namespace: Ravion/AppRouter
          name: OpenWebSockets
          statistic: Maximum
          dimensions:
            Router: << module.id >>
      - id: routes
        name: Routes
        type: line
        source:
          type: cloudwatch
          aws_account_id: << module.input.aws_account_id >>
          region: << module.output.region >>
          namespace: Ravion/AppRouter
          name: Routes
          statistic: Maximum
          dimensions:
            Router: << module.id >>
      - id: control_plane_connected
        name: Control plane connected
        type: line
        source:
          type: cloudwatch
          aws_account_id: << module.input.aws_account_id >>
          region: << module.output.region >>
          namespace: Ravion/AppRouter
          name: ControlPlaneConnected
          statistic: Minimum
          dimensions:
            Router: << module.id >>
      - id: healthy_routers
        name: Healthy routers
        type: line
        source:
          type: cloudwatch
          aws_account_id: << module.input.aws_account_id >>
          region: << module.output.region >>
          namespace: AWS/NetworkELB
          name: HealthyHostCount
          statistic: Minimum
          dimensions:
            LoadBalancer: << module.output.load_balancer_arn_suffix >>
            TargetGroup: << module.output.traffic_target_group_arn_suffix >>
      - id: unhealthy_routers
        name: Unhealthy routers
        type: line
        source:
          type: cloudwatch
          aws_account_id: << module.input.aws_account_id >>
          region: << module.output.region >>
          namespace: AWS/NetworkELB
          name: UnHealthyHostCount
          statistic: Maximum
          dimensions:
            LoadBalancer: << module.output.load_balancer_arn_suffix >>
            TargetGroup: << module.output.traffic_target_group_arn_suffix >>
      - id: new_connections
        name: New connections
        type: line
        source:
          type: cloudwatch
          aws_account_id: << module.input.aws_account_id >>
          region: << module.output.region >>
          namespace: AWS/NetworkELB
          name: NewFlowCount
          statistic: Sum
          dimensions:
            LoadBalancer: << module.output.load_balancer_arn_suffix >>
      - id: active_connections
        name: Active connections
        type: line
        source:
          type: cloudwatch
          aws_account_id: << module.input.aws_account_id >>
          region: << module.output.region >>
          namespace: AWS/NetworkELB
          name: ActiveFlowCount
          statistic: Average
          dimensions:
            LoadBalancer: << module.output.load_balancer_arn_suffix >>
      - id: data_processed
        name: Data processed
        type: line
        source:
          type: cloudwatch
          aws_account_id: << module.input.aws_account_id >>
          region: << module.output.region >>
          namespace: AWS/NetworkELB
          name: ProcessedBytes
          statistic: Sum
          dimensions:
            LoadBalancer: << module.output.load_balancer_arn_suffix >>
      - id: peak_throughput
        name: Peak throughput
        type: line
        source:
          type: cloudwatch
          aws_account_id: << module.input.aws_account_id >>
          region: << module.output.region >>
          namespace: AWS/NetworkELB
          name: PeakBytesPerSecond
          statistic: Maximum
          dimensions:
            LoadBalancer: << module.output.load_balancer_arn_suffix >>
      - id: capacity_units
        name: Load balancer capacity units
        type: line
        source:
          type: cloudwatch
          aws_account_id: << module.input.aws_account_id >>
          region: << module.output.region >>
          namespace: AWS/NetworkELB
          name: ConsumedLCUs
          statistic: Sum
          dimensions:
            LoadBalancer: << module.output.load_balancer_arn_suffix >>
      - id: client_tls_errors
        name: Client TLS negotiation errors
        type: line
        source:
          type: cloudwatch
          aws_account_id: << module.input.aws_account_id >>
          region: << module.output.region >>
          namespace: AWS/NetworkELB
          name: ClientTLSNegotiationErrorCount
          statistic: Sum
          dimensions:
            LoadBalancer: << module.output.load_balancer_arn_suffix >>
      - id: blocked_connections
        name: Connections blocked by ingress CIDRs
        type: line
        source:
          type: cloudwatch
          aws_account_id: << module.input.aws_account_id >>
          region: << module.output.region >>
          namespace: AWS/NetworkELB
          name: SecurityGroupBlockedFlowCount_Inbound_TCP
          statistic: Sum
          dimensions:
            LoadBalancer: << module.output.load_balancer_arn_suffix >>
      - id: client_resets
        name: Resets sent by clients
        type: line
        source:
          type: cloudwatch
          aws_account_id: << module.input.aws_account_id >>
          region: << module.output.region >>
          namespace: AWS/NetworkELB
          name: TCP_Client_Reset_Count
          statistic: Sum
          dimensions:
            LoadBalancer: << module.output.load_balancer_arn_suffix >>
      - id: router_resets
        name: Resets sent by the router
        type: line
        source:
          type: cloudwatch
          aws_account_id: << module.input.aws_account_id >>
          region: << module.output.region >>
          namespace: AWS/NetworkELB
          name: TCP_Target_Reset_Count
          statistic: Sum
          dimensions:
            LoadBalancer: << module.output.load_balancer_arn_suffix >>
      - id: load_balancer_resets
        name: Resets sent by the load balancer
        type: line
        source:
          type: cloudwatch
          aws_account_id: << module.input.aws_account_id >>
          region: << module.output.region >>
          namespace: AWS/NetworkELB
          name: TCP_ELB_Reset_Count
          statistic: Sum
          dimensions:
            LoadBalancer: << module.output.load_balancer_arn_suffix >>
      - id: router_memory
        name: Router memory used
        type: line
        source:
          type: cloudwatch
          aws_account_id: << module.input.aws_account_id >>
          region: << module.output.region >>
          namespace: Ravion/AppRouter
          name: MemoryUsedMiB
          statistic: Maximum
          dimensions:
            Router: << module.id >>
      - id: hosts_running
        name: Running host minutes
        type: line
        source:
          type: cloudwatch
          aws_account_id: << module.input.aws_account_id >>
          region: << module.output.region >>
          namespace: Ravion/SandboxHost
          name: BusyHosts
          statistic: SampleCount
          dimensions:
            ExecutionEnvironmentId: << module.output.execution_environment_id >>
      - id: hosts_busy
        name: Busy host minutes
        type: line
        source:
          type: cloudwatch
          aws_account_id: << module.input.aws_account_id >>
          region: << module.output.region >>
          namespace: Ravion/SandboxHost
          name: BusyHosts
          statistic: Sum
          dimensions:
            ExecutionEnvironmentId: << module.output.execution_environment_id >>

  readme: |
    Runs the apps you deploy with `ravion deploy`, each in its own sandbox on hosts in your VPC, and serves them under a managed wildcard domain through a Network Load Balancer and a router that wakes a paused app on request.

    ## Overview

    Select a VPC network and Ravion provisions everything the cluster's apps run on:

    - A **sandbox pool** for the cluster. Ravion launches its hosts in the network's private subnets when apps need room, and each app runs in its own sandbox on them.
    - A **wildcard domain and certificate** on Ravion's managed apex. Every app address is a hostname one label below it.
    - An internet-facing **Network Load Balancer** that terminates TLS with that certificate.
    - A **router** behind the load balancer that sends each hostname to its app. Ravion runs the router instance and replaces it with a new one, launched and ready before the old one stops, when a new router release ships.
    - **Security groups** for the load balancer, the router and the sandbox hosts. Only the router reaches the hosts.

    Requests go from the browser to the load balancer, to the router, to the app's sandbox. They stay inside your AWS account.

    Terraform source: [ravionhq/modules/compute/app_cluster](https://github.com/ravionhq/modules/tree/$local.module_tag/compute/app_cluster)

    ## Deploying apps

    Run `ravion deploy` in an app's folder and choose this cluster. The first deploy of a new name creates the app; later deploys of the same name update it. The Apps tab of this module lists every app.

    | App address | Serves |
    | --- | --- |
    | `<app>.<domain>` | The app's first exposed port |
    | `<app>-<port name>.<domain>` | Each other exposed port |

    An app idle for its idle timeout is paused and its disk saved. A request to a paused app is held while the app wakes, then answered. A paused app's disk is kept for **Disk kept while paused**; after it, the disk is deleted and the app stays stopped until its next deploy.

    ## Hosts

    Instance types lists the types the pool may launch. Leave it empty to let Ravion choose from the region's c8id, m8id, r8id, i7i, and i7ie types that support nested virtualization.

    Warm hosts keeps hosts parked and ready for the next deploy or wake. With none, the first deploy after a quiet period waits a minute or two for a host to launch.

    Max hosts caps the hosts the pool runs at once, parked hosts included.

    ## App defaults and limits

    App defaults are the sizes an app gets when its `ravion-app.yaml` sets none. App limits are the most an app may ask for; a deploy asking for more is refused with the limit in the message.

    ## Reaching other resources

    The sandbox hosts run in the security group in the **Sandbox host security group ID** output. Allow it in a database's or another service's security group to let the apps reach it.

    ## Placement and security

    The load balancer is internet-facing in the network's public subnets. Restrict who can open the apps with Allowed source CIDRs. The router and the sandbox hosts run in the private subnets and need a NAT gateway for outbound traffic.

    | Security group | Inbound | Outbound |
    | --- | --- | --- |
    | Load balancer | TCP 443 and 80 from the allowed CIDRs | The router's three ports |
    | Router | TCP 8080, 8081 and 8082 from the load balancer's group | TCP 443 to any address; TCP 20000-20999 to the sandbox hosts' group |
    | Sandbox hosts | TCP 20000-20999 from the router's group | Any IPv4 address |

    No CIDR reaches the router or the hosts. The rule that admits the router to the hosts belongs to this module's stack, so destroying the stack removes it.

    The router's instance role allows it to publish its metrics to CloudWatch, in the `Ravion/AppRouter` namespace only, and adds AWS Systems Manager Session Manager access for operators.

    ## Destroying the cluster

    Delete the cluster's apps first: Ravion refuses to delete the sandbox pool while it runs sandboxes, so a destroy with apps fails.

    ## Metrics

    The Metrics tab reads CloudWatch in your account:

    - Router, published every minute: requests, responses by status class, latency average and maximum, requests and 5xx responses per hostname, requests for unknown hostnames, app wakes, wake failures and wake duration, requests held during a wake, open WebSockets, routes, whether the router is connected to Ravion, and the router's memory.
    - Load balancer: healthy and unhealthy routers, new and active connections, data processed, peak throughput, capacity units, client TLS errors, connections the allowed CIDRs block, and resets by side.
    - Sandbox pool: host minutes running and busy, from the minute each running host reports.

    Each app's page charts its own sandbox and requests.

    ## Configuration

    | Field | Required | Default | Description |
    | --- | --- | --- | --- |
    | VPC network | Yes | - | Existing rvn-aws-network module instance |
    | Name slug | Yes | {project}-{env}-{module} | Name for the load balancer, 32 characters max |
    | Ravion domain | No | {module} | Base for app addresses on Ravion's managed apex |
    | Allowed source CIDRs | No | 0.0.0.0/0 | Sources allowed to open the apps |
    | Instance types | No | Ravion's choice | Host instance types, each with its root volume |
    | Markets | Yes | On-demand | On-demand, and Spot if wanted |
    | Warm hosts | Yes | None | Hosts kept parked and ready |
    | Max hosts | Yes | 10 | Most hosts the pool runs at once |
    | Router instance type | Yes | t3.micro | Instance type of the router |
    | vCPUs, memory, disk | Yes | 2, 4 GiB, 20 GiB | App defaults |
    | Idle timeout | Yes | 15 minutes | App default; 0 never pauses |
    | Max vCPUs, memory, disk per app | Yes | 8, 16 GiB, 100 GiB | App limits |
    | Max idle timeout | Yes | 1440 minutes | App limit; 0 sets none |
    | Disk kept while paused | Yes | 7 days | How long a paused app's disk is kept |
    | Tags | No | Standard Ravion tags | Additional tags applied to resources |
    | Advanced Terraform variables | No | {} | Raw lower-level overrides for exceptional cases |
    | OpenTofu version override | No | Ravion default | Override the OpenTofu version for the stack |
    | Ravion Terraform workspace name | No | {project}-{env}-{module} | Override the state backend workspace name |

    ## Design decisions

    - TLS ends at the load balancer with a certificate Ravion issues and renews. The router receives plain HTTP/1.1, and WebSocket upgrades pass through.
    - Port 80 reaches the router, which redirects to HTTPS. A Network Load Balancer cannot redirect by itself.
    - Ravion runs the router instance, so a new router release reaches the cluster without a stack run.
    - The load balancer, the router and the hosts use IPv4.
    - The load balancer writes no access logs.

