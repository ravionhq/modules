          aws_account_id: << module.input.aws_account_id >>
          region: << module.output.region >>
          namespace: AWS/NetworkELB
          name: PeakBytesPerSecond
          statistic: Maximum
          dimensions:
            LoadBalancer: << module.output.load_balancer_arn_suffix >>
      - id: capacity_units
        name: Load balancer capacity units
        type: line
        source:
          type: cloudwatch
          aws_account_id: << module.input.aws_account_id >>
          region: << module.output.region >>
          namespace: AWS/NetworkELB
          name: ConsumedLCUs
          statistic: Sum
          dimensions:
