          aws_account_id: << module.input.aws_account_id >>
          region: << module.output.region >>
          namespace: Ravion/AppRouter
          name: ControlPlaneConnected
          statistic: Minimum
          dimensions:
            Router: << module.id >>
      - id: healthy_routers
        name: Healthy routers
        type: line
        source:
          type: cloudwatch
          aws_account_id: << module.input.aws_account_id >>
          region: << module.output.region >>
          namespace: AWS/NetworkELB
          name: HealthyHostCount
          statistic: Minimum
          dimensions:
            LoadBalancer: << module.output.load_balancer_arn_suffix >>
            TargetGroup: << module.output.traffic_target_group_arn_suffix >>
      - id: unhealthy_routers
        name: Unhealthy routers
        type: line
        source:
          type: cloudwatch
          aws_account_id: << module.input.aws_account_id >>
          region: << module.output.region >>
          namespace: AWS/NetworkELB
          name: UnHealthyHostCount
          statistic: Maximum
          dimensions:
            LoadBalancer: << module.output.load_balancer_arn_suffix >>
            TargetGroup: << module.output.traffic_target_group_arn_suffix >>
      - id: new_connections
