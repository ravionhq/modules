definition:
  type: rvn-ecs-web
  name: ECS Web Service
  description: Web server ECS service for running an HTTP application behind an ECS cluster load balancer.
release:
  version: 2.0.0
  description: >-
    Support ECS clusters with multiple public and private load balancers. Adds
    public/private load balancer selectors under the cluster reference; the
    service uses the selected load balancer's listeners and security group, and
    defaults to the cluster's first load balancer when none is selected.
module:
  inputs:
    - id: section_cluster
      label: ECS cluster
      type: section
    - id: cluster
      immutable: true
      label: ECS cluster
      type: $ref:rvn-ecs-cluster
      mapped_inputs:
        - $include: ../../partials/inputs/ecs-service-cluster-common-mapped-inputs.yml
        - $include: ../../partials/inputs/ecs-service-cluster-alb-mapped-inputs.yml
        - id: public_alb_name
          label: Public load balancer
          type: string
          description: Which of the cluster's public load balancers this service uses. Defaults to the first one when unset; a name that no longer exists on the cluster fails the deployment instead of silently using another load balancer.
          required: false
          show_when:
            public_web_service_enabled: true
          values: $values:ravion/module_input_options?module_type=rvn-ecs-cluster&module_instance_id=<<module.input.cluster>>&input=public_albs&value_field=name
        - id: private_alb_name
          label: Private load balancer
          type: string
          description: Which of the cluster's private load balancers this service uses. Defaults to the first one when unset; a name that no longer exists on the cluster fails the deployment instead of silently using another load balancer.
          required: false
          show_when:
            public_web_service_enabled: false
          values: $values:ravion/module_input_options?module_type=rvn-ecs-cluster&module_instance_id=<<module.input.cluster>>&input=private_albs&value_field=name
      required: true
    - id: section_service
      label: Web service
      type: section
    - id: name
      immutable: true
      label: Service name
      type: string
      description: Name for the ECS service and related resources.
      required: true
      default: <<project.given_id>>-<<environment.given_id>>-<<module.given_id>>
      patterns:
        - message: Use 1-255 letters, numbers, underscores, or hyphens, starting with a letter or number.
          pattern: ^[A-Za-z0-9][A-Za-z0-9_-]{0,254}$
    - id: public_web_service_enabled
      label: Public web service
      type: boolean
      description: Expose this service through the public ALB. Turn off to use the private ALB.
      default: true
    - $include: ../../partials/inputs/private-subnet-placement.yml
    - $include: ../../partials/inputs/ecs-service-build-inputs.yml
    - id: section_deployment
      label: Deployment
      type: section
    - id: deployment_strategy
      label: Deployment strategy
      type: string
      description: Choose how traffic moves from the current deployment to the new deployment.
      required: true
      default: rolling
      values:
        - label: Rolling
          description: Replace tasks in place while the service keeps serving from the production target group.
          value: rolling
        - label: Blue/green
          description: Start the new deployment on the alternate target group, then shift production traffic after test validation.
          value: blue_green
        - label: Linear
          description: Shift production traffic to the new deployment in equal percentage steps with a wait between steps.
          value: linear
        - label: Canary
          description: Send a small percentage of production traffic to the new deployment first, then shift the rest after the canary bake time.
          value: canary
    - id: deployment_bake_time_in_minutes
      label: Bake time in minutes
      type: number
      description: Minutes to keep the current and new deployments running after production traffic has fully shifted, before the old deployment is removed.
      max: 1440
      min: 0
      show_when:
        deployment_strategy:
          - blue_green
          - linear
          - canary
      default: 10
    - id: linear_step_percentage
      label: Linear step percentage
      type: number
      description: Percentage of production traffic to move to the new deployment at each linear step.
      max: 100
      min: 1
      show_when:
        deployment_strategy: linear
      default: 20
    - id: linear_step_bake_time_in_minutes
      label: Linear step bake time in minutes
      type: number
      description: Minutes to wait between linear traffic steps before shifting the next percentage.
      max: 1440
      min: 0
      show_when:
        deployment_strategy: linear
      default: 5
    - id: canary_percent
      label: Canary percent
      type: number
      description: Percentage of production traffic to send to the new deployment during the canary phase.
      max: 100
      min: 1
      show_when:
        deployment_strategy: canary
      default: 5
    - id: canary_bake_time_in_minutes
      label: Canary bake time in minutes
      type: number
      description: Minutes to hold canary traffic before shifting the remaining production traffic to the new deployment.
      max: 1440
      min: 0
      show_when:
        deployment_strategy: canary
      default: 10
    - id: deployment_pause_stages
      label: Manual approval gates
      type: object_array
      description: Optional gates that pause the deployment at chosen lifecycle stages until you approve it. Applies only to the blue/green, linear, and canary strategies.
      collapsible: true
      item_inputs:
        - id: stage
          label: Stage
          type: string
          description: Deployment lifecycle stage at which to pause and wait for manual approval.
          default: POST_TEST_TRAFFIC_SHIFT
          values:
            - label: Reconcile service
              description: Pause during service reconciliation, before ECS finalizes the deployment.
              value: RECONCILE_SERVICE
            - label: Pre scale up
              description: Pause before the new task set scales up.
              value: PRE_SCALE_UP
            - label: Post scale up
              description: Pause after the new task set has scaled up and become healthy.
              value: POST_SCALE_UP
            - label: Post test traffic shift
              description: Pause after test traffic is shifted to the new (green) tasks, so you can validate them before production traffic moves.
              value: POST_TEST_TRAFFIC_SHIFT
            - label: Pre production traffic shift
              description: Pause before production traffic begins shifting to the new tasks.
              value: PRE_PRODUCTION_TRAFFIC_SHIFT
            - label: Post production traffic shift
              description: Pause after production traffic has fully shifted to the new tasks, before the old tasks are removed.
              value: POST_PRODUCTION_TRAFFIC_SHIFT
        - id: timeout_in_minutes
          label: Timeout (minutes)
          type: number
          description: Minutes to wait for manual approval before the timeout action runs. Matches the AWS default of 1,440 minutes (24 hours).
          max: 20160
          min: 1
          required: true
          default: 1440
        - id: timeout_action
          label: On timeout
          type: string
          description: Action to take if approval is not given before the timeout elapses. Defaults to rolling back.
          required: true
          default: ROLLBACK
          values:
            - label: Roll back
              description: Roll the deployment back to the previous revision.
              value: ROLLBACK
            - label: Continue
              description: Proceed with the deployment as if it were approved.
              value: CONTINUE
      item_label: Pause stage
      item_title:
        template: "{stage}"
      item_description: "Timeout: {timeout_in_minutes} minutes / {timeout_action}"
      show_when:
        deployment_strategy:
          - blue_green
          - linear
          - canary
      default:
        - stage: POST_TEST_TRAFFIC_SHIFT
          timeout_in_minutes: 1440
          timeout_action: ROLLBACK
    - id: section_health
      label: Health check
      type: section
    - id: container_port
      immutable: true
      label: Container port
      type: number
      description: Port the web container listens on.
      max: 65535
      min: 1
      required: true
      default: 80
    - id: health_check_path
      label: Health check path
      type: string
      description: HTTP path the load balancer calls to verify the web server is healthy. Use a lightweight endpoint that does not require authentication.
      required: true
      default: /
    - id: health_check_matcher
      label: Success codes
      type: string
      description: HTTP status code matcher for successful health checks. Defaults to 200-399 so redirects and common successful responses are accepted.
      collapsible: true
      placeholder: 200-399
      required: true
      default: 200-399
    - id: health_check_interval
      label: Interval (secs)
      type: number
      description: Seconds between load balancer health checks. Lower values detect failures faster but send more health-check traffic.
      collapsible: true
      max: 300
      min: 5
      default: 5
    - id: health_check_timeout
      label: Timeout (secs)
      type: number
      description: Seconds to wait for the health-check response before marking that check as failed. Must be lower than the interval.
      collapsible: true
      max: 120
      min: 2
      default: 4
    - id: healthy_threshold
      label: Healthy threshold
      type: number
      description: Number of consecutive successful checks required before an unhealthy target is considered healthy.
      collapsible: true
      max: 10
      min: 2
      default: 2
    - id: unhealthy_threshold
      label: Unhealthy threshold
      type: number
      description: Number of consecutive failed checks required before a target is considered unhealthy.
      collapsible: true
      max: 10
      min: 2
      default: 2
    - id: health_check_grace_period_seconds
      label: Health check grace period (secs)
      type: number
      description: Seconds ECS ignores failing load balancer health checks after a task starts. Increase this for apps with slow boot times.
      collapsible: true
      min: 0
      default: 0
    - id: target_group_slow_start
      label: Slow start duration (secs)
      type: number
      description: Gradually ramps traffic to newly registered targets. Use 0 to disable.
      collapsible: true
      max: 900
      min: 0
      default: 0
    - id: target_group_stickiness_enabled
      label: Sticky sessions
      type: boolean
      description: Enable load balancer cookie stickiness so repeat requests are routed to the same task when possible. When enabled, traffic-shift deployments also keep clients on the first production or alternate target group they reach.
      collapsible: true
      default: true
    - id: target_group_stickiness_type
      label: Stickiness type
      type: string
      collapsible: true
      show_when:
        target_group_stickiness_enabled: true
      default: lb_cookie
      values:
        - label: Load balancer cookie
          value: lb_cookie
        - label: Application cookie
          value: app_cookie
    - id: target_group_stickiness_cookie_duration
      label: Stickiness cookie duration (secs)
      type: number
      collapsible: true
      max: 604800
      min: 1
      show_when:
        target_group_stickiness_enabled: true
      default: 86400
    - id: target_group_stickiness_cookie_name
      label: Application cookie name
      type: string
      collapsible: true
      required: false
      show_when:
        target_group_stickiness_type: app_cookie
    - $template: ../../partials/templates/alb-listener-rule-inputs.yml
      with:
        field_overrides: {}
    - $include: ../../partials/inputs/ecs-service-capacity-inputs.yml
    - $include: ../../partials/inputs/ecs-service-autoscaling-inputs.yml
    - $template: ../../partials/templates/ecs-service-runtime-env-inputs.yml
      with:
        environment_variables_description: Runtime environment variables passed to the app container. PORT is added automatically from the container port setting.
    - $include: ../../partials/inputs/ecs-service-deploy-command-inputs.yml
    - $include: ../../partials/inputs/ecs-service-logging-iam-networking-inputs.yml
    - $include: ../../partials/inputs/ecs-service-efs-inputs.yml
    - $include: ../../partials/inputs/ecs-service-builder-ecr-misc-inputs.yml
  stack:
    type: opentofu
    ravion_state_backend_workspace: >-
      << module.input.ravion_state_backend_workspace || project.given_id + "-" + environment.given_id + "-"
      + module.given_id + "-" + stack.id>>
    pipelines:
      defaults:
        input:
          aws_account_id: "<< module.input.execution_environment_id ? null : module.input.aws_account_id >>"
          aws_region: "<< module.input.execution_environment_id ? null : module.input.aws_region >>"
          base_path: compute/ecs_service
          branch: main
          execution_environment_id: << module.input.execution_environment_id >>
          ref: $local.module_tag
          repo: https://github.com/flightcontrolhq/modules
          stack_id: <<stack.id>>
          terraform_variables:
            $merge:
              - ../../partials/stack/ecs-service-common-terraform-variables.yml
              - container_port: << module.input.container_port >>
                health_check_grace_period_seconds: << module.input.health_check_grace_period_seconds >>
                load_balancer_attachment:
                  $template: ../../partials/templates/alb-load-balancer-attachment.yml
                  with:
                    additional_fields:
                      container_port: << module.input.container_port >>
                    attachment_control:
                      enabled: true
                    listener_arn: >-
                      << module.input.public_web_service_enabled ?
                      ((module.input.public_alb_name || "") == "" ?
                      (module.input.public_alb_https_listener_arn || module.input.public_alb_http_listener_arn) :
                      (get(get(module.input.public_albs_by_name, module.input.public_alb_name), "https_listener_arn") ||
                      get(get(module.input.public_albs_by_name, module.input.public_alb_name), "http_listener_arn"))) :
                      ((module.input.private_alb_name || "") == "" ?
                      (module.input.private_alb_https_listener_arn || module.input.private_alb_http_listener_arn) :
                      (get(get(module.input.private_albs_by_name, module.input.private_alb_name), "https_listener_arn") ||
                      get(get(module.input.private_albs_by_name, module.input.private_alb_name), "http_listener_arn"))) >>
                    target_group:
                      health_check:
                        enabled: true
                        healthy_threshold: << module.input.healthy_threshold >>
                        interval: << module.input.health_check_interval >>
                        matcher: << module.input.health_check_matcher >>
                        path: << module.input.health_check_path >>
                        timeout: << module.input.health_check_timeout >>
                        unhealthy_threshold: << module.input.unhealthy_threshold >>
                      port: << module.input.container_port >>
                      protocol: HTTP
                      slow_start: << module.input.target_group_slow_start >>
                      stickiness:
                        cookie_duration: << module.input.target_group_stickiness_cookie_duration >>
                        cookie_name: '<< module.input.target_group_stickiness_type == "app_cookie" ? module.input.target_group_stickiness_cookie_name : nil >>'
                        enabled: << module.input.target_group_stickiness_enabled >>
                        # Fall back to lb_cookie when stickiness is disabled: the type input is hidden
                        # (show_when) and renders null, but the Terraform variable validation and the
                        # aws_lb_target_group stickiness block both require a non-null type.
                        type: '<< module.input.target_group_stickiness_enabled ? module.input.target_group_stickiness_type : "lb_cookie" >>'
                      target_type: ip
                load_balancer_security_group_id: >-
                  << module.input.public_web_service_enabled ?
                  ((module.input.public_alb_name || "") == "" ?
                  module.input.public_alb_security_group_id :
                  get(get(module.input.public_albs_by_name, module.input.public_alb_name), "security_group_id")) :
                  ((module.input.private_alb_name || "") == "" ?
                  module.input.private_alb_security_group_id :
                  get(get(module.input.private_albs_by_name, module.input.private_alb_name), "security_group_id")) >>
          tool: opentofu
          tool_version: << module.input.opentofu_version || defaults.opentofu_version >>
        variant: standard
      change:
        pipeline_id: << defaults.change_pipeline_id >>
      destroy:
        pipeline_id: << defaults.destroy_pipeline_id >>
  build:
    $include: ../../partials/build/ecs-service-image-build.yml
  deploy:
    $merge:
      - ../../partials/deploy/ecs-service-deploy-common.yml
    strategy: |
      <<
      module.input.deployment_strategy == "rolling" ? nil :
      module.input.deployment_strategy == "blue_green" ? {
        "type": "blue_green",
        "bake_time_in_minutes": module.input.deployment_bake_time_in_minutes,
        "pause_stages": module.input.deployment_pause_stages
      } :
      module.input.deployment_strategy == "linear" ? {
        "type": "linear",
        "bake_time_in_minutes": module.input.deployment_bake_time_in_minutes,
        "pause_stages": module.input.deployment_pause_stages,
        "linear": {
          "step_percentage": module.input.linear_step_percentage,
          "step_bake_time_in_minutes": module.input.linear_step_bake_time_in_minutes
        }
      } : {
        "type": "canary",
        "bake_time_in_minutes": module.input.deployment_bake_time_in_minutes,
        "pause_stages": module.input.deployment_pause_stages,
        "canary": {
          "canary_percent": module.input.canary_percent,
          "canary_bake_time_in_minutes": module.input.canary_bake_time_in_minutes
        }
      }
      >>
    infrastructure:
      $merge:
        - ../../partials/deploy/ecs-service-deploy-infrastructure-common.yml
        - ecs_target_group_arn: <<stack.output.target_group_arn>>
          # Load-balancer advanced configuration for native traffic-shift
          # strategies (blue_green / linear / canary). The deploy manager
          # attaches these to UpdateService loadBalancers[].advancedConfiguration
          # so ECS can shift traffic between the production and alternate target
          # groups. Null/absent for non-load-balanced services (rolling only).
          ecs_alternate_target_group_arn: <<stack.output.alternate_target_group_arn>>
          ecs_production_listener_rule_arn: <<stack.output.production_listener_rule_arn>>
          ecs_infrastructure_role_arn: <<stack.output.ecs_infrastructure_role_arn>>
          ecs_test_listener_rule_arn: <<stack.output.test_listener_rule_arn>>
    task_definition:
      $merge:
        - ../../partials/deploy/ecs-service-task-definition-common.yml
      container_definitions: >-
        << (module.input.firelens_enabled ? [{"command": (len(module.input.image_start_command)
        > 0 ? module.input.image_start_command : nil), "cpu": (module.input.capacity_provider == "ec2" ?
        int(float(module.input.task_cpu) * 1024) : int(float(module.input.fargate_size.vcpu) * 1024)),
        "depends_on": [{"container_name": "log_router", "condition": "START"}], "environment": ([{name:
        "PORT", value: string(module.input.container_port)}] | concat(module.input.environment_variables !=
        nil ? module.input.environment_variables : [])), "essential": true, "image":
        (module.input.build_source == "image_registry" ? (deploy.input.image_ref contains
        "sha256:" ? module.input.image_repository + "@" + deploy.input.image_ref :
        module.input.image_repository + ":" + deploy.input.image_ref) : (deploy.input.image_ref contains
        "sha256:" ? stack.output.ecr_repository_url + "@" + deploy.input.image_ref :
        stack.output.ecr_repository_url + ":" + deploy.input.image_ref)), "linux_parameters":
        {"init_process_enabled": true}, "log_configuration": {"log_driver": "awsfirelens"}, "memory":
        (module.input.capacity_provider == "ec2" ? int(float(module.input.task_memory) * 1024) :
        int(float(module.input.fargate_size.memory_gb) * 1024)), "mount_points":
        (module.input.efs_enabled ? [{"source_volume": "efs", "container_path":
        module.input.efs_mount_path, "read_only": module.input.efs_read_only}] : []), "name":
        (stack.output.container_name),
        "port_mappings": [{"app_protocol": "http", "container_port": (module.input.container_port),
        "protocol": "tcp"}], "readonly_root_filesystem": false, "repository_credentials":
        (module.input.image_registry_credentials_secret_arn ? {credentials_parameter:
        module.input.image_registry_credentials_secret_arn} : nil), "secrets": (module.input.secrets),
        "stop_timeout": 30}, {"name": "log_router", "image": module.input.firelens_image, "cpu": 0,
        "memory_reservation": 51, "essential": true, "environment": ([{name: "FIRELENS_CONFIG_CONTENT",
        value: "[SERVICE]\n    Flush 1\n    Grace 30\n\n" + (module.input.firelens_config ?
        module.input.firelens_config + "\n" : "") + (module.input.firelens_cloudwatch_output_enabled ?
        "\n[OUTPUT]\n    Name cloudwatch\n    Match *\n    region " + stack.output.region +
        "\n    log_group_name " + stack.output.log_group_name +
        "\n    auto_create_group true\n    log_stream_prefix " + stack.output.log_stream_prefix +
        "/\n    retry_limit 2\n    log_key log\n    log_format json/emf\n" : "")}] |
        concat(module.input.firelens_environment_variables != nil ?
        module.input.firelens_environment_variables : [])), "secrets": module.input.firelens_secrets != nil
        ? module.input.firelens_secrets : [], "command": ["/bin/sh", "-c",
        "printf '%s' \"$FIRELENS_CONFIG_CONTENT\" > /flightcontrol-firelens.conf && exec /entrypoint.sh"],
        "user": "0", "log_configuration": {"log_driver": "awslogs", "options": {"awslogs-group":
        stack.output.log_group_name, "awslogs-region": stack.output.region, "awslogs-stream-prefix":
        stack.output.log_stream_prefix + "/firelens"}}, "firelens_configuration": {"type": "fluentbit",
        "options": {"config-file-type": "file", "config-file-value": "/flightcontrol-firelens.conf",
        "enable-ecs-log-metadata": string(module.input.firelens_ecs_metadata_enabled)}}}] : [{"command":
        (len(module.input.image_start_command) > 0 ? module.input.image_start_command : nil), "cpu":
        (module.input.capacity_provider == "ec2" ? int(float(module.input.task_cpu) * 1024) :
        int(float(module.input.fargate_size.vcpu) * 1024)), "environment": ([{name: "PORT", value:
        string(module.input.container_port)}] | concat(module.input.environment_variables != nil ?
        module.input.environment_variables : [])), "essential": true, "image": (module.input.build_source ==
        "image_registry" ? (deploy.input.image_ref contains "sha256:" ?
        module.input.image_repository + "@" + deploy.input.image_ref : module.input.image_repository +
        ":" + deploy.input.image_ref) : (deploy.input.image_ref contains "sha256:" ?
        stack.output.ecr_repository_url + "@" + deploy.input.image_ref : stack.output.ecr_repository_url +
        ":" + deploy.input.image_ref)), "linux_parameters": {"init_process_enabled": true},
        "log_configuration": {"log_driver": "awslogs", "options": {"awslogs-group":
        stack.output.log_group_name, "awslogs-region": stack.output.region, "awslogs-stream-prefix":
        stack.output.log_stream_prefix}}, "memory": (module.input.capacity_provider == "ec2" ?
        int(float(module.input.task_memory) * 1024) : int(float(module.input.fargate_size.memory_gb) *
        1024)), "mount_points": (module.input.efs_enabled ? [{"source_volume": "efs", "container_path":
        module.input.efs_mount_path, "read_only": module.input.efs_read_only}] : []), "name":
        (stack.output.container_name), "port_mappings": [{"app_protocol": "http",
        "container_port": (module.input.container_port), "protocol": "tcp"}], "readonly_root_filesystem":
        false, "repository_credentials": (module.input.image_registry_credentials_secret_arn ?
        {credentials_parameter: module.input.image_registry_credentials_secret_arn} : nil), "secrets":
        (module.input.secrets), "stop_timeout": 30}]) | concat(module.input.sidecars ? module.input.sidecars
        : []) >>
  ui:
    logs:
      - id: ecs_service_logs
        name: ECS service logs
        source:
          type: cloudwatch
          aws_account_id: << module.input.aws_account_id >>
          region: << stack.output.region >>
          log_group: << stack.output.log_group_name >>
          log_stream_prefix: << stack.output.log_stream_prefix >>
    metrics:
      - $include: ../../partials/ui/ecs-service-common-metrics.yml
      - id: request_count
        name: Request count
        type: line
        source:
          type: cloudwatch
          aws_account_id: << module.input.aws_account_id >>
          dimensions:
            TargetGroup: << stack.output.target_group_arn_suffix >>
            LoadBalancer: >-
              << module.input.public_web_service_enabled ?
              ((module.input.public_alb_name || "") == "" ?
              module.input.public_alb_arn_suffix :
              get(get(module.input.public_albs_by_name, module.input.public_alb_name), "arn_suffix")) :
              ((module.input.private_alb_name || "") == "" ?
              module.input.private_alb_arn_suffix :
              get(get(module.input.private_albs_by_name, module.input.private_alb_name), "arn_suffix")) >>
          name: RequestCount
          namespace: AWS/ApplicationELB
          region: << stack.output.region >>
          statistic: Sum
      - id: target_5xx_errors
        name: 5xx errors
        type: line
        source:
          type: cloudwatch
          aws_account_id: << module.input.aws_account_id >>
          dimensions:
            TargetGroup: << stack.output.target_group_arn_suffix >>
            LoadBalancer: >-
              << module.input.public_web_service_enabled ?
              ((module.input.public_alb_name || "") == "" ?
              module.input.public_alb_arn_suffix :
              get(get(module.input.public_albs_by_name, module.input.public_alb_name), "arn_suffix")) :
              ((module.input.private_alb_name || "") == "" ?
              module.input.private_alb_arn_suffix :
              get(get(module.input.private_albs_by_name, module.input.private_alb_name), "arn_suffix")) >>
          name: HTTPCode_Target_5XX_Count
          namespace: AWS/ApplicationELB
          region: << stack.output.region >>
