      s3_artifact_bucket: >-
        << module.input.package_type == "Zip" ? stack.output.code_bucket_id : nil >>
    definition: >-
      << module.input.lambda_type != "edge" && module.input.package_type == "Image" ? {package_type: "image", image_uri:
      (module.input.build_source == "image_registry" ? (deploy.input.image_ref contains "sha256:" ? module.input.image_repository + "@" +
      deploy.input.image_ref : module.input.image_repository + ":" + deploy.input.image_ref) : (deploy.input.image_ref
      contains "sha256:" ? stack.output.ecr_repository_url + "@" + deploy.input.image_ref : stack.output.ecr_repository_url
