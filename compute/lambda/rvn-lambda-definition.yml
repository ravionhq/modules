      cache_from: {tag: "nixpacks"}} : module.input.build_source == "dockerfile" ? {type:
      "dockerfile", dockerfile: module.input.dockerfile || "Dockerfile", context:
      module.input.dockerfile_context || ".", inject_env_variables_in_dockerfile:
      module.input.dockerfile_environment_variable_injection_enabled, output_directory: module.input.output_directory} :
      module.input.build_source == "nixpacks" ? {type: "nixpacks", install_cmd:
      module.input.nixpacks_install_cmd, build_cmd: module.input.nixpacks_build_cmd,
