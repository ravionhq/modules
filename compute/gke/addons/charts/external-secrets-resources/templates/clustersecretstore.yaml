apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ .Values.name }}
spec:
  provider:
    gcpsm:
      projectID: {{ .Values.projectID | quote }}
      # No auth block: the controller uses its own Workload Identity
      # credentials from the GKE metadata server.
  {{- with .Values.allowedNamespaces }}
  conditions:
    - namespaces:
        {{- toYaml . | nindent 8 }}
  {{- end }}
