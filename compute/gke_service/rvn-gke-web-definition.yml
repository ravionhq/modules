global: true
definition:
  type: rvn-gke-web
  name: GKE Web Service
  description: Web server on GKE for running any HTTP application on your Kubernetes cluster behind a Google Cloud load balancer, with no Kubernetes manifests or Helm charts to write.
release:
  version: 0.1.0
  description: Run an HTTP application on a GKE cluster, built from source into Artifact Registry or pulled from a registry, behind a Google Cloud load balancer with Workload Identity access to Google Cloud APIs.
module:
  inputs:
    - id: section_cluster
      label: GKE cluster
      type: section
    - id: cluster
      immutable: true
      label: Cluster
      type: $ref:rvn-gke-cluster
      mapped_inputs:
        - $include: ../../partials/inputs/gke-workload-cluster-mapped-inputs.yml
        - id: subnetwork
          immutable: true
          label: Subnetwork
          type: string
          description: Subnetwork the private load balancer's address is reserved in.
          collapsible: true
          placeholder: default
          required: false
          default: << ref.stack.output.subnetwork >>
      required: true
    - id: addons
      immutable: true
      label: GKE add-ons
      type: $ref:rvn-gke-addons
      description: Select this cluster's Add-ons module for runtime secrets or KEDA when using Spot burst.
      mapped_inputs:
        - $include: ../../partials/inputs/gke-workload-addons-mapped-inputs.yml
      required: false
    - id: section_service
      label: Web service
      type: section
    - $template: ../../partials/templates/eks-workload-release-inputs.yml
      with:
        name_label: Service name
        name_description: Name for the Helm release, the Kubernetes objects, and the load balancer address.
    - id: load_balancer
      label: Load balancer
      type: string
      description: Cluster only is reachable just from other pods, at `<service name>.<namespace>`.
      required: true
      default: public
      values:
        - label: Public
          description: Global external Application Load Balancer
          value: public
        - label: Private
          description: Regional internal Application Load Balancer, reachable from the VPC. Needs a proxy-only subnet in the region.
          value: private
        - label: Cluster only (no load balancer)
          value: kubernetes_service
    - id: hostnames
      label: Hostnames
      type: string_array
      description: Requests for other hosts are not routed here. Empty accepts every host. Point each name's DNS at the load balancer address.
      add_button_label: Add hostname
      placeholder: app.example.com
      required: false
      show_when:
        load_balancer:
          not: kubernetes_service
      patterns:
        - message: A lowercase hostname, optionally starting with *.
          pattern: ^(\*\.)?[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)*$
    - id: path_prefixes
      label: Path prefixes
      type: string_array
      description: Empty routes every path.
      add_button_label: Add path
      placeholder: /api
      collapsible: true
      required: false
      show_when:
        load_balancer:
          not: kubernetes_service
      patterns:
        - message: A path starting with /.
          pattern: ^/
    - id: gateway_certificate_map_name
      label: Certificate map
      type: string
      description: Certificate Manager certificate map that serves HTTPS. Public load balancers only.
      placeholder: my-app
      collapsible: true
      required: false
      show_when:
        load_balancer: public
    - id: gateway_pre_shared_certificate_names
      label: SSL certificates
      type: string_array
      description: Compute Engine SSL certificates that serve HTTPS; regional ones for a private load balancer.
      add_button_label: Add certificate
      placeholder: my-app-cert
      collapsible: true
      required: false
      show_when:
        load_balancer:
          not: kubernetes_service
    - id: https_redirect_enabled
      label: Redirect HTTP to HTTPS
      type: boolean
      description: Applies once a certificate is configured.
      collapsible: true
      default: true
      show_when:
        load_balancer:
          not: kubernetes_service
    - $include: ../../partials/inputs/eks-workload-build-inputs.yml
    - $include: ../../partials/inputs/gke-workload-image-inputs.yml
    - label: Health check
      id: section_health
      type: section
    - description: Port the application listens on, also set as `PORT`.
      id: container_port
      immutable: true
      label: Container port
      type: number
      max: 65535
      min: 1
      required: true
      default: 8080
    - label: Health check path
      id: health_check_path
      type: string
      description: Unauthenticated endpoint that returns 200 when the app can receive requests. Kubernetes readiness and the load balancer both use this path.
      required: true
      default: /
    - id: health_check_interval
      label: Interval (secs)
      type: number
      description: Seconds between load balancer health checks.
      collapsible: true
      max: 300
      min: 1
      default: 5
      show_when:
        load_balancer:
          not: kubernetes_service
    - id: health_check_timeout
      label: Timeout (secs)
      type: number
      description: Must not exceed the interval.
      collapsible: true
      max: 300
      min: 1
      default: 4
      show_when:
        load_balancer:
          not: kubernetes_service
    - label: Initial delay (secs)
      id: probe_initial_delay_seconds
      type: number
      description: Seconds Kubernetes waits after the container starts or the startup check succeeds before checking traffic readiness or liveness.
      collapsible: true
      max: 600
      min: 0
      default: 0
    - id: readiness_probe_period_seconds
      label: Readiness check interval (secs)
      type: number
      description: Seconds between Kubernetes readiness checks. A pod leaves traffic after about 30 seconds of failed checks at any interval.
      collapsible: true
      max: 300
      min: 1
      default: 1
    - id: health_check_healthy_threshold
      label: Healthy threshold
      type: number
      description: Consecutive successful load balancer checks before a pod receives traffic.
      collapsible: true
      max: 10
      min: 1
      default: 2
      show_when:
        load_balancer:
          not: kubernetes_service
    - id: health_check_unhealthy_threshold
      label: Unhealthy threshold
      type: number
      description: Consecutive failed load balancer checks before a pod stops receiving traffic.
      collapsible: true
      max: 10
      min: 1
      default: 2
      show_when:
        load_balancer:
          not: kubernetes_service
    - id: gateway_draining_timeout_seconds
      label: Connection draining (secs)
      type: number
      description: Seconds the load balancer lets in-flight requests to a stopping pod finish.
      collapsible: true
      max: 3600
      min: 0
      default: 300
      show_when:
        load_balancer:
          not: kubernetes_service
    - id: session_affinity
      label: Session affinity
      type: string
      description: Keep repeat requests on the same pod when possible.
      collapsible: true
      default: none
      show_when:
        load_balancer:
          not: kubernetes_service
      values:
        - label: None
          value: none
        - label: Client IP
          value: CLIENT_IP
        - label: Load balancer cookie
          value: GENERATED_COOKIE
    - id: session_affinity_cookie_ttl_seconds
      label: Cookie duration (secs)
      type: number
      collapsible: true
      min: 1
      default: 86400
      show_when:
        load_balancer:
          not: kubernetes_service
        session_affinity: GENERATED_COOKIE
    - id: section_probes
      label: Startup and liveness
      type: section
    - id: startup_probe_enabled
      label: Enforce startup timeout
      type: boolean
      description: Restart the container if the app does not become responsive in time. A bad path or short timeout can cause a restart loop.
      collapsible: true
      default: false
    - id: startup_timeout_seconds
      label: Maximum startup time (secs)
      type: number
      description: Maximum time the app may take to start before Kubernetes restarts it. Rounded up to the next five-second check.
      collapsible: true
      max: 1500
      min: 5
      show_when:
        startup_probe_enabled: true
      default: 150
    - id: startup_probe_path
      label: Startup health path
      type: string
      description: Endpoint used while the app starts. Leave blank to use the liveness path when set, otherwise the health check path.
      collapsible: true
      required: false
      show_when:
        startup_probe_enabled: true
    - id: liveness_probe_enabled
      label: Restart unresponsive containers
      type: boolean
      description: Restart a running process that stops responding. A dependency-aware path can restart every pod during an outage.
      collapsible: true
      default: false
    - id: liveness_probe_path
      label: Liveness health path
      type: string
      description: Lightweight endpoint that confirms the app process is responsive. Avoid database or external-service checks. Leave blank to use the health check path.
      collapsible: true
      required: false
      show_when:
        liveness_probe_enabled: true
    - $include: ../../partials/inputs/gke-workload-resource-inputs.yml
    - id: section_scaling
      label: Autoscaling
      type: section
    - id: autoscaling_enabled
      label: Autoscaling
      type: boolean
      description: Scale pods with a HorizontalPodAutoscaler. Requires the metrics server or an equivalent metrics API in the cluster.
      show_when:
        spot_burst_enabled:
          not: true
      default: true
    - id: autoscaling_min_replicas
      label: Minimum pods
      type: number
      max: 1000
      min: 1
      show_when:
        autoscaling_enabled: true
        spot_burst_enabled:
          not: true
      default: 2
    - id: autoscaling_max_replicas
      label: Maximum pods
      type: number
      max: 1000
      min: 1
      show_when:
        autoscaling_enabled: true
        spot_burst_enabled:
          not: true
      default: 3
    - id: autoscaling_cpu_target
      label: CPU target (%)
      type: number
      description: Average CPU utilization, as a percentage of the CPU request, the autoscaler aims to hold.
      max: 100
      min: 1
      show_when:
        autoscaling_enabled: true
        spot_burst_enabled:
          not: true
      default: 70
    - id: autoscaling_memory_target
      label: Memory target (%)
      type: number
      description: Optional average memory utilization target, as a percentage of the memory request. Leave blank to scale on CPU alone.
      required: false
      collapsible: true
      max: 100
      min: 1
      show_when:
        autoscaling_enabled: true
        spot_burst_enabled:
          not: true
    - label: Desired pods
      id: replica_count
      type: number
      max: 1000
      min: 0
      show_when:
        autoscaling_enabled: false
        spot_burst_enabled:
          not: true
      default: 2
    - $include: ../../partials/inputs/eks-workload-spot-burst-inputs.yml
    - id: spot_burst_scale_down_window
      label: Scale-down delay (secs)
      type: number
      collapsible: true
      description: Seconds demand must stay lower before the Spot pool starts shrinking. The pool then shrinks gradually rather than all at once.
      max: 3600
      min: 0
      show_when:
        compute_target: on_demand
        spot_burst_enabled: true
      default: 300
    - $include: ../../partials/inputs/eks-workload-spot-burst-scale-down-inputs.yml
    - $include: ../../partials/inputs/gke-workload-runtime-inputs.yml
    - $include: ../../partials/inputs/gke-workload-iam-inputs.yml
    - id: section_deployments
      label: Networking and deployment
      type: section
    - id: rollout_max_surge_percent
      label: Maximum rollout surge (%)
      type: number
      description: Extra pods Kubernetes may create during a rolling update, as a percentage of the desired count. Use 100 to create a full replacement set at once when the cluster has enough spare capacity. Zero-unavailable rollout protection remains enabled.
      collapsible: true
      max: 100
      min: 1
      default: 100
    - id: termination_grace_period_seconds
      label: Stop timeout (secs)
      type: number
      description: Seconds a pod has to finish in-flight requests after SIGTERM before it is killed, including the pre-stop delay below. Raise this for services that move long-lived connections such as WebSockets to other pods on shutdown.
      collapsible: true
      max: 3600
      min: 0
      default: 30
    - description: Seconds a stopping pod keeps serving before SIGTERM, so the load balancer stops sending it new connections first. 0 turns it off. Must be less than the stop timeout.
      id: pre_stop_sleep_seconds
      label: Pre-stop delay (secs)
      type: number
      collapsible: true
      max: 3599
      min: 0
      default: 10
    - id: pod_disruption_budget_enabled
      label: Disruption budget
      type: boolean
      description: Limit how many pods node drains, consolidation and cluster upgrades may evict at once. Takes effect only while the minimum pod count is above Minimum available pods, since a budget that allows no evictions would block every drain.
      collapsible: true
      default: true
    - id: pod_disruption_budget_min_available
      label: Minimum available pods
      type: number
      description: Pods that must stay running during a node drain or other voluntary disruption.
      collapsible: true
      max: 1000
      min: 1
      default: 1
      show_when:
        pod_disruption_budget_enabled: true
    - description: GKE services in this namespace allowed to call this one. Set it and every other pod is blocked; the load balancer is always allowed.
      id: ingress_allowed_workloads
      label: Ingress allow-list
      type: string_array
      add_button_label: Add service
      placeholder: api
      collapsible: true
      required: false
      default: null
    - $include: ../../partials/inputs/gke-workload-builder-inputs.yml
    - $include: ../../partials/inputs/misc-section.yml
    - $include: ../../partials/inputs/tags.yml
    - $include: ../../partials/inputs/terraform-settings-gcp.yml
  stack:
    $template: ../../partials/templates/opentofu-stack-gcp.yml
    with:
      base_path: compute/gke_service
      terraform_variables:
        $merge:
          - ../../partials/stack/gke-workload-common-terraform-variables.yml
          - kubernetes_service_enabled: true
            container_port: << module.input.container_port >>
            load_balancer_scheme: >-
              << module.input.load_balancer == "public" ? "external" :
              (module.input.load_balancer == "private" ? "internal" : nil) >>
            subnetwork: '<< module.input.load_balancer == "private" ? module.input.subnetwork : nil >>'
            hostnames: << module.input.hostnames || [] >>
            gateway_certificate_map_name: '<< module.input.load_balancer == "public" && module.input.gateway_certificate_map_name ? module.input.gateway_certificate_map_name : nil >>'
            gateway_pre_shared_certificate_names: << module.input.gateway_pre_shared_certificate_names || [] >>
  build:
    $include: ../../partials/build/gke-workload-image-build.yml
  deploy:
    $merge:
      - ../../partials/deploy/gke-workload-deploy-common.yml
    definition:
      $merge:
        - ../../partials/deploy/gke-workload-helm-definition-common.yml
        - source:
            type: git
            repo_url: https://github.com/ravionhq/modules
            branch: main
            ref: $local.module_tag
            base_path: charts/rvn-gke-web
          values:
            $merge:
              - ../../partials/deploy/gke-workload-helm-values-common.yml
              - containerPort: << module.input.container_port >>
                env: >-
                  << [{"name": "PORT", "value": string(module.input.container_port)}] |
                  concat(module.input.environment_variables != nil ? module.input.environment_variables : []) |
                  concat(module.input.deploy_environment_variable_names != nil && deploy.input.environment_variables != nil ?
                  map(filter(deploy.input.environment_variables, #.name != "PORT" &&
                  #.name in module.input.deploy_environment_variable_names && #.value != nil &&
                  !(#.name in map(module.input.environment_variables ?? [], .name)) &&
                  !(#.name in map(module.input.secrets ?? [], .name))), {"name": #.name, "value": string(#.value)}) : []) >>
                service:
                  port: << module.input.container_port >>
                probes:
                  liveness:
                    enabled: << module.input.liveness_probe_enabled >>
                    path: '<< module.input.liveness_probe_path || module.input.health_check_path >>'
                    initialDelaySeconds: '<< module.input.probe_initial_delay_seconds != nil ? module.input.probe_initial_delay_seconds : 0 >>'
                  readiness:
                    enabled: true
                    path: << module.input.health_check_path >>
                    initialDelaySeconds: '<< module.input.probe_initial_delay_seconds != nil ? module.input.probe_initial_delay_seconds : 0 >>'
                    periodSeconds: '<< module.input.readiness_probe_period_seconds != nil ? module.input.readiness_probe_period_seconds : 1 >>'
                    failureThreshold: '<< module.input.readiness_probe_period_seconds != nil && module.input.readiness_probe_period_seconds >= 10 ? 3 : int((29 + (module.input.readiness_probe_period_seconds != nil ? module.input.readiness_probe_period_seconds : 1)) / (module.input.readiness_probe_period_seconds != nil ? module.input.readiness_probe_period_seconds : 1)) >>'
                  startup:
                    enabled: << module.input.startup_probe_enabled >>
                    path: '<< module.input.startup_probe_path || module.input.liveness_probe_path || module.input.health_check_path >>'
                    failureThreshold: '<< module.input.startup_timeout_seconds != nil ? int((module.input.startup_timeout_seconds + 4) / 5) : 30 >>'
                # The Gateway is pinned to the address the stack reserved, so
                # the load balancer address is known before the first deploy.
                # Hidden inputs are nil for a cluster-only service, which
                # renders no Gateway at all.
                gateway:
                  enabled: '<< module.input.load_balancer != "kubernetes_service" >>'
                  className: '<< module.input.load_balancer == "private" ? "gke-l7-rilb" : "gke-l7-global-external-managed" >>'
                  addressName: '<< stack.output.gateway_address_name || "" >>'
                  hostnames: << module.input.hostnames || [] >>
                  pathPrefixes: << module.input.path_prefixes || [] >>
                  certificateMapName: '<< module.input.load_balancer == "public" && module.input.gateway_certificate_map_name ? module.input.gateway_certificate_map_name : "" >>'
                  preSharedCertificateNames: << module.input.gateway_pre_shared_certificate_names || [] >>
                  httpsRedirect: '<< module.input.https_redirect_enabled != false >>'
                  healthCheck:
                    path: << module.input.health_check_path >>
                    intervalSeconds: '<< module.input.health_check_interval != nil ? module.input.health_check_interval : 5 >>'
                    timeoutSeconds: '<< module.input.health_check_timeout != nil ? module.input.health_check_timeout : 4 >>'
                    healthyThreshold: '<< module.input.health_check_healthy_threshold != nil ? module.input.health_check_healthy_threshold : 2 >>'
                    unhealthyThreshold: '<< module.input.health_check_unhealthy_threshold != nil ? module.input.health_check_unhealthy_threshold : 2 >>'
                  drainingTimeoutSeconds: '<< module.input.gateway_draining_timeout_seconds != nil ? module.input.gateway_draining_timeout_seconds : 300 >>'
                  sessionAffinity:
                    type: '<< module.input.session_affinity != nil && module.input.session_affinity != "none" ? module.input.session_affinity : "" >>'
                    cookieTtlSeconds: '<< module.input.session_affinity_cookie_ttl_seconds != nil ? module.input.session_affinity_cookie_ttl_seconds : 86400 >>'
                networkPolicy:
                  enabled: '<< module.input.ingress_allowed_workloads != nil && len(module.input.ingress_allowed_workloads) > 0 >>'
                  ingress:
                    fromReleases: '<< module.input.ingress_allowed_workloads != nil ? module.input.ingress_allowed_workloads : [] >>'
                    fromCIDRs: '<< stack.output.load_balancer_source_cidr_blocks != nil ? stack.output.load_balancer_source_cidr_blocks : [] >>'
                terminationGracePeriodSeconds: '<< module.input.termination_grace_period_seconds != nil ? module.input.termination_grace_period_seconds : 30 >>'
                lifecycle:
                  preStopSleepSeconds: '<< module.input.pre_stop_sleep_seconds != nil ? module.input.pre_stop_sleep_seconds : 10 >>'
                strategy:
                  maxSurge: '<< module.input.rollout_max_surge_percent != nil ? module.input.rollout_max_surge_percent : 100 >>%'
                podDisruptionBudget:
                  enabled: '<< module.input.pod_disruption_budget_enabled != nil ? module.input.pod_disruption_budget_enabled : true >>'
                  minAvailable: '<< module.input.pod_disruption_budget_min_available != nil ? module.input.pod_disruption_budget_min_available : 1 >>'
                replicaCount: >-
                  << module.input.autoscaling_enabled != false ? (module.input.autoscaling_min_replicas != nil ?
                  module.input.autoscaling_min_replicas : 2) : (module.input.replica_count != nil ?
                  module.input.replica_count : 2) >>
                autoscaling:
                  enabled: '<< module.input.spot_burst_enabled == true && module.input.compute_target == "on_demand" ? false : (module.input.autoscaling_enabled != nil ? module.input.autoscaling_enabled : true) >>'
                  minReplicas: '<< module.input.autoscaling_min_replicas != nil ? module.input.autoscaling_min_replicas : 2 >>'
                  maxReplicas: '<< module.input.autoscaling_max_replicas != nil ? module.input.autoscaling_max_replicas : 3 >>'
                  targetCPUUtilizationPercentage: '<< module.input.autoscaling_cpu_target != nil ? module.input.autoscaling_cpu_target : 70 >>'
                  targetMemoryUtilizationPercentage: << module.input.autoscaling_memory_target >>
                spotBurst:
                  enabled: '<< module.input.spot_burst_enabled == true && module.input.compute_target == "on_demand" >>'
                  kedaEnabled: '<< module.input.keda_enabled == true >>'
                  baselineReplicas: '<< module.input.spot_burst_enabled == true && module.input.compute_target == "on_demand" && module.input.spot_burst_baseline_replicas != nil ? module.input.spot_burst_baseline_replicas : 2 >>'
                  minReplicas: '<< module.input.spot_burst_enabled == true && module.input.compute_target == "on_demand" && module.input.spot_burst_min_replicas != nil ? module.input.spot_burst_min_replicas : 0 >>'
                  maxReplicas: '<< module.input.spot_burst_enabled == true && module.input.compute_target == "on_demand" && module.input.spot_burst_max_replicas != nil ? module.input.spot_burst_max_replicas : 8 >>'
                  pollingInterval: '<< module.input.spot_burst_enabled == true && module.input.compute_target == "on_demand" && module.input.spot_burst_polling_interval != nil ? module.input.spot_burst_polling_interval : 30 >>'
                  cooldownPeriod: '<< module.input.spot_burst_enabled == true && module.input.compute_target == "on_demand" && module.input.spot_burst_cooldown_period != nil ? module.input.spot_burst_cooldown_period : 300 >>'
                  triggers: '<< module.input.spot_burst_enabled == true && module.input.compute_target == "on_demand" && module.input.spot_burst_triggers != nil ? module.input.spot_burst_triggers : [] >>'
                  fallback:
                    replicas: '<< module.input.spot_burst_enabled == true && module.input.compute_target == "on_demand" && module.input.spot_burst_fallback_replicas != nil ? module.input.spot_burst_fallback_replicas : nil >>'
                  scaleDown:
                    stabilizationWindowSeconds: '<< module.input.spot_burst_scale_down_window != nil ? module.input.spot_burst_scale_down_window : 300 >>'
                    podsPerPeriod: '<< module.input.spot_burst_scale_down_pods != nil ? module.input.spot_burst_scale_down_pods : 2 >>'
                    percentPerPeriod: '<< module.input.spot_burst_scale_down_percent != nil ? module.input.spot_burst_scale_down_percent : 25 >>'
  ui:
    links: |-
      <<
      (stack.output.load_balancer_url ? [{"name":"Load balancer","href":stack.output.load_balancer_url}] : []) +
      (module.input.cluster_name ? [{"name":"GKE workload","href":"https://console.cloud.google.com/kubernetes/deployment/" + module.input.gcp_region + "/" + module.input.cluster_name + "/" + module.input.namespace + "/" + module.input.name + "/overview?project=" + module.input.project_id}] : [])
      >>
    metrics:
      - $include: ../../partials/ui/gke-workload-pod-metrics.yml
    logs:
      - $include: ../../partials/ui/gke-workload-logs.yml
  readme: |
    Web server on GKE for running any HTTP application on your Kubernetes cluster behind a Google Cloud load balancer, with no Kubernetes manifests or Helm charts to write.

    ## Overview

    GKE Web Service deploys a web app - any HTTP application in a container - to an existing Ravion GKE cluster. Point it at a Git repository or an image you already have, set the port, hostnames, health checks, and scaling in a form, and Ravion builds the image, deploys it, and puts a Google Cloud Application Load Balancer in front of it.

    Each deploy installs the `rvn-gke-web` Helm chart, which Ravion maintains: a Deployment, a ClusterIP Service, a ServiceAccount, an optional HorizontalPodAutoscaler, and a GKE Gateway with an HTTPRoute. Each release runs `helm upgrade --install --atomic`, so a failed deploy rolls back to the previous revision on its own.

    | Part | Owns | Changes when |
    | ---- | ---- | ------------ |
    | Terraform stack | Reserved load balancer address, optional Artifact Registry repository, Workload Identity Google service account and its IAM grants, service address outputs | You change the load balancer, build source, or IAM roles |
    | Build | The container image, from a Dockerfile or Railpack, pushed to Artifact Registry | Every build, unless the build source is an existing registry image |
    | Helm deploy | Deployment, Service, Gateway, HTTPRoute, HPA, secrets wiring | Every release, and whenever runtime settings change |

    Chart source: [ravionhq/modules/charts/rvn-gke-web](https://github.com/ravionhq/modules/tree/$local.module_tag/charts/rvn-gke-web)

    Terraform source: [ravionhq/modules/compute/gke_service](https://github.com/ravionhq/modules/tree/$local.module_tag/compute/gke_service)

    ## Use cases

    | Scenario | GKE Web Service helps by... |
    | -------- | --------------------------- |
    | Running a public web app on Kubernetes | Serving it through a global external Application Load Balancer |
    | Hosting an internal HTTP API | Serving it through a regional internal load balancer reachable from the VPC |
    | Building from source | Creating images with a Dockerfile or Railpack and pushing to Artifact Registry |
    | Calling Google Cloud APIs | Granting IAM roles to the pods through Workload Identity, with no keys |
    | Handling variable traffic | Scaling pods on CPU and memory, or bursting onto Spot nodes with KEDA |

    ## Prerequisites

    - A **GKE Cluster** module with the Gateway API on (the default).
    - `roles/container.admin` on the Ravion runner's service account, added through `runner_sa_roles` in Ravion's GCP setup. Deploys and removal reach the cluster with the runner's Google access token; the GKE Cluster module does not grant the role because it covers every cluster in the project.
    - A **GKE Add-ons** module on the same cluster, if the service uses Runtime secrets (External Secrets Operator) or Spot burst (KEDA).
    - For a **Private** load balancer, a proxy-only subnet in the cluster's region. The stack fails with a clear message when there is none.

    ## Load balancer

    Each service gets its own GKE Gateway. GKE's Gateway controller turns it into a Google Cloud Application Load Balancer that sends requests straight to pod IPs, so there is no node hop. The stack reserves the load balancer's address first, so the address and URL are known before the first deploy and survive the Gateway being recreated.

    | Load balancer | Gateway class | Address |
    | ------------- | ------------- | ------- |
    | Public | `gke-l7-global-external-managed` | Global external IP |
    | Private | `gke-l7-rilb` | Internal IP in the cluster's subnetwork |
    | Cluster only | None | Reachable at `<service name>.<namespace>` from other pods |

    **Hostnames** limit the route to those hosts; point each name's DNS at the load balancer address. **Path prefixes** limit it to those paths. HTTPS needs a certificate: a Certificate Manager **Certificate map** (public only) or Compute Engine **SSL certificates**. With either set, the Gateway adds an HTTPS listener and, unless you turn off **Redirect HTTP to HTTPS**, redirects plain HTTP to it.

    ## Health checks

    **Health check path** is used by both Kubernetes readiness and the load balancer health check. It must return HTTP 200 without authentication. GKE adds a readiness gate to pods behind a Gateway, so a rolling update keeps old pods serving until their replacements are healthy in the load balancer.

    **Startup and liveness** checks are optional and work exactly as on the EKS Web Service: **Enforce startup timeout** restarts a container that never finishes starting, and **Restart unresponsive containers** restarts one that stops answering.

    ## Build and image options

    | Build source | When to use it |
    | ------------ | -------------- |
    | Dockerfile | Build from a Dockerfile in the selected repository |
    | Railpack | Let Ravion detect the app stack and build with Railpack |
    | Pull from image registry | Deploy an existing image, such as one in Artifact Registry |

    For Dockerfile and Railpack builds, the stack creates an Artifact Registry repository named after the service in the cluster's region, keeps the 100 most recent images, and the cluster's nodes pull from it with their own service account. For **Pull from image registry**, provide the image path without a tag; registries outside the project need **Image pull secret names**.

    ## Application configuration

    Use **Runtime environment variables** for plain values and **Runtime secrets** for sensitive ones, as `{name, value_from}` where `value_from` is a Secret Manager secret ID or `projects/<project>/secrets/<id>`. The chart renders an `ExternalSecret` against the GKE Add-ons `ravion-gcp` store, and the External Secrets Operator materializes the Kubernetes Secret in the cluster. Ravion never reads the values. The service's namespace must be one of the add-ons module's **Allowed namespaces**.

    ## Google Cloud permissions

    List **Project IAM roles** to give the pods Google Cloud access. The stack creates a Google service account for this module, grants it each role on the project, and lets the pods' Kubernetes service account act as it through Workload Identity; no key is created, and client libraries pick up credentials with no configuration.

    ## Compute and scaling

    **Compute target** places pods on any node, only On-demand nodes, or only Spot nodes. With node auto-provisioning, GKE creates a Spot node pool when no node fits. Autoscaling is on by default with 2 to 3 pods at 70% CPU. **Spot burst** keeps an On-demand baseline and adds a KEDA-scaled Spot pool, the same as on EKS; it needs KEDA from the GKE Add-ons module.

    ## Service addresses

    | Output | Value |
    | ------ | ----- |
    | `service_url` | `http://{name}.{namespace}.svc.cluster.local:{port}`, for callers in the cluster |
    | `load_balancer_url` | `https://` with a certificate, otherwise `http://`, to the first hostname without a wildcard, otherwise the load balancer address |
    | `gateway_address` | The reserved load balancer IP |

    ## Metrics and logs

    The Metrics tab charts CPU as a percentage of the request, memory, container restarts, and network traffic from GKE's system metrics in Cloud Monitoring. The Logs tab reads container logs from Cloud Logging, which the cluster collects when it logs workloads (the default).

    ## Design decisions

    - **One Gateway per service.** Each service owns its load balancer and address, so one service's routes cannot break another's. A shared Gateway costs less with many services but needs a cluster-level owner.
    - **A Google service account per stack.** The stack creates a Google service account for the service, grants it the Project IAM roles, and lets the pods' Kubernetes service account act as it through Workload Identity; the chart sets the `iam.gke.io/gcp-service-account` annotation. Roles are not granted to the Kubernetes service account itself because every cluster in a project shares one Workload Identity pool: the same namespace and name on another cluster or environment would share the grant, and removing either module would revoke both. No key is created.
    - **No Ravion-managed domains yet.** Bring a certificate and point DNS yourself; Ravion-managed domains are AWS-only today.
    - **Service name and container port are fixed after creation.** They identify the release and its address.

