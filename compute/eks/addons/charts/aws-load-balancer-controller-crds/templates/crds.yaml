{{- if not .Values.crds }}
{{- fail "crds must contain the selected controller chart's CRD files" }}
{{- end }}
{{- range .Values.crds }}
{{- range regexSplit "(?m)^---[ \\t]*\\r?$" . -1 }}
{{- $crd := fromYaml . }}
{{- if $crd.kind }}
{{- if ne $crd.kind "CustomResourceDefinition" }}
{{- fail "crds may only contain CustomResourceDefinition documents" }}
{{- end }}
{{- $_ := set $crd.metadata "annotations" (mergeOverwrite (default (dict) $crd.metadata.annotations) (dict "helm.sh/resource-policy" "keep")) }}
---
{{ toYaml $crd }}
{{- else if $crd.Error }}
{{- fail $crd.Error }}
{{- end }}
{{- end }}
{{- end }}
