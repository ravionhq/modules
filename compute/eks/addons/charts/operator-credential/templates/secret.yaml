{{/*
The per-cluster Ravion Operator credential.

Two keys, not one: `clientId` is the WorkOS Connect client id and is not a
secret — it is the `sub` claim of every token minted for this agent. It lives
in the same object as its partner purely so the two are provisioned, rotated
and deleted as one.

The agent never calls WorkOS. It presents both over the WebSocket it already
holds and Ravion performs the OAuth2 exchange server-side, which is what keeps
Ravion Operator's egress down to a single destination.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ required "secretName is required" .Values.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: ravion-operator
    app.kubernetes.io/component: credential
    app.kubernetes.io/managed-by: {{ .Release.Service }}
type: Opaque
stringData:
  {{ required "clientIdKey is required" .Values.clientIdKey }}: {{ required "clientId is required: it is written by the compute/eks/addons enrollment step" .Values.clientId | quote }}
  {{ required "clientSecretKey is required" .Values.clientSecretKey }}: {{ required "clientSecret is required: it is written by the compute/eks/addons enrollment step" .Values.clientSecret | quote }}
