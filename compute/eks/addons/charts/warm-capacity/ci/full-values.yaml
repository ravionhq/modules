enabled: true
replicas: 9
resources:
  requests:
    cpu: 250m
    memory: 512Mi
    ephemeral-storage: 2Gi
nodeSelector:
  karpenter.sh/nodepool: default
tolerations:
  - key: dedicated
    operator: Equal
    value: apps
    effect: NoSchedule
topologySpread:
  enabled: true
  topologyKey: kubernetes.io/hostname
  whenUnsatisfiable: DoNotSchedule
