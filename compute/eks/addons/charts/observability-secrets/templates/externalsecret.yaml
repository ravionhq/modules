{{- range .Values.externalSecrets }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .name }}
  namespace: {{ .namespace }}
spec:
  refreshInterval: {{ $.Values.refreshInterval }}
  secretStoreRef:
    name: {{ .storeName | default $.Values.storeName }}
    kind: {{ $.Values.storeKind }}
  target:
    name: {{ .name }}
    creationPolicy: Owner
    {{- with .template }}
    # Literal keys alongside the fetched ones — a vendor user id is public, the
    # token it pairs with is not, and only the token comes from Secrets Manager.
    template:
      engineVersion: v2
      data:
        {{- range $key, $value := . }}
        {{ $key }}: {{ $value | quote }}
        {{- end }}
    {{- end }}
  data:
    {{- range .data }}
    - secretKey: {{ .secretKey }}
      remoteRef:
        # A name, or the full ARN: the operator's AWS providers accept an ARN as
        # the key, which is what lets a secret in another region or account be
        # referenced without a second store.
        key: {{ .remoteRef.key | quote }}
        {{- with .remoteRef.property }}
        property: {{ . | quote }}
        {{- end }}
        {{- with .remoteRef.version }}
        version: {{ . | quote }}
        {{- end }}
    {{- end }}
{{- end }}
