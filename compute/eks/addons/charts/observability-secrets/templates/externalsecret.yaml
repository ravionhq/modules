{{- range .Values.externalSecrets }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .name }}
  namespace: {{ .namespace }}
spec:
  refreshInterval: {{ $.Values.refreshInterval }}
  secretStoreRef:
    name: {{ $.Values.storeName }}
    kind: {{ $.Values.storeKind }}
  target:
    name: {{ .name }}
    creationPolicy: Owner
    {{- with .template }}
    # Literal keys alongside the fetched ones — a vendor user id is public, the
    # token it pairs with is not, and only the token comes from Secrets Manager.
    template:
      engineVersion: v2
      data:
        {{- range $key, $value := . }}
        {{ $key }}: {{ $value | quote }}
        {{- end }}
    {{- end }}
  data:
    {{- range .data }}
    - secretKey: {{ .secretKey }}
      remoteRef:
        # The full Secrets Manager ARN: the operator's AWS provider accepts an
        # ARN as the key, which is what lets a secret in another region or
        # account be referenced without a second store.
        key: {{ .remoteRef | quote }}
    {{- end }}
{{- end }}
