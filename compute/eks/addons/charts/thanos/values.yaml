image: quay.io/thanos/thanos:v0.42.4
objstoreConfig: ""
prometheusRelease: ravion-prometheus
retentionDays: 365
nodeSelector: {}
tolerations: []
affinity: {}
# Applied to every component. Empty leaves the cluster default.
priorityClassName: ""
query:
  # Above one, the replicas spread across nodes behind a minAvailable=1 budget.
  replicas: 1
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 1Gi}
store:
  replicas: 1
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 1Gi}
compactor:
  storageSize: 20Gi
  storageClass: null
  podAnnotations: {}
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 1Gi}
