{{- range $component := list "query" "store" }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $.Release.Name }}-{{ $component }}
  namespace: {{ $.Release.Namespace }}
spec:
  replicas: {{ index $.Values $component "replicas" }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ $.Release.Name }}
      app.kubernetes.io/component: {{ $component }}
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ $.Release.Name }}
        app.kubernetes.io/component: {{ $component }}
      annotations:
        checksum/objstore: {{ $.Values.objstoreConfig | sha256sum }}
    spec:
      serviceAccountName: {{ $.Release.Name }}-{{ $component }}
      {{- with $.Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
      nodeSelector: {{ $.Values.nodeSelector | toJson }}
      tolerations: {{ $.Values.tolerations | toJson }}
      affinity: {{ $.Values.affinity | toJson }}
      {{- if gt (int (index $.Values $component "replicas")) 1 }}
      # Soft: one eligible node still runs every replica.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          matchLabelKeys: [pod-template-hash]
          labelSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ $.Release.Name }}
              app.kubernetes.io/component: {{ $component }}
      {{- end }}
      containers:
        - name: {{ $component }}
          image: {{ $.Values.image | quote }}
          args:
            - {{ $component }}
            - --http-address=0.0.0.0:10902
            {{- if eq $component "query" }}
            - --endpoint=dns+{{ $.Release.Name }}-sidecar-headless.{{ $.Release.Namespace }}.svc.cluster.local:10901
            - --endpoint=dns+{{ $.Release.Name }}-store-headless.{{ $.Release.Namespace }}.svc.cluster.local:10901
            {{- with $.Values.replicaLabel }}
            # Prometheus replicas each hold every series; merge their copies.
            - --query.replica-label={{ . }}
            {{- end }}
            {{- else }}
            - --grpc-address=0.0.0.0:10901
            - --objstore.config-file=/etc/thanos/bucket.yaml
            - --data-dir=/data
            {{- end }}
          ports:
            - name: http
              containerPort: 10902
            {{- if eq $component "store" }}
            - name: grpc
              containerPort: 10901
            {{- end }}
          resources: {{ index $.Values $component "resources" | toJson }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          readinessProbe:
            httpGet: {path: /-/ready, port: http}
          livenessProbe:
            httpGet: {path: /-/healthy, port: http}
          {{- if eq $component "store" }}
          volumeMounts:
            - {name: objstore, mountPath: /etc/thanos, readOnly: true}
            - {name: data, mountPath: /data}
          {{- end }}
      {{- if eq $component "store" }}
      volumes:
        - name: objstore
          configMap:
            name: {{ $.Release.Name }}-objstore
        - name: data
          emptyDir: {sizeLimit: 10Gi}
      {{- end }}
{{- end }}
