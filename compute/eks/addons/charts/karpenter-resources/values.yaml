# All values are supplied by the compute/eks Terraform module.
ec2NodeClass:
  name: default
  # IAM instance profile attached to Karpenter-launched nodes.
  instanceProfile: ""
  # Subnets nodes launch into.
  subnetIds: []
  # Security groups attached to nodes (typically the EKS cluster security group).
  securityGroupIds: []
  # IMDSv2 only, and a hop limit of 1 so pods cannot read the node's
  # instance credentials. Workloads get AWS access through Pod Identity.
  metadataHopLimit: 1
  # Root volume. Always encrypted so nodes never depend on the account's
  # EBS-encryption-by-default setting; kmsKeyId "" means the AWS-managed key.
  rootVolume:
    deviceName: /dev/xvda
    size: 20Gi
    type: gp3
    kmsKeyId: ""
  tags: {}

nodePool:
  name: default
  capacityTypes: ["on-demand", "spot"]
  instanceCategories: ["c", "m", "r"]
  architectures: ["amd64"]
  cpuLimit: 100
  expireAfter: 720h
  consolidationPolicy: WhenEmptyOrUnderutilized
  consolidateAfter: 15m
  # Smallest instance memory to launch, in MiB. Zero removes the floor.
  minInstanceMemoryMiB: 8192

spotWarm:
  # Zero disables the static Spot NodePool.
  minInstances: 0

# A NodePool for the add-on stores alone (Prometheus, Loki, Tempo, the Thanos
# compactor), which require it by name and tolerate its taint.
statefulPool:
  enabled: false
  name: addon-stateful
  taintKey: ravion.com/addon-stateful
  instanceCategories: ["m", "r"]
  # A Prometheus replica requests 7Gi; 16 GiB leaves room for it and the
  # node's daemons.
  minInstanceMemoryMiB: 16384
  cpuLimit: 64
  consolidateAfter: 1h
