{{- range $namespace := .Values.helmInventoryNamespaces | uniq | sortAlpha }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ravion-helm-inventory-read
  namespace: {{ $namespace | quote }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ravion-helm-inventory-read
  namespace: {{ $namespace | quote }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ravion-helm-inventory-read
subjects:
  - kind: Group
    apiGroup: rbac.authorization.k8s.io
    name: ravion:readers
{{- end }}
