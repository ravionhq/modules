# All values are supplied by the compute/eks/addons Terraform module.

# AWS region the stores read from.
region: ""

# Namespaces whose ExternalSecrets may use these cluster-scoped stores. Empty
# leaves the stores open to every namespace; the Terraform module fills this
# with the Ravion Operator's workload namespaces by default.
allowedNamespaces: []

# Cluster-scoped store backed by AWS Secrets Manager. This is the default
# store Ravion app charts reference.
secretsManagerStore:
  name: ravion-aws
  enabled: true

# Cluster-scoped store backed by AWS SSM Parameter Store. A separate store is
# required because ESO's AWS provider takes a single `service` per store.
parameterStore:
  name: ravion-aws-parameter-store
  enabled: true
