{{- if .Values.secretsManagerStore.enabled }}
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ .Values.secretsManagerStore.name }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.region }}
      # No auth block: credentials come from the ESO controller pod's EKS Pod
      # Identity association.
{{- end }}
{{- if .Values.parameterStore.enabled }}
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ .Values.parameterStore.name }}
spec:
  provider:
    aws:
      service: ParameterStore
      region: {{ .Values.region }}
      # No auth block: credentials come from the ESO controller pod's EKS Pod
      # Identity association.
{{- end }}
