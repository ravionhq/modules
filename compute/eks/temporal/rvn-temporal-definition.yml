  readme: |-
    Self-hosted [Temporal](https://temporal.io) on an existing EKS cluster, with its persistence and visibility stores on an Aurora PostgreSQL cluster.

    ## Overview

    Temporal installs the official [temporalio/helm-charts](https://github.com/temporalio/helm-charts) chart, pinned to a version, and everything a production deployment needs around it:

    - The database password, copied from Secrets Manager into a Kubernetes Secret by the External Secrets Operator, so it never enters Helm values, release history or Terraform state.
    - TLS to the database, verified against the RDS CA bundle.
    - A schema job that creates both databases and runs Temporal's migrations on every deploy, and a job that creates your Temporal namespaces and registers their search attributes.
    - Replicas spread across zones and nodes, PodDisruptionBudgets, graceful shutdown drains, and a Go memory limit under each container limit.
    - Network policies that close Temporal's internal ports to the rest of the cluster.
    - Optionally: mutual TLS from a CA of your choice, JWT authorization, an internal NLB and Tailscale access for the frontend, Web UI sign-in with Google, Okta, Microsoft Entra ID or any OIDC provider, a dedicated Karpenter node pool, a priority class, ServiceMonitors and an OTLP metrics forwarder.

    Terraform source: [ravionhq/modules/compute/eks/temporal](https://github.com/ravionhq/modules/tree/$local.module_tag/compute/eks/temporal)

    ## Prerequisites

    - An **EKS Cluster** module, and **EKS Add-ons** with the EBS CSI driver.
    - An **Aurora Database** module running Aurora PostgreSQL. Add the EKS cluster security group to its **Allowed security groups**.
    - The External Secrets Operator from **EKS Add-ons**, with this namespace in its **Allowed namespaces**, for the database password and for every other secret this module reads. If you narrowed the operator's IAM scope to specific secrets, include each one, and its KMS key if it is customer managed.
    - For **TLS**, cert-manager. For **Dedicated node pool**, Karpenter. Both come with **EKS Add-ons**. For **Internal NLB**, the AWS Load Balancer Controller, also from **EKS Add-ons**.
    - For Tailscale access, the [Tailscale Kubernetes operator](https://tailscale.com/kb/1236/kubernetes-operator), the same one **EKS Add-ons** can serve Grafana through.

    ## Connecting

    SDK clients and the `temporal` CLI in the cluster connect to the `frontend_address` output, such as `temporal-frontend.temporal.svc:7233`:

    ```yaml
    env:
      - name: TEMPORAL_ADDRESS
        value: << modules.temporal.output.frontend_address >>
      - name: TEMPORAL_NAMESPACE
        value: default
    ```

    With **TLS** on, clients connect with TLS, verify the server name in `tls_server_name`, and trust the `ca.crt` of the Secret named in `tls_ca_secret_name`. Copy only `ca.crt` to clients: that Secret also holds the frontend's private key. With **Require client certificates**, clients must also present a certificate issued by the same CA.

    Clients outside the cluster reach the frontend through the internal NLB or the tailnet (see **Frontend access**). Either way TCP passes straight through, so TLS and token checks still happen at the frontend. Through the NLB, verify the certificate against `tls_server_name` (override the TLS server name in the SDK), or add the DNS name you point at the NLB to **Extra frontend names**. The tailnet name is added to the certificate automatically when **Tailnet domain** is set.

    ## Namespaces and search attributes

    **Namespaces** is a JSON object keyed by namespace name. Each entry takes `retention_days` (default 7) and `search_attributes`, a map of attribute name to type: `Keyword`, `KeywordList`, `Text`, `Int`, `Double`, `Bool` or `Datetime`.

    ```json
    {
      "default": {},
      "orders": {
        "retention_days": 30,
        "search_attributes": { "CustomerId": "Keyword", "Amount": "Double" }
      }
    }
    ```

    After every deploy, a job creates each missing namespace, applies its retention, and registers the attributes it does not have yet, in that order, so the attributes exist before your workers use the namespace. Running it again changes nothing. Attributes are only ever added: removing one here leaves it registered, because Temporal keeps its data.

    Postgres visibility stores custom attributes in fixed columns, so each namespace can hold at most **10 Keyword** attributes and **3 of each other type** (KeywordList, Text, Int, Double, Bool, Datetime). The module refuses a configuration over those limits.

    ## Authorization

    **JWT authorization** makes the frontend require a token on every call, checked by Temporal's default claim mapper and authorizer. The token must be signed by a key from **Signing keys**, carry the **Audience** when one is set, and list its permissions in the **Permissions claim**:

    ```json
    { "permissions": ["orders:write", "reports:read", "system:admin"] }
    ```

    Each entry is `<namespace>:<read|write|worker|admin>`, and `system:admin` grants cluster-wide admin. Signing keys come from JWKS URLs, such as your identity provider's, or from a JWKS document in Secrets Manager that the module serves inside the namespace, for tokens you sign yourself.

    Authorization needs **TLS**. Temporal's own components, the admin tools and the setup jobs then reach the cluster through an internal frontend with their internode certificates, and are treated as admin without a token, as Temporal intends. SDK clients pass their token as the API key.

    ### Roles for Web UI users

    With authorization on, the Web UI forwards each signed-in user's ID token to the frontend, so the roles a user gets come from that token. There are two ways to give them roles:

    1. **Roles from a token claim.** Configure your identity provider to add the permissions claim to its ID tokens, then set **Permissions claim** to its name and **Audience** to the OIDC client ID. Okta, Auth0, Keycloak and Microsoft Entra ID can add custom claims. Google cannot: with Google sign-in, either leave **JWT authorization** off, so sign-in only controls who reaches the UI, or use a custom claim mapper.
    2. **A custom claim mapper.** Bring a server image built with your own ClaimMapper, for example one that maps Google Workspace group membership to roles, and set **Server image** to it. Give it its settings through **Frontend environment**, credentials through **Frontend secret environment** (each from Secrets Manager), and key files through **Server secret files**, mounted at the paths you choose. Set the claim mapper to your mapper's name through **Extra chart values** (`server.config.authorization.claimMapper`).

    **Web UI through internal frontend** connects the UI as admin without tokens instead. Use it only when the UI's own sign-in, or the network, already limits who reaches it.

    ## Certificate authority

    **Certificate authority** picks what issues the frontend and internode certificates:

    | Choice | What it uses |
    | ------ | ------------ |
    | Self-signed CA | A CA cert-manager creates in the namespace. The default. |
    | Existing issuer | Any cert-manager Issuer or ClusterIssuer, by name, kind and group. |
    | Existing CA secret | A `kubernetes.io/tls` Secret in the namespace holding your CA's `tls.crt` and `tls.key`. |

    Whichever you choose, clients trust the `ca.crt` in the Secret named by `tls_ca_secret_name`.

    ### AWS Private CA

    To issue from [AWS Private CA](https://docs.aws.amazon.com/privateca/latest/userguide/PcaWelcome.html), install the [aws-privateca-issuer](https://github.com/cert-manager/aws-privateca-issuer) cert-manager plugin and give its service account, through EKS Pod Identity, these permissions on the CA's ARN:

    - `acm-pca:DescribeCertificateAuthority`
    - `acm-pca:IssueCertificate`
    - `acm-pca:GetCertificate`

    Create an `AWSPCAClusterIssuer` with the CA's `arn` and `region`, then choose **Existing issuer** with its name, kind `AWSPCAClusterIssuer` and group `awspca.cert-manager.io`. Each certificate cert-manager renews is a new Private CA certificate, which is billed per certificate in general-purpose mode.

    ## Frontend access

    **Internal NLB** puts the frontend's gRPC port on an internal Network Load Balancer for clients outside the cluster, such as in a peered VPC or over a VPN. Only **Allowed source CIDRs** can reach it. The NLB keeps client addresses, so the same CIDRs, and the NLB's subnets for its health checks, are admitted to the frontend by the network policy. The `frontend_nlb_hostname` output is the NLB's DNS name; connect to it on port 7233.

    ## Tailscale

    **Tailscale frontend** makes the frontend's gRPC port a device on your tailnet, and **Tailscale Web UI** serves the Web UI there over HTTPS through a Tailscale Ingress. Each takes a hostname and tags, and the outputs `tailscale_frontend_address` and `tailscale_web_url` give their tailnet names when **Tailnet domain** is set.

    Before turning them on:

    - Install the Tailscale Kubernetes operator, and enable MagicDNS and HTTPS certificates for your tailnet (the Web UI needs both).
    - Let the operator use each tag: list the operator's own tag as an owner of the tag under `tagOwners` in your tailnet policy.
    - Grant access to the tag: a grant from the users or groups who need Temporal to the tag, on `tcp:7233` for the frontend and `tcp:443` for the Web UI.
    - Set **Operator namespace** to where the operator runs its proxies, so the network policies admit them.

    ## Web UI sign-in

    **Sign-in** puts an OpenID Connect login in front of the Web UI. Pick a **Provider**:

    | Provider | Issuer URL | Scopes |
    | -------- | ---------- | ------ |
    | Google | `https://accounts.google.com`, filled in | `openid`, `profile`, `email` |
    | Okta | Your org, such as `https://example.okta.com` or a custom authorization server | `openid`, `profile`, `email`, `offline_access` |
    | Microsoft Entra ID | `https://login.microsoftonline.com/<tenant ID>/v2.0` | `openid`, `profile`, `email`, `offline_access` |
    | Other OIDC provider | Required | Required |

    Store the client's ID and secret as JSON in one Secrets Manager secret, such as `{"client_id": "...", "client_secret": "..."}`, and set **Client secret ARN**. External Secrets syncs it into the namespace.

    The callback URL is `https://<Web UI host>/auth/sso/callback`, from the Tailscale hostname and **Tailnet domain**, or the ingress **Host name**. The `web_oidc_callback_url` output shows it. Register it with your provider:

    | Provider | Where |
    | -------- | ----- |
    | Google | Google Cloud console, the OAuth client (Web application), **Authorized redirect URIs** |
    | Okta | The app integration (Web), **Sign-in redirect URIs** |
    | Microsoft Entra ID | The app registration, **Authentication**, a **Web** platform **Redirect URI** |
    | Other | The client's allowed redirect URIs |

    ## History shards

    **History shards** is fixed for the life of the cluster. Changing it later means a new database and moving your workflows. Temporal recommends a power of two. 512 suits most teams. Choose 2048 or more if you expect thousands of workflow state transitions per second.

    ## Sizing

    The defaults run two replicas of the frontend, history and matching services and one worker, plus one Web UI, for about 2 CPUs and 3.5 GiB of memory requested. Authorization adds two internal frontend replicas. Scale history first: it owns the shards and does most of the work. Each server pod opens up to **Max connections** plus **Max visibility connections** to the database, so make sure the database's `max_connections` covers every pod.

    ## Password rotation

    Temporal reads the database password when a server starts. If the password changes, for example through Secrets Manager rotation, existing connections keep working, but new ones fail until the pods restart. Aurora's managed master user secret rotates every 7 days by default. Prefer a secret without automatic rotation, such as the Aurora module's named master secret, or restart the Temporal Deployments after each rotation. Server secret files are not refreshed in running pods either.

    ## Metrics

    Every server exposes Prometheus metrics on port 9090, annotated for scrapers that discover pods by annotation. For a cluster whose metrics pipeline receives OTLP instead, such as **EKS Add-ons**, set **OTLP endpoint**: a small forwarder in the namespace scrapes the servers and pushes the main request, persistence, task queue, shard and workflow metrics.

    ## Upgrades

    Upgrade the chart and the images together, one Temporal minor version at a time, as Temporal requires. The schema job migrates the databases before the new servers start.

    ## Not included

    Archival, Elasticsearch visibility and multi-cluster replication are not configured by this module. Set them through **Extra chart values** if you need them.
