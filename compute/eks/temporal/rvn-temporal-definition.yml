global: false
definition:
  type: rvn-temporal
  name: Temporal
  description: Self-hosted Temporal on an EKS cluster, with its persistence and visibility stores on Aurora PostgreSQL.
release:
  version: 0.1.0
  description: Run a self-hosted Temporal cluster on EKS backed by Aurora PostgreSQL, with namespaces and search attributes, zone spread, network policies, TLS from your choice of CA, JWT authorization, access over an internal NLB or Tailscale, Web UI sign-in with Google, Okta, Microsoft Entra ID or any OIDC provider, and metrics.
module:
  inputs:
    - id: section_cluster
      label: EKS cluster
      type: section
    - id: cluster
      immutable: true
      label: Cluster
      type: $ref:rvn-eks-cluster
      required: true
      mapped_inputs:
        - id: section_aws
          label: AWS account & region
          type: section
        - default: << ref.input.aws_account_id >>
          id: aws_account_id
          immutable: true
          label: AWS account
          type: string
          values: $values:ravion/aws_accounts
        - default: << ref.input.aws_region >>
          id: aws_region
          immutable: true
          label: Region
          type: string
          values: $values:aws/regions
        - collapsible: true
          default: << ref.input.execution_environment_id >>
          description: For a private cluster endpoint, choose one in the cluster VPC; the cluster's Ravion Runner security group is attached for each run.
          id: execution_environment_id
          label: Terraform execution environment
          type: string
          values: $values:ravion/execution_environments
        - id: section_cluster_details
          label: Cluster details
          type: section
        - default: <<ref.stack.output.cluster_name>>
          id: cluster_name
          immutable: true
          label: EKS cluster name
          placeholder: my-eks-cluster
          required: true
          type: string
        - collapsible: true
          default: <<ref.stack.output.ravion_runner_role_arn>>
          description: IAM role Terraform assumes when authenticating to the Kubernetes API.
          id: ravion_runner_role_arn
          label: Ravion Runner role ARN
          placeholder: arn:aws:iam::123456789012:role/my-eks-cluster-ravion-runner
          type: string
        - collapsible: true
          default: <<ref.stack.output.ravion_runner_security_group_id>>
          description: Lets the OpenTofu runner reach the Kubernetes API. Only blank for a public endpoint.
          id: ravion_runner_security_group_id
          immutable: true
          label: Ravion Runner security group ID
          placeholder: sg-0123456789abcdef0
          type: string
    - id: section_database
      label: Database
      type: section
    - id: database
      immutable: true
      label: Aurora PostgreSQL cluster
      description: Its allowed security groups must include the EKS cluster security group.
      type: $ref:rvn-aurora
      required: true
      mapped_inputs:
        - default: <<ref.stack.output.cluster_identifier>>
          id: database_cluster_identifier
          immutable: true
          label: DB cluster identifier
          placeholder: my-temporal-db
          required: true
          type: string
        - default: <<ref.stack.output.cluster_master_user_secret_arn>>
          description: Secret holding the database credentials as JSON. Blank when the password comes from an existing Kubernetes Secret.
          id: database_password_secret_arn
          label: Credentials secret ARN
          placeholder: arn:aws:secretsmanager:us-east-1:123456789012:secret:my-db-AbCdEf
          required: false
          type: string
    - default: external_secrets
      id: database_password_source
      label: Password source
      required: true
      type: string
      values:
        - label: Secrets Manager, through External Secrets
          value: external_secrets
          description: Needs the External Secrets Operator, such as from EKS Add-ons, with this namespace allowed.
        - label: Existing Kubernetes Secret
          value: kubernetes_secret
          description: A Secret in the namespace with the password under the key password.
    - collapsible: true
      default: ravion-aws
      description: External Secrets store for every secret this module reads. Must allow this namespace and be able to read each secret.
      id: external_secrets_store_name
      label: ClusterSecretStore
      type: string
    - collapsible: true
      description: Blank uses <release name>-db.
      id: database_password_kubernetes_secret_name
      label: Password Secret name
      patterns:
        - message: A Kubernetes object name of lowercase letters, numbers, dots and hyphens.
          pattern: ^[a-z0-9]([a-z0-9.-]{0,251}[a-z0-9])?$
      type: string
    - collapsible: true
      description: Blank uses the cluster's master user.
      id: database_username
      label: Database user
      type: string
    - collapsible: true
      default: temporal
      id: database_name
      immutable: true
      label: Persistence database
      patterns:
        - message: Lowercase letters, numbers and underscores, not starting with a number.
          pattern: ^[a-z_][a-z0-9_]{0,62}$
      type: string
    - collapsible: true
      default: temporal_visibility
      id: visibility_database_name
      immutable: true
      label: Visibility database
      patterns:
        - message: Lowercase letters, numbers and underscores, not starting with a number.
          pattern: ^[a-z_][a-z0-9_]{0,62}$
      type: string
    - collapsible: true
      default: true
      description: Creates both databases if missing and runs schema migrations on every deploy.
      id: database_schema_management_enabled
      label: Manage schema
      type: boolean
    - collapsible: true
      default: true
      description: Verifies the database certificate against the RDS CA bundle.
      id: database_tls_enabled
      label: Database TLS
      type: boolean
    - collapsible: true
      default: 20
      description: Per server pod. Size the database's max_connections for every pod together.
      id: database_max_connections
      label: Max connections
      max: 1000
      min: 1
      type: number
    - collapsible: true
      default: 10
      description: Per server pod.
      id: visibility_database_max_connections
      label: Max visibility connections
      max: 1000
      min: 1
      type: number
    - id: section_release
      label: Helm release
      type: section
    - default: temporal
      description: Prefixes every Service, such as <name>-frontend.
      id: name
      immutable: true
      label: Release name
      patterns:
        - message: 1-30 lowercase letters, numbers and hyphens. Start with a letter and end with a letter or number.
          pattern: ^[a-z]([a-z0-9-]{0,28}[a-z0-9])?$
      required: true
      type: string
    - default: temporal
      id: namespace
      immutable: true
      label: Namespace
      patterns:
        - message: 1-63 lowercase letters, numbers and hyphens. Start and end with a letter or number.
          pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
      required: true
      type: string
    - collapsible: true
      default: true
      description: Turn off when the namespace is managed elsewhere.
      id: namespace_creation_enabled
      label: Create namespace
      type: boolean
    - collapsible: true
      default: 1.8.0
      description: The temporalio/helm-charts temporal chart. 1.8.0 or newer.
      id: chart_version
      label: Chart version
      patterns:
        - message: A version such as 1.8.0.
          pattern: ^[0-9]+\.[0-9]+\.[0-9]+$
      type: string
    - collapsible: true
      default: temporalio/server:1.32.2
      id: server_image
      label: Server image
      type: string
    - collapsible: true
      default: temporalio/admin-tools:1.32.2
      description: Runs the schema migrations. Keep it on the server's Temporal version.
      id: admin_tools_image
      label: Admin tools image
      type: string
    - collapsible: true
      default: info
      id: log_level
      label: Log level
      type: string
      values:
        - label: Debug
          value: debug
        - label: Info
          value: info
        - label: Warn
          value: warn
        - label: Error
          value: error
    - id: section_temporal
      label: Temporal
      type: section
    - default: 512
      description: Cannot change after the first deploy. 512 suits most teams; use 2048 or more for very high throughput.
      id: num_history_shards
      immutable: true
      label: History shards
      max: 65536
      min: 1
      required: true
      type: number
    - default:
        default: {}
      description: Keyed by name, with retention_days (default 7) and search_attributes (name to type). Applied after every deploy; attributes are only added. Postgres allows 10 Keyword and 3 of each other type per namespace.
      id: temporal_namespaces
      label: Namespaces
      placeholder: |-
        {
          "default": {},
          "orders": {
            "retention_days": 30,
            "search_attributes": {
              "CustomerId": "Keyword",
              "Amount": "Double"
            }
          }
        }
      type: object
    - id: section_services
      label: Services
      type: section
    - default: 2
      id: frontend_replicas
      label: Frontend replicas
      min: 1
      type: number
    - default: 2
      description: Owns the history shards and does most of the work. Scale it first.
      id: history_replicas
      label: History replicas
      min: 1
      type: number
    - default: 2
      id: matching_replicas
      label: Matching replicas
      min: 1
      type: number
    - default: 1
      id: worker_replicas
      label: Worker replicas
      min: 1
      type: number
    - collapsible: true
      default: 250m
      id: frontend_cpu_request
      label: Frontend CPU request
      type: string
    - collapsible: true
      default: 256Mi
      id: frontend_memory_request
      label: Frontend memory request
      type: string
    - collapsible: true
      default: 512Mi
      description: In Mi or Gi. GOMEMLIMIT is set to 90% of it.
      id: frontend_memory_limit
      label: Frontend memory limit
      type: string
    - collapsible: true
      default: 500m
      id: history_cpu_request
      label: History CPU request
      type: string
    - collapsible: true
      default: 1Gi
      id: history_memory_request
      label: History memory request
      type: string
    - collapsible: true
      default: 2Gi
      description: In Mi or Gi. History caches workflows in memory, so give it room.
      id: history_memory_limit
      label: History memory limit
      type: string
    - collapsible: true
      default: 250m
      id: matching_cpu_request
      label: Matching CPU request
      type: string
    - collapsible: true
      default: 256Mi
      id: matching_memory_request
      label: Matching memory request
      type: string
    - collapsible: true
      default: 512Mi
      description: In Mi or Gi.
      id: matching_memory_limit
      label: Matching memory limit
      type: string
    - collapsible: true
      default: 100m
      id: worker_cpu_request
      label: Worker CPU request
      type: string
    - collapsible: true
      default: 256Mi
      id: worker_memory_request
      label: Worker memory request
      type: string
    - collapsible: true
      default: 512Mi
      description: In Mi or Gi.
      id: worker_memory_limit
      label: Worker memory limit
      type: string
    - id: section_placement
      label: Placement and resilience
      type: section
    - default: preferred
      id: topology_spread
      label: Zone and node spread
      type: string
      values:
        - label: Preferred
          value: preferred
          description: Spread replicas when possible.
        - label: Required
          value: required
          description: Never stack replicas; needs nodes in every zone.
        - label: Off
          value: "off"
    - default: true
      description: Node drains take at most one replica of each service at a time.
      id: pod_disruption_budgets_enabled
      label: Pod disruption budgets
      type: boolean
    - default: false
      description: Ranks Temporal above other workloads under node pressure.
      id: priority_class_creation_enabled
      label: Create priority class
      type: boolean
    - collapsible: true
      description: Blank uses <release name>-critical when created, or none otherwise.
      id: priority_class_name
      label: Priority class name
      type: string
    - default: false
      description: A tainted Karpenter NodePool for Temporal alone. Needs Karpenter.
      id: node_pool_creation_enabled
      label: Dedicated node pool
      type: boolean
    - collapsible: true
      default: default
      id: node_pool_ec2_node_class_name
      label: EC2NodeClass
      show_when:
        node_pool_creation_enabled: true
      type: string
    - collapsible: true
      default:
        - on-demand
      description: Spot is not recommended; a reclaim moves history shards mid-flight.
      id: node_pool_capacity_types
      label: Capacity types
      show_when:
        node_pool_creation_enabled: true
      type: string_array
    - collapsible: true
      default:
        - c
        - m
        - r
      id: node_pool_instance_categories
      label: Instance categories
      show_when:
        node_pool_creation_enabled: true
      type: string_array
    - collapsible: true
      default:
        - amd64
      id: node_pool_architectures
      label: Architectures
      show_when:
        node_pool_creation_enabled: true
      type: string_array
    - collapsible: true
      default: 32
      id: node_pool_cpu_limit
      label: CPU limit
      min: 1
      show_when:
        node_pool_creation_enabled: true
      type: number
    - id: section_network
      label: Network access
      type: section
    - default: true
      description: Closes internal ports to everything outside the release. Needs a CNI that enforces NetworkPolicy.
      id: network_policy_enabled
      label: Network policies
      type: boolean
    - add_button_label: Add namespace
      default: []
      description: Blank allows every namespace.
      id: network_policy_frontend_client_namespaces
      label: Frontend client namespaces
      placeholder: my-app
      show_when:
        network_policy_enabled: true
      type: string_array
    - add_button_label: Add namespace
      collapsible: true
      default: []
      description: Blank allows every namespace.
      id: network_policy_metrics_namespaces
      label: Metrics scraper namespaces
      placeholder: monitoring
      show_when:
        network_policy_enabled: true
      type: string_array
    - default: false
      description: Mutual TLS between services and TLS on the frontend, from a private CA. Needs cert-manager.
      id: tls_enabled
      label: TLS
      type: boolean
    - collapsible: true
      default: false
      description: Clients must present a certificate from the private CA.
      id: tls_frontend_client_auth_required
      label: Require client certificates
      show_when:
        tls_enabled: true
      type: boolean
    - default: self_signed
      id: tls_ca_source
      label: Certificate authority
      show_when:
        tls_enabled: true
      type: string
      values:
        - label: Self-signed CA
          value: self_signed
          description: Created in the namespace.
        - label: Existing issuer
          value: issuer
          description: A cert-manager Issuer or ClusterIssuer, such as AWS Private CA.
        - label: Existing CA secret
          value: secret
          description: A CA key pair Secret in the namespace.
    - id: tls_issuer_name
      label: Issuer name
      placeholder: private-ca
      show_when:
        tls_enabled: true
        tls_ca_source: issuer
      type: string
    - default: ClusterIssuer
      description: AWSPCAClusterIssuer or AWSPCAIssuer for AWS Private CA.
      id: tls_issuer_kind
      label: Issuer kind
      show_when:
        tls_enabled: true
        tls_ca_source: issuer
      type: string
    - default: cert-manager.io
      description: awspca.cert-manager.io for AWS Private CA.
      id: tls_issuer_group
      label: Issuer group
      show_when:
        tls_enabled: true
        tls_ca_source: issuer
      type: string
    - description: A kubernetes.io/tls Secret with the CA's tls.crt and tls.key.
      id: tls_ca_secret_name
      label: CA secret name
      show_when:
        tls_enabled: true
        tls_ca_source: secret
      type: string
    - add_button_label: Add name
      collapsible: true
      default: []
      description: More names for the frontend certificate, such as a DNS name for the NLB.
      id: tls_frontend_extra_dns_names
      label: Extra frontend names
      show_when:
        tls_enabled: true
      type: string_array
    - id: section_auth
      label: Authorization
      type: section
    - default: false
      description: Every frontend call needs a JWT whose permissions claim lists <namespace>:<read|write|worker|admin>. Needs TLS.
      id: jwt_auth_enabled
      label: JWT authorization
      type: boolean
    - description: Blank skips the audience check. With Web UI sign-in, use the OIDC client ID.
      id: jwt_auth_audience
      label: Audience
      show_when:
        jwt_auth_enabled: true
      type: string
    - default: permissions
      description: Claim holding the permission list. Your identity provider must add it.
      id: jwt_auth_permissions_claim_name
      label: Permissions claim
      show_when:
        jwt_auth_enabled: true
      type: string
    - default: url
      id: jwt_auth_jwks_source
      label: Signing keys
      show_when:
        jwt_auth_enabled: true
      type: string
      values:
        - label: JWKS URLs
          value: url
          description: Such as your identity provider's.
        - label: Secrets Manager
          value: secrets_manager
          description: A JWKS document served inside the namespace, for tokens you sign.
    - add_button_label: Add URL
      default: []
      id: jwt_auth_jwks_urls
      label: JWKS URLs
      placeholder: https://login.example.com/.well-known/jwks.json
      show_when:
        jwt_auth_enabled: true
        jwt_auth_jwks_source: url
      type: string_array
    - id: jwt_auth_jwks_secret_arn
      label: JWKS secret ARN
      placeholder: arn:aws:secretsmanager:us-east-1:123456789012:secret:temporal-jwks-AbCdEf
      show_when:
        jwt_auth_enabled: true
        jwt_auth_jwks_source: secrets_manager
      type: string
    - collapsible: true
      description: Blank uses the whole secret string.
      id: jwt_auth_jwks_secret_property
      label: JWKS secret key
      show_when:
        jwt_auth_enabled: true
        jwt_auth_jwks_source: secrets_manager
      type: string
    - collapsible: true
      default: 1m
      id: jwt_auth_jwks_refresh_interval
      label: Key refresh interval
      show_when:
        jwt_auth_enabled: true
      type: string
    - collapsible: true
      default: false
      description: The UI acts as admin without tokens. Only for a UI that already limits who reaches it.
      id: web_internal_frontend_enabled
      label: Web UI through internal frontend
      show_when:
        jwt_auth_enabled: true
      type: boolean
    - collapsible: true
      default: {}
      description: Plain environment variables for the frontend, such as settings for a custom claim mapper.
      id: frontend_extra_env
      label: Frontend environment
      type: keyvalue
    - collapsible: true
      default: {}
      description: Frontend environment variables from Secrets Manager, keyed by name.
      id: frontend_secret_env
      label: Frontend secret environment
      placeholder: |-
        {
          "MAPPER_CREDENTIALS": {
            "secret_arn": "arn:aws:secretsmanager:us-east-1:123456789012:secret:mapper-AbCdEf",
            "property": "token"
          }
        }
      type: object
    - collapsible: true
      default: {}
      description: Secrets Manager secrets mounted as files in the server pods, keyed by path.
      id: server_secret_files
      label: Server secret files
      placeholder: |-
        {
          "/etc/claim-mapper/key.json": {
            "secret_arn": "arn:aws:secretsmanager:us-east-1:123456789012:secret:mapper-key-AbCdEf"
          }
        }
      type: object
    - id: section_frontend_access
      label: Frontend access
      type: section
    - default: false
      description: An internal NLB on port 7233 for clients outside the cluster. Needs the AWS Load Balancer Controller.
      id: frontend_nlb_enabled
      label: Internal NLB
      type: boolean
    - add_button_label: Add CIDR
      default: []
      description: Client networks allowed through the NLB and the network policy.
      id: frontend_nlb_source_cidrs
      label: Allowed source CIDRs
      placeholder: 10.0.0.0/16
      show_when:
        frontend_nlb_enabled: true
      type: string_array
    - add_button_label: Add subnet ID
      default: []
      description: Blank uses subnets tagged kubernetes.io/role/internal-elb.
      id: frontend_nlb_subnet_ids
      label: Private subnet IDs
      placeholder: subnet-0123456789abcdef0
      show_when:
        frontend_nlb_enabled: true
      type: string_array
    - collapsible: true
      description: Blank uses <cluster name>-<release name>.
      id: frontend_nlb_name
      label: NLB name
      show_when:
        frontend_nlb_enabled: true
      type: string
    - collapsible: true
      default: true
      id: frontend_nlb_cross_zone_enabled
      label: Cross-zone load balancing
      show_when:
        frontend_nlb_enabled: true
      type: boolean
    - collapsible: true
      default: false
      id: frontend_nlb_deletion_protection_enabled
      label: Deletion protection
      show_when:
        frontend_nlb_enabled: true
      type: boolean
    - default: false
      description: The frontend's gRPC port on your tailnet. Needs the Tailscale operator.
      id: tailscale_frontend_enabled
      label: Tailscale frontend
      type: boolean
    - description: Blank uses <release name>-frontend.
      id: tailscale_frontend_hostname
      label: Tailnet hostname
      show_when:
        tailscale_frontend_enabled: true
      type: string
    - add_button_label: Add tag
      default: []
      description: Blank uses the operator's default tags.
      id: tailscale_frontend_tags
      label: Tailscale tags
      placeholder: tag:workflows-grpc
      show_when:
        tailscale_frontend_enabled: true
      type: string_array
    - id: section_tailscale
      label: Tailscale
      type: section
    - description: Such as example-tailnet.ts.net. Used for the tailnet addresses and the sign-in callback URL.
      id: tailscale_tailnet_domain
      label: Tailnet domain
      placeholder: example-tailnet.ts.net
      type: string
    - collapsible: true
      default: tailscale
      description: Where the operator runs its proxies. Admitted by the network policies.
      id: tailscale_namespace
      label: Operator namespace
      type: string
    - id: section_web
      label: Web UI
      type: section
    - default: true
      description: Without sign-in, anyone who reaches it can act on every namespace. Keep it private.
      id: web_enabled
      label: Web UI
      type: boolean
    - collapsible: true
      default: 1
      id: web_replicas
      label: Replicas
      min: 1
      show_when:
        web_enabled: true
      type: number
    - default: false
      description: With the alb class, an internal Application Load Balancer.
      id: web_ingress_enabled
      label: Ingress
      show_when:
        web_enabled: true
      type: boolean
    - collapsible: true
      default: alb
      id: web_ingress_class_name
      label: Ingress class
      show_when:
        web_ingress_enabled: true
      type: string
    - id: web_ingress_host
      label: Host name
      placeholder: temporal.internal.example.com
      show_when:
        web_ingress_enabled: true
      type: string
    - description: Serves HTTPS on the internal ALB. Blank serves HTTP.
      id: web_ingress_certificate_arn
      label: ACM certificate ARN
      placeholder: arn:aws:acm:us-east-1:123456789012:certificate/...
      show_when:
        web_ingress_enabled: true
      type: string
    - collapsible: true
      default: {}
      description: Merged over the module's annotations.
      id: web_ingress_annotations
      label: Ingress annotations
      show_when:
        web_ingress_enabled: true
      type: keyvalue
    - default: false
      description: The Web UI on your tailnet over HTTPS. Needs the Tailscale operator.
      id: tailscale_web_enabled
      label: Tailscale Web UI
      show_when:
        web_enabled: true
      type: boolean
    - description: Blank uses the release name.
      id: tailscale_web_hostname
      label: Tailnet hostname
      show_when:
        tailscale_web_enabled: true
      type: string
    - add_button_label: Add tag
      default: []
      description: Blank uses the operator's default tags.
      id: tailscale_web_tags
      label: Tailscale tags
      placeholder: tag:workflows-ui
      show_when:
        tailscale_web_enabled: true
      type: string_array
    - id: section_web_sign_in
      label: Web UI sign-in
      type: section
    - default: false
      description: OpenID Connect sign-in for the Web UI.
      id: web_oidc_enabled
      label: Sign-in
      show_when:
        web_enabled: true
      type: boolean
    - default: google
      id: web_oidc_provider
      label: Provider
      show_when:
        web_oidc_enabled: true
      type: string
      values:
        - label: Google
          value: google
        - label: Okta
          value: okta
        - label: Microsoft Entra ID
          value: microsoft_entra
        - label: Other OIDC provider
          value: generic
    - description: Blank uses the preset. Required for Okta, Entra ID and other providers.
      id: web_oidc_issuer_url
      label: Issuer URL
      placeholder: https://login.microsoftonline.com/<tenant ID>/v2.0
      show_when:
        web_oidc_enabled: true
      type: string
