{{- /*
Values the Temporal pods read from AWS Secrets Manager, copied into
Kubernetes Secrets by the External Secrets Operator: environment variables
for the frontend, files for the server pods, and the Web UI's OIDC client.
*/ -}}
{{- $docs := list }}
{{- with .Values.frontendEnv }}
{{- if .items }}
{{- $docs = append $docs (dict "name" .secretName "items" .items "refresh" "1h") }}
{{- end }}
{{- end }}
{{- with .Values.serverFiles }}
{{- if .items }}
{{- $docs = append $docs (dict "name" .secretName "items" .items "refresh" "1h") }}
{{- end }}
{{- end }}
{{- with .Values.webOidc }}
{{- if .enabled }}
{{- if not .remoteSecretName }}
{{- fail "webOidc.remoteSecretName is required when webOidc.enabled is true" }}
{{- end }}
{{- $items := list
  (dict "key" "TEMPORAL_AUTH_CLIENT_ID" "remoteSecret" .remoteSecretName "remoteProperty" .clientIdProperty)
  (dict "key" "TEMPORAL_AUTH_CLIENT_SECRET" "remoteSecret" .remoteSecretName "remoteProperty" .clientSecretProperty) }}
{{- $docs = append $docs (dict "name" .secretName "items" $items "refresh" .refreshInterval) }}
{{- end }}
{{- end }}
{{- range $i, $doc := $docs }}
{{- if $i }}
---
{{- end }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $doc.name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "temporal-resources.labels" $ | nindent 4 }}
spec:
  refreshInterval: {{ $doc.refresh }}
  secretStoreRef:
    {{- include "temporal-resources.secretStoreRef" $ | nindent 4 }}
  target:
    name: {{ $doc.name }}
    creationPolicy: Owner
  data:
    {{- range $doc.items }}
    {{- if not .remoteSecret }}
    {{- fail (printf "%s: remoteSecret is required for %s" $doc.name .key) }}
    {{- end }}
    - secretKey: {{ .key }}
      remoteRef:
        {{- include "temporal-resources.remoteRef" . | nindent 8 }}
    {{- end }}
{{- end }}
