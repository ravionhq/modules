definition:
  type: rvn-aws-sandbox-release
  name: Sandbox host release
  description: Publishes the runner version and guest image every sandbox pool in a region boots, after checking that an image carrying both exists.
release:
  version: 0.1.0
  description: Promote a baked sandbox host image to the pools of one region by publishing its release, with the image checked before the release is written.
module:
  inputs:
    - $include: ../../partials/inputs/aws-account.yml
    - $include: ../../partials/inputs/aws-region.yml
    - id: section_release
      label: Release
      type: section
    - description: "Runner release the hosts boot, exactly as the image is tagged."
      id: runner_version
      label: Runner version
      patterns:
        - message: "Looks like v1.2.3."
          pattern: ^v[0-9]+\.[0-9]+\.[0-9]+$
      placeholder: v1.1.37
      required: true
      type: string
    - description: "Guest image the hosts boot, as the release bucket names it and the image is tagged."
      id: guest_image_key
      label: Guest image key
      patterns:
        - message: "Looks like guest/0123456789abcdef."
          pattern: ^guest/[0-9a-f]{16}$
      placeholder: guest/0123456789abcdef
      required: true
      type: string
    - collapsible: true
      default: true
      description: Refuse the deploy when no image in this region carries both coordinates. Leave on unless you are publishing ahead of a copy that is still running.
      id: verify_image
      label: Check the image exists
      type: boolean
    - collapsible: true
      default: /ravion/sandbox-host/release
      description: Parameter the release is published at. Every pool in the region reads this when it plans, so it only changes if the platform's own setting does.
      id: parameter_name
      label: Parameter name
      patterns:
        - message: Starts with / and holds letters, numbers, dots, underscores, hyphens and slashes.
          pattern: ^/[A-Za-z0-9._/-]{1,1000}$
      type: string
  docs: |
    Publishes the release a region's sandbox pools boot.

    A sandbox host image is baked for one runner version and one guest image, and is tagged with both. Publishing the release is what puts a baked image in front of the fleet: every pool in the region reads this parameter the next time it plans, and no deploy of the control plane is involved.

    Hosts already running stay where they are. The hourly sweep rotates parked hosts onto the new launch template, so a release drains through a pool over hours rather than all at once.

    ## What it does

    | Step | Behaviour |
    | --- | --- |
    | Check | Finds an available image in this region tagged with both coordinates. The deploy fails if there is none. |
    | Publish | Writes the release to the parameter. |

    ## Inputs

    | Input | Required | Default | Description |
    | --- | --- | --- | --- |
    | Runner version | Yes | None | The runner release, as tagged on the image. |
    | Guest image key | Yes | None | The guest image, as tagged on the image and named in the release bucket. |
    | Check the image exists | No | On | Fail rather than publish a release no image carries. |
    | Parameter name | No | /ravion/sandbox-host/release | Where the release is published. |

    ## Design decisions

    Promotion is a module rather than a command. A release is a fact about a region, so it is reviewed, versioned and rolled back exactly as the rest of the infrastructure is, and rolling back is deploying the previous version of this module.

    The image check is part of the deploy rather than a note in a runbook. A release published without its image is a pool that cannot launch, and the failure would otherwise surface at the next launch rather than at the change that caused it.

    Baking and promoting are separate on purpose. An image can be built, copied and tested without any pool being asked to boot it, and promotion is the one step that changes what customers run.

    ## Learn more

    - [Source module](https://github.com/ravionhq/modules/tree/$local.module_tag/compute/sandbox_release)
