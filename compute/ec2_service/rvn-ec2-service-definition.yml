definition:
  type: rvn-ec2-service
  name: EC2 Service
  description: Runs supervised workloads on a stable EC2 Auto Scaling Group, with optional shared ALB routing and switchable container or manual in-place deploys.
release:
  version: 2.0.0
  description: ECS cluster references now expose the cluster's load balancer arrays; the shared ALB fields default to the cluster's first public or private load balancer.
module:
  inputs:
    - id: network
      immutable: true
      label: VPC network
      type: $ref:rvn-aws-network
      description: Existing Ravion network that supplies the AWS account, region, VPC, and public and private subnets for the instances.
      mapped_inputs:
        - $template: ../../partials/templates/network-ref-mapped-inputs.yml
          with:
            aws_account_id_default: << ref.input.aws_account_id >>
            aws_region_default: << ref.input.aws_region >>
            execution_environment_default: << ref.input.execution_environment_id >>
            private_subnet_ids_default: <<ref.stack.output.private_subnet_ids>>
            public_subnet_ids_default: <<ref.stack.output.public_subnet_ids>>
            vpc_id_default: <<ref.stack.output.vpc_id>>
      required: true
    - $include: ../../partials/inputs/private-subnet-placement.yml
    - id: section_service
      label: EC2 service
      type: section
    - id: name
      immutable: true
      label: Service name
      type: string
      description: Name for the instance group and related resources.
      required: true
      default: <<project.given_id>>-<<environment.given_id>>-<<module.given_id>>
      patterns:
        - message: 1-28 lowercase letters, numbers, and hyphens. Start and end with a letter or number.
          pattern: ^[a-z0-9]([a-z0-9-]{0,26}[a-z0-9])?$
    - id: instance_type
      label: Instance type
      type: string
      required: true
      no_options_message: Select a VPC Network, or enter an AWS account and region, to load available EC2 instance types.
      values: $values:aws/ec2/instances?awsAccountId=<<module.input.aws_account_id>>&region=<<module.input.aws_region>>
    - id: ami_id
      label: Custom AMI ID
      type: string
      description: Custom AMI for new instances. Leave blank for the latest architecture-matched Amazon Linux 2023 AMI.
      collapsible: true
      placeholder: ami-...
      required: false
    - id: key_name
      label: SSH key pair name
      type: string
      description: Optional EC2 key pair for SSH access.
      collapsible: true
      required: false
    - id: additional_user_data
      label: Additional user data
      type: text
      description: Shell script run as root after Ravion's bootstrap on every newly launched instance.
      collapsible: true
      required: false
    - id: http_traffic_enabled
      label: Serve HTTP traffic
      type: boolean
      description: Off for a worker. On to serve HTTP traffic through a load balancer.
      default: true
    - id: deploy_type
      label: Deploy type
      type: string
      description: Choose in-place container image deploys or host-level shell commands.
      required: true
      default: container
      values:
        - label: Container
          description: Pull an image and replace the supervised Docker container on each existing instance.
          value: container
        - label: Manual
          description: Run release preparation commands on each instance, then start a supervised foreground command on the host.
          value: manual
    - id: section_build
      label: Build config
      show_when:
        deploy_type: container
      type: section
    - id: build_source
      label: Build source
      type: string
      description: Build a container image from source with Dockerfile or Railpack, or deploy an existing image from a configured registry repository.
      required: true
      show_when:
        deploy_type: container
      default: dockerfile
      values:
        - description: Build an image from a Dockerfile in the selected Git repository.
          label: Dockerfile
          value: dockerfile
        - description: Let Railpack detect the application and build a container image from source.
          label: Railpack
          value: railpack
        - description: Deploy an image from a registry configured on this module. Provide only the tag or digest at deploy time.
          label: Pull from image registry
          value: image_registry
    - $template: ../../partials/inputs/build-git-source.yml
      with:
        show_when:
          deploy_type: container
          build_source:
            - dockerfile
            - railpack
    - id: image_repository
      label: Image repository
      type: string
      description: Repository without a tag or digest, such as `nginx` or `123456789012.dkr.ecr.us-east-1.amazonaws.com/app`. Registries requiring Docker credentials are unsupported. Same-region private ECR also needs a repository policy that lets the service instance role pull images.
      placeholder: nginx
      required: true
      show_when:
        deploy_type: container
        build_source: image_registry
    - id: container_start_command
      label: Start command override
      type: string
      description: Optional command string that overrides the image CMD. The image ENTRYPOINT is preserved.
      collapsible: true
      required: false
      show_when:
        deploy_type: container
    - $template: ../../partials/inputs/dockerfile-build.yml
      with:
        show_when:
          deploy_type: container
          build_source: dockerfile
    - $template: ../../partials/inputs/railpack.yml
      with:
        show_when:
          deploy_type: container
          build_source: railpack
    - id: railpack_start_cmd
      label: Start command
      type: string
      description: Optional start command embedded in the Railpack-built image. Leave blank to use Railpack detection.
      placeholder: Railpack default
      show_when:
        deploy_type: container
        build_source: railpack
    - id: section_deployment
      label: Deployment
      type: section
    - id: deploy_source_repo
      label: Git repository
      type: gitrepo
      description: Optional repository to check out before manual deploy commands run. Leave blank to run the commands without a managed source checkout.
      required: false
      show_when:
        deploy_type: manual
    - id: deploy_source_base_path
      label: Source base path
      type: string
      description: Repository-relative working directory for manual deploy and start commands when a Git repository is selected.
      required: false
      default: .
      show_when:
        deploy_type: manual
        deploy_source_repo:
          not: ""
    - id: deploy_commands
      label: Deploy commands
      type: string_array
      description: Release preparation commands run as root, in order, on every instance during each manual deploy. Keep them idempotent; any command that exits non-zero fails that instance's deploy.
      add_button_label: Add command
      placeholder: cd /srv/app && git pull
      required: true
      show_when:
        deploy_type: manual
    - id: start_command
      label: Start command
      type: string
      description: Long-running foreground app command that supervisord runs as root after preparation and restarts if it exits. Use a wrapper to drop privileges when needed; the command must not daemonize.
      placeholder: cd /srv/app && ./bin/server
      required: true
      show_when:
        deploy_type: manual
    - id: deployment_concurrency_max
      label: Maximum concurrent instances
      type: string
      description: Maximum instances updated at once. Use an instance count such as 1 or a percentage such as 25%.
      collapsible: true
      required: true
      default: "1"
      patterns:
        - message: Positive instance count or percentage from 1% to 100%.
          pattern: ^([1-9][0-9]*|[1-9][0-9]?%|100%)$
    - id: deployment_errors_max
      label: Maximum deployment errors
      type: string
      description: Number or percentage of failed instances tolerated before the deployment stops on remaining instances.
      collapsible: true
      required: true
      default: "0"
      patterns:
        - message: Zero, a positive error count, or percentage from 1% to 100%.
          pattern: ^(0|[1-9][0-9]*|[1-9][0-9]?%|100%)$
    - id: deploy_timeout_seconds
      label: Per-instance deploy timeout (secs)
      type: number
      description: Maximum time allowed for the SSM deploy script on each instance, for both container and manual deploys.
      collapsible: true
      max: 14400
      min: 60
      default: 1200
    - id: section_web
      label: HTTP routing
      show_when:
        http_traffic_enabled: true
      type: section
    - id: load_balancer_source
      immutable: true
      label: Load balancer source
      type: string
      description: Must use the same AWS account, region, and VPC as the VPC network.
      required: true
      default: standalone_alb
      show_when:
        http_traffic_enabled: true
      values:
        - label: Standalone ALB module
          description: Attach to a standalone Ravion Application Load Balancer.
          value: standalone_alb
        - label: ALB from ECS Cluster module
          description: Attach to the public or private ALB created by a Ravion ECS cluster.
          value: ecs_cluster
    - id: alb
      immutable: true
      label: Standalone ALB module
      type: $ref:rvn-aws-alb
      description: Attach listener rules to this.
      mapped_inputs:
        - default: <<ref.stack.output.http_listener_arn>>
          id: alb_http_listener_arn
          immutable: true
          label: ALB HTTP listener ARN
          required: false
          type: string
        - default: <<ref.stack.output.https_listener_arn>>
          id: alb_https_listener_arn
          immutable: true
          label: ALB HTTPS listener ARN
          required: false
          type: string
        - default: <<ref.stack.output.security_group_id>>
          id: alb_security_group_id
          immutable: true
          label: ALB security group ID
          required: true
          type: string
        - default: <<ref.stack.output.alb_arn_suffix>>
          id: alb_arn_suffix
          immutable: true
          label: ALB ARN suffix
          required: true
          type: string
      required: true
      show_when:
        http_traffic_enabled: true
        load_balancer_source: standalone_alb
    - id: ecs_cluster
      immutable: true
      label: ECS Cluster
      type: $ref:rvn-ecs-cluster
      description: Attach listener rules to the ALB in this cluster.
      mapped_inputs:
        - $include: ../../partials/inputs/ecs-service-cluster-alb-mapped-inputs.yml
      required: true
      show_when:
        http_traffic_enabled: true
        load_balancer_source: ecs_cluster
    - id: ecs_cluster_alb_visibility
      label: ALB to use from ECS Cluster module
      type: string
      description: The selected load balancer must be enabled on the cluster.
      required: true
      default: public
      show_when:
        http_traffic_enabled: true
        load_balancer_source: ecs_cluster
      values:
        - label: Public
          description: Route through the cluster's internet-facing Application Load Balancer.
          value: public
        - label: Private
          description: Route through the cluster's internal Application Load Balancer.
          value: private
    - id: app_port
      immutable: true
      label: App port
      type: number
      description: Port the host application listens on. Container mode publishes the same container port, and PORT is set automatically.
      max: 65535
      min: 1
      required: true
      show_when:
        http_traffic_enabled: true
      default: 80
    - $template: ../../partials/templates/alb-listener-rule-inputs.yml
      with:
        field_overrides:
          show_when:
            http_traffic_enabled: true
    - id: section_health
      label: Health check
      type: section
    - id: health_check_path
      label: Health check path
      type: string
      description: HTTP path used by the load balancer health check and by the Container-mode deploy gate on each instance.
      required: true
      show_when:
        http_traffic_enabled: true
      default: /
    - id: health_check_matcher
      label: Success codes
      type: string
      description: HTTP status codes the ALB treats as healthy, such as 200-399.
      collapsible: true
      required: true
      show_when:
        http_traffic_enabled: true
      default: 200-399
    - id: health_check_interval
      label: Interval (secs)
      type: number
      description: Seconds between Application Load Balancer health checks.
      collapsible: true
      max: 300
      min: 5
      show_when:
        http_traffic_enabled: true
      default: 10
    - id: health_check_timeout
      label: Timeout (secs)
      type: number
      description: Seconds the Application Load Balancer waits for a health-check response. Must be lower than the interval.
      collapsible: true
      max: 120
      min: 2
      show_when:
        http_traffic_enabled: true
      default: 5
    - id: healthy_threshold
      label: Healthy threshold
      type: number
      description: Consecutive successful ALB checks required before an instance is healthy.
      collapsible: true
      max: 10
      min: 2
      show_when:
        http_traffic_enabled: true
      default: 2
    - id: unhealthy_threshold
      label: Unhealthy threshold
      type: number
      description: Consecutive failed ALB checks required before an instance is unhealthy.
      collapsible: true
      max: 10
      min: 2
      show_when:
        http_traffic_enabled: true
      default: 2
    - id: health_check_grace_period
      label: Instance health check grace period (secs)
      type: number
      description: Seconds after launch before Auto Scaling health checks apply.
      collapsible: true
      min: 0
      default: 300
    - id: target_group_slow_start
      label: Slow start duration (secs)
      type: number
      description: Seconds the load balancer gradually increases traffic to a newly healthy instance. Use 0 to disable.
      collapsible: true
      max: 900
      min: 0
      show_when:
        http_traffic_enabled: true
      default: 0
    - id: deregistration_delay
      label: Deregistration delay (secs)
      type: number
      description: Seconds allowed for in-flight requests to drain before a Container-mode in-place swap.
      collapsible: true
      max: 3600
      min: 0
      show_when:
        http_traffic_enabled: true
      default: 30
    - id: target_group_stickiness_enabled
      label: Sticky sessions
      type: boolean
      description: Keep repeat requests on the same instance using a load balancer or application cookie.
      collapsible: true
      show_when:
        http_traffic_enabled: true
      default: false
    - id: target_group_stickiness_type
      label: Stickiness type
      type: string
      description: Use a load-balancer-generated cookie or an application cookie.
      required: true
      show_when:
        http_traffic_enabled: true
        target_group_stickiness_enabled: true
      default: lb_cookie
      values:
        - label: Load balancer cookie
          value: lb_cookie
        - label: Application cookie
          value: app_cookie
    - id: target_group_stickiness_cookie_name
      label: Application cookie name
      type: string
      description: Application cookie name used for target stickiness.
      required: true
      show_when:
        http_traffic_enabled: true
        target_group_stickiness_enabled: true
        target_group_stickiness_type: app_cookie
    - id: target_group_stickiness_cookie_duration
      label: Stickiness cookie duration (secs)
      type: number
      description: How long the cookie keeps a client routed to the same instance.
      collapsible: true
      max: 604800
      min: 1
      show_when:
        http_traffic_enabled: true
        target_group_stickiness_enabled: true
      default: 86400
    - id: section_storage
      label: Storage
      type: section
      description: The root volume is the required boot disk, the data volume adds per-instance storage, and EFS provides shared storage that survives instance replacement.
    - id: root_volume_size
      label: Root volume size (GB)
      type: number
      description: Required encrypted boot disk for the operating system, Docker, and local files. It is deleted when the instance is terminated.
      collapsible: true
      max: 16384
      min: 8
      default: 30
    - id: data_volume_creation_enabled
      label: Data volume
      type: boolean
      description: Attach a second encrypted EBS disk for per-instance files such as caches or generated artifacts. Each instance gets its own disk, which is deleted with that instance.
      default: false
    - id: data_volume_size
      label: Data volume size (GB)
      type: number
      description: Size of the dedicated EBS data volume attached to each instance.
      max: 16384
      min: 1
      show_when:
        data_volume_creation_enabled: true
      default: 20
    - id: data_volume_mount_path
      label: Data volume mount path
      type: string
      description: Absolute host path for the data volume.
      required: true
      show_when:
        data_volume_creation_enabled: true
      default: /data
      patterns:
        - message: Use an absolute path.
          pattern: ^/
    - id: efs_enabled
      label: EFS file system
      type: boolean
      description: Mount a shared network filesystem that every instance can access. Files survive instance replacement and remain available at the configured mount path.
      default: false
    - id: efs
      label: EFS file system
      type: $ref:rvn-efs
      mapped_inputs:
        - default: <<ref.stack.output.file_system_id>>
          id: efs_file_system_id
          label: EFS file system ID
          type: string
        - default: <<ref.stack.output.access_point_id>>
          id: efs_access_point_id
          label: EFS access point ID
          required: false
          type: string
        - default: <<ref.stack.output.client_security_group_id>>
          id: efs_client_security_group_id
          label: EFS client security group ID
          type: string
      required: true
      show_when:
        efs_enabled: true
    - id: efs_mount_path
      label: EFS mount path
      type: string
      description: Host path where the file system is mounted.
      required: true
      show_when:
        efs_enabled: true
      default: /mnt/efs
      patterns:
        - message: Use an absolute path.
          pattern: ^/
    - id: section_scaling
      label: Scaling
      type: section
    - $template: ../../partials/templates/autoscaling-capacity-inputs.yml
      with:
        min_capacity_overrides:
          label: Minimum instances
          required: true
        max_capacity_overrides:
          label: Maximum instances
          required: true
    - id: cpu_autoscaling_enabled
      label: CPU autoscaling
      type: boolean
      default: false
    - id: cpu_target_value
      label: CPU target (%)
      type: number
      description: Average EC2 CPU utilization that target-tracking autoscaling tries to maintain.
      max: 100
      min: 1
      show_when:
        cpu_autoscaling_enabled: true
      default: 70
    - id: desired_capacity
      label: Desired instances
      placeholder: Defaults to minimum instances
      type: number
      description: Initial group size when CPU autoscaling is off. Leave blank to start at the minimum.
      min: 0
      required: false
      show_when:
        cpu_autoscaling_enabled: false
    - id: section_app_config
      label: Environment variables
      type: section
    - $merge:
        - ../../partials/inputs/build-environment-variables.yml
      show_when:
        deploy_type: container
        build_source:
          - dockerfile
          - railpack
    - $merge:
        - ../../partials/inputs/dockerfile-env-injection.yml
      show_when:
        deploy_type: container
        build_source: dockerfile
    - id: environment_variables
      label: Runtime environment variables
      type: array
      description: Plain, single-line environment variables written to each instance at boot and refreshed on every deploy.
    - id: secrets
      label: Runtime secrets
      type: array
      description: Secret environment variables as {name, value_from} objects fetched on each instance.
    - id: section_networking
      label: Networking
      type: section
    - id: additional_security_group_ids
      label: Additional security groups
      type: string_array
      description: Additional security groups attached to the instances.
      add_button_label: Add security group ID
      collapsible: true
      required: false
    - id: direct_access_cidr_blocks
      label: Allowed CIDR blocks
      type: string_array
      description: IPv4 CIDR blocks allowed to reach the app port directly, bypassing the load balancer.
      add_button_label: Add CIDR block
      collapsible: true
      required: false
      show_when:
        http_traffic_enabled: true
    - $template: ../../partials/templates/builder-infrastructure-inputs.yml
      with:
        no_options_message: Select a VPC Network, or enter an AWS account and region, to load available EC2 instance types.
        show_when:
          deploy_type: container
          build_source:
            - dockerfile
            - railpack
    - id: section_ecr
      label: Container registry
      show_when:
        deploy_type: container
        build_source:
          - dockerfile
          - railpack
      type: section
    - id: ecr_scan_on_push_enabled
      label: Scan images on push
      type: boolean
      description: Scan images for vulnerabilities after they are pushed to the Ravion-created ECR repository.
      collapsible: true
      show_when:
        deploy_type: container
        build_source:
          - dockerfile
          - railpack
      default: true
    - id: ecr_force_deletion_enabled
      label: Force delete image repository
      type: boolean
      description: Allow the Ravion-created ECR repository to be deleted while it still contains images.
      collapsible: true
      show_when:
        deploy_type: container
        build_source:
          - dockerfile
          - railpack
      default: false
    - id: section_logging
      label: Logging
      type: section
    - id: log_retention_in_days
      label: Log retention (days)
      type: number
      description: CloudWatch retention for app logs.
      collapsible: true
      min: 1
      default: 30
    - $include: ../../partials/inputs/tags.yml
    - $include: ../../partials/inputs/terraform-settings.yml
  stack:
    $template: ../../partials/templates/opentofu-stack.yml
    with:
      base_path: compute/ec2_service
      terraform_variables:
        ...overrides: << module.input.advanced_terraform_variables >>
        additional_security_group_ids: << module.input.additional_security_group_ids || [] >>
        additional_user_data: << module.input.additional_user_data || "" >>
        direct_access_cidr_blocks: "<< module.input.http_traffic_enabled ? (module.input.direct_access_cidr_blocks || []) : [] >>"
        ami_id: << module.input.ami_id || nil >>
        app_port: "<< module.input.http_traffic_enabled ? module.input.app_port : nil >>"
        public_ip_assignment_enabled: "<< module.input.private_subnet_placement_enabled ? false : true >>"
        cpu_autoscaling_enabled: << module.input.cpu_autoscaling_enabled >>
        cpu_target_value: << module.input.cpu_target_value >>
        data_volume_creation_enabled: << module.input.data_volume_creation_enabled >>
        data_volume_mount_path: << module.input.data_volume_mount_path >>
        data_volume_size: << module.input.data_volume_size >>
        deploy_timeout_seconds: << module.input.deploy_timeout_seconds >>
        desired_capacity: "<< module.input.cpu_autoscaling_enabled ? nil : (module.input.desired_capacity || nil) >>"
        ecr_force_deletion_enabled: << module.input.ecr_force_deletion_enabled >>
        ecr_repository_creation_enabled: '<< module.input.deploy_type == "container" && (module.input.build_source == "dockerfile" || module.input.build_source == "railpack") >>'
        ecr_scan_on_push_enabled: << module.input.ecr_scan_on_push_enabled >>
        efs_access_point_id: "<< module.input.efs_enabled ? (module.input.efs_access_point_id || nil) : nil >>"
        efs_client_security_group_id: "<< module.input.efs_enabled ? module.input.efs_client_security_group_id : nil >>"
        efs_enabled: << module.input.efs_enabled >>
        efs_file_system_id: "<< module.input.efs_enabled ? module.input.efs_file_system_id : nil >>"
        efs_mount_path: << module.input.efs_mount_path >>
        environment_variables: << module.input.environment_variables || [] >>
        health_check_grace_period: << module.input.health_check_grace_period >>
        deploy_health_check_path: "<< module.input.http_traffic_enabled ? module.input.health_check_path : nil >>"
        instance_type: << module.input.instance_type >>
        key_name: << module.input.key_name || nil >>
        load_balancer_attachment:
          $template: ../../partials/templates/alb-load-balancer-attachment.yml
          with:
            additional_fields: {}
            attachment_control:
              creation_enabled: << module.input.http_traffic_enabled >>
            listener_arn: >-
              << !module.input.http_traffic_enabled ? "" :
              module.input.load_balancer_source == "standalone_alb" ?
              (module.input.alb_https_listener_arn || module.input.alb_http_listener_arn) :
              module.input.ecs_cluster_alb_visibility == "public" ?
              (module.input.public_alb_https_listener_arn || module.input.public_alb_http_listener_arn) :
              (module.input.private_alb_https_listener_arn || module.input.private_alb_http_listener_arn) >>
            target_group:
              port: << module.input.app_port >>
              deregistration_delay: << module.input.deregistration_delay >>
              slow_start: << module.input.target_group_slow_start >>
              health_check:
                enabled: true
                path: << module.input.health_check_path >>
                matcher: << module.input.health_check_matcher >>
                interval: << module.input.health_check_interval >>
                timeout: << module.input.health_check_timeout >>
                healthy_threshold: << module.input.healthy_threshold >>
                unhealthy_threshold: << module.input.unhealthy_threshold >>
              stickiness: >-
                << module.input.target_group_stickiness_enabled ? {
                  "enabled": true,
                  "type": module.input.target_group_stickiness_type,
                  "cookie_duration": module.input.target_group_stickiness_cookie_duration,
                  "cookie_name": module.input.target_group_stickiness_type == "app_cookie" ? module.input.target_group_stickiness_cookie_name : nil
                } : nil >>
        load_balancer_security_group_id: >-
          << !module.input.http_traffic_enabled ? nil :
          module.input.load_balancer_source == "standalone_alb" ? module.input.alb_security_group_id :
          module.input.ecs_cluster_alb_visibility == "public" ? module.input.public_alb_security_group_id :
          module.input.private_alb_security_group_id >>
        log_retention_in_days: << module.input.log_retention_in_days >>
        manual_start_command: '<< module.input.deploy_type == "manual" ? module.input.start_command : nil >>'
        max_size: << module.input.max_capacity >>
        min_size: << module.input.min_capacity >>
        name: << module.input.name >>
        region: << module.input.aws_region >>
        root_volume_size: << module.input.root_volume_size >>
        runtime: << module.input.deploy_type >>
        secrets: << module.input.secrets || [] >>
        container_start_command: '<< module.input.deploy_type == "container" ? (module.input.container_start_command || nil) : nil >>'
        subnet_ids: "<< module.input.private_subnet_placement_enabled ? module.input.private_subnet_ids : module.input.public_subnet_ids >>"
        tags:
          $include: ../../partials/stack/ravion-tags.yml
        vpc_id: << module.input.vpc_id >>
  build:
    $merge: ../../partials/build/ecs-service-image-build.yml
    type: '<< module.input.deploy_type == "manual" || module.input.build_source == "image_registry" ? "disabled" : "image" >>'
  deploy:
    type: aws:ec2
    concurrency:
      queue_overflow: oldest
      queue_size: 1
    timeout: 86400
    strategy:
      type: rolling
      concurrency_max: << module.input.deployment_concurrency_max >>
      errors_max: << module.input.deployment_errors_max >>
    inputs:
      - id: image_ref
        label: Image tag or digest
        type: string
        description: Image tag or digest to deploy.
        placeholder: sha256:... or latest or <run-id>-railpack
        patterns:
          - message: Image tags and digests must not contain whitespace.
            pattern: ^\S+$
        required: true
        show_when:
          deploy_type: container
      - id: branch
        label: Git branch
        type: string
        description: Branch to deploy. Defaults to the repository's default branch.
        required: false
        show_when:
          deploy_type: manual
      - id: ref
        label: Git ref (commit or tag)
        type: string
        description: Optional commit SHA, tag, or ref to deploy.
        required: false
        show_when:
          deploy_type: manual
    source: >-
      << module.input.deploy_type == "manual" && module.input.deploy_source_repo ? {
        "type": "git",
        "repo": module.input.deploy_source_repo,
        "branch": deploy.input.branch,
        "ref": deploy.input.ref,
        "base_path": module.input.deploy_source_base_path || "."
      } : nil >>
    definition: >-
      << module.input.deploy_type == "container" ? {"runtime": "container", "image_uri":
      (module.input.build_source == "image_registry" ? (deploy.input.image_ref contains "sha256:" ?
      module.input.image_repository + "@" + deploy.input.image_ref : module.input.image_repository +
      ":" + deploy.input.image_ref) : (deploy.input.image_ref contains "sha256:" ?
      stack.output.ecr_repository_url + "@" + deploy.input.image_ref : stack.output.ecr_repository_url
      + ":" + deploy.input.image_ref))} : {"runtime": "manual", "commands":
      module.input.deploy_commands} >>
    infrastructure:
      autoscaling_group_name: << stack.output.autoscaling_group_name >>
      aws_account_id: << module.input.aws_account_id >>
      log_group_name: << stack.output.log_group_name >>
      region: << stack.output.region >>
      target_group_arn: << stack.output.target_group_arn >>
  ui:
    logs:
      - id: app_logs
        name: App logs
        source:
          type: cloudwatch
          aws_account_id: << module.input.aws_account_id >>
          region: << stack.output.region >>
          log_group: << stack.output.log_group_name >>
          log_stream_prefix: << stack.output.log_stream_prefix >>
    metrics: >-
      << /* ALB metrics use LoadBalancer: and TargetGroup: dimensions. */ [{"id":"desired_instances","name":"Desired instances","type":"line","source":{"type":"cloudwatch","aws_account_id":module.input.aws_account_id,"dimensions":{"AutoScalingGroupName":stack.output.autoscaling_group_name},"name":"GroupDesiredCapacity","namespace":"AWS/AutoScaling","region":stack.output.region,"statistic":"Average"}},{"id":"in_service_instances","name":"In-service instances","type":"line","source":{"type":"cloudwatch","aws_account_id":module.input.aws_account_id,"dimensions":{"AutoScalingGroupName":stack.output.autoscaling_group_name},"name":"GroupInServiceInstances","namespace":"AWS/AutoScaling","region":stack.output.region,"statistic":"Average"}}] |
