definition:
  type: rvn-ecs-cluster
  name: ECS Cluster
  description: Production-ready AWS ECS cluster with Fargate, Fargate Spot, optional EC2 capacity, and shared load balancers.
release:
  version: 2.0.0
  description: >-
    Support multiple public and private load balancers per cluster. Public/private
    ALBs and NLBs are now configured as arrays with per-load-balancer settings, and
    cluster outputs expose the full load balancer lists so services can pick one by name.
module:
  inputs:
    - id: network
      immutable: true
      label: VPC network
      mapped_inputs:
        - $template: ../../partials/templates/network-ref-mapped-inputs.yml
          with:
            aws_account_id_default: << ref.input.aws_account_id >>
            aws_region_default: << ref.input.aws_region >>
            execution_environment_default: << ref.input.execution_environment_id >>
            private_subnet_ids_default: <<ref.stack.output.private_subnet_ids>>
            public_subnet_ids_default: <<ref.stack.output.public_subnet_ids>>
            vpc_id_default: <<ref.stack.output.vpc_id>>
      required: true
      type: $ref:rvn-aws-network
    - id: section_cluster
      label: ECS cluster
      type: section
    - default: <<project.given_id>>-<<environment.given_id>>
      description: Name prefix for all resources. Terraform requires 1-28 characters so generated ALB names fit AWS limits.
      id: name
      immutable: true
      label: Name slug
      patterns:
        - message: The name must be 1-28 characters, contain only lowercase letters, numbers, and hyphens, and start and end with a letter or number.
          pattern: ^[a-z0-9]([a-z0-9-]{0,26}[a-z0-9])?$
      required: true
      type: string
    - default: true
      description: Prevent accidental deletion of load balancers created by this module.
      id: load_balancer_deletion_protection_enabled
      label: Load balancer deletion protection
      type: boolean
    - default: enhanced
      description: Configures CloudWatch Container Insights for the ECS cluster. Enhanced observability adds detailed task and container metrics and may increase CloudWatch costs.
      id: container_insights
      label: Container insights
      type: string
      values:
        - label: Enhanced observability
          value: enhanced
        - label: Standard
          value: enabled
        - label: Disabled
          value: disabled
    - id: section_capacity
      label: Capacity providers
      type: section
    - default: true
      description: Allows ECS services in this cluster to use Fargate for serverless task capacity.
      id: fargate_enabled
      label: Fargate
      type: boolean
    - default: true
      description: Allows ECS services in this cluster to use Fargate Spot for lower-cost, interruptible serverless task capacity.
      id: fargate_spot_enabled
      label: Fargate spot
      type: boolean
    - description: Enables the EC2 capacity provider when set. Leave blank to use only Fargate/Fargate Spot.
      id: ec2_instance_type
      label: EC2 instance type
      no_options_message: Select a VPC Network, or enter an AWS account and region, to load available EC2 instance types.
      placeholder: Select an instance type to enable EC2 capacity
      type: string
      values: $values:aws/ec2/instances?awsAccountId=<<module.input.aws_account_id>>&region=<<module.input.aws_region>>
    - description: Configure the EC2 Auto Scaling Group and capacity provider settings used when an instance type is selected.
      id: section_ec2_capacity
      label: EC2 capacity
      show_when:
        ec2_instance_type:
          not: ""
      type: section
    - description: Minimum EC2 instances in the Auto Scaling Group. To speed up deployments and autoscaling, set this high enough to keep spare capacity for all ECS services using this cluster. As a starting point, use about 2x the total desired task instances across those services.
      id: ec2_min_size
      label: Min instances
      min: 0
      placeholder: "0"
      show_when:
        ec2_instance_type:
          not: ""
      type: number
    - description: Maximum EC2 instances in the Auto Scaling Group. Must be high enough to accommodate 2x the total max task instances across all ECS services using this cluster, otherwise deployments can fail.
      id: ec2_max_size
      label: Max instances
      min: 1
      placeholder: "10"
      show_when:
        ec2_instance_type:
          not: ""
      type: number
    - description: Configure the root EBS volume attached to each EC2 capacity instance.
      id: section_ec2_volume
      label: EC2 volume
      show_when:
        ec2_instance_type:
          not: ""
      type: section
    - collapsible: true
      description: Root EBS volume size for EC2 capacity instances.
      id: ec2_root_volume_size
      label: Root volume size (GB)
      max: 16384
      min: 8
      placeholder: "30"
      show_when:
        ec2_instance_type:
          not: ""
      type: number
    - add_button_label: Add security group ID
      collapsible: true
      description: Additional security groups attached to EC2 capacity instances.
      id: ec2_security_group_ids
      label: Additional security groups
      placeholder: sg-...
      show_when:
        ec2_instance_type:
          not: ""
      type: string_array
    - collapsible: true
      default: false
      description: Use Spot instances in the EC2 Auto Scaling Group.
      id: ec2_spot_enabled
      label: Spot instances
      show_when:
        ec2_instance_type:
          not: ""
      type: boolean
    - add_button_label: Add instance type
      collapsible: true
      description: Additional instance types for Spot capacity.
      id: ec2_spot_instance_types
      label: Spot instance types
      placeholder: t3.large
      show_when:
        ec2_spot_enabled: true
        ec2_instance_type:
          not: ""
      type: string_array
    - collapsible: true
      description: Custom AMI for EC2 capacity. Leave blank to use the latest ECS-optimized AMI.
      id: ec2_ami_id
      label: Custom AMI ID
      placeholder: ami-...
      show_when:
        ec2_instance_type:
          not: ""
      type: string
    - collapsible: true
      description: Key pair for SSH access to EC2 capacity instances.
      id: ec2_key_name
      label: SSH key pair name
      placeholder: my-key-pair
      show_when:
        ec2_instance_type:
          not: ""
      type: string
    - collapsible: true
      description: Root EBS volume type.
      id: ec2_root_volume_type
      label: Root volume type
      placeholder: gp3
      show_when:
        ec2_instance_type:
          not: ""
      type: string
      values:
        - label: gp3
          value: gp3
        - label: gp2
          value: gp2
        - label: io1
          value: io1
        - label: io2
          value: io2
    - collapsible: true
      description: Additional user data script appended after ECS config.
      id: ec2_user_data
      label: Additional user data
      placeholder: "#!/bin/bash"
      show_when:
        ec2_instance_type:
          not: ""
      type: text
    - collapsible: true
      default: true
      description: Managed termination protection for EC2 capacity.
      id: ec2_managed_termination_protection_enabled
      label: Managed termination protection
      show_when:
        ec2_instance_type:
          not: ""
      type: boolean
    - collapsible: true
      default: true
      description: Lets ECS automatically scale the EC2 Auto Scaling Group to match task demand. Disable to manage the instance count yourself.
      id: ec2_managed_scaling_enabled
      label: Managed scaling
      show_when:
        ec2_instance_type:
          not: ""
      type: boolean
    - collapsible: true
      description: Defaults to 100% which means ECS autoscales EC2 instances to have zero extra capacity (cheapest). Reduce to something like 80-90% if you want to pay for spare capacity for faster autoscaling.
      id: ec2_managed_scaling_target_capacity
      label: Managed scaling target capacity (%)
      max: 100
      min: 1
      placeholder: "100"
      show_when:
        ec2_instance_type:
          not: ""
        ec2_managed_scaling_enabled: true
      type: number
    - description: Internet-facing Application Load Balancers for services that should receive traffic from the public internet, such as websites, public APIs, and webhook endpoints.
      id: section_public_albs
      label: Public application load balancers
      type: section
    - label: Public load balancers
      default:
        - name: <<project.given_id>>-<<environment.given_id>>-pub
          https_enabled: true
      description: Each entry creates one internet-facing Application Load Balancer. Services on this cluster choose a load balancer by name.
      id: public_albs
      item_label: Public load balancer
      item_title:
        template: "{name}"
      item_inputs:
        - description: Unique load balancer name.
          id: name
          label: Name
          patterns:
            - message: The name must be 1-32 characters, contain only letters, numbers, and hyphens, and start and end with a letter or number.
              pattern: ^[a-zA-Z0-9]([a-zA-Z0-9-]{0,30}[a-zA-Z0-9])?$
          required: true
          type: string
        - default: true
          description: Enable an HTTPS listener on this load balancer.
          id: https_enabled
          label: HTTPS
          type: boolean
        - $template: ../../partials/templates/alb-certificate-input.yml
          with:
            additional_certificate_arns_description: Additional ACM certificate ARNs attached to the HTTPS listener for SNI.
            additional_certificate_arns_input_id: additional_certificate_arns
            certificate_arns_description: ACM certificate ARNs resolved from the selected module. The first ARN is the default certificate.
            certificate_arns_input_id: certificate_arns
            certificate_description: Primary ACM certificate module for HTTPS.
            certificate_input_id: certificate
            show_when:
              https_enabled: true
        - collapsible: true
          description: SSL policy for the HTTPS listener.
          id: ssl_policy
          label: SSL policy
          placeholder: ELBSecurityPolicy-TLS13-1-2-2021-06
          show_when:
            https_enabled: true
          type: string
        - add_button_label: Add CIDR block
          collapsible: true
          description: Allowed IPv4 CIDRs. Defaults to allowing all IPv4 traffic.
          id: ingress_cidr_blocks
          label: Ingress CIDRs
          placeholder: 0.0.0.0/0
          type: string_array
        - add_button_label: Add IPv6 CIDR block
          collapsible: true
          description: Allowed IPv6 CIDRs. Defaults to allowing all IPv6 traffic.
          id: ingress_ipv6_cidr_blocks
          label: Ingress IPv6 CIDRs
          placeholder: ::/0
          type: string_array
        - add_button_label: Add security group
          collapsible: true
          description: Security groups whose members can access this load balancer. Useful for sources without static CIDRs, such as CloudFront VPC origins.
          id: ingress_security_group_ids
          label: Ingress security groups
          placeholder: sg-...
          type: string_array
        - collapsible: true
          description: Idle timeout for this load balancer.
          id: idle_timeout
          label: Idle timeout (seconds)
          max: 4000
          min: 1
          placeholder: "60"
          type: number
        - collapsible: true
          description: WAFv2 Web ACL ARN for this load balancer.
          id: web_acl_arn
          label: WAF web ACL ARN
          placeholder: arn:aws:wafv2:...
          type: string
        - collapsible: true
          default: false
          description: Enable access logging for this load balancer.
          id: access_logs_enabled
          label: Access logs
          type: boolean
        - collapsible: true
          description: Existing S3 bucket ARN for access logs.
          id: access_logs_bucket_arn
          label: Access logs bucket ARN
          placeholder: arn:aws:s3:::my-bucket
          show_when:
            access_logs_enabled: true
          type: string
      type: object_array
    - description: Internal Application Load Balancers for services that should only be reachable inside the VPC or private network, such as internal APIs, admin tools, and service-to-service traffic.
      id: section_private_albs
      label: Private application load balancers
      type: section
    - label: Private load balancers
      default: []
      description: Each entry creates one internal Application Load Balancer. Services on this cluster choose a load balancer by name.
      id: private_albs
      item_label: Private load balancer
      item_title:
        template: "{name}"
      item_inputs:
        - description: Unique load balancer name.
          id: name
          label: Name
          patterns:
            - message: The name must be 1-32 characters, contain only letters, numbers, and hyphens, and start and end with a letter or number.
              pattern: ^[a-zA-Z0-9]([a-zA-Z0-9-]{0,30}[a-zA-Z0-9])?$
          required: true
          type: string
        - default: false
          description: Enable an HTTPS listener on this load balancer.
          id: https_enabled
          label: HTTPS
          type: boolean
        - $template: ../../partials/templates/alb-certificate-input.yml
          with:
            additional_certificate_arns_description: Additional ACM certificate ARNs attached to the HTTPS listener for SNI.
            additional_certificate_arns_input_id: additional_certificate_arns
            certificate_arns_description: ACM certificate ARNs resolved from the selected module. The first ARN is the default certificate.
            certificate_arns_input_id: certificate_arns
            certificate_description: Primary ACM certificate module for HTTPS.
            certificate_input_id: certificate
            show_when:
              https_enabled: true
        - collapsible: true
          description: SSL policy for the HTTPS listener.
          id: ssl_policy
          label: SSL policy
          placeholder: ELBSecurityPolicy-TLS13-1-2-2021-06
          show_when:
            https_enabled: true
          type: string
        - add_button_label: Add CIDR block
          collapsible: true
          description: Allowed IPv4 CIDRs. Terraform defaults to RFC1918 private ranges.
          id: ingress_cidr_blocks
          label: Ingress CIDRs
          placeholder: 10.0.0.0/8
          type: string_array
        - add_button_label: Add IPv6 CIDR block
          collapsible: true
          description: Allowed IPv6 CIDRs. Defaults to no IPv6 ingress.
          id: ingress_ipv6_cidr_blocks
          label: Ingress IPv6 CIDRs
          placeholder: fd00::/8
          type: string_array
        - add_button_label: Add security group
          collapsible: true
          description: Security groups whose members can access this load balancer. Useful for sources without static CIDRs, such as CloudFront VPC origins.
          id: ingress_security_group_ids
          label: Ingress security groups
          placeholder: sg-...
          type: string_array
        - collapsible: true
          description: Idle timeout for this load balancer.
          id: idle_timeout
          label: Idle timeout (seconds)
          max: 4000
          min: 1
          placeholder: "60"
          type: number
        - collapsible: true
          default: false
          description: Enable access logging for this load balancer.
          id: access_logs_enabled
          label: Access logs
          type: boolean
        - collapsible: true
          description: Existing S3 bucket ARN for access logs.
          id: access_logs_bucket_arn
          label: Access logs bucket ARN
          placeholder: arn:aws:s3:::my-bucket
          show_when:
            access_logs_enabled: true
          type: string
      type: object_array
    - description: Use Network Load Balancers for TCP/UDP workloads, static IP requirements, very high-throughput connections, or protocols that do not need HTTP routing. For normal web apps and HTTP APIs, prefer the Application Load Balancer sections above.
      id: section_nlb
      label: Network load balancers
      type: section
    - label: Public network load balancers
      default: []
      description: Each entry creates one internet-facing Network Load Balancer. Services on this cluster choose a load balancer by name.
      id: public_nlbs
      item_label: Public NLB
      item_title:
        template: "{name}"
      item_inputs:
        - description: Unique load balancer name.
          id: name
          label: Name
          patterns:
            - message: The name must be 1-32 characters, contain only letters, numbers, and hyphens, and start and end with a letter or number.
              pattern: ^[a-zA-Z0-9]([a-zA-Z0-9-]{0,30}[a-zA-Z0-9])?$
          required: true
          type: string
        - add_button_label: Add security group ID
          collapsible: true
          description: Security groups for this load balancer.
          id: security_group_ids
          label: Security groups
          placeholder: sg-...
          type: string_array
        - collapsible: true
          default: false
          description: Enable cross-zone load balancing.
          id: cross_zone_load_balancing_enabled
          label: Cross-zone load balancing
          type: boolean
        - collapsible: true
          default: false
          description: Assign static Elastic IPs to this load balancer.
          id: elastic_ips_enabled
          label: Use elastic IPs
          type: boolean
        - add_button_label: Add allocation ID
          collapsible: true
          description: Elastic IP allocation IDs, one per subnet.
          id: elastic_ip_allocation_ids
          label: Elastic IP allocation IDs
          placeholder: eipalloc-...
          show_when:
            elastic_ips_enabled: true
          type: string_array
        - collapsible: true
          default: false
          description: Enable access logging for this load balancer.
          id: access_logs_enabled
          label: Access logs
          type: boolean
        - collapsible: true
          description: Existing S3 bucket ARN for access logs.
          id: access_logs_bucket_arn
          label: Access logs bucket ARN
          placeholder: arn:aws:s3:::my-bucket
          show_when:
            access_logs_enabled: true
          type: string
      type: object_array
    - label: Private network load balancers
      default: []
      description: Each entry creates one internal Network Load Balancer. Services on this cluster choose a load balancer by name.
      id: private_nlbs
      item_label: Private NLB
      item_title:
        template: "{name}"
      item_inputs:
        - description: Unique load balancer name.
          id: name
          label: Name
          patterns:
            - message: The name must be 1-32 characters, contain only letters, numbers, and hyphens, and start and end with a letter or number.
              pattern: ^[a-zA-Z0-9]([a-zA-Z0-9-]{0,30}[a-zA-Z0-9])?$
          required: true
          type: string
        - add_button_label: Add security group ID
          collapsible: true
          description: Security groups for this load balancer.
          id: security_group_ids
          label: Security groups
          placeholder: sg-...
          type: string_array
        - collapsible: true
          default: false
          description: Enable cross-zone load balancing.
          id: cross_zone_load_balancing_enabled
          label: Cross-zone load balancing
          type: boolean
        - collapsible: true
          default: false
          description: Assign static Elastic IPs to this load balancer.
          id: elastic_ips_enabled
          label: Use elastic IPs
          type: boolean
        - add_button_label: Add allocation ID
          collapsible: true
          description: Elastic IP allocation IDs, one per subnet.
          id: elastic_ip_allocation_ids
          label: Elastic IP allocation IDs
          placeholder: eipalloc-...
          show_when:
            elastic_ips_enabled: true
          type: string_array
        - collapsible: true
          default: false
          description: Enable access logging for this load balancer.
          id: access_logs_enabled
          label: Access logs
          type: boolean
        - collapsible: true
          description: Existing S3 bucket ARN for access logs.
          id: access_logs_bucket_arn
          label: Access logs bucket ARN
          placeholder: arn:aws:s3:::my-bucket
          show_when:
            access_logs_enabled: true
          type: string
      type: object_array
    - $include: ../../partials/inputs/misc-section.yml
    - $include: ../../partials/inputs/tags.yml
    - $include: ../../partials/inputs/terraform-settings.yml
  readme: |-
    Production-ready AWS ECS cluster with Fargate, Fargate Spot, optional EC2 capacity, and shared load balancers.

    ## Overview

    Amazon ECS (Elastic Container Service) runs containerized workloads on AWS. This module creates an ECS cluster inside your selected VPC and configures the capacity providers and shared load balancers that services can use.

    The ECS cluster module provides:

    - **Fargate and Fargate Spot** capacity providers for serverless containers
    - **Optional EC2 capacity** with an Auto Scaling Group and managed ECS capacity provider
    - **Public and private Application Load Balancers** for HTTP and HTTPS services
    - **Public and private Network Load Balancers** for TCP/UDP and static IP use cases
    - **CloudWatch Container Insights** dashboard metrics for production visibility

    Terraform source: [flightcontrolhq/modules/compute/ecs_cluster](https://github.com/flightcontrolhq/modules/tree/$local.module_tag/compute/ecs_cluster)

    ## Use cases

    | Scenario                       | ECS cluster helps by...                                          |
    | ------------------------------ | ---------------------------------------------------------------- |
    | Running web apps and APIs      | Providing Fargate capacity and shared ALBs for HTTP traffic      |
    | Reducing compute cost          | Allowing services to use Fargate Spot or EC2 Spot capacity       |
    | Hosting private services       | Creating internal load balancers reachable only inside the VPC   |
    | Running TCP/UDP workloads      | Creating Network Load Balancers for non-HTTP protocols           |
    | Operating production workloads | Enabling Container Insights metrics for tasks, services, and EC2 |
    | Supporting custom runtimes     | Adding EC2 capacity when workloads need host-level control       |

    ## Capacity providers

    ### Fargate

    Fargate runs containers without managing EC2 instances. It is the simplest option for most web apps, APIs, workers, and scheduled tasks.

    ### Fargate Spot

    Fargate Spot uses spare AWS capacity at a lower cost. It is best for interruptible workloads such as queues, batch jobs, background workers, and services that can tolerate replacement tasks.

    ### EC2 capacity

    EC2 capacity creates an Auto Scaling Group and ECS capacity provider for tasks that need host-level control, custom AMIs, SSH access, special networking, or lower long-running compute costs.

    Select an **EC2 instance type** to enable EC2 capacity. Leave it blank for a Fargate-only cluster.

    ## Load balancers

    ### Public application load balancers

    Creates internet-facing Application Load Balancers for services that should receive public HTTP or HTTPS traffic, such as websites, public APIs, and webhook endpoints. Add multiple entries when services need separate load balancers; each entry has its own name, HTTPS/certificate, timeout, WAF, and access log settings, and services select one by name.

    Use a public ALB for:

    - Websites and browser apps
    - Public APIs
    - Webhooks
    - HTTP/HTTPS traffic with host or path routing

    ### Private application load balancers

    Creates internal Application Load Balancers for services reachable only inside the VPC or private network, such as internal APIs, admin tools, and service-to-service traffic. Add multiple entries when services need separate load balancers.

    Use a private ALB for:

    - Internal APIs
    - Admin dashboards
    - Backend services
    - Private HTTP/HTTPS routing

    For any ALB entry, the selected Certificate is the default HTTPS certificate. Use Additional certificate ARNs to attach more ACM certificates to the same listener through SNI.

    ### Network load balancers

    Use Network Load Balancers for TCP/UDP workloads, static IP requirements, very high-throughput connections, or protocols that do not need HTTP routing. For normal web apps and HTTP APIs, prefer an Application Load Balancer. Public and private NLBs are also configured as arrays, so one cluster can own several NLBs and services select one by name.

    ## Observability

    Container Insights collects ECS cluster, service, and task CPU, memory, network, and storage metrics in CloudWatch. The module dashboard includes:

    - CPU and memory used
    - Running task and service counts
    - Network received and sent
    - Storage read and write
    - EC2 container instance count
    - EC2 instance CPU, memory, running task, and reserved capacity metrics

    Metrics appear only after tasks are running in the cluster. EC2-specific charts appear only when EC2 capacity exists and the required Container Insights instance metrics are available.

    ## Configuration

    | Field                 | Required | Default              | Description                                                   |
    | --------------------- | -------- | -------------------- | ------------------------------------------------------------- |
    | VPC network           | Yes      | —                    | Existing VPC, subnets, AWS account, and region                |
    | Name slug             | Yes      | `{project}-{env}`    | Name prefix for ECS and load balancer resources               |
    | Container insights    | No       | `enhanced`           | Collect enhanced task, service, cluster, and EC2 metrics in CloudWatch |
    | Fargate               | No       | `true`               | Allow services to use Fargate capacity                        |
    | Fargate Spot          | No       | `true`               | Allow services to use lower-cost interruptible Fargate Spot   |
    | EC2 instance type     | No       | —                    | Enables EC2 capacity when selected                            |
    | Public load balancers  | No      | one ALB              | Array of internet-facing ALBs with per-entry settings         |
    | Private load balancers | No      | `[]`                 | Array of internal ALBs with per-entry settings                |
    | Public NLBs           | No       | `[]`                 | Array of internet-facing Network Load Balancers               |
    | Private NLBs          | No       | `[]`                 | Array of internal Network Load Balancers                      |
    | Tags                  | No       | Environment, Project | Custom tags applied to all resources                          |

    ## EC2 capacity settings

    | Field                           | Description                                             |
    | ------------------------------- | ------------------------------------------------------- |
    | Minimum instances               | Keep enough EC2 capacity for all ECS services; start around 2x the total desired task instances |
    | Maximum instances               | Must fit 2x the total max task instances across all ECS services, or deployments can fail       |
    | Root volume size                | Root EBS volume size for ECS instances                  |
    | Additional security groups      | Extra security groups attached to ECS instances         |
    | Spot instances                  | Use Spot instances in the EC2 Auto Scaling Group        |
    | Spot instance types             | Additional instance types for mixed Spot capacity       |
    | Custom AMI ID                   | Custom ECS AMI; blank uses the latest ECS-optimized AMI |
    | Key pair name                   | EC2 key pair for SSH access                             |
    | Managed scaling                 | Let ECS scale the Auto Scaling Group to match task demand |
    | Managed scaling target capacity | Spare capacity target for ECS managed scaling           |

    ## Design decisions

    This ECS cluster follows AWS ECS production patterns:

    - **Fargate-first defaults:** Fargate and Fargate Spot are enabled so services can start without managing instances
    - **EC2 opt-in:** EC2 capacity is created only when an instance type is selected
    - **Shared load balancers:** Cluster-level ALBs and NLBs can be reused by services in the environment, and each cluster can own several of each so services can select a specific one by name
    - **Private subnet placement:** ECS tasks and EC2 capacity use private subnets from the selected VPC
    - **Public ingress by default:** Public ALBs use Terraform's default internet ingress unless overridden in Terraform
    - **Private ingress by default:** Private ALBs use Terraform's default RFC1918 private CIDR ranges and no IPv6 ingress unless overridden
    - **Enhanced Container Insights:** Enhanced production metrics are collected by default for operational visibility

    ## Learn more

    **Amazon ECS**

    - [Amazon ECS Developer Guide](https://docs.aws.amazon.com/AmazonECS/latest/developerguide/) — Official documentation
    - [Fargate capacity providers](https://docs.aws.amazon.com/AmazonECS/latest/developerguide/fargate-capacity-providers.html) — Fargate and Fargate Spot behavior
    - [Amazon ECS capacity providers](https://docs.aws.amazon.com/AmazonECS/latest/developerguide/cluster-capacity-providers.html) — Capacity provider strategy and EC2 integration

    **Load balancing and observability**

    - [Application Load Balancers](https://docs.aws.amazon.com/elasticloadbalancing/latest/application/introduction.html) — HTTP/HTTPS load balancing
    - [Network Load Balancers](https://docs.aws.amazon.com/elasticloadbalancing/latest/network/introduction.html) — TCP/UDP and static IP load balancing
    - [ECS Container Insights](https://docs.aws.amazon.com/AmazonECS/latest/developerguide/cloudwatch-container-insights.html) — CloudWatch metrics and dashboards
  stack:
    $template: ../../partials/templates/opentofu-stack.yml
    with:
      base_path: compute/ecs_cluster
      terraform_variables:
        ...overrides: << module.input.advanced_terraform_variables >>
        load_balancer_deletion_protection_enabled: << module.input.load_balancer_deletion_protection_enabled >>
        ec2_ami_id: << module.input.ec2_ami_id >>
        ec2_spot_enabled: << module.input.ec2_spot_enabled >>
        ec2_instance_type: << module.input.ec2_instance_type >>
        ec2_key_name: << module.input.ec2_key_name >>
        ec2_managed_scaling_enabled: << module.input.ec2_managed_scaling_enabled >>
        ec2_managed_scaling_target_capacity: << module.input.ec2_managed_scaling_target_capacity >>
        ec2_managed_termination_protection_enabled: << module.input.ec2_managed_termination_protection_enabled >>
        ec2_max_size: << module.input.ec2_max_size >>
        ec2_min_size: << module.input.ec2_min_size >>
        ec2_root_volume_size: << module.input.ec2_root_volume_size >>
        ec2_root_volume_type: << module.input.ec2_root_volume_type >>
        ec2_security_group_ids: << module.input.ec2_security_group_ids >>
        ec2_spot_instance_types: << module.input.ec2_spot_instance_types >>
        ec2_user_data: << module.input.ec2_user_data >>
        container_insights: << module.input.container_insights >>
        fargate_enabled: << module.input.fargate_enabled >>
        fargate_spot_enabled: << module.input.fargate_spot_enabled >>
        name: << module.input.name >>
        public_albs: >-
          << map(module.input.public_albs != nil ? module.input.public_albs : [], {"name": #.name,
          "https_enabled": #.https_enabled, "certificate_arns": ((#.certificate_arns != nil ?
          #.certificate_arns : []) | concat(#.additional_certificate_arns != nil ?
          #.additional_certificate_arns : [])), "ssl_policy": #.ssl_policy, "idle_timeout":
          #.idle_timeout, "ingress_cidr_blocks": (#.ingress_cidr_blocks != nil &&
          len(#.ingress_cidr_blocks) > 0 ? #.ingress_cidr_blocks : nil), "ingress_ipv6_cidr_blocks":
          (#.ingress_ipv6_cidr_blocks != nil && len(#.ingress_ipv6_cidr_blocks) > 0 ?
          #.ingress_ipv6_cidr_blocks : nil), "ingress_security_group_ids":
          (#.ingress_security_group_ids != nil ? #.ingress_security_group_ids : []),
          "web_acl_arn": #.web_acl_arn, "access_logs_enabled": #.access_logs_enabled,
          "access_logs_bucket_arn": #.access_logs_bucket_arn}) >>
        private_albs: >-
          << map(module.input.private_albs != nil ? module.input.private_albs : [], {"name": #.name,
          "https_enabled": #.https_enabled, "certificate_arns": ((#.certificate_arns != nil ?
          #.certificate_arns : []) | concat(#.additional_certificate_arns != nil ?
          #.additional_certificate_arns : [])), "ssl_policy": #.ssl_policy, "idle_timeout":
          #.idle_timeout, "ingress_cidr_blocks": (#.ingress_cidr_blocks != nil &&
          len(#.ingress_cidr_blocks) > 0 ? #.ingress_cidr_blocks : nil), "ingress_ipv6_cidr_blocks":
          (#.ingress_ipv6_cidr_blocks != nil && len(#.ingress_ipv6_cidr_blocks) > 0 ?
          #.ingress_ipv6_cidr_blocks : nil), "ingress_security_group_ids":
          (#.ingress_security_group_ids != nil ? #.ingress_security_group_ids : []),
          "access_logs_enabled": #.access_logs_enabled, "access_logs_bucket_arn":
          #.access_logs_bucket_arn}) >>
        public_nlbs: >-
          << map(module.input.public_nlbs != nil ? module.input.public_nlbs : [], {"name": #.name,
          "cross_zone_load_balancing_enabled": #.cross_zone_load_balancing_enabled,
          "security_group_ids": (#.security_group_ids != nil ? #.security_group_ids : []),
          "elastic_ips_enabled": #.elastic_ips_enabled, "elastic_ip_allocation_ids":
          (#.elastic_ip_allocation_ids != nil ? #.elastic_ip_allocation_ids : []),
          "access_logs_enabled": #.access_logs_enabled, "access_logs_bucket_arn":
          #.access_logs_bucket_arn}) >>
        private_nlbs: >-
          << map(module.input.private_nlbs != nil ? module.input.private_nlbs : [], {"name": #.name,
          "cross_zone_load_balancing_enabled": #.cross_zone_load_balancing_enabled,
          "security_group_ids": (#.security_group_ids != nil ? #.security_group_ids : []),
          "elastic_ips_enabled": #.elastic_ips_enabled, "elastic_ip_allocation_ids":
          (#.elastic_ip_allocation_ids != nil ? #.elastic_ip_allocation_ids : []),
          "access_logs_enabled": #.access_logs_enabled, "access_logs_bucket_arn":
          #.access_logs_bucket_arn}) >>
        private_subnet_ids: << module.input.private_subnet_ids >>
        public_subnet_ids: << module.input.public_subnet_ids || [] >>
        region: << module.input.aws_region >>
        tags:
          $include: ../stack/ravion-tags.yml
        vpc_id: << module.input.vpc_id >>
  ui:
    links: |-
      <<
      map(stack.output.public_albs != nil ? stack.output.public_albs : [], {"name": "Public ALB " + #.name, "href": (#.https_enabled ? "https://" : "http://") + #.dns_name}) +
      map(stack.output.private_albs != nil ? stack.output.private_albs : [], {"name": "Private ALB " + #.name, "href": (#.https_enabled ? "https://" : "http://") + #.dns_name}) +
      map(stack.output.public_nlbs != nil ? stack.output.public_nlbs : [], {"name": "Public NLB " + #.name, "href": "http://" + #.dns_name}) +
      map(stack.output.private_nlbs != nil ? stack.output.private_nlbs : [], {"name": "Private NLB " + #.name, "href": "http://" + #.dns_name})
      >>
    metrics:
      - id: task_cpu_utilization
        name: CPU used
        source:
          aws_account_id: << module.input.aws_account_id >>
          dimensions:
            ClusterName: << stack.output.cluster_name >>
          name: CpuUtilized
          namespace: ECS/ContainerInsights
          region: << stack.output.region >>
          statistic: Average
          type: cloudwatch
        type: line
      - id: task_memory_utilization
        name: Memory used
        source:
          aws_account_id: << module.input.aws_account_id >>
          dimensions:
            ClusterName: << stack.output.cluster_name >>
          name: MemoryUtilized
          namespace: ECS/ContainerInsights
          region: << stack.output.region >>
          statistic: Average
          type: cloudwatch
        type: line
      - id: running_tasks
        name: Running tasks
        source:
          aws_account_id: << module.input.aws_account_id >>
          dimensions:
            ClusterName: << stack.output.cluster_name >>
          name: TaskCount
          namespace: ECS/ContainerInsights
          region: << stack.output.region >>
          statistic: Average
          type: cloudwatch
        type: line
      - id: services
        name: Services
        source:
          aws_account_id: << module.input.aws_account_id >>
          dimensions:
            ClusterName: << stack.output.cluster_name >>
          name: ServiceCount
          namespace: ECS/ContainerInsights
          region: << stack.output.region >>
          statistic: Average
          type: cloudwatch
        type: line
      - id: network_rx
        name: Network received
        source:
          aws_account_id: << module.input.aws_account_id >>
          dimensions:
            ClusterName: << stack.output.cluster_name >>
          name: NetworkRxBytes
          namespace: ECS/ContainerInsights
          region: << stack.output.region >>
          statistic: Sum
          type: cloudwatch
        type: line
      - id: network_tx
        name: Network sent
        source:
          aws_account_id: << module.input.aws_account_id >>
          dimensions:
            ClusterName: << stack.output.cluster_name >>
          name: NetworkTxBytes
          namespace: ECS/ContainerInsights
          region: << stack.output.region >>
          statistic: Sum
          type: cloudwatch
        type: line
      - id: storage_read
        name: Storage read
        source:
          aws_account_id: << module.input.aws_account_id >>
          dimensions:
            ClusterName: << stack.output.cluster_name >>
          name: StorageReadBytes
          namespace: ECS/ContainerInsights
          region: << stack.output.region >>
          statistic: Sum
          type: cloudwatch
        type: line
      - id: storage_write
        name: Storage write
        source:
          aws_account_id: << module.input.aws_account_id >>
          dimensions:
            ClusterName: << stack.output.cluster_name >>
          name: StorageWriteBytes
          namespace: ECS/ContainerInsights
          region: << stack.output.region >>
          statistic: Sum
          type: cloudwatch
        type: line
      - id: ec2_container_instances
        name: EC2 container instances
        source:
          aws_account_id: << module.input.aws_account_id >>
          dimensions:
            ClusterName: << stack.output.cluster_name >>
          name: ContainerInstanceCount
          namespace: ECS/ContainerInsights
          region: << stack.output.region >>
          statistic: Average
          type: cloudwatch
        type: line
      - id: ec2_instance_cpu_utilization
        name: EC2 instance CPU utilization
        source:
          aws_account_id: << module.input.aws_account_id >>
          dimensions:
            ClusterName: << stack.output.cluster_name >>
          name: instance_cpu_utilization
          namespace: ECS/ContainerInsights
          region: << stack.output.region >>
          statistic: Average
          type: cloudwatch
        type: line
      - id: ec2_instance_memory_utilization
        name: EC2 instance memory utilization
        source:
          aws_account_id: << module.input.aws_account_id >>
          dimensions:
            ClusterName: << stack.output.cluster_name >>
          name: instance_memory_utilization
          namespace: ECS/ContainerInsights
          region: << stack.output.region >>
          statistic: Average
          type: cloudwatch
        type: line
      - id: ec2_running_tasks
        name: EC2 running tasks
        source:
          aws_account_id: << module.input.aws_account_id >>
          dimensions:
            ClusterName: << stack.output.cluster_name >>
          name: instance_number_of_running_tasks
          namespace: ECS/ContainerInsights
          region: << stack.output.region >>
          statistic: Average
          type: cloudwatch
        type: line
      - id: ec2_cpu_reserved_capacity
        name: EC2 CPU reserved capacity
        source:
          aws_account_id: << module.input.aws_account_id >>
          dimensions:
            ClusterName: << stack.output.cluster_name >>
          name: instance_cpu_reserved_capacity
          namespace: ECS/ContainerInsights
          region: << stack.output.region >>
          statistic: Average
          type: cloudwatch
        type: line
      - id: ec2_memory_reserved_capacity
        name: EC2 memory reserved capacity
        source:
          aws_account_id: << module.input.aws_account_id >>
          dimensions:
            ClusterName: << stack.output.cluster_name >>
          name: instance_memory_reserved_capacity
          namespace: ECS/ContainerInsights
          region: << stack.output.region >>
          statistic: Average
          type: cloudwatch
        type: line
