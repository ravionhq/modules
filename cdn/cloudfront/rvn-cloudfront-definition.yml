definition:
  type: rvn-cloudfront
  name: CloudFront CDN
  description: CloudFront CDN distribution that serves web applications and private S3 buckets from ECS services, load balancers, S3 origins, and other custom origins.
release:
  version: 1.1.0
  description: Add an optional module-managed cache policy that includes the Accept header in the cache key.
module:
  inputs:
    - $include: ../../partials/inputs/aws-account.yml
    - $merge:
        - ../../partials/inputs/aws-region.yml
      default: us-east-1
      description: CloudFront is global. Access logs go to CloudWatch Logs in us-east-1 by default; this region is used for the optional S3 logging bucket.
    - id: section_distribution
      label: Distribution
      type: section
    - id: name
      immutable: true
      label: Name slug
      type: string
      description: Name prefix for the distribution comment, origin access control, and logging bucket.
      required: true
      default: <<project.given_id>>-<<environment.given_id>>-<<module.given_id>>
      patterns:
        - message: 1-63 letters, numbers, or hyphens. Start with a letter.
          pattern: ^[a-zA-Z][a-zA-Z0-9-]{0,62}$
    - id: distribution_aliases
      label: Domain aliases
      type: string_array
      description: Custom domain names like app.example.com. Leave empty to use the default cloudfront.net domain. Aliases must match the domain host rules on the origin load balancer when it routes by host.
      add_button_label: Add domain alias
      default: []
    - id: certificate
      label: ACM certificate
      type: $ref:rvn-acm-certificate
      description: Certificate for the domain aliases. Required when aliases are set. CloudFront requires the certificate to be issued in us-east-1.
      required: false
      mapped_inputs:
        - id: acm_certificate_arn
          label: ACM certificate ARN
          type: string
          description: Certificate ARN from the selected ACM certificate module. Must be in us-east-1.
          placeholder: arn:aws:acm:us-east-1:123456789012:certificate/abc-123
          required: false
          default: <<ref.stack.output.certificate_arn>>
    - id: section_origin
      label: Origin
      type: section
      description: Where CloudFront sends requests. ECS web services and clusters share one load balancer, and private S3 buckets use Origin Access Control.
    - id: origin_source
      label: Origin source
      type: string
      description: Choose an existing ECS module, private S3 bucket, or custom origin domain name.
      required: true
      default: ecs_web_service
      values:
        - label: ECS web service
          description: Use the load balancer of an existing ECS web service as the origin.
          value: ecs_web_service
        - label: ECS cluster
          description: Use the public ALB of an existing ECS cluster as the origin.
          value: ecs_cluster
        - label: S3 bucket
          description: Use a private S3 bucket as the origin with CloudFront Origin Access Control.
          value: s3_bucket
        - label: Custom domain
          description: Enter any origin domain name, such as a load balancer, API endpoint, or S3 website endpoint.
          value: custom
    - id: ecs_web_service
      label: ECS web service
      type: $ref:rvn-ecs-web
      description: ECS web service whose load balancer becomes the origin. The service must be on rvn-ecs-web 0.8.0 or later so its stack exposes the load balancer DNS name.
      required: false
      show_when:
        origin_source: ecs_web_service
      mapped_inputs:
        - id: ecs_web_alb_dns_name
          label: Service load balancer DNS name
          type: string
          description: Load balancer DNS name from the selected ECS web service, used as the origin domain. If this is empty, update the service to rvn-ecs-web 0.8.0 or later and apply its stack, then re-select the service.
          required: true
          default: <<ref.stack.output.load_balancer_dns_name>>
        - id: ecs_web_alb_arn
          label: Service load balancer ARN
          type: string
          description: Load balancer ARN from the selected ECS web service, used to create the CloudFront VPC origin when private origin is enabled. If this is empty, update the service to rvn-ecs-web 0.8.0 or later and apply its stack, then re-select the service.
          required: false
          default: <<ref.stack.output.load_balancer_arn>>
    - id: origin_vpc_enabled
      label: Private origin (VPC origin)
      type: boolean
      description: Connect to the service's load balancer through a CloudFront VPC origin instead of over the public internet. Use when the service runs on a private (internal) load balancer.
      default: false
      show_when:
        origin_source: ecs_web_service
    - id: origin_vpc_domain_name
      label: VPC origin domain name
      type: string
      description: Host name CloudFront uses as the origin domain and Host header. With HTTPS to the origin, it must be covered by the load balancer's TLS certificate and match the service's host-based listener rule. No public DNS record is required.
      placeholder: my-service.private.example.com
      required: true
      show_when:
        origin_vpc_enabled: true
    - id: ecs_cluster
      label: ECS cluster
      type: $ref:rvn-ecs-cluster
      description: ECS cluster whose public ALB becomes the origin. Listener rules on the ALB keep routing requests to the right services.
      required: false
      show_when:
        origin_source: ecs_cluster
      mapped_inputs:
        - id: ecs_cluster_alb_dns_name
          label: Cluster public ALB DNS name
          type: string
          description: Public ALB DNS name from the selected ECS cluster, used as the origin domain. If this is empty, the selected cluster has no public ALB or has not applied its stack.
          required: true
          default: <<ref.stack.output.public_alb_dns_name>>
    - id: origin_domain_name
      label: Origin domain name
      type: string
      description: Domain name CloudFront connects to for the primary origin.
      placeholder: my-alb-1234567890.us-east-1.elb.amazonaws.com
      required: true
      show_when:
        origin_source: custom
    - id: s3_bucket
      label: S3 bucket
      type: $ref:rvn-s3
      description: Private S3 bucket to serve through CloudFront Origin Access Control. After this CloudFront stack applies, add its distribution ARN to the S3 bucket's CloudFront OAC read policy template.
      required: false
      show_when:
        origin_source: s3_bucket
      mapped_inputs:
        - id: s3_bucket_regional_domain_name
          label: S3 bucket regional domain name
          type: string
          description: Regional S3 bucket domain name from the selected S3 bucket module.
          required: true
          default: <<ref.stack.output.bucket_regional_domain_name>>
    - id: origin_protocol_policy
      label: Origin protocol policy
      type: string
      description: How CloudFront connects to the origin. HTTPS only requires the origin load balancer to serve a certificate valid for the forwarded host.
      required: true
      default: https-only
      show_when:
        origin_source:
          - ecs_web_service
          - ecs_cluster
          - custom
      values:
        - label: HTTPS only
          value: https-only
        - label: HTTP only
          value: http-only
        - label: Match viewer
          value: match-viewer
    - id: origin_custom_headers
      label: Origin custom headers
      type: object_array
      description: Headers CloudFront adds to every request sent to the primary origin. Use them for origin authentication or routing.
      collapsible: true
      required: false
      show_when:
        origin_source:
          - ecs_web_service
          - ecs_cluster
          - custom
      item_label: Custom header
      item_title:
        template: "{name}"
      item_inputs:
        - id: name
          label: Header name
          type: string
          placeholder: X-Origin-Auth
          required: true
        - id: value
          label: Header value
          type: string
          required: true
      default: []
    - id: additional_origins
      label: Additional origins
      type: object_array
      description: Optional extra origins that custom cache behaviors can route paths to. Each origin needs a unique ID.
      collapsible: true
      required: false
      item_label: Origin
      item_title:
        template: "{origin_id}"
      item_description: "{domain_name}"
      item_inputs:
        - id: origin_id
          label: Origin ID
          type: string
          description: Unique identifier referenced by cache behaviors. The primary origin uses the ID primary.
          required: true
        - id: domain_name
          label: Domain name
          type: string
          placeholder: assets.example.com
          required: true
        - id: origin_path
          label: Origin path
          type: string
          description: Optional path prefix CloudFront adds to requests sent to this origin.
          placeholder: /base-path
          required: false
        - id: origin_protocol_policy
          label: Origin protocol policy
          type: string
          required: true
          default: https-only
          values:
            - label: HTTPS only
              value: https-only
            - label: HTTP only
              value: http-only
            - label: Match viewer
              value: match-viewer
        - id: custom_headers
          label: Custom headers
          type: object_array
          description: Headers CloudFront adds to every request sent to this origin.
          collapsible: true
          required: false
          item_label: Custom header
          item_title:
            template: "{name}"
          item_inputs:
            - id: name
              label: Header name
              type: string
              placeholder: X-Origin-Auth
              required: true
            - id: value
              label: Header value
              type: string
              required: true
          default: []
      default: []
    - id: section_edge_redirects
      label: Edge redirects
      type: section
      description: Return redirects from CloudFront before contacting an origin. Rules are evaluated in order and the first match wins.
    - id: redirect_rules
      label: Redirect rules
      type: object_array
      description: Optional URL-pattern redirects handled by a CloudFront Function at viewer request time.
      collapsible: true
      required: false
      item_label: Redirect rule
      item_title:
        template: "{source}"
      item_description: "Redirect to {destination}"
      item_inputs:
        - id: source
          label: Source
          type: string
          description: Absolute HTTPS URL or host-agnostic path to match. Use :name for one segment and a final :name* to capture the remaining path.
          placeholder: https://docs.example.com/:path*
          required: true
        - id: destination
          label: Destination
          type: string
          description: Absolute HTTPS URL or host-agnostic path. Named parameters are replaced with values captured by the source.
          placeholder: https://www.example.com/docs/:path*
          required: true
        - id: preserve_query_string
          label: Preserve query string
          type: boolean
          description: Append the request query parameters to the redirect location.
          default: false
        - id: redirect_non_read_methods
          label: Redirect non-read methods
          type: boolean
          description: Redirect methods other than GET and HEAD. Requires status 307 or 308 so clients preserve the request method and body.
          default: false
        - id: status_code
          label: Status code
          type: number
          description: HTTP redirect status. Use 308 for permanent redirects that preserve the request method.
          required: true
          default: 308
          values:
            - label: 308 Permanent redirect
              value: 308
            - label: 307 Temporary redirect
              value: 307
            - label: 301 Moved permanently
              value: 301
            - label: 302 Found
              value: 302
      default: []
    - id: section_default_behavior
      label: Default cache behavior
      type: section
      description: Applies to every request that does not match a custom cache behavior path.
    - id: viewer_protocol_policy
      label: Viewer protocol policy
      type: string
      description: How viewers connect to CloudFront.
      required: true
      default: redirect-to-https
      values:
        - label: Redirect to HTTPS
          value: redirect-to-https
        - label: HTTPS only
          value: https-only
        - label: Allow all
          value: allow-all
    - id: allowed_methods
      label: Allowed methods
      type: string
      description: HTTP methods CloudFront forwards to the origin. Use all methods for apps that accept form posts or API writes.
      required: true
      default: read
      values:
        - label: All methods
          description: GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE
          value: all
        - label: Read and OPTIONS
          description: GET, HEAD, OPTIONS
          value: read_options
        - label: Read only
          description: GET, HEAD
          value: read
    - id: cache_policy
      label: Cache policy
      type: string
      description: Controls edge caching for the default behavior. The default respects your app's Cache-Control headers, so nothing is cached unless the app asks for it.
      required: true
      default: 4cc15a8a-d715-48a4-82b8-cc0b614638fe
      values:
        - label: UseOriginCacheControlHeaders-QueryStrings (recommended)
          description: Caches only responses with Cache-Control headers from your app. Query strings are part of the cache key.
          value: 4cc15a8a-d715-48a4-82b8-cc0b614638fe
        - label: UseOriginCacheControlHeaders-QueryStrings with Accept
          description: Caches only responses with Cache-Control headers from your app. Query strings and the Accept header are part of the cache key.
          value: managed_accept
        - label: UseOriginCacheControlHeaders
          description: Caches only responses with Cache-Control headers from your app. Query strings are not part of the cache key.
          value: 83da9c7e-98b4-4e11-a168-04f0df8e2c65
        - label: CachingDisabled
          description: No edge caching. Every request goes to the origin.
          value: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
        - label: CachingOptimized
          description: Long default TTLs with compression support. Best for static content.
          value: 658327ea-f89d-4fab-a63d-7e88639e58f6
        - label: Custom policy ID
          description: Use a cache policy you created yourself.
          value: custom
    - id: cache_policy_custom_id
      label: Custom cache policy ID
      type: string
      description: ID of a cache policy from your AWS account.
      placeholder: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
      required: true
      show_when:
        cache_policy: custom
      patterns:
        - message: Invalid CloudFront policy ID. Use the 36-character policy ID, not the name or ARN.
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
    - id: origin_request_policy
      label: Origin request policy
      type: string
      description: Controls what CloudFront forwards to the origin. Use None for private S3 origins so CloudFront can sign OAC requests without forwarding the viewer Host header.
      required: true
      default: 216adef6-5c7f-47e4-b989-5492eafa07d3
      values:
        - label: None
          description: Forward only what the cache policy includes. Recommended for private S3 origins with OAC.
          value: none
        - label: AllViewer (recommended)
          description: Forwards the Host header, cookies, and query strings so load balancer routing and app sessions work.
          value: 216adef6-5c7f-47e4-b989-5492eafa07d3
        - label: AllViewerExceptHostHeader
          description: Forwards everything except Host. The origin sees its own domain, which breaks host-based listener rules.
          value: b689b0a8-53d0-40ab-baf2-68738e2966ac
        - label: AllViewerAndCloudFrontHeaders-2022-06
          description: AllViewer plus CloudFront headers such as viewer country and device type.
          value: 33f36d7e-f396-46d9-90e0-52428a34d9dc
        - label: CORS-CustomOrigin
          description: Forwards only the Origin header for CORS. Cookies and Host are not forwarded.
          value: 59781a5b-3903-41f3-afcb-af62929ccde1
        - label: CORS-S3Origin
          description: Forwards the CORS headers needed for an S3 origin.
          value: 88a5eaf4-2fd4-4709-b370-b4c650ea3fcf
        - label: Custom policy ID
          description: Use an origin request policy you created yourself.
          value: custom
    - id: origin_request_policy_custom_id
      label: Custom origin request policy ID
      type: string
      description: ID of an origin request policy from your AWS account.
      placeholder: 216adef6-5c7f-47e4-b989-5492eafa07d3
      required: true
      show_when:
        origin_request_policy: custom
      patterns:
        - message: Invalid CloudFront policy ID. Use the 36-character policy ID, not the name or ARN.
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
    - id: cache_behaviors
      label: Custom cache behaviors
      type: object_array
      description: Optional path-based behaviors evaluated before the default behavior, such as caching /assets/* or routing /api/* to another origin.
      collapsible: true
      required: false
      item_label: Cache behavior
      item_title:
        template: "{path_pattern}"
      item_description: "Origin: {target_origin_id}"
      item_inputs:
        - id: path_pattern
          label: Path pattern
          type: string
          placeholder: /assets/*
          required: true
        - id: target_origin_id
          label: Target origin ID
          type: string
          description: Origin this behavior routes to. Use primary for the main origin or the ID of an additional origin.
          required: true
          default: primary
        - id: viewer_protocol_policy
          label: Viewer protocol policy
          type: string
          required: true
          default: redirect-to-https
          values:
            - label: Redirect to HTTPS
              value: redirect-to-https
            - label: HTTPS only
              value: https-only
            - label: Allow all
              value: allow-all
        - id: allowed_methods
          label: Allowed methods
          type: string
          description: HTTP methods CloudFront forwards for this path. CloudFront supports only these three combinations.
          required: true
          default: read
          values:
            - label: Read only
              description: GET, HEAD
              value: read
            - label: Read and OPTIONS
              description: GET, HEAD, OPTIONS
              value: read_options
            - label: All methods
              description: GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE
              value: all
        - id: cache_policy_id
          label: Cache policy
          type: string
          description: Controls edge caching for this path. For a custom cache policy, override ordered_cache_behaviors in Advanced Terraform variables.
          required: true
          default: 658327ea-f89d-4fab-a63d-7e88639e58f6
          values:
            - label: CachingOptimized
              description: Long default TTLs with compression support. Best for static assets.
              value: 658327ea-f89d-4fab-a63d-7e88639e58f6
            - label: CachingOptimizedForUncompressedObjects
              description: Like CachingOptimized but without compression in the cache key.
              value: b2884449-e4de-46a7-ac36-70bc7f1ddd6d
            - label: CachingDisabled
              description: No edge caching for this path.
              value: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            - label: UseOriginCacheControlHeaders
              description: Cache according to the Cache-Control headers your app returns.
              value: 83da9c7e-98b4-4e11-a168-04f0df8e2c65
            - label: UseOriginCacheControlHeaders-QueryStrings
              description: Origin-controlled caching with query strings included in the cache key.
              value: 4cc15a8a-d715-48a4-82b8-cc0b614638fe
        - id: origin_request_policy_id
          label: Origin request policy
          type: string
          description: What CloudFront forwards to the origin for this path. Leave empty to forward only what the cache policy includes.
          required: false
          values:
            - label: AllViewer
              description: Forwards the Host header, cookies, and query strings.
              value: 216adef6-5c7f-47e4-b989-5492eafa07d3
            - label: AllViewerExceptHostHeader
              description: Forwards everything except the Host header.
              value: b689b0a8-53d0-40ab-baf2-68738e2966ac
            - label: AllViewerAndCloudFrontHeaders-2022-06
              description: AllViewer plus CloudFront headers such as viewer country and device type.
              value: 33f36d7e-f396-46d9-90e0-52428a34d9dc
            - label: CORS-CustomOrigin
              description: Forwards only the Origin header for CORS.
              value: 59781a5b-3903-41f3-afcb-af62929ccde1
            - label: CORS-S3Origin
              description: Forwards the CORS headers needed for an S3 origin.
              value: 88a5eaf4-2fd4-4709-b370-b4c650ea3fcf
        - id: signed_urls_enabled
          label: Require signed URLs
          type: boolean
          description: Require requests matching this path to use a signed URL or signed cookie from one of the trusted key groups.
          default: false
        - id: trusted_key_group_ids
          label: Trusted key group IDs
          type: string_array
          description: Existing CloudFront key group IDs whose public keys are trusted for signed URLs or signed cookies on this path.
          add_button_label: Add key group ID
          required: true
          show_when:
            signed_urls_enabled: true
          patterns:
            - message: Invalid CloudFront key group ID.
              pattern: ^[A-Z0-9]+$
          default: []
      default: []
    - id: section_signed_urls
      label: Signed URLs
      type: section
      description: Restrict viewer access with existing CloudFront key groups. Your app keeps the private key and signs URLs or cookies; this module trusts the key group IDs.
    - id: signed_urls_enabled
      label: Require signed URLs
      type: boolean
      description: Require signed URLs or signed cookies for the default cache behavior. Unsigned requests receive 403 responses from CloudFront.
      default: false
    - id: trusted_key_group_ids
      label: Trusted key group IDs
      type: string_array
      description: Existing CloudFront key group IDs whose public keys are trusted for signed URLs or signed cookies. Add at least one key group before enabling Require signed URLs on the default behavior or any custom cache behavior.
      add_button_label: Add key group ID
      required: true
      show_when:
        signed_urls_enabled: true
      patterns:
        - message: Invalid CloudFront key group ID.
          pattern: ^[A-Z0-9]+$
      default: []
    - id: response_headers_policy
      label: Response headers policy
      type: string
      description: Optional headers CloudFront adds to responses, such as security headers or CORS. Leave empty to add none.
      collapsible: true
      required: false
      values:
        - label: SecurityHeadersPolicy
          description: Adds security headers such as HSTS, X-Content-Type-Options, and X-Frame-Options.
          value: 67f7725c-6f97-4210-82d7-5512b31e9d03
        - label: SimpleCORS
          description: Allows simple CORS requests from any origin.
          value: 60669652-455b-4ae9-85a4-c4c02393f86c
        - label: CORS-With-Preflight
          description: Allows CORS requests including preflight OPTIONS from any origin.
          value: 5cc3b908-e619-4b99-88e5-2cf7f45965bd
        - label: CORS-and-SecurityHeadersPolicy
          description: Simple CORS plus the security headers set.
          value: e61eb60c-9c35-4d20-a928-2b84e02af89c
        - label: CORS-with-preflight-and-SecurityHeadersPolicy
          description: CORS with preflight plus the security headers set.
          value: eaab4381-ed33-4a86-88ca-d9558dc6cd63
        - label: Custom policy ID
          description: Use a response headers policy you created yourself.
          value: custom
    - id: response_headers_policy_custom_id
      label: Custom response headers policy ID
      type: string
      description: ID of a response headers policy from your AWS account.
      placeholder: 67f7725c-6f97-4210-82d7-5512b31e9d03
      required: true
      show_when:
        response_headers_policy: custom
      patterns:
        - message: Invalid CloudFront policy ID. Use the 36-character policy ID, not the name or ARN.
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
    - id: section_settings
      label: Distribution settings
      type: section
    - id: price_class
      label: Price class
      type: string
      description: You can reduce edge locations for some cost savings if it becomes an issue.
      default: PriceClass_All
      values:
        - label: All edge locations
          value: PriceClass_All
        - label: Most edge locations
          value: PriceClass_200
        - label: US, Canada, Europe
          value: PriceClass_100
    - id: http_version
      label: HTTP version
      type: string
      collapsible: true
      default: http2and3
      values:
        - label: HTTP/2 and HTTP/3
          value: http2and3
        - label: HTTP/2
          value: http2
        - label: HTTP/1.1
          value: http1.1
    - id: web_acl_id
      label: WAF web ACL ARN
      type: string
      description: Optional WAFv2 web ACL to associate with the distribution. Must be a global (CloudFront) web ACL.
      collapsible: true
      placeholder: arn:aws:wafv2:us-east-1:123456789012:global/webacl/name/abc-123
      required: false
    - id: geo_restriction_type
      label: Geo restriction
      type: string
      default: none
      values:
        - label: None
          value: none
        - label: Whitelist
          value: whitelist
        - label: Blacklist
          value: blacklist
    - id: geo_restriction_locations
      label: Geo restriction country codes
      type: string_array
      show_when:
        geo_restriction_type:
          - whitelist
          - blacklist
      default: []
    - id: section_monitoring
      label: Monitoring
      type: section
    - id: additional_metrics_enabled
      label: Additional metrics
      type: boolean
      description: Enable `CacheHitRate`, `OriginLatency`, and `401/403/404/502/503/504` error rate charts. Adds a flat CloudWatch cost of about $2.40/month per distribution.
      default: false
    - id: section_logging
      label: Access logging
      type: section
    - id: logging_enabled
      label: CloudFront access logging
      type: boolean
      description: Enable CloudFront access logging. Logs are delivered to CloudWatch Logs by default and can be viewed in Ravion.
      default: true
    - id: logging_destination
      label: Logging destination
      type: string
      description: Where CloudFront delivers access logs.
      default: cloudwatch
      show_when:
        logging_enabled: true
      values:
        - description: View access logs directly in Ravion. Ingestion costs more at very high traffic.
          label: CloudWatch Logs
          value: cloudwatch
        - description: Deliver compressed log files to an automatically created S3 bucket. Cheapest for high traffic.
          label: S3 bucket
          value: s3
    - id: logging_bucket_retention_days
      label: Logging retention days
      type: number
      description: Days to retain CloudFront access logs in CloudWatch Logs or the automatically created S3 logging bucket.
      min: 1
      show_when:
        logging_enabled: true
      default: 90
