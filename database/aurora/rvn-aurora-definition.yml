definition:
  type: rvn-aurora
  name: Aurora Database
  description: Creates and manages an Amazon Aurora cluster. Supports Aurora PostgreSQL and Aurora MySQL with provisioned or Serverless v2 capacity.

release:
  version: 1.1.1
  description: Add optional RDS Proxy connection pooling and update Terraform module sources and documentation links to the renamed `ravionhq` GitHub organization.
module:
  inputs:
    - id: network
      immutable: true
      label: VPC network
      mapped_inputs:
        - id: section_aws
          label: AWS account & region
          type: section
        - default: << ref.input.aws_account_id >>
          id: aws_account_id
          immutable: true
          label: AWS account
          type: string
          values: $values:ravion/aws_accounts
        - default: << ref.input.aws_region >>
          id: aws_region
          immutable: true
          label: Region
          type: string
          values: $values:aws/regions
        - collapsible: true
          default: << ref.input.execution_environment_id >>
          description: Override the VPC, subnet, and security group for Pipeline Terraform runners. Must use the same AWS account as selected above.
          id: execution_environment_id
          label: Terraform execution environment
          type: string
          values: $values:ravion/execution_environments
        - id: section_vpc
          label: VPC
          type: section
        - default: <<ref.stack.output.vpc_id>>
          id: vpc_id
          immutable: true
          label: VPC ID
          required: true
          type: string
        - add_button_label: Add private subnet ID
          default: <<ref.stack.output.private_subnet_ids>>
          description: Used for the Aurora DB subnet group when the database is not publicly accessible. Use at least two subnets in different Availability Zones.
          id: private_subnet_ids
          immutable: true
          label: Private subnet IDs
          required: true
          type: string_array
        - add_button_label: Add public subnet ID
          default: <<ref.stack.output.public_subnet_ids>>
          description: Used for the Aurora DB subnet group when Publicly accessible is enabled. AWS requires public subnets for public database access.
          id: public_subnet_ids
          immutable: true
          label: Public subnet IDs
          placeholder: subnet-...
          show_when:
            public_access_enabled: true
          type: string_array
      required: true
      type: $ref:rvn-aws-network
    - id: section_database
      label: Database
      type: section
    - default: <<project.given_id>>-<<environment.given_id>>
      description: Name of the Aurora cluster and prefix for related resources.
      id: name
      immutable: true
      label: Name slug
      patterns:
        - message: 1-63 lowercase letters, numbers, and hyphens. Start with a letter and end with a letter or number.
          pattern: ^[a-z]([a-z0-9-]{0,61}[a-z0-9])?$
      required: true
      type: string
    - default: none
      id: restore_mode
      immutable: true
      label: Create or restore
      required: true
      type: string
      values:
        - label: New empty database
          value: none
        - label: Restore from snapshot
          value: snapshot
        - label: Point-in-time restore
          value: point_in_time
    - collapsible: true
      description: Name for an automatically created database on the cluster.
      id: database_name
      immutable: true
      label: Database name
      patterns:
        - message: 1-64 letters, numbers, and underscores. Start with a letter.
          pattern: ^[A-Za-z][A-Za-z0-9_]{0,63}$
      placeholder: myapp_prod
      required: false
      show_when:
        restore_mode: none
      type: string
    - collapsible: true
      default: dbadmin
      id: master_username
      immutable: true
      label: Username
      patterns:
        - message: Invalid Aurora master username. Start with a letter. Letters, numbers, and underscores only.
          pattern: ^[A-Za-z][A-Za-z0-9_]{0,62}$
      required: true
      show_when:
        restore_mode: none
      type: string
    - description: Snapshot identifier or ARN to restore into this new Aurora cluster.
      id: snapshot_identifier
      immutable: true
      label: Snapshot to restore
      required: true
      show_when:
        restore_mode: snapshot
      type: string
    - description: Source Aurora cluster identifier to restore from.
      id: point_in_time_source_cluster_identifier
      immutable: true
      label: Source cluster identifier
      placeholder: my-aurora-cluster
      required: true
      show_when:
        restore_mode: point_in_time
      type: string
    - collapsible: true
      default: full-copy
      id: point_in_time_restore_type
      immutable: true
      label: Restore type
      required: true
      show_when:
        restore_mode: point_in_time
      type: string
      values:
        - label: Full copy
          value: full-copy
        - label: Copy on write
          value: copy-on-write
    - default: true
      description: Restore to the latest time AWS can recover from the selected source cluster backup.
      id: point_in_time_use_latest_restorable_time
      immutable: true
      label: Use latest restorable time
      show_when:
        restore_mode: point_in_time
      type: boolean
    - description: Restore to this UTC timestamp instead of the latest restorable time.
      id: point_in_time_restore_time
      immutable: true
      label: Restore time
      placeholder: 2026-06-11T15:04:05Z
      required: false
      show_when:
        restore_mode: point_in_time
        point_in_time_use_latest_restorable_time: false
      type: string
    - id: section_version
      label: Version
      type: section
    - default: aurora-postgresql
      id: engine
      immutable: true
      label: Engine
      required: true
      type: string
      values:
        - label: Aurora PostgreSQL
          value: aurora-postgresql
        - label: Aurora MySQL
          value: aurora-mysql
    - description: "Examples: 16 for Aurora PostgreSQL or 8.0 for Aurora MySQL."
      id: engine_major_version
      label: Engine major version
      placeholder: "16"
      required: true
      type: string
    - collapsible: true
      description: "Optional minor engine version appended to the major version. Example: 4 becomes 16.4 for Aurora PostgreSQL; 3.08.0 becomes 8.0.mysql_aurora.3.08.0 for Aurora MySQL."
      id: engine_minor_version
      label: Engine minor version
      placeholder: "4"
      required: false
      type: string
    - collapsible: true
      default: true
      description: Enable automatic minor engine version upgrades during the configured maintenance window.
      id: minor_version_auto_upgrade_enabled
      label: Auto minor version upgrades
      type: boolean
    - id: section_capacity
      label: Capacity
      type: section
    - default: provisioned
      description: Choose fixed DB instances or Aurora Serverless v2 capacity.
      id: capacity_mode
      label: Capacity mode
      required: true
      type: string
      values:
        - label: Provisioned instances
          value: provisioned
        - label: Serverless v2
          value: serverless_v2
    - default: db.t4g.medium
      description: Aurora writer instance size, such as db.t4g.medium or db.r6g.large.
      id: instance_class
      label: Instance class
      placeholder: db.r6g.large
      required: true
      show_when:
        capacity_mode: provisioned
      type: string
    - default: 1
      description: Minimum Aurora Serverless v2 capacity units. Must not exceed max capacity.
      id: serverless_min_capacity
      label: Min capacity (ACUs)
      max: 256
      min: 1
      required: true
      show_when:
        capacity_mode: serverless_v2
      type: number
    - default: 4
      description: Maximum Aurora Serverless v2 capacity units. Must be at least min capacity.
      id: serverless_max_capacity
      label: Max capacity (ACUs)
      max: 256
      min: 1
      required: true
      show_when:
        capacity_mode: serverless_v2
      type: number
    - id: section_storage
      label: Storage & cluster
      type: section
    - collapsible: true
      default: aurora
      id: storage_type
      label: Storage type
      type: string
      values:
        - label: Aurora Standard
          value: aurora
        - label: Aurora I/O-Optimized
          value: aurora-iopt1
    - collapsible: true
      id: kms_key_id
      immutable: true
      label: Storage KMS key ARN
      placeholder: arn:aws:kms:...
      required: false
      type: string
    - collapsible: true
      id: ca_certificate_identifier
      label: CA certificate identifier
      required: false
      type: string
    - collapsible: true
      default: IPV4
      id: network_type
      label: Network type
      type: string
      values:
        - label: IPv4
          value: IPV4
        - label: Dual-stack
          value: DUAL
    - id: section_access
      label: Network access
      type: section
    - default: false
      description: Keep disabled for production databases unless public access is intentional.
      id: public_access_enabled
      label: Publicly accessible
      type: boolean
    - collapsible: true
      description: "Leave blank to use the engine default port: 5432 for PostgreSQL or 3306 for MySQL."
      id: port
      label: Port
      max: 65535
      min: 1
      required: false
      type: number
    - collapsible: true
      default: true
      id: security_group_creation_enabled
      immutable: true
      label: Security group creation
      type: boolean
    - collapsible: true
      id: security_group_id
      label: Existing security group ID
      placeholder: sg-...
      required: false
      show_when:
        security_group_creation_enabled: false
      type: string
    - add_button_label: Add security group ID
      collapsible: true
      id: allowed_security_group_ids
      label: Allowed security groups
      placeholder: sg-...
      required: false
      show_when:
        security_group_creation_enabled: true
      type: string_array
    - add_button_label: Add CIDR block
      collapsible: true
      id: allowed_cidr_blocks
      label: Allowed CIDR blocks
      placeholder: 10.0.0.0/16
      required: false
      show_when:
        security_group_creation_enabled: true
      type: string_array
    - id: section_proxy
      label: Connection pooling
      type: section
    - default: false
      description: Create an RDS Proxy in front of the cluster for connection pooling and improved failover handling.
      id: proxy_creation_enabled
      label: RDS Proxy
      type: boolean
    - add_button_label: Add secret ARN
      collapsible: true
      description: Secrets Manager secrets containing database credentials for the proxy. Leave blank to use the managed master user secret.
      id: proxy_auth_secret_arns
      label: Auth secret ARNs
      placeholder: arn:aws:secretsmanager:...
      required: false
      show_when:
        proxy_creation_enabled: true
      type: string_array
    - add_button_label: Add KMS key ARN
      collapsible: true
      description: KMS keys used to encrypt the auth secrets when using customer-managed keys. The master user secret KMS key is included automatically.
      id: proxy_secret_kms_key_arns
      label: Auth secret KMS key ARNs
      placeholder: arn:aws:kms:...
      required: false
      show_when:
        proxy_creation_enabled: true
      type: string_array
    - collapsible: true
      default: false
      description: Require IAM authentication for client connections to the proxy.
      id: proxy_iam_auth_enabled
      label: IAM authentication
      show_when:
        proxy_creation_enabled: true
      type: boolean
    - collapsible: true
      default: true
      description: Require TLS for client connections to the proxy.
      id: proxy_tls_requirement_enabled
      label: Require TLS
      show_when:
        proxy_creation_enabled: true
      type: boolean
    - collapsible: true
      default: false
      description: Log detailed connection information, including SQL statements, to CloudWatch Logs.
      id: proxy_debug_logging_enabled
      label: Debug logging
      show_when:
        proxy_creation_enabled: true
      type: boolean
    - collapsible: true
      default: 1800
      id: proxy_idle_client_timeout
      label: Idle client timeout (seconds)
      max: 28800
      min: 1
      show_when:
        proxy_creation_enabled: true
      type: number
    - collapsible: true
      default: 120
      id: proxy_connection_borrow_timeout
      label: Connection borrow timeout (seconds)
      min: 0
      show_when:
        proxy_creation_enabled: true
      type: number
    - collapsible: true
      default: 100
      description: Maximum size of the connection pool as a percentage of the database max_connections setting.
      id: proxy_max_connections_percent
      label: Max connections (%)
      max: 100
      min: 1
      show_when:
        proxy_creation_enabled: true
      type: number
    - collapsible: true
      default: 50
      description: Maximum idle connections kept open, as a percentage of the database max_connections setting.
      id: proxy_max_idle_connections_percent
      label: Max idle connections (%)
      max: 100
      min: 0
      show_when:
        proxy_creation_enabled: true
      type: number
    - add_button_label: Add filter
      collapsible: true
      id: proxy_session_pinning_filters
      label: Session pinning filters
      required: false
      show_when:
        proxy_creation_enabled: true
      type: string_array
      values:
        - label: EXCLUDE_VARIABLE_SETS
          value: EXCLUDE_VARIABLE_SETS
    - collapsible: true
      description: SQL statements the proxy runs when opening each new database connection.
      id: proxy_init_query
      label: Initialization query
      placeholder: SET time_zone = 'UTC'
      required: false
      show_when:
        proxy_creation_enabled: true
      type: string
    - id: section_readers
      label: Readers
      type: section
    - default: 0
      description: Number of reader instances to create.
      id: reader_count
      label: Reader count
      max: 15
      min: 0
      type: number
    - collapsible: true
      description: Reader instance class. Leave blank to use the writer instance class.
      id: reader_instance_class
      label: Reader instance class
      placeholder: db.r6g.large
      required: false
      show_when:
        capacity_mode: provisioned
      type: string
    - collapsible: true
      description: Default failover priority for instances. Lower values have higher priority.
      id: promotion_tier
      label: Promotion tier
      max: 15
      min: 0
      required: false
      type: number
    - default: false
      id: autoscaling_enabled
      label: Reader autoscaling
      type: boolean
    - collapsible: true
      default: 1
      description: Must not exceed max reader capacity.
      id: autoscaling_min_capacity
      label: Min reader capacity
      min: 0
      show_when:
        autoscaling_enabled: true
      type: number
    - collapsible: true
      default: 3
      description: Must be at least min reader capacity.
      id: autoscaling_max_capacity
      label: Max reader capacity
      min: 1
      show_when:
        autoscaling_enabled: true
      type: number
    - collapsible: true
      default: 70
      id: autoscaling_target_cpu
      label: Target CPU utilization (%)
      max: 100
      min: 1
      show_when:
        autoscaling_enabled: true
      type: number
    - collapsible: true
      id: autoscaling_target_connections
      label: Target connections
      min: 1
      required: false
      show_when:
        autoscaling_enabled: true
      type: number
    - collapsible: true
      default: 300
      id: autoscaling_scale_in_cooldown
      label: Scale-in cooldown seconds
      min: 0
      show_when:
        autoscaling_enabled: true
      type: number
    - collapsible: true
      default: 300
      id: autoscaling_scale_out_cooldown
      label: Scale-out cooldown seconds
      min: 0
      show_when:
        autoscaling_enabled: true
      type: number
    - id: section_auth
      label: Credentials & authentication
      type: section
    - default: true
      description: Let AWS generate and manage the master password in Secrets Manager. Disable before importing a cluster whose existing password is managed externally.
      id: master_user_password_management_enabled
      label: Manage password in Secrets Manager
      type: boolean
    - collapsible: true
      default: false
      description: Preserve the externally managed password of an imported cluster. Ravion verifies that the named cluster already exists in AWS.
      id: master_user_password_preservation_enabled
      label: Preserve existing master password
      show_when:
        master_user_password_management_enabled: false
      type: boolean
    - collapsible: true
      id: master_user_secret_kms_key_id
      label: Secrets Manager KMS key ARN
      placeholder: arn:aws:kms:...
      required: false
      show_when:
        master_user_password_management_enabled: true
        restore_mode: none
      type: string
    - collapsible: true
      default: false
      id: iam_database_authentication_enabled
      label: IAM database authentication
      type: boolean
    - collapsible: true
      default: false
      description: Enable the Aurora Data API HTTP endpoint.
      id: http_endpoint_enabled
      label: Data API (HTTP endpoint)
      type: boolean
    - id: section_mysql_settings
      label: MySQL settings
      show_when:
        engine: aurora-mysql
      type: section
    - collapsible: true
      default: 0
      description: Target backtrack window in seconds. Set 0 to disable.
      id: backtrack_window
      label: Backtrack window (seconds)
      max: 259200
      min: 0
      show_when:
        engine: aurora-mysql
      type: number
    - collapsible: true
      default: false
      id: local_write_forwarding_enabled
      label: Local write forwarding
      show_when:
        engine: aurora-mysql
      type: boolean
    - id: section_backup
      label: Backups
      type: section
    - collapsible: true
      default: 7
      id: backup_retention_period
      label: Backup retention days
      max: 35
      min: 1
      type: number
    - collapsible: true
      id: preferred_backup_window
      label: Backup window
      placeholder: 03:00-04:00
      required: false
      type: string
    - collapsible: true
      default: true
      id: snapshot_tag_copying_enabled
      label: Copy tags to snapshots
      type: boolean
    - collapsible: true
      default: true
      id: final_snapshot_creation_enabled
      label: Create final snapshot
      type: boolean
    - collapsible: true
      id: final_snapshot_identifier
      label: Final snapshot identifier
      required: false
      show_when:
        final_snapshot_creation_enabled: true
      type: string
    - default: true
      id: deletion_protection_enabled
      label: Deletion protection
      type: boolean
    - id: section_maintenance
      label: Maintenance
      type: section
    - collapsible: true
      id: preferred_maintenance_window
      label: Maintenance window
      placeholder: sun:04:00-sun:05:00
      required: false
      type: string
    - collapsible: true
      default: false
      id: major_version_upgrade_enabled
      label: Allow major version upgrades
      type: boolean
    - collapsible: true
      default: false
      id: immediate_apply_enabled
      label: Apply changes immediately
      type: boolean
    - id: section_parameter_groups
      description: Aurora uses a cluster parameter group for cluster-level settings and a DB parameter group for instance-level settings.
      label: Parameter groups
      type: section
    - collapsible: true
      default: true
      description: Create a cluster parameter group for this database. Disable this only when you want to attach an existing parameter group.
      id: cluster_parameter_group_creation_enabled
      immutable: true
      label: Cluster parameter group creation
      type: boolean
    - collapsible: true
      description: Name of an existing cluster parameter group to attach when this module is not creating one.
      id: cluster_parameter_group_name
      immutable: true
      label: Existing cluster parameter group name
      required: false
      show_when:
        cluster_parameter_group_creation_enabled: false
      type: string
    - collapsible: true
      description: Cluster parameter group family. Leave blank to derive it from the selected engine version.
      id: cluster_parameter_group_family
      immutable: true
      label: Cluster parameter group family
      placeholder: aurora-postgresql16
      required: false
      show_when:
        cluster_parameter_group_creation_enabled: true
      type: string
    - collapsible: true
      default: []
      description: Custom cluster parameters to apply to the created cluster parameter group.
      id: cluster_parameters
      item_inputs:
        - description: Engine parameter name, such as rds.force_ssl.
          id: name
          label: Name
          required: true
          type: string
        - description: Parameter value to set.
          id: value
          label: Value
          required: true
          type: string
        - default: immediate
          description: Apply immediately when supported, or wait until the next database reboot.
          id: apply_method
          label: Apply method
          type: string
          values:
            - label: immediate
              value: immediate
            - label: pending-reboot
              value: pending-reboot
      item_label: Cluster parameter
      label: Cluster parameters
      required: false
      show_when:
        cluster_parameter_group_creation_enabled: true
      type: object_array
    - collapsible: true
      default: true
      description: Create a DB parameter group for cluster instances. Disable this only when you want to attach an existing parameter group.
      id: db_parameter_group_creation_enabled
      immutable: true
      label: DB parameter group creation
      type: boolean
    - collapsible: true
      description: Name of an existing DB parameter group to attach when this module is not creating one.
      id: db_parameter_group_name
      immutable: true
      label: Existing DB parameter group name
      required: false
      show_when:
        db_parameter_group_creation_enabled: false
      type: string
    - collapsible: true
      description: DB parameter group family. Leave blank to derive it from the selected engine version.
      id: db_parameter_group_family
      immutable: true
      label: DB parameter group family
      placeholder: aurora-postgresql16
      required: false
      show_when:
        db_parameter_group_creation_enabled: true
      type: string
    - collapsible: true
      default: []
      description: Custom instance parameters to apply to the created DB parameter group.
      id: db_parameters
      item_inputs:
        - description: Engine parameter name, such as shared_preload_libraries.
          id: name
          label: Name
          required: true
          type: string
        - description: Parameter value to set.
          id: value
          label: Value
          required: true
          type: string
        - default: immediate
          description: Apply immediately when supported, or wait until the next database reboot.
          id: apply_method
          label: Apply method
          type: string
          values:
            - label: immediate
              value: immediate
            - label: pending-reboot
              value: pending-reboot
      item_label: DB parameter
      label: DB parameters
      required: false
      show_when:
        db_parameter_group_creation_enabled: true
      type: object_array
    - id: section_monitoring
      label: Monitoring
      type: section
    - add_button_label: Add log type
      collapsible: true
      description: Engine logs exported to CloudWatch. Each enabled log type is shown on the module Logs tab.
      id: enabled_cloudwatch_logs_exports
      label: CloudWatch log exports
      required: false
      type: string_array
      values:
        - label: postgresql
          show_when:
            engine: aurora-postgresql
          value: postgresql
        - label: audit
          show_when:
            engine: aurora-mysql
          value: audit
        - label: error
          show_when:
            engine: aurora-mysql
          value: error
        - label: general
          show_when:
            engine: aurora-mysql
          value: general
        - label: slowquery
          show_when:
            engine: aurora-mysql
          value: slowquery
    - collapsible: true
      default: 0
      id: monitoring_interval
      label: Enhanced monitoring interval
      type: number
      values:
        - label: "0"
          value: 0
        - label: "1"
          value: 1
        - label: "5"
          value: 5
        - label: "10"
          value: 10
        - label: "15"
          value: 15
        - label: "30"
          value: 30
        - label: "60"
          value: 60
    - collapsible: true
      default: true
      id: monitoring_role_creation_enabled
      immutable: true
      label: Monitoring IAM role creation
      show_when:
        monitoring_interval:
          not: 0
      type: boolean
    - collapsible: true
      id: monitoring_role_arn
      label: Monitoring IAM role ARN
      placeholder: arn:aws:iam::...
      required: false
      show_when:
        monitoring_role_creation_enabled: false
        monitoring_interval:
          not: 0
      type: string
    - collapsible: true
      default: true
      id: performance_insights_enabled
      label: Performance insights
      type: boolean
    - collapsible: true
      default: 7
      description: AWS supports 7 days, multiples of 31 days up to 23 months, or 731 days.
      id: performance_insights_retention_period
      label: Performance insights retention days
      show_when:
        performance_insights_enabled: true
      type: number
      values:
        - label: 7 days
          value: 7
        - label: 1 month (31 days)
          value: 31
        - label: 2 months (62 days)
          value: 62
        - label: 3 months (93 days)
          value: 93
        - label: 6 months (186 days)
          value: 186
        - label: 12 months (372 days)
          value: 372
        - label: 24 months (731 days)
          value: 731
    - collapsible: true
      id: performance_insights_kms_key_id
      label: Performance insights KMS key ARN
      required: false
      show_when:
        performance_insights_enabled: true
      type: string
    - id: section_cloudwatch_alarms
      label: CloudWatch alarms
      type: section
    - default: true
      id: cloudwatch_alarms_creation_enabled
      label: Create CloudWatch alarms
      type: boolean
    - collapsible: true
      default: 80
      id: cloudwatch_alarm_cpu_threshold
      label: CPU alarm threshold (%)
      max: 100
      min: 0
      show_when:
        cloudwatch_alarms_creation_enabled: true
      type: number
    - collapsible: true
      default: 256
      description: Displayed in MiB. Ravion converts this to bytes for Terraform.
      id: cloudwatch_alarm_memory_threshold_mib
      label: Freeable memory alarm threshold (MiB)
      min: 1
      show_when:
        cloudwatch_alarms_creation_enabled: true
      type: number
    - collapsible: true
      default: 100
      id: cloudwatch_alarm_connections_threshold
      label: Connections alarm threshold
      min: 1
      show_when:
        cloudwatch_alarms_creation_enabled: true
      type: number
    - collapsible: true
      default: 2
      id: cloudwatch_alarm_evaluation_periods
      label: Alarm evaluation periods
      min: 1
      show_when:
        cloudwatch_alarms_creation_enabled: true
      type: number
    - collapsible: true
      default: 300
      id: cloudwatch_alarm_period
      label: Alarm period seconds
      show_when:
        cloudwatch_alarms_creation_enabled: true
      type: number
      values:
        - label: "10"
          value: 10
        - label: "30"
          value: 30
        - label: "60"
          value: 60
        - label: "300"
          value: 300
        - label: "900"
          value: 900
        - label: "3600"
          value: 3600
    - add_button_label: Add action ARN
      collapsible: true
      id: cloudwatch_alarm_actions
      label: Alarm action ARNs
      required: false
      show_when:
        cloudwatch_alarms_creation_enabled: true
      type: string_array
    - add_button_label: Add action ARN
      collapsible: true
      id: cloudwatch_ok_actions
      label: OK action ARNs
      required: false
      show_when:
        cloudwatch_alarms_creation_enabled: true
      type: string_array
    - id: section_global_database
      label: Global database
      type: section
    - collapsible: true
      default: false
      id: global_cluster_creation_enabled
      immutable: true
      label: Global cluster creation
      type: boolean
    - collapsible: true
      description: Global cluster identifier. Set this to create a new global cluster or join an existing global cluster.
      id: global_cluster_identifier
      immutable: true
      label: Global cluster identifier
      required: false
      type: string
    - collapsible: true
      description: Source region for cross-region replication in a global database.
      id: source_region
      immutable: true
      label: Source region
      required: false
      type: string
      values: $values:aws/regions
    - collapsible: true
      default: false
      id: global_write_forwarding_enabled
      label: Global write forwarding
      show_when:
