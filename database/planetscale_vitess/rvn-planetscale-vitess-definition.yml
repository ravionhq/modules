definition:
  type: rvn-planetscale-vitess
  name: PlanetScale MySQL
  description: Managed PlanetScale MySQL with application credentials, safe migrations, and in-place cluster resizing.
release:
  version: 0.1.0
  description: Add PlanetScale MySQL with saved integrations, regional Metal sizes, standard Terraform pipelines, automatic default-keyspace adoption, short-lived credentials, and native module metrics.
module:
  inputs:
    - id: section_planetscale
      label: PlanetScale integration
      type: section
    - id: planetscale
      label: PlanetScale integration
      description: Select an active integration from Settings → Integrations. The organization and short-lived credentials come from this connection.
      type: string
      required: true
      immutable: true
      values: $values:ravion/integrations?provider=PLANETSCALE
    - id: section_database
      label: Database
      type: section
    - id: name
      label: Database name
      type: string
      required: true
      immutable: true
      default: << project.given_id >>-<< environment.given_id >>-<< module.given_id >>
      patterns:
        - pattern: ^[a-z0-9]([a-z0-9-]{0,62}[a-z0-9])?$
          message: 1-64 lowercase letters, numbers, and hyphens. Start and end with a letter or number.
    - id: region
      label: Database region
      description: Choose a MySQL region available to the selected PlanetScale organization near your application.
      type: string
      required: true
      immutable: true
      values: "$values:planetscale/regions?integrationId=<< module.input.planetscale >>"
    - id: cluster_size
      label: Cluster size
      description: Choose a regional MySQL size. Metal options include local NVMe disk capacity in the SKU. Compute is per instance; the cluster includes a primary and two replicas. Changes resize in place.
      type: string
      required: true
      default: PS_10
      values: "$values:planetscale/cluster-sizes?integrationId=<< module.input.planetscale >>&region=<< module.input.region >>"
    - id: extra_replicas
      label: Extra replicas
      description: Additional replicas beyond PlanetScale's included replicas; increases cost. Applied from the second deployment, after automatic default-keyspace adoption.
      type: number
      default: 0
      min: 0
    - id: application_password_cidrs
      label: Application credential CIDRs
      description: Restrict application connections to these IPv4 or IPv6 CIDR ranges. Empty permits connections from any source IP.
      type: string_array
      default: []
      add_button_label: Add CIDR range
      collapsible: true
    - id: deletion_protection_enabled
      label: Deletion protection
      description: Disable and apply before destroying the database. The default keyspace is deleted before the branch.
      type: boolean
      default: true
    - id: safe_migrations_enabled
      label: Safe migrations
      description: Require PlanetScale deploy requests for schema changes. Disable only when direct DDL on main is intended.
      type: boolean
      default: true
    - $include: ../../partials/inputs/terraform-settings.yml
    - id: execution_environment_id
      label: Terraform execution environment
      description: Runs OpenTofu with short-lived credentials from the selected integration. This does not select the database's cloud account or region.
      type: string
      required: true
      default: << defaults.execution_environment_id >>
      values: $values:ravion/execution_environments
  stack:
    type: opentofu
    ravion_state_backend_workspace: >-
      << module.input.ravion_state_backend_workspace || project.given_id + "-" + environment.given_id + "-"
      + module.given_id + "-" + stack.id >>
    pipelines:
      defaults:
        variant: standard
        input:
          repo: https://github.com/ravionhq/modules
          branch: main
          ref: $local.module_tag
          base_path: database/planetscale_vitess
          stack_id: << stack.id >>
          tool: opentofu
          tool_version: << module.input.opentofu_version || defaults.opentofu_version >>
          execution_environment_id: << module.input.execution_environment_id >>
          integrations:
            - << module.input.planetscale >>
          timeout: 2700
          terraform_variables:
            ...overrides: << module.input.advanced_terraform_variables >>
            name: << module.input.name >>
            region: << module.input.region >>
            cluster_size: << module.input.cluster_size >>
            extra_replicas: << module.input.extra_replicas >>
            manage_default_keyspace: '<< stack.output && stack.output["branch_id"] ? true : false >>'
            application_password:
              cidrs: << module.input.application_password_cidrs >>
            deletion_protection_enabled: << module.input.deletion_protection_enabled >>
            safe_migrations_enabled: << module.input.safe_migrations_enabled >>
      change:
        pipeline_id: << defaults.change_pipeline_id >>
      destroy:
        pipeline_id: << defaults.destroy_pipeline_id >>
  ui:
    links:
      - name: PlanetScale database
        href: << stack.output.dashboard_url >>
    metrics:
      - {id: primary_cpu_usage, name: Primary CPU usage, type: line, source: {type: planetscale, integration_id: '<< module.input.planetscale >>', database: '<< stack.output.database >>', branch: '<< stack.output.branch >>', name: primary_cpu_usage}}
      - {id: primary_memory_usage, name: Primary memory usage, type: line, source: {type: planetscale, integration_id: '<< module.input.planetscale >>', database: '<< stack.output.database >>', branch: '<< stack.output.branch >>', name: primary_memory_usage}}
      - {id: primary_iops, name: Primary IOPS, type: line, source: {type: planetscale, integration_id: '<< module.input.planetscale >>', database: '<< stack.output.database >>', branch: '<< stack.output.branch >>', name: primary_iops}}
      - {id: primary_queries, name: Primary queries, type: line, source: {type: planetscale, integration_id: '<< module.input.planetscale >>', database: '<< stack.output.database >>', branch: '<< stack.output.branch >>', name: primary_queries}}
      - {id: primary_rows_read, name: Primary rows read, type: line, source: {type: planetscale, integration_id: '<< module.input.planetscale >>', database: '<< stack.output.database >>', branch: '<< stack.output.branch >>', name: primary_rows_read}}
      - {id: primary_rows_written, name: Primary rows written, type: line, source: {type: planetscale, integration_id: '<< module.input.planetscale >>', database: '<< stack.output.database >>', branch: '<< stack.output.branch >>', name: primary_rows_written}}
