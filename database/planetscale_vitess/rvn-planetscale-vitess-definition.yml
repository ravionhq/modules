      - {id: pod_cpu_usage, name: Tablet CPU usage, type: line, source: {type: planetscale, integration_id: '<< module.input.planetscale >>', database: '<< stack.output.database >>', branch: '<< stack.output.branch >>', name: pod_cpu_usage}}
      - {id: pod_memory_usage, name: Tablet memory usage, type: line, source: {type: planetscale, integration_id: '<< module.input.planetscale >>', database: '<< stack.output.database >>', branch: '<< stack.output.branch >>', name: pod_memory_usage}}
