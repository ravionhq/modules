# The ClickHouse pods' identity. EKS Pod Identity binds it to the S3 role, so
# the server (cold tier) and the clickhouse-backup sidecar get short-lived AWS
# credentials without static keys.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  labels:
    {{- include "clickhouse-cluster.labels" . | nindent 4 }}
