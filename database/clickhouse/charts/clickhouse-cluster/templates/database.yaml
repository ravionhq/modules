{{- if .Values.database.name }}
# Creates the database on every server after each install and upgrade,
# addressing each replica by its own Service rather than with ON CLUSTER.
# ON CLUSTER reaches only the servers the receiving server lists in its
# cluster at that moment, and the operator leaves a server out of the other
# servers' lists while it is being created or restarted, so a server can be
# skipped and never get the database. CREATE ... IF NOT EXISTS makes a rerun
# a no-op on servers that have it, and an upgrade that adds replicas creates
# it on them. A Replicated database then copies its tables to the new
# replica from Keeper, and Replicated*MergeTree tables fetch their data.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Values.name }}-create-database
  labels:
    {{- include "clickhouse-cluster.labels" . | nindent 4 }}
    app.kubernetes.io/component: create-database
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 1500
  template:
    metadata:
      labels:
        {{- include "clickhouse-cluster.labels" . | nindent 8 }}
        app.kubernetes.io/component: create-database
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
      containers:
        - name: create-database
          image: {{ .Values.clickhouse.image }}
          command:
            - /bin/bash
            - -c
            - |
              set -u
              {{- if .Values.tls.enabled }}
              # Over TLS on 9440, verifying the server against the CA.
              cat >/tmp/client.xml <<'EOF'
              <config>
                <openSSL>
                  <client>
                    <caConfig>/etc/clickhouse-client/tls/ca.crt</caConfig>
                    <loadDefaultCAFile>false</loadDefaultCAFile>
                    <verificationMode>relaxed</verificationMode>
                    <invalidCertificateHandler>
                      <name>RejectCertificateHandler</name>
                    </invalidCertificateHandler>
                  </client>
                </openSSL>
              </config>
              EOF
              client() {
                local host="$1"
                shift
                clickhouse-client --config-file /tmp/client.xml --secure --port 9440 --host "$host" --user "$CLICKHOUSE_USER" --password "$CLICKHOUSE_PASSWORD" "$@"
              }
              {{- else }}
              client() {
                local host="$1"
                shift
                clickhouse-client --host "$host" --user "$CLICKHOUSE_USER" --password "$CLICKHOUSE_PASSWORD" "$@"
              }
              {{- end }}
              # Without ON CLUSTER the macros are each server's own, so every
              # replica registers itself in the Replicated database.
              if [ "$ENGINE" = "Replicated" ]; then
                query="CREATE DATABASE IF NOT EXISTS \`${DATABASE}\` ENGINE = Replicated('/clickhouse/databases/${DATABASE}', '{shard}', '{replica}')"
              else
                query="CREATE DATABASE IF NOT EXISTS \`${DATABASE}\` ENGINE = Atomic"
              fi
              for shard in $(seq 0 $((SHARDS - 1))); do
                for replica in $(seq 0 $((REPLICAS - 1))); do
                  host="chi-${INSTALLATION}-${CLUSTER}-${shard}-${replica}"
                  until client "$host" --query "SELECT 1" >/dev/null 2>&1; do
                    echo "waiting for ${host}"
                    sleep 10
                  done
                  until client "$host" --query "$query"; do
                    echo "retrying CREATE DATABASE ${DATABASE} on ${host}"
                    sleep 15
                  done
                  echo "database ${DATABASE} exists on ${host}"
                done
              done
          env:
            - name: INSTALLATION
              value: {{ .Values.name | quote }}
            - name: CLUSTER
              value: {{ .Values.clusterName | quote }}
            - name: DATABASE
              value: {{ .Values.database.name | quote }}
            - name: ENGINE
              value: {{ .Values.database.engine | quote }}
            - name: SHARDS
              value: {{ .Values.clickhouse.shards | int64 | quote }}
            - name: REPLICAS
              value: {{ .Values.clickhouse.replicas | int64 | quote }}
            {{- include "clickhouse-cluster.adminEnv" . | nindent 12 }}
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          {{- if .Values.tls.enabled }}
          volumeMounts:
            - name: tls-ca
              mountPath: /etc/clickhouse-client/tls
              readOnly: true
          {{- end }}
      {{- if .Values.tls.enabled }}
      # Only the CA from the server certificate Secret, not its key.
      volumes:
        - name: tls-ca
          secret:
            secretName: {{ .Values.tls.serverSecretName }}
            items:
              - key: ca.crt
                path: ca.crt
      {{- end }}
{{- end }}
