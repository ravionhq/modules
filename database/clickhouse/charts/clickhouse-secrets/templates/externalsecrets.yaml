{{- range .Values.secrets }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .name }}
  labels:
    app.kubernetes.io/name: clickhouse-secrets
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
  annotations:
    # External Secrets refreshes as soon as this value changes.
    force-sync: {{ $.Values.passwordVersion | quote }}
spec:
  refreshInterval: {{ $.Values.refreshInterval }}
  secretStoreRef:
    name: {{ $.Values.store.name }}
    kind: {{ $.Values.store.kind }}
  target:
    name: {{ .name }}
    # The Secret belongs to its ExternalSecret and goes with it, so removing
    # the module leaves no credentials behind. Terraform removes this release
    # last, after ClickHouse and the operator, so nothing still needs them.
    creationPolicy: Owner
    # Keep the Secret if its Secrets Manager secret disappears, so a running
    # server never loses the password it starts with.
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: {{ .remoteKey }}
{{- end }}
