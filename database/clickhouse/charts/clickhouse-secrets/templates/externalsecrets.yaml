{{- range .Values.secrets }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .name }}
  labels:
    app.kubernetes.io/name: clickhouse-secrets
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
  annotations:
    # External Secrets refreshes as soon as this value changes.
    force-sync: {{ $.Values.passwordVersion | quote }}
spec:
  refreshInterval: {{ $.Values.refreshInterval }}
  secretStoreRef:
    name: {{ $.Values.store.name }}
    kind: {{ $.Values.store.kind }}
  target:
    name: {{ .name }}
    creationPolicy: Owner
    # Keep the Secret if the ExternalSecret is removed, so a running server
    # never loses the password it starts with.
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: {{ .remoteKey }}
{{- end }}
