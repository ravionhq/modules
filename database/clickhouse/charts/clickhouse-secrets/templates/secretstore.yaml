{{- if .Values.store.create }}
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ .Values.store.name }}
  labels:
    app.kubernetes.io/name: clickhouse-secrets
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.region }}
      # No auth block: the External Secrets controller reads the secrets with
      # its own credentials (its Pod Identity or IRSA role).
{{- end }}
