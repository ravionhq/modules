definition:
  type: rvn-rds
  name: RDS Database
  description: Creates and manages an Amazon RDS database. Supports PostgreSQL, MySQL, MariaDB, Oracle, and SQL Server engines.

release:
  version: 1.1.1
  description: Add optional RDS Proxy connection pooling and update Terraform module sources and documentation links to the renamed `ravionhq` GitHub organization.
module:
  inputs:
    - id: network
      immutable: true
      label: VPC network
      mapped_inputs:
        - id: section_aws
          label: AWS account & region
          type: section
        - default: << ref.input.aws_account_id >>
          id: aws_account_id
          immutable: true
          label: AWS account
          type: string
          values: $values:ravion/aws_accounts
        - default: << ref.input.aws_region >>
          id: aws_region
          immutable: true
          label: Region
          type: string
          values: $values:aws/regions
        - collapsible: true
          default: << ref.input.execution_environment_id >>
          description: Override the VPC, subnet, and security group for Pipeline Terraform runners. Must use the same AWS account as selected above.
          id: execution_environment_id
          label: Terraform execution environment
          type: string
          values: $values:ravion/execution_environments
        - id: section_vpc
          label: VPC
          type: section
        - default: <<ref.stack.output.vpc_id>>
          id: vpc_id
          immutable: true
          label: VPC ID
          required: true
          type: string
        - add_button_label: Add private subnet ID
          default: <<ref.stack.output.private_subnet_ids>>
          description: Subnets for the RDS DB subnet group. Use private subnets for normal database deployments.
          id: subnet_ids
          immutable: true
          label: Private subnet IDs
          required: true
          type: string_array
      required: true
      type: $ref:rvn-aws-network
    - id: section_database
      label: Database
      type: section
    - default: <<project.given_id>>-<<environment.given_id>>
      description: Name prefix for all RDS resources.
      id: name
      immutable: true
      label: Name slug
      patterns:
        - message: 1-40 lowercase letters, numbers, and hyphens. Start and end with a letter or number.
          pattern: ^[a-z0-9]([a-z0-9-]{0,38}[a-z0-9])?$
      required: true
      type: string
    - default: none
      id: restore_mode
      immutable: true
      label: Create or restore
      required: true
      type: string
      values:
        - label: New empty database
          value: none
        - label: Restore from snapshot
          value: snapshot
        - label: Point-in-time restore
          value: point_in_time
    - id: db_name
      immutable: true
      label: Database name
      patterns:
        - message: 1-64 lowercase letters, numbers, and underscores. Start with a letter.
          pattern: ^[a-z][a-z0-9_]{0,63}$
        - message: Pick a different name, this is reserved by AWS.
          pattern: ^(?:|[^adimnoprst].*|a(?:|[^d].*|d(?:|[^m].*|m(?:|[^i].*|i(?:|[^n].*|n.+))))|d(?:|[^a].*|a(?:|[^t].*|t(?:|[^a].*|a(?:|[^b].*|b(?:|[^a].*|a(?:|[^s].*|s(?:|[^e].*|e(?:[^s].*|s.+))))))))|i(?:|[^n].*|n(?:|[^f].*|f(?:|[^o].*|o(?:|[^r].*|r(?:|[^m].*|m(?:|[^a].*|a(?:|[^t].*|t(?:|[^i].*|i(?:|[^o].*|o(?:|[^n].*|n(?:|[^_].*|_(?:|[^s].*|s(?:|[^c].*|c(?:|[^h].*|h(?:|[^e].*|e(?:|[^m].*|m(?:|[^a].*|a.+)))))))))))))))))|m(?:|[^y].*|y(?:|[^s].*|s(?:|[^q].*|q(?:|[^l].*|l.+))))|n(?:|[^u].*|u(?:|[^l].*|l(?:|[^l].*|l.+)))|o(?:|[^r].*|r(?:|[^a].*|a(?:|[^c].*|c(?:|[^l].*|l(?:|[^e].*|e.+)))))|p(?:|[^eo].*|e(?:|[^r].*|r(?:|[^f].*|f(?:|[^o].*|o(?:|[^r].*|r(?:|[^m].*|m(?:|[^a].*|a(?:|[^n].*|n(?:|[^c].*|c(?:|[^e].*|e(?:|[^_].*|_(?:|[^s].*|s(?:|[^c].*|c(?:|[^h].*|h(?:|[^e].*|e(?:|[^m].*|m(?:|[^a].*|a.+))))))))))))))))|o(?:|[^s].*|s(?:|[^t].*|t(?:|[^g].*|g(?:|[^r].*|r(?:|[^e].*|e(?:|[^s].*|s.+)))))))|r(?:|[^do].*|d(?:|[^s].*|s(?:|[^a].*|a(?:|[^d].*|d(?:|[^m].*|m(?:|[^i].*|i(?:|[^n].*|n.+))))))|o(?:|[^o].*|o(?:|[^t].*|t.+)))|s(?:|[^y].*|y(?:|[^s].*|s.+))|t(?:|[^e].*|e(?:|[^m].*|m(?:|[^p].*|p(?:|[^l].*|l(?:|[^a].*|a(?:|[^t].*|t(?:|[^e].*|e(?:|[^01].*|0.+|1.+)))))))))$
      placeholder: myapp_prod
      required: true
      show_when:
        restore_mode: none
        engine:
          - mysql
          - postgres
          - mariadb
          - oracle-ee
          - oracle-se2
          - oracle-se2-cdb
      type: string
    - default: dbadmin
      collapsible: true
      id: username
      immutable: true
      label: Username
      patterns:
        - message: Invalid RDS master username. Start with a letter. Letters, numbers, and underscores only.
          pattern: ^[A-Za-z][A-Za-z0-9_]{0,62}$
      required: true
      show_when:
        restore_mode: none
      type: string
    - description: Snapshot identifier or ARN to restore into this new database. The snapshot must be compatible with the selected engine and instance settings.
      id: snapshot_identifier
      immutable: true
      label: Snapshot to restore
      required: false
      show_when:
        restore_mode: snapshot
      type: string
    - default: true
      description: Restore to the latest time AWS can recover from the selected source database backup.
      id: point_in_time_use_latest_restorable_time
      immutable: true
      label: Use latest restorable time
      show_when:
        restore_mode: point_in_time
      type: boolean
    - description: Restore to this UTC timestamp instead of the latest restorable time.
      id: point_in_time_restore_time
      immutable: true
      label: Restore time
      placeholder: 2026-06-11T15:04:05Z
      required: false
      show_when:
        restore_mode: point_in_time
        point_in_time_use_latest_restorable_time: false
      type: string
    - description: Source DB instance identifier to restore from.
      id: point_in_time_source_db_instance_identifier
      immutable: true
      label: Source DB instance identifier
      placeholder: my-db
      required: false
      show_when:
        restore_mode: point_in_time
      type: string
    - description: ARN of the source automated backups to restore from. Use this for cross-region or retained automated backup restores.
      id: point_in_time_source_db_instance_automated_backups_arn
      immutable: true
      label: Source automated backups ARN
      placeholder: arn:aws:rds:...
      required: false
      show_when:
        restore_mode: point_in_time
      type: string
    - description: Source DB resource ID to restore from when using automated backups.
      id: point_in_time_source_dbi_resource_id
      immutable: true
      label: Source DB resource ID
      placeholder: db-...
      required: false
      show_when:
        restore_mode: point_in_time
      type: string
    - id: section_version
      label: Version
      type: section
    - default: postgres
      id: engine
      immutable: true
      label: Engine
      required: true
      type: string
      values:
        - label: PostgreSQL
          value: postgres
        - label: MySQL
          value: mysql
        - label: MariaDB
          value: mariadb
        - label: Oracle Enterprise Edition
          value: oracle-ee
        - label: Oracle Standard Edition 2
          value: oracle-se2
        - label: Oracle Standard Edition 2 CDB
          value: oracle-se2-cdb
        - label: SQL Server Enterprise
          value: sqlserver-ee
        - label: SQL Server Standard
          value: sqlserver-se
        - label: SQL Server Express
          value: sqlserver-ex
        - label: SQL Server Web
          value: sqlserver-web
    - description: "Examples: 15 for PostgreSQL or SQL Server, 8.0 for MySQL, 19 for Oracle."
      id: engine_major_version
      immutable: true
      label: Engine major version
      placeholder: "15"
      required: true
      type: string
    - collapsible: true
      description: "Optional minor engine version appended to the major version. Example: major 15 and minor 4 becomes 15.4."
      id: engine_minor_version
      label: Engine minor version
      placeholder: "4"
      required: false
      type: string
    - collapsible: true
      default: true
      description: Enable automatic minor engine version upgrades during the configured maintenance window.
      id: minor_version_auto_upgrade_enabled
      label: Auto minor version upgrades
      type: boolean
    - id: section_size
      label: Size & Storage
      type: section
    - description: RDS instance size, such as db.t4g.micro or db.r6g.large.
      id: instance_class
      label: Instance class
      placeholder: db.t4g.micro
      default: db.t4g.micro
      required: true
      type: string
    - default: 20
      description: AWS supports increasing allocated storage after creation, but not reducing it in place.
      id: allocated_storage
      label: Allocated storage (GiB)
      max: 65536
      min: 20
      required: true
      type: number
    - collapsible: true
      default: 0
      description: Upper limit for RDS storage autoscaling. Use 0 to disable. AWS can grow storage up to this limit, but storage cannot be reduced in place.
      id: max_allocated_storage
      label: Max allocated storage (GiB)
      max: 65536
      min: 0
      type: number
    - collapsible: true
      default: gp3
      id: storage_type
      label: Storage type
      type: string
      values:
        - label: gp3
          value: gp3
        - label: gp2
          value: gp2
        - label: io1
          value: io1
        - label: io2
          value: io2
        - label: standard
          value: standard
    - collapsible: true
      id: iops
      label: Provisioned IOPS
      max: 256000
      min: 1000
      required: false
      show_when:
        storage_type:
          - gp3
          - io1
          - io2
      type: number
    - collapsible: true
      id: storage_throughput
      label: Storage throughput (MiB/s)
      max: 1000
      min: 125
      required: false
      show_when:
        storage_type: gp3
      type: number
    - collapsible: true
      id: kms_key_id
      immutable: true
      label: Storage KMS key ARN
      placeholder: arn:aws:kms:...
      required: false
      type: string
    - collapsible: true
      id: ca_cert_identifier
      label: CA certificate identifier
      required: false
      type: string
    - id: section_access
      label: Network access
      type: section
    - default: false
      description: Keep disabled for production databases unless public access is intentional.
      id: public_access_enabled
      label: Publicly accessible
      type: boolean
    - collapsible: true
      description: Leave blank to use the engine default port.
      id: port
      label: Port
      max: 65535
      min: 1
      required: false
      type: number
    - collapsible: true
      default: true
      id: security_group_creation_enabled
      immutable: true
      label: Security group creation
      type: boolean
    - collapsible: true
      id: security_group_id
      label: Existing security group ID
      placeholder: sg-...
      required: false
      show_when:
        security_group_creation_enabled: false
      type: string
    - add_button_label: Add security group ID
      collapsible: true
      id: allowed_security_group_ids
      label: Allowed security groups
      placeholder: sg-...
      required: false
      show_when:
        security_group_creation_enabled: true
      type: string_array
    - add_button_label: Add CIDR block
      collapsible: true
      id: allowed_cidr_blocks
      label: Allowed CIDR blocks
      placeholder: 10.0.0.0/16
      required: false
      show_when:
        security_group_creation_enabled: true
      type: string_array
    - id: section_proxy
      label: Connection pooling
      show_when:
        engine:
          - mysql
          - postgres
          - mariadb
          - sqlserver-ee
          - sqlserver-se
          - sqlserver-ex
          - sqlserver-web
      type: section
    - default: false
      description: Create an RDS Proxy in front of the database for connection pooling and improved failover handling.
      id: proxy_creation_enabled
      label: RDS Proxy
      show_when:
        engine:
          - mysql
          - postgres
          - mariadb
          - sqlserver-ee
          - sqlserver-se
          - sqlserver-ex
          - sqlserver-web
      type: boolean
    - add_button_label: Add secret ARN
      collapsible: true
      description: Secrets Manager secrets containing database credentials for the proxy. Leave blank to use the managed master user secret.
      id: proxy_auth_secret_arns
      label: Auth secret ARNs
      placeholder: arn:aws:secretsmanager:...
      required: false
      show_when:
        proxy_creation_enabled: true
      type: string_array
    - add_button_label: Add KMS key ARN
      collapsible: true
      description: KMS keys used to encrypt the auth secrets when using customer-managed keys. The master user secret KMS key is included automatically.
      id: proxy_secret_kms_key_arns
      label: Auth secret KMS key ARNs
      placeholder: arn:aws:kms:...
      required: false
      show_when:
        proxy_creation_enabled: true
      type: string_array
    - collapsible: true
      default: false
      description: Require IAM authentication for client connections to the proxy.
      id: proxy_iam_auth_enabled
      label: IAM authentication
      show_when:
        proxy_creation_enabled: true
      type: boolean
    - collapsible: true
      default: true
      description: Require TLS for client connections to the proxy.
      id: proxy_tls_requirement_enabled
      label: Require TLS
      show_when:
        proxy_creation_enabled: true
      type: boolean
    - collapsible: true
      default: false
      description: Log detailed connection information, including SQL statements, to CloudWatch Logs.
      id: proxy_debug_logging_enabled
      label: Debug logging
      show_when:
        proxy_creation_enabled: true
      type: boolean
    - collapsible: true
      default: 1800
      id: proxy_idle_client_timeout
      label: Idle client timeout (seconds)
      max: 28800
      min: 1
      show_when:
        proxy_creation_enabled: true
      type: number
    - collapsible: true
      default: 120
      id: proxy_connection_borrow_timeout
      label: Connection borrow timeout (seconds)
      min: 0
      show_when:
        proxy_creation_enabled: true
      type: number
    - collapsible: true
      default: 100
      description: Maximum size of the connection pool as a percentage of the database max_connections setting.
      id: proxy_max_connections_percent
      label: Max connections (%)
      max: 100
      min: 1
      show_when:
        proxy_creation_enabled: true
      type: number
    - collapsible: true
      default: 50
      description: Maximum idle connections kept open, as a percentage of the database max_connections setting.
      id: proxy_max_idle_connections_percent
      label: Max idle connections (%)
      max: 100
      min: 0
      show_when:
        proxy_creation_enabled: true
      type: number
    - add_button_label: Add filter
      collapsible: true
      id: proxy_session_pinning_filters
      label: Session pinning filters
      required: false
      show_when:
        proxy_creation_enabled: true
      type: string_array
      values:
        - label: EXCLUDE_VARIABLE_SETS
          value: EXCLUDE_VARIABLE_SETS
    - collapsible: true
      description: SQL statements the proxy runs when opening each new database connection.
      id: proxy_init_query
      label: Initialization query
      placeholder: SET time_zone = 'UTC'
      required: false
      show_when:
        proxy_creation_enabled: true
      type: string
    - id: section_availability
      label: Availability & replicas
      type: section
    - default: false
      id: multi_az_enabled
      label: Multi-AZ
      type: boolean
    - collapsible: true
      description: Single-AZ placement. Hidden when Multi-AZ is enabled because AWS chooses standby placement.
      id: availability_zone
      label: Availability zone
      required: false
      show_when:
        multi_az_enabled: false
      type: string
    - default: false
      id: read_replica_creation_enabled
      label: Read replicas
      show_when:
        engine:
          - mysql
          - postgres
          - mariadb
          - oracle-ee
          - oracle-se2
          - oracle-se2-cdb
      type: boolean
    - default: 1
      id: read_replica_count
      label: Read replica count
      max: 15
      min: 0
      show_when:
        read_replica_creation_enabled: true
        engine:
          - mysql
          - postgres
          - mariadb
          - oracle-ee
          - oracle-se2
          - oracle-se2-cdb
      type: number
    - collapsible: true
      id: read_replica_instance_class
      label: Read replica instance class
      placeholder: db.r6g.large
      required: false
      show_when:
        read_replica_creation_enabled: true
        engine:
          - mysql
          - postgres
          - mariadb
          - oracle-ee
          - oracle-se2
          - oracle-se2-cdb
      type: string
    - add_button_label: Add availability zone
      collapsible: true
      id: read_replica_availability_zones
      label: Read replica AZs
      required: false
      show_when:
        read_replica_creation_enabled: true
        engine:
          - mysql
          - postgres
          - mariadb
          - oracle-ee
          - oracle-se2
          - oracle-se2-cdb
      type: string_array
    - id: section_auth
      label: Credentials & authentication
      type: section
    - default: true
      description: Let AWS generate and manage the master password in Secrets Manager. Disable before importing a database whose existing password is managed externally.
      id: master_user_password_management_enabled
      label: Manage password in Secrets Manager
      type: boolean
    - collapsible: true
      default: false
      description: Preserve the externally managed password of an imported database. Ravion verifies that the named database already exists in AWS.
      id: master_user_password_preservation_enabled
      label: Preserve existing master password
      show_when:
        master_user_password_management_enabled: false
      type: boolean
    - collapsible: true
      id: master_user_secret_kms_key_id
      label: Secrets Manager KMS key ARN
      placeholder: arn:aws:kms:...
      required: false
      show_when:
        master_user_password_management_enabled: true
        restore_mode: none
      type: string
    - collapsible: true
      default: false
      id: iam_database_authentication_enabled
      label: IAM database authentication
      show_when:
        engine:
          - mysql
          - postgres
      type: boolean
    - id: section_sql_server_settings
      label: SQL Server settings
      show_when:
        engine:
          - sqlserver-ee
          - sqlserver-se
          - sqlserver-ex
          - sqlserver-web
      type: section
    - collapsible: true
      id: license_model_sqlserver
      immutable: true
      label: License model
      required: false
      show_when:
        engine:
          - sqlserver-ee
          - sqlserver-se
          - sqlserver-ex
          - sqlserver-web
      type: string
      values:
        - label: license-included
          value: license-included
        - label: bring-your-own-license
          value: bring-your-own-license
    - collapsible: true
      id: character_set_name_sqlserver
      immutable: true
      label: Character set
      required: false
      show_when:
        engine:
          - sqlserver-ee
          - sqlserver-se
          - sqlserver-ex
          - sqlserver-web
      type: string
    - collapsible: true
      id: timezone
      immutable: true
      label: SQL Server time zone
      required: false
      show_when:
        engine:
          - sqlserver-ee
          - sqlserver-se
          - sqlserver-ex
          - sqlserver-web
      type: string
    - collapsible: true
      id: domain
      immutable: true
      label: Active Directory directory ID
      required: false
      show_when:
        engine:
          - sqlserver-ee
          - sqlserver-se
          - sqlserver-ex
          - sqlserver-web
      type: string
    - collapsible: true
      id: domain_iam_role_name
      immutable: true
      label: Active Directory IAM role name
      required: false
      show_when:
        domain:
          not: ""
        engine:
          - sqlserver-ee
          - sqlserver-se
          - sqlserver-ex
          - sqlserver-web
      type: string
    - id: section_oracle_settings
      label: Oracle settings
      show_when:
        engine:
          - oracle-ee
          - oracle-se2
          - oracle-se2-cdb
      type: section
    - collapsible: true
      id: license_model_oracle
      immutable: true
      label: License model
      required: false
      show_when:
        engine:
          - oracle-ee
          - oracle-se2
          - oracle-se2-cdb
      type: string
      values:
        - label: license-included
          value: license-included
        - label: bring-your-own-license
          value: bring-your-own-license
    - collapsible: true
      id: character_set_name_oracle
      immutable: true
      label: Character set
      required: false
      show_when:
        engine:
          - oracle-ee
          - oracle-se2
          - oracle-se2-cdb
      type: string
    - id: section_backup
      label: Backups
      type: section
    - default: 7
      id: backup_retention_period
      label: Backup retention days
      max: 35
      min: 0
      collapsible: true
      type: number
    - collapsible: true
      id: backup_window
      label: Backup window
      placeholder: 03:00-04:00
      required: false
      show_when:
        backup_retention_period:
          not: 0
      type: string
    - collapsible: true
      default: true
      id: snapshot_tag_copying_enabled
      label: Copy tags to snapshots
      type: boolean
    - collapsible: true
      default: true
      description: Delete retained automated backups when the database is deleted. Disable this to preserve automated backups after deletion.
      id: automated_backups_deletion_enabled
      label: Delete automated backups
      show_when:
        backup_retention_period:
          not: 0
      type: boolean
    - collapsible: true
      default: true
      id: final_snapshot_creation_enabled
      label: Create final snapshot
      type: boolean
    - collapsible: true
      id: final_snapshot_identifier
      label: Final snapshot identifier
      required: false
      show_when:
        final_snapshot_creation_enabled: true
      type: string
    - default: true
      id: deletion_protection_enabled
      label: Deletion protection
      type: boolean
    - id: section_maintenance
      label: Maintenance
      type: section
    - collapsible: true
      id: maintenance_window
      label: Maintenance window
      placeholder: sun:04:00-sun:05:00
      required: false
      type: string
    - collapsible: true
      default: false
      id: major_version_upgrade_enabled
      label: Allow major version upgrades
      type: boolean
    - collapsible: true
      default: false
      id: immediate_apply_enabled
      label: Apply changes immediately
      type: boolean
    - id: section_monitoring
      label: Monitoring
      type: section
    - add_button_label: Add log type
      collapsible: true
      id: enabled_cloudwatch_logs_exports
      label: CloudWatch log exports
      placeholder: postgresql
      required: false
      type: string_array
    - collapsible: true
      default: 0
      id: monitoring_interval
      label: Enhanced monitoring interval
      type: number
      values:
        - label: "0"
          value: 0
        - label: "1"
          value: 1
        - label: "5"
          value: 5
        - label: "10"
          value: 10
        - label: "15"
          value: 15
        - label: "30"
          value: 30
        - label: "60"
          value: 60
    - collapsible: true
      default: true
      id: monitoring_role_creation_enabled
      immutable: true
      label: Monitoring IAM role creation
      show_when:
        monitoring_interval:
          not: 0
      type: boolean
    - collapsible: true
      id: monitoring_role_arn
      label: Monitoring IAM role ARN
      placeholder: arn:aws:iam::...
      required: false
      show_when:
        monitoring_role_creation_enabled: false
        monitoring_interval:
          not: 0
      type: string
    - default: true
      id: performance_insights_enabled
      label: Performance insights
      type: boolean
      collapsible: true
    - collapsible: true
      default: 7
      id: performance_insights_retention_period
      label: Performance insights retention days
      show_when:
        performance_insights_enabled: true
      type: number
    - collapsible: true
      id: performance_insights_kms_key_id
      label: Performance insights KMS key ARN
      required: false
      show_when:
        performance_insights_enabled: true
      type: string
    - id: section_cloudwatch_alarms
      label: CloudWatch alarms
      type: section
    - default: true
      id: cloudwatch_alarms_creation_enabled
      label: Create CloudWatch alarms
      type: boolean
    - collapsible: true
      default: 80
      id: cloudwatch_alarm_cpu_threshold
      label: CPU alarm threshold (%)
      max: 100
      min: 0
      show_when:
        cloudwatch_alarms_creation_enabled: true
      type: number
    - collapsible: true
      default: 5
      description: Displayed in GiB. Ravion converts this to bytes for Terraform.
      id: cloudwatch_alarm_storage_threshold_gib
      label: Free storage alarm threshold (GiB)
      min: 0
      show_when:
        cloudwatch_alarms_creation_enabled: true
      type: number
    - collapsible: true
      default: 100
      id: cloudwatch_alarm_connections_threshold
      label: Connections alarm threshold
      min: 1
      show_when:
        cloudwatch_alarms_creation_enabled: true
      type: number
    - collapsible: true
      default: 2
      id: cloudwatch_alarm_evaluation_periods
      label: Alarm evaluation periods
      min: 1
      show_when:
        cloudwatch_alarms_creation_enabled: true
      type: number
    - collapsible: true
      default: 300
      id: cloudwatch_alarm_period
      label: Alarm period seconds
      show_when:
        cloudwatch_alarms_creation_enabled: true
      type: number
      values:
        - label: "10"
          value: 10
        - label: "30"
          value: 30
        - label: "60"
          value: 60
        - label: "300"
          value: 300
        - label: "900"
          value: 900
        - label: "3600"
          value: 3600
    - add_button_label: Add action ARN
      collapsible: true
      id: cloudwatch_alarm_actions
      label: Alarm action ARNs
      required: false
      show_when:
        cloudwatch_alarms_creation_enabled: true
      type: string_array
    - add_button_label: Add action ARN
      collapsible: true
      id: cloudwatch_ok_actions
      label: OK action ARNs
      required: false
      show_when:
        cloudwatch_alarms_creation_enabled: true
      type: string_array
    - id: section_parameter_group
      description: Parameter groups are database engine settings applied to the instance, such as logging, connection, or query behavior. Leave the defaults unless you need engine-specific tuning.
      label: Parameter group
      type: section
    - collapsible: true
      default: true
      description: Create a parameter group for this database. Disable this only when you want to attach an existing parameter group.
      id: parameter_group_creation_enabled
      immutable: true
      label: Parameter group creation
      type: boolean
    - collapsible: true
      description: Name of an existing parameter group to attach when this module is not creating one.
      id: parameter_group_name
      immutable: true
      label: Existing parameter group name
      required: false
      show_when:
        parameter_group_creation_enabled: false
      type: string
    - collapsible: true
      description: Parameter group family, such as postgres15 or mysql8.0. Leave blank to derive it from the selected engine and major version.
      id: parameter_group_family
      immutable: true
      label: Parameter group family
      placeholder: postgres15
      required: false
      show_when:
        parameter_group_creation_enabled: true
      type: string
    - collapsible: true
      default: []
      description: Custom database engine parameters to apply to the created parameter group. Many changes require a database reboot depending on the parameter.
      id: parameters
      item_inputs:
        - description: Engine parameter name, such as log_statement or max_connections.
          id: name
